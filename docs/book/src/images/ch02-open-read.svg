<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <rect class="u" x="35" y="16" width="190" height="44" rx="4"/>
  <text x="130" y="35" class="b c">a program</text>
  <text x="130" y="51" class="s c">libc and libsys</text>
  <path class="life" d="M130,60 L130,420"/>
  <rect class="k" x="305" y="16" width="190" height="44" rx="4"/>
  <text x="400" y="35" class="b c">process 1</text>
  <text x="400" y="51" class="s c">the pathname manager</text>
  <path class="life" d="M400,60 L400,420"/>
  <rect class="u" x="575" y="16" width="190" height="44" rx="4"/>
  <text x="670" y="35" class="b c">tmpfs</text>
  <text x="670" y="51" class="s c">owns /tmp</text>
  <path class="life" d="M670,60 L670,420"/>
  <text x="130" y="84" class="ms c">fd = open("/tmp/notes", O_RDONLY)</text>
  <path class="lnk" d="M130,118 L398,118" marker-end="url(#ak)"/>
  <circle cx="152" cy="105" r="9" fill="#2c5d9b"/>
  <text x="152" y="109" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="168" y="109" class="s">who owns /tmp/notes?</text>
  <path class="lng" d="M400,152 L132,152" marker-end="url(#ag)"/>
  <circle cx="154" cy="139" r="9" fill="#3e7b34"/>
  <text x="154" y="143" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="170" y="143" class="s">tmpfs does: its process and channel</text>
  <rect class="wu" x="40" y="164" width="180" height="30" rx="3"/>
  <text x="130" y="183" class="s c">connect to tmpfs's channel</text>
  <path class="lnk" d="M130,222 L668,222" marker-end="url(#ak)"/>
  <circle cx="152" cy="209" r="9" fill="#2c5d9b"/>
  <text x="152" y="213" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="168" y="213" class="s">open notes, to read</text>
  <rect class="wu" x="580" y="230" width="180" height="30" rx="3"/>
  <text x="670" y="249" class="s c">finds the file, checks access</text>
  <path class="lng" d="M670,286 L132,286" marker-end="url(#ag)"/>
  <circle cx="154" cy="273" r="9" fill="#3e7b34"/>
  <text x="154" y="277" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="170" y="277" class="s">done</text>
  <rect class="g" x="40" y="296" width="180" height="30" rx="3"/>
  <text x="130" y="315" class="s c">the connection is the fd</text>
  <text x="130" y="350" class="ms c">n = read(fd, buf, 4096)</text>
  <path class="lnk" d="M130,380 L668,380" marker-end="url(#ak)"/>
  <circle cx="152" cy="367" r="9" fill="#2c5d9b"/>
  <text x="152" y="371" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="168" y="371" class="s">read 4096 bytes</text>
  <path class="lng" d="M670,408 L132,408" marker-end="url(#ag)"/>
  <circle cx="154" cy="395" r="9" fill="#3e7b34"/>
  <text x="154" y="399" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">6</text>
  <text x="170" y="399" class="s">the bytes</text>
  <rect class="y" x="305" y="300" width="190" height="56" rx="3"/>
  <text x="400" y="320" class="s c">not involved any more:</text>
  <text x="400" y="335" class="s c">the descriptor already</text>
  <text x="400" y="350" class="s c">leads to the server</text>
</svg>
