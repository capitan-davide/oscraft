<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
  <rect class="g" x="20" y="15" width="590" height="48" rx="4"/>
  <text x="32" y="35" class="h">Programs</text>
  <text x="32" y="52" class="s">FreeBSD's sh, ls, ps, top, ifconfig, ping, kldload, ...  and your own</text>
  <rect class="g" x="20" y="71" width="590" height="70" rx="4"/>
  <text x="32" y="91" class="h">FreeBSD's C library, thread library and dynamic loader</text>
  <text x="32" y="108" class="s">libc, libthr, ld-elf.so: built from FreeBSD's source, unchanged</text>
  <rect class="k" x="30" y="113" width="570" height="22" rx="3"/>
  <text x="315" y="128" class="s c">libsys: FreeBSD's system calls, made of OsCraft kernel calls and messages</text>
  <rect class="k" x="20" y="149" width="590" height="106" rx="4"/>
  <text x="32" y="169" class="h">Servers: ordinary processes</text>
  <rect class="w" x="30.0" y="175" width="90.0" height="30" rx="3"/>
  <text x="75.0" y="194" class="s c">pipe</text>
  <rect class="w" x="126.0" y="175" width="90.0" height="30" rx="3"/>
  <text x="171.0" y="194" class="s c">pty</text>
  <rect class="w" x="222.0" y="175" width="90.0" height="30" rx="3"/>
  <text x="267.0" y="194" class="s c">random</text>
  <rect class="w" x="318.0" y="175" width="90.0" height="30" rx="3"/>
  <text x="363.0" y="194" class="s c">tmpfs</text>
  <rect class="w" x="414.0" y="175" width="90.0" height="30" rx="3"/>
  <text x="459.0" y="194" class="s c">syslogd</text>
  <rect class="w" x="510.0" y="175" width="90.0" height="30" rx="3"/>
  <text x="555.0" y="194" class="s c">diskd</text>
  <rect class="wk" x="30" y="211" width="570" height="36" rx="3"/>
  <text x="42" y="233" class="m">netd   pcid   usbd</text>
  <rect class="g" x="190" y="216" width="400" height="26" rx="3"/>
  <text x="390" y="233" class="s c">FreeBSD's network stack, PCI bus and USB stack, over bsdkern</text>
  <path class="lnr dash" d="M10,266 L620,266"/>
  <text x="626" y="262" class="s red">user mode (EL0)</text>
  <text x="626" y="278" class="s red">kernel mode (EL1)</text>
  <rect class="k" x="20" y="277" width="590" height="68" rx="4"/>
  <text x="32" y="297" class="h">Process 1: the managers</text>
  <rect class="wk" x="30.0" y="303" width="90.0" height="34" rx="3"/>
  <text x="75.0" y="316" class="s c">process</text>
  <text x="75.0" y="328" class="s c">manager</text>
  <rect class="wk" x="126.0" y="303" width="90.0" height="34" rx="3"/>
  <text x="171.0" y="316" class="s c">pathname</text>
  <text x="171.0" y="328" class="s c">manager</text>
  <rect class="wk" x="222.0" y="303" width="90.0" height="34" rx="3"/>
  <text x="267.0" y="316" class="s c">memory</text>
  <text x="267.0" y="328" class="s c">manager</text>
  <rect class="wk" x="318.0" y="303" width="90.0" height="34" rx="3"/>
  <text x="363.0" y="316" class="s c">image</text>
  <text x="363.0" y="328" class="s c">file system</text>
  <rect class="wk" x="414.0" y="303" width="90.0" height="34" rx="3"/>
  <text x="459.0" y="322" class="s c">/proc</text>
  <rect class="wk" x="510.0" y="303" width="90.0" height="34" rx="3"/>
  <text x="555.0" y="316" class="s c">consoles,</text>
  <text x="555.0" y="328" class="s c">/dev/null, ...</text>
  <rect class="k" x="20" y="353" width="590" height="68" rx="4"/>
  <text x="32" y="373" class="h">Microkernel</text>
  <rect class="wk" x="30.0" y="379" width="76.28571428571429" height="34" rx="3"/>
  <text x="68.14285714285714" y="392" class="s c">threads,</text>
  <text x="68.14285714285714" y="404" class="s c">scheduler</text>
  <rect class="wk" x="112.28571428571429" y="379" width="76.28571428571429" height="34" rx="3"/>
  <text x="150.42857142857144" y="392" class="s c">message</text>
  <text x="150.42857142857144" y="404" class="s c">passing</text>
  <rect class="wk" x="194.57142857142858" y="379" width="76.28571428571429" height="34" rx="3"/>
  <text x="232.71428571428572" y="392" class="s c">synchron-</text>
  <text x="232.71428571428572" y="404" class="s c">ization</text>
  <rect class="wk" x="276.8571428571429" y="379" width="76.28571428571429" height="34" rx="3"/>
  <text x="315.00000000000006" y="398" class="s c">signals</text>
  <rect class="wk" x="359.14285714285717" y="379" width="76.28571428571429" height="34" rx="3"/>
  <text x="397.28571428571433" y="392" class="s c">clocks,</text>
  <text x="397.28571428571433" y="404" class="s c">timers</text>
  <rect class="wk" x="441.42857142857144" y="379" width="76.28571428571429" height="34" rx="3"/>
  <text x="479.5714285714286" y="398" class="s c">interrupts</text>
  <rect class="wk" x="523.7142857142858" y="379" width="76.28571428571429" height="34" rx="3"/>
  <text x="561.8571428571429" y="392" class="s c">address</text>
  <text x="561.8571428571429" y="404" class="s c">spaces</text>
  <rect class="k" x="20" y="429" width="590" height="30" rx="4"/>
  <text x="315" y="448" class="c">AArch64 layer: exception vectors, kernel entry and exit, context switch, MMU</text>
  <rect class="frame" x="20" y="467" width="590" height="30" rx="4"/>
  <text x="315" y="486" class="c">system page and callouts: the machine, described for the kernel</text>
  <rect class="k" x="20" y="505" width="590" height="30" rx="4"/>
  <text x="315" y="524" class="c">startup (startup-qemu-virt): finds memory, CPUs and devices; starts the kernel</text>
  <rect class="n" x="20" y="543" width="590" height="40" rx="4"/>
  <text x="315" y="560" class="b c">QEMU's virt machine</text>
  <text x="315" y="575" class="s c">4 Cortex-A72 cores, GICv2, generic timer, PL011 UART, PCIe with a virtio network device</text>
  <path class="lnk" d="M616,281 L622,281 L622,455 L616,455"/>
  <text x="630" y="360" class="s">one program:</text>
  <text x="630" y="374" class="s">the kernel file</text>
  <text x="640" y="30" class="h">Who wrote it</text>
  <rect class="k" x="640" y="44" width="18" height="14" rx="2"/>
  <text x="666" y="56" class="s">OsCraft (Rust)</text>
  <rect class="g" x="640" y="66" width="18" height="14" rx="2"/>
  <text x="666" y="78" class="s">FreeBSD, from</text>
  <text x="666" y="91" class="s">its source</text>
  <rect class="r" x="640" y="104" width="18" height="14" rx="2"/>
  <text x="666" y="116" class="s">QNX, optional</text>
  <rect class="n" x="640" y="126" width="18" height="14" rx="2"/>
  <text x="666" y="138" class="s">the machine</text>
  <rect class="r" x="632" y="160" width="158" height="90" rx="4"/>
  <text x="711" y="178" class="b c">Optional: QNX</text>
  <text x="711" y="195" class="s c">QNX programs with</text>
  <text x="711" y="208" class="s c">QNX's own libc, under</text>
  <text x="711" y="221" class="s c">/compat/qnx; qnxd</text>
  <text x="711" y="234" class="s c">translates for them</text>
</svg>
