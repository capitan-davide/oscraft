<svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="370" fill="#ffffff"/>
  <text x="200" y="26" class="h c">SpinLock: interrupts stay unmasked</text>
  <text x="610" y="26" class="h c">IrqSpinLock: interrupts masked</text>
  <line x1="410" y1="16" x2="410" y2="300" stroke="#999999" stroke-width="1"/>
  <rect class="wk" x="40" y="50" width="320" height="40" rx="4"/>
  <text x="200" y="74" class="c">a kernel call takes lock L</text>
  <polyline class="ln" points="200,90 200,108" marker-end="url(#a)"/>
  <rect class="n" x="40" y="110" width="320" height="40" rx="4"/>
  <text x="200" y="134" class="c">an IRQ arrives on the same CPU</text>
  <polyline class="ln" points="200,150 200,168" marker-end="url(#a)"/>
  <rect class="wk" x="40" y="170" width="320" height="40" rx="4"/>
  <text x="200" y="194" class="c">the handler: lock(L), spins</text>
  <polyline class="ln" points="200,210 200,228" marker-end="url(#a)"/>
  <rect class="r" x="40" y="230" width="320" height="56" rx="4"/>
  <text x="200" y="247" class="c">deadlock</text>
  <text x="200" y="262" class="s c">the holder is the interrupted code:</text>
  <text x="200" y="277" class="s c">it can't run, so L is never released</text>
  <rect class="wk" x="450" y="50" width="320" height="40" rx="4"/>
  <text x="610" y="74" class="c">lock(): mask IRQs, then take L</text>
  <polyline class="ln" points="610,90 610,108" marker-end="url(#a)"/>
  <rect class="n" x="450" y="110" width="320" height="46" rx="4"/>
  <text x="610" y="129.5" class="c">an IRQ arrives: it stays pending</text>
  <text x="610" y="144.5" class="s c">at the interrupt controller</text>
  <polyline class="ln" points="610,156 610,174" marker-end="url(#a)"/>
  <rect class="wk" x="450" y="176" width="320" height="46" rx="4"/>
  <text x="610" y="195.5" class="c">unlock: release L, then</text>
  <text x="610" y="210.5" class="s c">restore the mask</text>
  <polyline class="ln" points="610,222 610,240" marker-end="url(#a)"/>
  <rect class="g" x="450" y="242" width="320" height="46" rx="4"/>
  <text x="610" y="261.5" class="c">the IRQ is taken; the handler</text>
  <text x="610" y="276.5" class="s c">takes L at once</text>
  <text x="40" y="330" class="s">Another CPU spinning on L is fine: L's holder keeps running there and releases it.</text>
  <text x="40" y="346" class="s">The danger is only the holder's own CPU, which is what masking covers.</text>
</svg>
