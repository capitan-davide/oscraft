<svg xmlns="http://www.w3.org/2000/svg" width="800" height="345" viewBox="0 0 800 345" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="345" fill="#ffffff"/>
  <text x="108" y="68" class="b e">CPU 0 runs</text>
  <text x="108" y="142" class="b e">on the stack</text>
  <text x="108" y="202" class="b e">interrupts</text>
  <text x="108" y="262" class="b e">may it block?</text>
  <rect class="u" x="120" y="40" width="96" height="50" rx="3"/>
  <text x="168.0" y="62" class="s c">program A,</text>
  <text x="168.0" y="76" class="s c">user mode</text>
  <rect class="w" x="120" y="120" width="96" height="34" rx="3"/>
  <text x="168.0" y="141" class="s c">A's user stack</text>
  <rect class="w" x="120" y="180" width="96" height="34" rx="3"/>
  <text x="168.0" y="201" class="s c">unmasked</text>
  <rect class="w" x="120" y="240" width="96" height="34" rx="3"/>
  <text x="168.0" y="261" class="s c">-</text>
  <rect class="r" x="220" y="40" width="96" height="50" rx="3"/>
  <text x="268.0" y="62" class="s c">interrupt</text>
  <text x="268.0" y="76" class="s c">handler</text>
  <rect class="y" x="220" y="180" width="96" height="34" rx="3"/>
  <text x="268.0" y="201" class="s c">masked</text>
  <rect class="r" x="220" y="240" width="96" height="34" rx="3"/>
  <text x="268.0" y="261" class="s c">no</text>
  <rect class="u" x="320" y="40" width="96" height="50" rx="3"/>
  <text x="368.0" y="62" class="s c">program A,</text>
  <text x="368.0" y="76" class="s c">user mode</text>
  <rect class="w" x="320" y="120" width="96" height="34" rx="3"/>
  <text x="368.0" y="141" class="s c">A's user stack</text>
  <rect class="w" x="320" y="180" width="96" height="34" rx="3"/>
  <text x="368.0" y="201" class="s c">unmasked</text>
  <rect class="w" x="320" y="240" width="96" height="34" rx="3"/>
  <text x="368.0" y="261" class="s c">-</text>
  <rect class="k" x="420" y="40" width="111" height="50" rx="3"/>
  <text x="475.5" y="62" class="s c">kernel call</text>
  <text x="475.5" y="76" class="s c">made by A</text>
  <rect class="y" x="420" y="180" width="111" height="34" rx="3"/>
  <text x="475.5" y="201" class="s c">masked</text>
  <rect class="g" x="420" y="240" width="111" height="34" rx="3"/>
  <text x="475.5" y="261" class="s c">yes: it does, here</text>
  <rect class="k" x="535" y="40" width="111" height="50" rx="3"/>
  <text x="590.5" y="62" class="s c">a thread of</text>
  <text x="590.5" y="76" class="s c">process 1</text>
  <rect class="w" x="535" y="120" width="111" height="34" rx="3"/>
  <text x="590.5" y="141" class="s c">its kernel stack</text>
  <rect class="w" x="535" y="180" width="111" height="34" rx="3"/>
  <text x="590.5" y="201" class="s c">unmasked</text>
  <rect class="g" x="535" y="240" width="111" height="34" rx="3"/>
  <text x="590.5" y="261" class="s c">yes</text>
  <rect class="n" x="650" y="40" width="111" height="50" rx="3"/>
  <text x="705.5" y="69" class="s c">idle loop</text>
  <rect class="w" x="650" y="120" width="111" height="34" rx="3"/>
  <text x="705.5" y="141" class="s c">CPU 0's boot stack</text>
  <rect class="w" x="650" y="180" width="111" height="34" rx="3"/>
  <text x="705.5" y="201" class="s c">unmasked</text>
  <rect class="r" x="650" y="240" width="111" height="34" rx="3"/>
  <text x="705.5" y="261" class="s c">no</text>
  <rect class="wk" x="220" y="120" width="96" height="34" rx="3"/>
  <text x="268" y="136" class="s c">A's kernel stack,</text>
  <text x="268" y="149" class="s c">borrowed</text>
  <rect class="wk" x="420" y="120" width="111" height="34" rx="3"/>
  <text x="475" y="141" class="s c">A's kernel stack</text>
  <path class="lnr" d="M220,14 L220,38" marker-end="url(#ar)"/>
  <text x="226" y="18" class="s red">a device interrupts</text>
  <path class="lnk" d="M420,14 L420,38" marker-end="url(#ak)"/>
  <text x="426" y="18" class="s blue">A calls the kernel</text>
  <path class="ln" d="M535,14 L535,38" marker-end="url(#a)"/>
  <text x="541" y="18" class="s">A blocks: switch</text>
  <path class="ln" d="M650,14 L650,38" marker-end="url(#a)"/>
  <text x="656" y="18" class="s">nothing is ready</text>
  <path class="ln" d="M120,300 L761,300" marker-end="url(#a)"/>
  <text x="767" y="304" class="s">time</text>
  <text x="120" y="322" class="s">Only code with a stack of its own can be set aside and resumed.</text>
  <text x="120" y="336" class="s">The handler has none, and the idle loop is what runs when everything else waits.</text>
</svg>
