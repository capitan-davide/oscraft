<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
  <rect class="u" x="15.0" y="12" width="110" height="40" rx="4"/>
  <text x="70" y="29" class="b c">the program</text>
  <text x="70" y="44" class="s c">calls recv()</text>
  <path class="life" d="M70,52 L70,588"/>
  <rect class="k" x="145.0" y="12" width="170" height="40" rx="4"/>
  <text x="230" y="29" class="b c">the kernel</text>
  <text x="230" y="44" class="s c">ker/, sched, interrupt, arch/</text>
  <path class="life" d="M230,52 L230,588"/>
  <rect class="g" x="335.0" y="12" width="150" height="40" rx="4"/>
  <text x="410" y="29" class="b c">netd</text>
  <text x="410" y="44" class="s c">a receiving thread</text>
  <path class="life" d="M410,52 L410,588"/>
  <rect class="g" x="515.0" y="12" width="150" height="40" rx="4"/>
  <text x="590" y="29" class="b c">netd</text>
  <text x="590" y="44" class="s c">the interrupt thread</text>
  <path class="life" d="M590,52 L590,588"/>
  <rect class="n" x="700.0" y="12" width="90" height="40" rx="4"/>
  <text x="745" y="29" class="b c">virtio</text>
  <text x="745" y="44" class="s c">network device</text>
  <path class="life" d="M745,52 L745,588"/>
  <rect class="y" x="63" y="84" width="14" height="455" rx="2"/>
  <text x="82" y="250" class="s">REPLY-</text>
  <text x="82" y="263" class="s">blocked</text>
  <rect class="y" x="403" y="204" width="14" height="238" rx="2"/>
  <text x="422" y="236" class="s">asleep</text>
  <text x="422" y="249" class="s">(a futex wait)</text>
  <rect class="y" x="583" y="66" width="14" height="252" rx="2"/>
  <text x="602" y="150" class="s">blocked in</text>
  <text x="602" y="163" class="s">InterruptWait()</text>
  <rect class="y" x="583" y="434" width="14" height="126" rx="2"/>
  <text x="602" y="480" class="s">InterruptWait()</text>
  <text x="602" y="493" class="s">again: unmasks</text>
  <text x="602" y="506" class="s">the interrupt</text>
  <circle cx="92" cy="66" r="9" fill="#2c5d9b"/>
  <text x="92" y="70" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <path class="lnk" d="M70,80 L228,80" marker-end="url(#ak)"/>
  <text x="164.0" y="74" class="s c">MsgSendv()</text>
  <rect class="wk" x="148.0" y="88" width="164" height="47" rx="3"/>
  <text x="230" y="103" class="s c">copy the request to a</text>
  <text x="230" y="116" class="s c">receiving thread; make it</text>
  <text x="230" y="129" class="s c">ready at the caller's priority</text>
  <path class="lnk" d="M312,112 L408,112" marker-end="url(#ak)"/>
  <circle cx="500" cy="158" r="9" fill="#3e7b34"/>
  <text x="500" y="162" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <rect class="g" x="332.0" y="150" width="156" height="34" rx="3"/>
  <text x="410" y="165" class="s c">soreceive(): the socket's</text>
  <text x="410" y="178" class="s c">buffer is empty; sleep</text>
  <path class="lng" d="M410,200 L232,200" marker-end="url(#ag)"/>
  <text x="320.0" y="194" class="s c">futex wait</text>
  <circle cx="765" cy="276" r="9" fill="#aa2222"/>
  <text x="765" y="280" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <path class="lnr" d="M745,290 L232,290" marker-end="url(#ar)"/>
  <text x="672" y="284" class="s c red">interrupt</text>
  <rect class="r" x="148.0" y="298" width="164" height="47" rx="3"/>
  <text x="230" y="313" class="s c">identify the vector; mask it;</text>
  <text x="230" y="326" class="s c">wake its thread; end the</text>
  <text x="230" y="339" class="s c">interrupt; reschedule</text>
  <path class="lnk" d="M312,322 L588,322" marker-end="url(#ak)"/>
  <circle cx="678" cy="358" r="9" fill="#3e7b34"/>
  <text x="678" y="362" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <rect class="g" x="512.0" y="350" width="156" height="60" rx="3"/>
  <text x="590" y="365" class="s c">the driver takes the packet;</text>
  <text x="590" y="378" class="s c">the stack finds the socket</text>
  <text x="590" y="391" class="s c">and queues the datagram;</text>
  <text x="590" y="404" class="s c">wake the sleeper</text>
  <path class="lng" d="M590,430 L232,430" marker-end="url(#ag)"/>
  <text x="500.0" y="425" class="s c">futex wake</text>
  <path class="lnk" d="M232,446 L408,446" marker-end="url(#ak)"/>
  <text x="320.0" y="460" class="s c">made ready</text>
  <circle cx="500" cy="476" r="9" fill="#3e7b34"/>
  <text x="500" y="480" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <rect class="g" x="332.0" y="468" width="156" height="34" rx="3"/>
  <text x="410" y="483" class="s c">soreceive() returns</text>
  <text x="410" y="496" class="s c">the datagram</text>
  <path class="lng" d="M410,518 L232,518" marker-end="url(#ag)"/>
  <text x="320.0" y="512" class="s c">MsgReply()</text>
  <rect class="wk" x="148.0" y="526" width="164" height="34" rx="3"/>
  <text x="230" y="541" class="s c">copy the data to the</text>
  <text x="230" y="554" class="s c">program's buffer; wake it</text>
  <path class="lnk" d="M148,543 L79,543" marker-end="url(#ak)"/>
  <rect class="g" x="15" y="556" width="110" height="26" rx="3"/>
  <text x="70" y="573" class="s c">recv() returns</text>
</svg>
