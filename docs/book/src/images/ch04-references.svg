<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>
  <text x="200" y="22" class="h c">References: counted, they keep the object</text>
  <rect class="k" x="130" y="120" width="140" height="70" rx="4"/>
  <text x="200" y="143" class="b c">thread 12</text>
  <text x="200" y="160" class="s c">its state, its stacks</text>
  <text x="200" y="177" class="m c">references: 3</text>
  <rect class="wk" x="20" y="44" width="150" height="32" rx="3"/>
  <text x="95" y="64" class="s c">the table of all threads</text>
  <rect class="wk" x="230" y="44" width="160" height="32" rx="3"/>
  <text x="310" y="64" class="s c">a channel's queue of senders</text>
  <rect class="wk" x="120" y="232" width="160" height="32" rx="3"/>
  <text x="200" y="252" class="s c">an interrupt it is attached to</text>
  <path class="lnk" d="M95,76 L160,118" marker-end="url(#ak)"/>
  <path class="lnk" d="M310,76 L240,118" marker-end="url(#ak)"/>
  <path class="lnk" d="M200,232 L200,192" marker-end="url(#ak)"/>
  <text x="200" y="284" class="s c">Freed when the last of the three lets go, whichever that is.</text>
  <path class="life" d="M410,20 L410,280"/>
  <text x="610" y="22" class="h c">IDs: looked up when used, they keep nothing</text>
  <rect class="k" x="440" y="60" width="150" height="60" rx="4"/>
  <text x="515" y="83" class="b c">channel</text>
  <text x="515" y="102" class="m c">owner: pid 4102</text>
  <rect class="y" x="640" y="44" width="140" height="92" rx="4"/>
  <text x="710" y="62" class="b c">the process table</text>
  <rect class="w" x="650" y="72" width="120" height="22" rx="2"/>
  <text x="710" y="87" class="m c">4102</text>
  <rect class="w" x="650" y="100" width="120" height="22" rx="2"/>
  <text x="710" y="115" class="m c">8199</text>
  <path class="ln dash" d="M590,84 L648,84" marker-end="url(#a)"/>
  <text x="619" y="76" class="s c">look up</text>
  <rect class="k" x="640" y="170" width="140" height="50" rx="4"/>
  <text x="710" y="191" class="b c">process 4102</text>
  <text x="710" y="208" class="s c">its memory, its tables</text>
  <path class="lnk" d="M760,94 L760,168" marker-end="url(#ak)"/>
  <text x="515" y="150" class="s c">The channel holds a number,</text>
  <text x="515" y="164" class="s c">not the process. When the</text>
  <text x="515" y="178" class="s c">process ends, its row goes,</text>
  <text x="515" y="192" class="s c">and the lookup fails.</text>
  <text x="610" y="284" class="s c">A process's channels never keep the process alive.</text>
</svg>
