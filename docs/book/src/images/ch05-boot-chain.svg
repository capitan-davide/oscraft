<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="250" fill="#ffffff"/>
  <rect class="n" x="20" y="60" width="136" height="84" rx="4"/>
  <text x="88.0" y="80" class="b c">firmware</text>
  <text x="88.0" y="100" class="s c">in ROM; runs at reset;</text>
  <text x="88.0" y="114" class="s c">brings up RAM and</text>
  <text x="88.0" y="128" class="s c">a boot device</text>
  <path class="ln" d="M156,102 L174,102" marker-end="url(#a)"/>
  <rect class="n" x="176" y="60" width="136" height="84" rx="4"/>
  <text x="244.0" y="80" class="b c">boot loader</text>
  <text x="244.0" y="100" class="s c">finds the boot image,</text>
  <text x="244.0" y="114" class="s c">copies it to RAM,</text>
  <text x="244.0" y="128" class="s c">jumps into it</text>
  <path class="ln" d="M312,102 L330,102" marker-end="url(#a)"/>
  <rect class="k" x="332" y="60" width="136" height="84" rx="4"/>
  <text x="400.0" y="80" class="b c">early kernel code</text>
  <text x="400.0" y="100" class="s c">learns what the machine</text>
  <text x="400.0" y="114" class="s c">is; builds page tables;</text>
  <text x="400.0" y="128" class="s c">sets up every CPU</text>
  <path class="ln" d="M468,102 L486,102" marker-end="url(#a)"/>
  <rect class="k" x="488" y="60" width="136" height="84" rx="4"/>
  <text x="556.0" y="80" class="b c">the kernel proper</text>
  <text x="556.0" y="100" class="s c">scheduler, memory,</text>
  <text x="556.0" y="114" class="s c">interrupts, clock;</text>
  <text x="556.0" y="128" class="s c">creates the first process</text>
  <path class="ln" d="M624,102 L642,102" marker-end="url(#a)"/>
  <rect class="u" x="644" y="60" width="136" height="84" rx="4"/>
  <text x="712.0" y="80" class="b c">the first programs</text>
  <text x="712.0" y="100" class="s c">start the servers and</text>
  <text x="712.0" y="114" class="s c">drivers; give the</text>
  <text x="712.0" y="128" class="s c">user a shell</text>
  <path class="life" d="M166,104 L166,166"/>
  <text x="166" y="180" class="s c">RAM works</text>
  <path class="life" d="M322,104 L322,166"/>
  <text x="322" y="180" class="s c">the image in RAM;</text>
  <text x="322" y="193" class="s c">one CPU, in a</text>
  <text x="322" y="206" class="s c">known state</text>
  <path class="life" d="M478,104 L478,166"/>
  <text x="478" y="180" class="s c">a description of the</text>
  <text x="478" y="193" class="s c">machine; an address</text>
  <text x="478" y="206" class="s c">space; CPUs waiting</text>
  <path class="life" d="M634,104 L634,166"/>
  <text x="634" y="180" class="s c">a running kernel</text>
  <text x="20" y="30" class="h">What each stage hands to the next</text>
  <text x="400" y="236" class="s c">Each stage runs once and leaves the next one a little more to stand on. The earlier a stage, the more it is tied to one machine.</text>
</svg>
