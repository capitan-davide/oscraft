<svg xmlns="http://www.w3.org/2000/svg" width="800" height="305" viewBox="0 0 800 305" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="305" fill="#ffffff"/>
  <text x="135" y="24" class="b c">1. Built for one machine</text>
  <text x="135" y="40" class="s c">addresses are constants in the kernel</text>
  <rect class="k" x="15" y="56" width="240" height="150" rx="4"/>
  <text x="135.0" y="76" class="b c">kernel</text>
  <rect class="wk" x="29" y="88" width="212" height="44" rx="3"/>
  <text x="135.0" y="106" class="ms c">UART = 0x09000000</text>
  <text x="135.0" y="121" class="ms c">TIMER_IRQ = 27  ...</text>
  <rect class="wk" x="29" y="142" width="212" height="50" rx="3"/>
  <text x="135.0" y="163" class="s c">drivers for this machine's</text>
  <text x="135.0" y="177" class="s c">controller, timer, UART</text>
  <text x="135.0" y="228" class="s c">Simple. Another machine needs</text>
  <text x="135.0" y="242" class="s c">another kernel.</text>
  <text x="400" y="24" class="b c">2. A description the kernel reads</text>
  <text x="400" y="40" class="s c">a device tree or firmware tables</text>
  <rect class="y" x="280" y="56" width="240" height="34" rx="4"/>
  <text x="400.0" y="77" class="s c">device tree: what is where</text>
  <path class="ln" d="M400.0,90 L400.0,108" marker-end="url(#a)"/>
  <rect class="k" x="280" y="110" width="240" height="96" rx="4"/>
  <text x="400.0" y="128" class="b c">kernel</text>
  <rect class="wk" x="294" y="138" width="212" height="56" rx="3"/>
  <text x="400.0" y="156" class="s c">a parser, and a driver for</text>
  <text x="400.0" y="170" class="s c">every controller, timer and</text>
  <text x="400.0" y="184" class="s c">UART it may meet</text>
  <text x="400.0" y="228" class="s c">One kernel for many machines,</text>
  <text x="400.0" y="242" class="s c">and all their drivers inside it.</text>
  <text x="665" y="24" class="b c">3. A program before the kernel</text>
  <text x="665" y="40" class="s c">written for the machine</text>
  <rect class="k" x="545" y="56" width="240" height="40" rx="4"/>
  <text x="665.0" y="73" class="b c">startup program</text>
  <text x="665.0" y="88" class="s c">knows this machine</text>
  <path class="ln" d="M665.0,96 L665.0,112" marker-end="url(#a)"/>
  <rect class="y" x="545" y="114" width="240" height="46" rx="4"/>
  <text x="665.0" y="132" class="s c">a fixed table of facts, and a</text>
  <text x="665.0" y="146" class="s c">few small routines for the devices</text>
  <path class="ln" d="M665.0,160 L665.0,176" marker-end="url(#a)"/>
  <rect class="k" x="545" y="178" width="240" height="28" rx="4"/>
  <text x="665.0" y="196" class="s c">kernel: knows the processor only</text>
  <text x="665.0" y="228" class="s c">One kernel, no drivers in it.</text>
  <text x="665.0" y="242" class="s c">A new machine needs a new startup.</text>
  <path class="life" d="M268,14 L268,250"/>
  <path class="life" d="M533,14 L533,250"/>
  <text x="400" y="284" class="s c">The ways combine: a startup program may itself read a device tree for the facts that vary.</text>
</svg>
