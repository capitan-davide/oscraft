<svg xmlns="http://www.w3.org/2000/svg" width="820" height="395" viewBox="0 0 820 395" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="395" fill="#ffffff"/>
  <text x="410" y="24" class="h c">ESR_EL1, low 32 bits</text>
  <rect class="k" x="60.0" y="44" width="131.25" height="40" rx="0"/>
  <text x="125.625" y="60.5" class="c">EC</text>
  <text x="125.625" y="75.5" class="s c">exception class</text>
  <rect class="n" x="191.25" y="44" width="21.875" height="40" rx="0"/>
  <text x="202.188" y="68" class="s c">IL</text>
  <rect class="y" x="213.125" y="44" width="546.875" height="40" rx="0"/>
  <text x="486.562" y="60.5" class="c">ISS</text>
  <text x="486.562" y="75.5" class="s c">instruction-specific syndrome</text>
  <text x="70.9375" y="98" class="s c">31</text>
  <text x="180.312" y="98" class="s c">26</text>
  <text x="202.188" y="98" class="s c">25</text>
  <text x="224.062" y="98" class="s c">24</text>
  <text x="749.062" y="98" class="s c">0</text>
  <rect class="wk" x="40" y="130" width="380" height="180" rx="2"/>
  <text x="52" y="152" class="b">classes handle() looks for</text>
  <text x="52" y="178" class="m">0x15</text>
  <text x="140" y="178" class="s">svc from AArch64: a kernel call if ISS = 0x51</text>
  <text x="52" y="200" class="m">0x07</text>
  <text x="140" y="200" class="s">FP/SIMD access trapped: lazy FP</text>
  <text x="52" y="222" class="m">0x20</text>
  <text x="140" y="222" class="s">instruction abort from EL0</text>
  <text x="52" y="244" class="m">0x24</text>
  <text x="140" y="244" class="s">data abort from EL0</text>
  <text x="52" y="266" class="m">0x21, 0x25</text>
  <text x="140" y="266" class="s">the same aborts from EL1 (a bug)</text>
  <text x="52" y="288" class="m">0x3c</text>
  <text x="140" y="288" class="s">brk instruction: the boot self-test</text>
  <polyline class="ln dash" points="125.625,84 125.625,128" marker-end="url(#a)"/>
  <rect class="y" x="460" y="150" width="320" height="40" rx="0"/>
  <rect class="y" x="460" y="150" width="200" height="40" rx="0"/>
  <text x="560" y="174" class="s c">…</text>
  <rect class="y" x="660" y="150" width="30" height="40" rx="0"/>
  <text x="675" y="174" class="s c">WnR</text>
  <rect class="y" x="690" y="150" width="90" height="40" rx="0"/>
  <text x="735" y="174" class="c">DFSC</text>
  <text x="675" y="204" class="s c">6</text>
  <text x="735" y="204" class="s c">5:0</text>
  <polyline class="ln dash" points="606.875,84 660,148"/>
  <polyline class="ln dash" points="760,84 780,148"/>
  <text x="460" y="140" class="s">the ISS of a data abort</text>
  <text x="460" y="232" class="s">WnR: 1 for a write, 0 for a read</text>
  <text x="460" y="252" class="s">DFSC, the fault status code:</text>
  <text x="470" y="272" class="s">0b0001LL (0x04–0x07): translation fault</text>
  <text x="470" y="290" class="s">0b0011LL (0x0c–0x0f): permission fault</text>
  <text x="470" y="308" class="s">LL: the translation level, 0 to 3</text>
  <text x="460" y="336" class="s">esr &amp; 0x3c drops LL and keeps the kind</text>
  <text x="40" y="350" class="m">handle(): ec = esr &gt;&gt; 26; iss = esr &amp; 0x1ff_ffff</text>
  <text x="40" y="372" class="s">IL is 1 for a 32-bit instruction, as every AArch64 instruction is.</text>
</svg>
