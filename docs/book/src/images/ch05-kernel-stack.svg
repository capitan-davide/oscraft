<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
  <rect class="u" x="40" y="20" width="300" height="56" rx="4"/>
  <text x="190" y="44.5" class="c">user code at EL0</text>
  <text x="190" y="59.5" class="s c">SP_EL0 = its user stack</text>
  <line x1="20" y1="104" x2="780" y2="104" stroke="#aa2222" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="26" y="98" class="s red">EL0</text>
  <text x="26" y="120" class="s red">EL1</text>
  <polyline class="ln" points="190,76 190,140 426,140" marker-end="url(#a)"/>
  <text x="198" y="96" class="s">svc #0x51, fault or IRQ: the CPU</text>
  <text x="198" y="122" class="s">switches to SP_EL1 and saves the</text>
  <text x="198" y="134" class="s">state at the top of the kernel stack</text>
  <rect class="y" x="430" y="130" width="290" height="44" rx="0"/>
  <text x="575" y="148.5" class="c">TrapFrame (288 bytes)</text>
  <text x="575" y="163.5" class="s c">x0–x30, sp_el0, elr, spsr, esr, far</text>
  <rect class="wk" x="430" y="174" width="290" height="30" rx="0"/>
  <text x="575" y="193" class="c">exception_entry(), handle()</text>
  <rect class="wk" x="430" y="204" width="290" height="30" rx="0"/>
  <text x="575" y="223" class="c">ker::dispatch()</text>
  <rect class="wk" x="430" y="234" width="290" height="30" rx="0"/>
  <text x="575" y="253" class="c">the call's handler, e.g. msg_sendv()</text>
  <rect class="wk" x="430" y="264" width="290" height="30" rx="0"/>
  <text x="575" y="283" class="c">sched::block() → schedule()</text>
  <rect class="wk" x="430" y="294" width="290" height="30" rx="0"/>
  <text x="575" y="313" class="c">context::switch() → cpu_switch</text>
  <rect class="w" x="430" y="324" width="290" height="120" rx="0"/>
  <text x="575" y="388" class="s c">free</text>
  <rect class="r" x="430" y="444" width="290" height="34" rx="0"/>
  <text x="575" y="465" class="c">guard page (unmapped)</text>
  <text x="726" y="134" class="s">kstack_top</text>
  <text x="726" y="146" class="s">(high)</text>
  <text x="726" y="328" class="s">saved sp</text>
  <polyline class="ln" points="760,160 760,300" marker-end="url(#a)"/>
  <text x="764" y="240" class="s">grows</text>
  <text x="764" y="252" class="s">down</text>
  <rect class="k" x="40" y="190" width="300" height="30" rx="0"/>
  <text x="190" y="209" class="c">Thread (in the kernel heap)</text>
  <rect class="wk" x="40" y="220" width="300" height="30" rx="0"/>
  <text x="48" y="239" class="m">kstack_top</text>
  <rect class="wk" x="40" y="250" width="300" height="46" rx="0"/>
  <text x="48" y="269.5" class="m">context: x19–x28, fp, lr, sp,</text>
  <text x="48" y="284.5" class="m">TPIDR_EL0</text>
  <rect class="wk" x="40" y="296" width="300" height="46" rx="0"/>
  <text x="48" y="315.5" class="m">fp: FpState</text>
  <text x="48" y="330.5" class="s">v0–v31, FPCR, FPSR</text>
  <rect class="wk" x="40" y="342" width="300" height="30" rx="0"/>
  <text x="48" y="361" class="s">stack: its pages, freed by reap()</text>
  <polyline class="lnk" points="340,235 390,235 390,132 426,132" marker-end="url(#ak)"/>
  <polyline class="lnk" points="340,273 400,324 426,324" marker-end="url(#ak)"/>
  <text x="40" y="400" class="s">A blocked user thread leaves two saved states:</text>
  <text x="40" y="414" class="s">its user registers in the TrapFrame, and the kernel</text>
  <text x="40" y="428" class="s">registers of its last schedule() in context.</text>
</svg>
