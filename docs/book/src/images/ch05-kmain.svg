<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>
  <text x="30" y="24" class="h">kmain(), in order</text>
  <text x="362" y="24" class="h">what works afterwards</text>
  <text x="584" y="24" class="h">on the console</text>
  <rect class="k" x="20" y="36" width="330" height="34" rx="3"/>
  <circle cx="36" cy="53" r="9" fill="#2c5d9b"/>
  <text x="36" y="57" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="54" y="57" class="s">this CPU's data; the system page; the console</text>
  <text x="362" y="57" class="s">from here on the kernel can print</text>
  <rect class="w" x="584" y="41" width="206" height="24" rx="2"/>
  <text x="590" y="57" class="ms">OsCraft kernel 0.1.0 on CPU 0</text>
  <path class="ln" d="M185,70 L185,78" marker-end="url(#a)"/>
  <rect class="k" x="20" y="79" width="330" height="34" rx="3"/>
  <circle cx="36" cy="96" r="9" fill="#2c5d9b"/>
  <text x="36" y="100" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="54" y="100" class="s">exception vectors, tested with a breakpoint</text>
  <text x="362" y="100" class="s">a fault is now reported, not silent</text>
  <rect class="w" x="584" y="84" width="206" height="24" rx="2"/>
  <text x="590" y="100" class="ms">exceptions: ... self-test ok</text>
  <path class="ln" d="M185,113 L185,121" marker-end="url(#a)"/>
  <rect class="k" x="20" y="122" width="330" height="34" rx="3"/>
  <circle cx="36" cy="139" r="9" fill="#2c5d9b"/>
  <text x="36" y="143" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="54" y="143" class="s">free memory; startup's page tables; all RAM mapped</text>
  <text x="362" y="143" class="s">the heap works: Box, Vec, Arc</text>
  <rect class="w" x="584" y="127" width="206" height="24" rx="2"/>
  <text x="590" y="143" class="ms">pmem: 1844 MiB free in 3 ranges</text>
  <path class="ln" d="M185,156 L185,164" marker-end="url(#a)"/>
  <rect class="k" x="20" y="165" width="330" height="34" rx="3"/>
  <circle cx="36" cy="182" r="9" fill="#2c5d9b"/>
  <text x="36" y="186" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="54" y="186" class="s">process 1 and its address space; copy windows</text>
  <text x="362" y="186" class="s">there is a process to own kernel threads</text>
  <path class="ln" d="M185,199 L185,207" marker-end="url(#a)"/>
  <rect class="k" x="20" y="208" width="330" height="34" rx="3"/>
  <circle cx="36" cy="225" r="9" fill="#2c5d9b"/>
  <text x="36" y="229" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="54" y="229" class="s">interrupt dispatch, from the system page</text>
  <text x="362" y="229" class="s">handlers can be attached</text>
  <path class="ln" d="M185,242 L185,250" marker-end="url(#a)"/>
  <rect class="k" x="20" y="251" width="330" height="34" rx="3"/>
  <circle cx="36" cy="268" r="9" fill="#2c5d9b"/>
  <text x="36" y="272" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">6</text>
  <text x="54" y="272" class="s">the clock tick</text>
  <text x="362" y="272" class="s">time passes; timeouts work</text>
  <rect class="w" x="584" y="256" width="206" height="24" rx="2"/>
  <text x="590" y="272" class="ms">clock: 1000 Hz tick on vector 27</text>
  <path class="ln" d="M185,285 L185,293" marker-end="url(#a)"/>
  <rect class="k" x="20" y="294" width="330" height="34" rx="3"/>
  <circle cx="36" cy="311" r="9" fill="#2c5d9b"/>
  <text x="36" y="315" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">7</text>
  <text x="54" y="315" class="s">scheduler, FP and IPIs on this CPU</text>
  <text x="362" y="315" class="s">threads can be created and switched</text>
  <path class="ln" d="M185,328 L185,336" marker-end="url(#a)"/>
  <rect class="k" x="20" y="337" width="330" height="34" rx="3"/>
  <circle cx="36" cy="354" r="9" fill="#2c5d9b"/>
  <text x="36" y="358" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">8</text>
  <text x="54" y="358" class="s">the other CPUs, one at a time</text>
  <text x="362" y="358" class="s">each repeats the per-CPU steps</text>
  <rect class="w" x="584" y="342" width="206" height="24" rx="2"/>
  <text x="590" y="358" class="ms">smp: 4 of 4 CPUs online</text>
  <path class="ln" d="M185,371 L185,379" marker-end="url(#a)"/>
  <rect class="k" x="20" y="380" width="330" height="34" rx="3"/>
  <circle cx="36" cy="397" r="9" fill="#2c5d9b"/>
  <text x="36" y="401" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">9</text>
  <text x="54" y="401" class="s">interrupts unmasked; process 1's threads created</text>
  <text x="362" y="401" class="s">the first tick; the boot script is ready</text>
  <path class="ln" d="M185,414 L185,422" marker-end="url(#a)"/>
  <rect class="g" x="20" y="423" width="330" height="34" rx="3"/>
  <circle cx="36" cy="440" r="9" fill="#3e7b34"/>
  <text x="36" y="444" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">10</text>
  <text x="54" y="444" class="s">sched::idle(): the boot code becomes the idle thread</text>
  <text x="362" y="444" class="s">the scheduler picks the first thread</text>
  <rect class="w" x="584" y="428" width="206" height="24" rx="2"/>
  <text x="590" y="444" class="ms">kernel: running the boot script</text>
</svg>
