<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
  <rect class="g" x="40" y="20" width="220" height="44" rx="4"/>
  <text x="150" y="38.5" class="c">thread A</text>
  <text x="150" y="53.5" class="s c">running on this CPU</text>
  <rect class="w" x="560" y="20" width="220" height="44" rx="4"/>
  <text x="670" y="38.5" class="c">thread B</text>
  <text x="670" y="53.5" class="s c">suspended since it last ran</text>
  <rect class="wk" x="40" y="90" width="220" height="44" rx="4"/>
  <text x="150" y="108.5" class="c">schedule()</text>
  <text x="150" y="123.5" class="s c">picks B</text>
  <rect class="wk" x="560" y="90" width="220" height="60" rx="4"/>
  <text x="670" y="109" class="c">inside its own call to</text>
  <text x="670" y="124" class="s c">cpu_switch, from schedule();</text>
  <text x="670" y="139" class="s c">B.context.x30 = return address</text>
  <polyline class="ln" points="150,134 150,170 298,170" marker-end="url(#a)"/>
  <text x="158" y="152" class="s">call: x30 =</text>
  <text x="158" y="164" class="s">return address in A</text>
  <rect class="k" x="300" y="150" width="220" height="130" rx="4"/>
  <text x="410" y="170" class="b c">cpu_switch</text>
  <rect class="y" x="310" y="182" width="200" height="40" rx="2"/>
  <text x="410" y="198.5" class="ms c">stp x19 … x30, sp</text>
  <text x="410" y="213.5" class="s c">→ A.context</text>
  <rect class="y" x="310" y="230" width="200" height="40" rx="2"/>
  <text x="410" y="246.5" class="ms c">ldp x19 … x30, sp</text>
  <text x="410" y="261.5" class="s c">← B.context</text>
  <polyline class="lng" points="520,262 670,262 670,300" marker-end="url(#ag)"/>
  <text x="600" y="254" class="s c">ret: jumps to x30, now B's</text>
  <rect class="g" x="560" y="300" width="220" height="50" rx="4"/>
  <text x="670" y="315" class="c">thread B</text>
  <text x="670" y="329" class="s c">returns from its cpu_switch call,</text>
  <text x="670" y="343" class="s c">continues in schedule()</text>
  <rect class="w" x="40" y="300" width="220" height="50" rx="4"/>
  <text x="150" y="315" class="c">thread A</text>
  <text x="150" y="329" class="s c">suspended inside cpu_switch</text>
  <text x="150" y="343" class="s c">until a switch loads A.context</text>
  <text x="40" y="384" class="s">The registers saved in a Context are those of a thread in the middle of its call to cpu_switch, so loading them resumes that call.</text>
</svg>
