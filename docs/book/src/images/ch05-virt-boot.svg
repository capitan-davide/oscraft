<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <rect class="n" x="20" y="20" width="150" height="92" rx="4"/>
  <text x="95" y="40" class="b c">QEMU</text>
  <text x="95" y="58" class="s c">-kernel oscraft.ifs:</text>
  <text x="95" y="71" class="s c">copies the image into</text>
  <text x="95" y="84" class="s c">RAM, writes a device</text>
  <text x="95" y="97" class="s c">tree, starts CPU 0</text>
  <text x="210" y="30" class="h">RAM, from 0x40000000</text>
  <rect class="n" x="210" y="44" width="44" height="46" rx="2"/>
  <text x="232.0" y="71" class="s c">jump</text>
  <rect class="y" x="254" y="44" width="62" height="46" rx="2"/>
  <text x="285.0" y="64" class="s c">startup</text>
  <text x="285.0" y="78" class="s c">header</text>
  <rect class="k" x="316" y="44" width="96" height="46" rx="2"/>
  <text x="364.0" y="71" class="s c">startup</text>
  <rect class="k" x="412" y="44" width="120" height="46" rx="2"/>
  <text x="472.0" y="71" class="s c">kernel</text>
  <rect class="y" x="532" y="44" width="70" height="46" rx="2"/>
  <text x="567.0" y="64" class="s c">boot</text>
  <text x="567.0" y="78" class="s c">script</text>
  <rect class="g" x="602" y="44" width="122" height="46" rx="2"/>
  <text x="663.0" y="64" class="s c">files: servers,</text>
  <text x="663.0" y="78" class="s c">libc, sh, tools</text>
  <text x="210" y="106" class="ms">0x40080000</text>
  <path class="ln" d="M412,96 L412,102 L724,102 L724,96"/>
  <text x="568.0" y="116" class="s c">the image file system</text>
  <rect class="y" x="730" y="44" width="56" height="46" rx="2"/>
  <text x="758" y="64" class="s c">device</text>
  <text x="758" y="78" class="s c">tree</text>
  <path class="ln" d="M170,66 L208,66" marker-end="url(#a)"/>
  <rect class="k" x="20" y="170" width="220" height="110" rx="4"/>
  <text x="130.0" y="190" class="b c">1   startup, on CPU 0</text>
  <text x="130.0" y="208" class="s c">EL1, MMU off, x0 = device tree</text>
  <text x="130.0" y="221" class="s c">RAM size and CPU count from the tree</text>
  <text x="130.0" y="234" class="s c">sets up the GIC and the timer</text>
  <text x="130.0" y="247" class="s c">starts CPUs 1-3 (PSCI)</text>
  <text x="130.0" y="260" class="s c">builds the kernel's page tables</text>
  <rect class="k" x="290" y="170" width="220" height="110" rx="4"/>
  <text x="400.0" y="190" class="b c">2  the kernel</text>
  <text x="400.0" y="208" class="s c">_start: a stack, a cleared .bss</text>
  <text x="400.0" y="221" class="s c">kmain(): memory, interrupts, clock,</text>
  <text x="400.0" y="234" class="s c">scheduler; calls in the other CPUs</text>
  <text x="400.0" y="247" class="s c">starts process 1's threads</text>
  <text x="400.0" y="260" class="s c">becomes CPU 0's idle thread</text>
  <rect class="k" x="560" y="170" width="220" height="110" rx="4"/>
  <text x="670.0" y="190" class="b c">3  process 1</text>
  <text x="670.0" y="208" class="s c">serves the image's files</text>
  <text x="670.0" y="221" class="s c">runs the boot script:</text>
  <text x="670.0" y="234" class="s c">servers, the network driver,</text>
  <text x="670.0" y="247" class="s c">then sh on the console</text>
  <text x="670.0" y="260" class="s c"></text>
  <path class="ln" d="M240,215 L288,215" marker-end="url(#a)"/>
  <text x="264" y="207" class="ms c">x0</text>
  <path class="ln" d="M510,215 L558,215" marker-end="url(#a)"/>
  <circle cx="330" cy="56" r="9" fill="#2c5d9b"/>
  <text x="330" y="60" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <circle cx="426" cy="56" r="9" fill="#2c5d9b"/>
  <text x="426" y="60" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <circle cx="544" cy="56" r="9" fill="#2c5d9b"/>
  <text x="544" y="60" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <circle cx="614" cy="56" r="9" fill="#2c5d9b"/>
  <text x="614" y="60" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <circle cx="784" cy="44" r="9" fill="#2c5d9b"/>
  <text x="784" y="48" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="400" y="140" class="s c">The numbers say which step runs or reads each part. Startup and the kernel run where they lie, in the image.</text>
  <rect class="y" x="150" y="330" width="500" height="40" rx="4"/>
  <text x="400" y="347" class="b c">the system page: the machine, described, with the callouts</text>
  <text x="400" y="362" class="s c">memory ranges, CPUs, interrupt controller, timer, console; kept for the kernel's whole life</text>
  <path class="lnk" d="M130,280 L130,350 L148,350" marker-end="url(#ak)"/>
  <text x="98" y="320" class="s c">writes</text>
  <path class="lnk" d="M400,328 L400,282" marker-end="url(#ak)"/>
  <text x="424" y="312" class="s c">reads</text>
  <path class="lnk" d="M652,350 L670,350 L670,282" marker-end="url(#ak)"/>
  <text x="700" y="320" class="s c">reads</text>
</svg>
