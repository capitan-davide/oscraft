<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="340" fill="#ffffff"/>
  <text x="120" y="24" class="b c">sender: 2 iovecs</text>
  <text x="690" y="24" class="b c">receiver: 3 iovecs</text>
  <rect class="wu" x="20" y="40" width="110" height="34" rx="4"/>
  <text x="75" y="54.5" class="ms c">iov[0]</text>
  <text x="75" y="67.5" class="ms c">{ hdr, 16 }</text>
  <polyline class="ln" points="130,57 148,57" marker-end="url(#a)"/>
  <rect class="u" x="150" y="44" width="60" height="26" rx="0"/>
  <text x="180" y="61" class="s c">hdr: 16</text>
  <rect class="wu" x="20" y="96" width="110" height="34" rx="4"/>
  <text x="75" y="110.5" class="ms c">iov[1]</text>
  <text x="75" y="123.5" class="ms c">{ buf, 40 }</text>
  <polyline class="ln" points="130,113 148,113" marker-end="url(#a)"/>
  <rect class="u" x="150" y="100" width="150" height="26" rx="0"/>
  <text x="225" y="117" class="s c">buf: 40</text>
  <rect class="wu" x="690" y="40" width="110" height="34" rx="4"/>
  <text x="745" y="54.5" class="ms c">iov[0]</text>
  <text x="745" y="67.5" class="ms c">{ a, 8 }</text>
  <polyline class="ln" points="690,57 672,57" marker-end="url(#a)"/>
  <rect class="y" x="630" y="44" width="40" height="26" rx="0"/>
  <text x="650" y="61" class="s c">a: 8</text>
  <rect class="wu" x="690" y="96" width="110" height="34" rx="4"/>
  <text x="745" y="110.5" class="ms c">iov[1]</text>
  <text x="745" y="123.5" class="ms c">{ b, 24 }</text>
  <polyline class="ln" points="690,113 672,113" marker-end="url(#a)"/>
  <rect class="y" x="570" y="100" width="100" height="26" rx="0"/>
  <text x="620" y="117" class="s c">b: 24</text>
  <rect class="wu" x="690" y="152" width="110" height="34" rx="4"/>
  <text x="745" y="166.5" class="ms c">iov[2]</text>
  <text x="745" y="179.5" class="ms c">{ c, 100 }</text>
  <polyline class="ln" points="690,169 672,169" marker-end="url(#a)"/>
  <rect class="y" x="540" y="156" width="130" height="26" rx="0"/>
  <text x="605" y="173" class="s c">c: 24 of 100</text>
  <text x="410" y="204" class="s c">the 56 bytes, in order</text>
  <rect class="u" x="270" y="214" width="80" height="24" rx="0"/>
  <text x="310" y="230" class="s c">hdr: 16</text>
  <rect class="u" x="350" y="214" width="200" height="24" rx="0"/>
  <text x="450" y="230" class="s c">buf: 40</text>
  <rect class="y" x="270" y="242" width="40" height="24" rx="0"/>
  <text x="290" y="258" class="s c">a</text>
  <rect class="y" x="310" y="242" width="120" height="24" rx="0"/>
  <text x="370" y="258" class="s c">b: 24</text>
  <rect class="y" x="430" y="242" width="120" height="24" rx="0"/>
  <text x="490" y="258" class="s c">c: 24</text>
  <text x="262" y="230" class="s e">read from</text>
  <text x="262" y="258" class="s e">written to</text>
  <polyline class="lnk" points="150,160 150,226 200,226"/>
  <polyline class="lnk" points="200,226 200,226" marker-end="url(#ak)"/>
  <text x="160" y="200" class="s blue">gather</text>
  <polyline class="lnk" points="550,254 620,254 620,218" marker-end="url(#ak)"/>
  <text x="630" y="246" class="s blue">scatter</text>
  <text x="20" y="330" class="s">The kernel copies straight from the sender's pieces to the receiver's: the 56 bytes are never in a kernel buffer.</text>
</svg>
