<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
  <rect class="u" x="160" y="20" width="340" height="44" rx="4"/>
  <text x="330" y="38.5" class="c">C library stub</text>
  <text x="330" y="53.5" class="s c">mov w8, #number; args in x0–x7; svc #0x51</text>
  <rect class="k" x="160" y="100" width="340" height="44" rx="4"/>
  <text x="330" y="118.5" class="c">vectors.s</text>
  <text x="330" y="133.5" class="s c">save the TrapFrame on the kernel stack</text>
  <rect class="k" x="160" y="160" width="340" height="44" rx="4"/>
  <text x="330" y="178.5" class="c">arch::exception::handle()</text>
  <text x="330" y="193.5" class="s c">ESR: SVC with immediate 0x51</text>
  <rect class="k" x="160" y="220" width="340" height="44" rx="4"/>
  <text x="330" y="238.5" class="c">ker::dispatch()</text>
  <text x="330" y="253.5" class="s c">cancellation, trace, match on the number</text>
  <rect class="k" x="160" y="280" width="340" height="44" rx="4"/>
  <text x="330" y="298.5" class="c">handler in kernel/src/ker/</text>
  <text x="330" y="313.5" class="s c">does the work, returns a KerResult</text>
  <rect class="k" x="160" y="340" width="340" height="44" rx="4"/>
  <text x="330" y="358.5" class="c">complete_kercall()</text>
  <text x="330" y="373.5" class="s c">x0 = value, or x0 = errno and elr += 4</text>
  <rect class="k" x="160" y="400" width="340" height="44" rx="4"/>
  <text x="330" y="418.5" class="c">ker::user_return()</text>
  <text x="330" y="433.5" class="s c">stopped? ending? pending signals</text>
  <rect class="k" x="160" y="460" width="340" height="44" rx="4"/>
  <text x="330" y="478.5" class="c">sched::preempt()</text>
  <text x="330" y="493.5" class="s c">switch if a better thread became ready</text>
  <rect class="k" x="160" y="520" width="340" height="44" rx="4"/>
  <text x="330" y="538.5" class="c">exception_return</text>
  <text x="330" y="553.5" class="s c">restore the TrapFrame; eret</text>
  <polyline class="ln" points="330,64 330,100" marker-end="url(#a)"/>
  <polyline class="ln" points="330,144 330,160" marker-end="url(#a)"/>
  <polyline class="ln" points="330,204 330,220" marker-end="url(#a)"/>
  <polyline class="ln" points="330,264 330,280" marker-end="url(#a)"/>
  <polyline class="ln" points="330,324 330,340" marker-end="url(#a)"/>
  <polyline class="ln" points="330,384 330,400" marker-end="url(#a)"/>
  <polyline class="ln" points="330,444 330,460" marker-end="url(#a)"/>
  <polyline class="ln" points="330,504 330,520" marker-end="url(#a)"/>
  <line x1="20" y1="80" x2="780" y2="80" stroke="#aa2222" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="24" y="74" class="s red">EL0</text>
  <text x="24" y="96" class="s red">EL1, IRQs masked</text>
  <polyline class="ln" points="160,542 140,542 140,42 158,42" marker-end="url(#a)"/>
  <text x="20" y="300" class="s">back to EL0:</text>
  <text x="20" y="314" class="s">ret on success;</text>
  <text x="20" y="328" class="s">one instruction</text>
  <text x="20" y="342" class="s">later on error</text>
  <rect class="g" x="560" y="270" width="220" height="64" rx="4"/>
  <text x="670" y="291" class="c">may block:</text>
  <text x="670" y="306" class="s c">prepare_block(state); block()</text>
  <text x="670" y="321" class="s c">other threads run until wake()</text>
  <polyline class="lng" points="500,296 558,296" marker-end="url(#ag)" marker-start="url(#ag)"/>
  <rect class="y" x="560" y="360" width="220" height="52" rx="4"/>
  <text x="670" y="375" class="c">TrapFrame</text>
  <text x="670" y="390" class="s c">read for the arguments,</text>
  <text x="670" y="405" class="s c">written with the result</text>
  <polyline class="ln dash" points="558,386 502,362" marker-end="url(#a)"/>
  <polyline class="ln dash" points="558,386 502,422" marker-end="url(#a)"/>
</svg>
