<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="40" y="28" class="s red">user mode</text>
  <rect class="u" x="40" y="36" width="720" height="46" rx="4"/>
  <text x="400" y="56" class="c">a program</text>
  <text x="400" y="72" class="s c">runs its own instructions, in its own memory</text>
  <path class="lnr dash" d="M20,128 L780,128"/>
  <text x="40" y="146" class="s red">kernel mode</text>
  <path class="ln" d="M150,82 L150,160" marker-end="url(#a)"/>
  <circle cx="134" cy="104" r="9" fill="#333333"/>
  <text x="134" y="108" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="158" y="101" class="b">a system call</text>
  <text x="158" y="115" class="s">the program asks</text>
  <path class="ln" d="M330,82 L330,160" marker-end="url(#a)"/>
  <circle cx="314" cy="104" r="9" fill="#333333"/>
  <text x="314" y="108" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="338" y="101" class="b">a fault</text>
  <text x="338" y="115" class="s">an instruction fails</text>
  <path class="ln" d="M510,82 L510,160" marker-end="url(#a)"/>
  <circle cx="494" cy="104" r="9" fill="#333333"/>
  <text x="494" y="108" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="518" y="101" class="b">an interrupt</text>
  <text x="518" y="115" class="s">a device or a timer calls</text>
  <rect class="n" x="40" y="160" width="560" height="50" rx="4"/>
  <text x="320" y="180" class="c">the processor</text>
  <text x="320" y="196" class="s c">keeps the return address and the status, raises the privilege, masks interrupts, jumps to the kernel's entry</text>
  <path class="ln" d="M320,210 L320,236" marker-end="url(#a)"/>
  <rect class="k" x="40" y="236" width="560" height="50" rx="4"/>
  <text x="320" y="256" class="c">the kernel's entry code</text>
  <text x="320" y="272" class="s c">saves every other register of the interrupted program, on a stack of the kernel's own</text>
  <path class="ln" d="M320,286 L320,312" marker-end="url(#a)"/>
  <rect class="k" x="40" y="312" width="560" height="50" rx="4"/>
  <text x="320" y="332" class="c">the handler</text>
  <text x="320" y="348" class="s c">does the call, repairs or reports the fault, serves the device; may decide that another thread runs next</text>
  <rect class="n" x="640" y="236" width="130" height="126" rx="4"/>
  <text x="705" y="276" class="c">return from</text>
  <text x="705" y="292" class="c">exception</text>
  <text x="705" y="312" class="s c">restores the status,</text>
  <text x="705" y="326" class="s c">drops the privilege,</text>
  <text x="705" y="340" class="s c">jumps back</text>
  <path class="lnk" d="M600,337 L640,337" marker-end="url(#ak)"/>
  <path class="ln" d="M705,236 L705,82" marker-end="url(#a)"/>
  <text x="697" y="176" class="s e">the only</text>
  <text x="697" y="190" class="s e">way out</text>
  <text x="400" y="386" class="s c">grey: done by the processor itself; blue: the kernel's code</text>
</svg>
