<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="350" fill="#ffffff"/>
  <text x="135" y="26" class="h c">A function call</text>
  <rect class="u" x="40" y="44" width="190" height="44" rx="4"/>
  <text x="135" y="71" class="c">caller</text>
  <rect class="u" x="40" y="180" width="190" height="56" rx="4"/>
  <text x="135" y="204" class="c">callee</text>
  <text x="135" y="220" class="s c">same memory, same privilege</text>
  <path class="ln" d="M100,88 L100,180" marker-end="url(#a)"/>
  <text x="94" y="128" class="s e">jump;</text>
  <text x="94" y="142" class="s e">arguments</text>
  <path class="ln dash" d="M170,180 L170,88" marker-end="url(#a)"/>
  <text x="176" y="135" class="s">result</text>
  <text x="135" y="268" class="s c">The callee trusts its caller:</text>
  <text x="135" y="282" class="s c">a bad argument is the</text>
  <text x="135" y="296" class="s c">program's own problem.</text>
  <path class="life" d="M268,16 L268,330"/>
  <text x="535" y="26" class="h c">A system call</text>
  <rect class="u" x="300" y="44" width="150" height="44" rx="4"/>
  <text x="375" y="71" class="c">program</text>
  <rect class="u" x="500" y="44" width="270" height="44" rx="4"/>
  <text x="635" y="63" class="c">library stub</text>
  <text x="635" y="78" class="s c">number and arguments in registers; trap</text>
  <path class="ln" d="M450,66 L500,66" marker-end="url(#a)"/>
  <path class="lnr dash" d="M284,112 L784,112"/>
  <text x="782" y="106" class="s red e">user mode</text>
  <text x="782" y="126" class="s red e">kernel mode</text>
  <rect class="k" x="500" y="140" width="270" height="40" rx="4"/>
  <text x="635" y="157" class="c">entry</text>
  <text x="635" y="172" class="s c">save the caller's registers</text>
  <rect class="k" x="500" y="204" width="270" height="40" rx="4"/>
  <text x="635" y="221" class="c">dispatch</text>
  <text x="635" y="236" class="s c">the number selects a handler</text>
  <rect class="k" x="500" y="268" width="270" height="56" rx="4"/>
  <text x="635" y="288" class="c">handler</text>
  <text x="635" y="303" class="s c">check every argument, then do the work;</text>
  <text x="635" y="316" class="s c">may wait</text>
  <path class="ln" d="M600,88 L600,140" marker-end="url(#a)"/>
  <circle cx="584" cy="100" r="9" fill="#333333"/>
  <text x="584" y="104" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <path class="ln" d="M635,180 L635,204" marker-end="url(#a)"/>
  <path class="ln" d="M635,244 L635,268" marker-end="url(#a)"/>
  <path class="lnk" d="M500,296 L375,296 L375,88" marker-end="url(#ak)"/>
  <circle cx="359" cy="100" r="9" fill="#2c5d9b"/>
  <text x="359" y="104" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="367" y="200" class="s e">a result,</text>
  <text x="367" y="214" class="s e">or an error</text>
  <text x="367" y="228" class="s e">number</text>
</svg>
