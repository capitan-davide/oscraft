<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="400" y="22" class="h c">a thread is blocked in a kernel call, and something wants it out</text>
  <rect class="u" x="40" y="36" width="200" height="44" rx="4"/>
  <text x="140" y="55" class="c">a signal arrives for it</text>
  <text x="140" y="71" class="s c">EINTR</text>
  <path class="ln" d="M140,80 L140,112" marker-end="url(#a)"/>
  <rect class="u" x="300" y="36" width="200" height="44" rx="4"/>
  <text x="400" y="55" class="c">its timeout runs out</text>
  <text x="400" y="71" class="s c">ETIMEDOUT</text>
  <path class="ln" d="M400,80 L400,112" marker-end="url(#a)"/>
  <rect class="u" x="560" y="36" width="200" height="44" rx="4"/>
  <text x="660" y="55" class="c">it must end (its process exits,</text>
  <text x="660" y="71" class="s c">another thread destroys it): EINTR</text>
  <path class="ln" d="M660,80 L660,112" marker-end="url(#a)"/>
  <rect class="k" x="40" y="112" width="720" height="34" rx="4"/>
  <text x="400" y="133" class="c">ker::unblock(thread, error): the thread's blocked state says who must release it</text>
  <path class="ln" d="M115,146 L115,172" marker-end="url(#a)"/>
  <rect class="y" x="40" y="172" width="150" height="62" rx="3"/>
  <text x="115" y="190" class="s c">Send, Receive,</text>
  <text x="115" y="203" class="s c">Reply</text>
  <text x="115" y="224" class="ms c">msg</text>
  <path class="ln" d="M273,146 L273,172" marker-end="url(#a)"/>
  <rect class="y" x="198" y="172" width="150" height="62" rx="3"/>
  <text x="273" y="190" class="s c">Mutex, Condvar,</text>
  <text x="273" y="203" class="s c">Sem, Barrier</text>
  <text x="273" y="224" class="ms c">sync</text>
  <path class="ln" d="M411,146 L411,172" marker-end="url(#a)"/>
  <rect class="y" x="356" y="172" width="110" height="62" rx="3"/>
  <text x="411" y="190" class="s c">MqSend,</text>
  <text x="411" y="203" class="s c">MqReceive</text>
  <text x="411" y="224" class="ms c">mqueue</text>
  <path class="ln" d="M514,146 L514,172" marker-end="url(#a)"/>
  <rect class="y" x="474" y="172" width="80" height="62" rx="3"/>
  <text x="514" y="190" class="s c">Pipe</text>
  <text x="514" y="203" class="s c"></text>
  <text x="514" y="224" class="ms c">kpipe</text>
  <path class="ln" d="M661,146 L661,172" marker-end="url(#a)"/>
  <rect class="y" x="562" y="172" width="198" height="62" rx="3"/>
  <text x="661" y="190" class="s c">Nanosleep, Sigsuspend,</text>
  <text x="661" y="203" class="s c">Join, Intr, ...</text>
  <text x="661" y="224" class="s c">no queue: sched::wake_with()</text>
  <rect class="k" x="198" y="268" width="562" height="40" rx="4"/>
  <text x="479" y="285" class="c">the thread is taken off its queue and made ready;</text>
  <text x="479" y="301" class="s c">it resumes inside its handler, which returns the error</text>
  <path class="ln" d="M273,234 L273,268" marker-end="url(#a)"/>
  <path class="ln" d="M411,234 L411,268" marker-end="url(#a)"/>
  <path class="ln" d="M514,234 L514,268" marker-end="url(#a)"/>
  <path class="ln" d="M661,234 L661,268" marker-end="url(#a)"/>
  <path class="ln" d="M140,234 L140,252 L240,252 L240,268" marker-end="url(#a)"/>
  <rect class="y" x="40" y="340" width="220" height="84" rx="3"/>
  <text x="150" y="360" class="s c">REPLY-blocked on a channel</text>
  <text x="150" y="374" class="s c">with the unblock flag:</text>
  <text x="150" y="388" class="s c">stays blocked; the server gets a</text>
  <text x="150" y="402" class="s c">pulse and replies when it is ready</text>
  <path class="ln dash" d="M80,234 L80,340" marker-end="url(#a)"/>
  <rect class="r" x="290" y="340" width="220" height="84" rx="3"/>
  <text x="400" y="366" class="c">the call fails</text>
  <text x="400" y="384" class="s c">the error number, at the</text>
  <text x="400" y="398" class="s c">failure return point</text>
  <rect class="g" x="540" y="340" width="220" height="84" rx="3"/>
  <text x="650" y="358" class="c">the call is made again</text>
  <text x="650" y="376" class="s c">a native program's MsgSendv() or</text>
  <text x="650" y="390" class="s c">futex wait, interrupted for a handler</text>
  <text x="650" y="404" class="s c">with SA_RESTART: elr -= 4</text>
  <path class="ln" d="M400,308 L400,340" marker-end="url(#a)"/>
  <path class="ln" d="M650,308 L650,340" marker-end="url(#a)"/>
</svg>
