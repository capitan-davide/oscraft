<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <text x="40" y="24" class="h">pointer arguments of five calls</text>
  <text x="40" y="224" class="s">the caller's address space</text>
  <rect class="u" x="40" y="158" width="160" height="46" rx="2"/>
  <text x="120" y="178" class="c">data</text>
  <text x="120" y="194" class="s c">read, write</text>
  <rect class="w" x="200" y="158" width="130" height="46" rx="2"/>
  <text x="265" y="186" class="c">nothing mapped</text>
  <rect class="u" x="330" y="158" width="120" height="46" rx="2"/>
  <text x="390" y="178" class="c">code</text>
  <text x="390" y="194" class="s c">read only</text>
  <rect class="u" x="450" y="158" width="110" height="46" rx="2"/>
  <text x="505" y="178" class="c">stack</text>
  <text x="505" y="194" class="s c">read, write</text>
  <rect class="k" x="600" y="158" width="160" height="46" rx="2"/>
  <text x="680" y="186" class="c">kernel memory</text>
  <path class="lnr dash" d="M580,140 L580,222"/>
  <text x="580" y="238" class="s c red">end of user addresses</text>
  <text x="90" y="52" class="s">read 64 bytes</text>
  <text x="90" y="65" class="s">from here</text>
  <path class="lng" d="M90,74 L90,156" marker-end="url(#ag)"/>
  <path class="lng" d="M90,120 L160,120"/>
  <path class="lng" d="M160,114 L160,126"/>
  <text x="90" y="264" class="s green">mapped and readable:</text>
  <text x="90" y="278" class="s green">the call goes on</text>
  <text x="235" y="52" class="s">read from</text>
  <text x="235" y="65" class="s">here</text>
  <path class="lnr" d="M235,74 L235,156" marker-end="url(#ar)"/>
  <path class="lnr" d="M235,120 L295,120"/>
  <path class="lnr" d="M295,114 L295,126"/>
  <text x="235" y="264" class="s red">no memory:</text>
  <text x="235" y="278" class="s red">error</text>
  <text x="360" y="52" class="s">write the</text>
  <text x="360" y="65" class="s">result here</text>
  <path class="lnr" d="M360,74 L360,156" marker-end="url(#ar)"/>
  <path class="lnr" d="M360,120 L420,120"/>
  <path class="lnr" d="M420,114 L420,126"/>
  <text x="360" y="264" class="s red">not writable:</text>
  <text x="360" y="278" class="s red">error</text>
  <text x="505" y="52" class="s">read 1 MiB</text>
  <text x="505" y="65" class="s">from here</text>
  <path class="lnr" d="M505,74 L505,156" marker-end="url(#ar)"/>
  <path class="lnr" d="M505,120 L573,120"/>
  <path class="lnr" d="M573,114 L573,126"/>
  <text x="505" y="264" class="s red">runs past the</text>
  <text x="505" y="278" class="s red">mapping: error</text>
  <text x="650" y="52" class="s">read from</text>
  <text x="650" y="65" class="s">here</text>
  <path class="lnr" d="M650,74 L650,156" marker-end="url(#ar)"/>
  <path class="lnr" d="M650,120 L710,120"/>
  <path class="lnr" d="M710,114 L710,126"/>
  <text x="650" y="264" class="s red">not the</text>
  <text x="650" y="278" class="s red">caller's: error</text>
  <text x="400" y="312" class="s c">The kernel checks the whole range, and the kind of access, before it touches a byte: a bad pointer fails the call, never the kernel.</text>
</svg>
