<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <rect class="u" x="15" y="20" width="170" height="30" rx="4"/>
  <text x="100" y="40" class="c">the program, libthr</text>
  <path class="life" d="M100,50 L100,400"/>
  <rect class="g" x="215" y="20" width="170" height="30" rx="4"/>
  <text x="300" y="40" class="c">libsys</text>
  <path class="life" d="M300,50 L300,400"/>
  <rect class="k" x="415" y="20" width="170" height="30" rx="4"/>
  <text x="500" y="40" class="c">the kernel</text>
  <path class="life" d="M500,50 L500,400"/>
  <rect class="u" x="615" y="20" width="170" height="30" rx="4"/>
  <text x="700" y="40" class="c">the new thread</text>
  <path class="life" d="M700,50 L700,400"/>
  <path class="lnr dash" d="M400,60 L400,400"/>
  <text x="396" y="72" class="s e red">EL0</text>
  <text x="404" y="72" class="s red">EL1</text>
  <rect class="wu" x="15" y="84" width="170" height="74" rx="3"/>
  <circle cx="28" cy="98" r="9" fill="#9a6b2f"/>
  <text x="28" y="102" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="42" y="102" class="s">pthread_create():</text>
  <text x="42" y="116" class="s">allocates the stack and</text>
  <text x="42" y="130" class="s">the TLS block, fills a</text>
  <text x="42" y="144" class="ms">struct thr_param</text>
  <path class="ln" d="M185,150 L213,150" marker-end="url(#a)"/>
  <rect class="g" x="215" y="124" width="170" height="74" rx="3"/>
  <circle cx="228" cy="138" r="9" fill="#3e7b34"/>
  <text x="228" y="142" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="242" y="142" class="s">thr_new(): turns</text>
  <text x="242" y="156" class="s">param.rtp (class, prio)</text>
  <text x="242" y="170" class="s">into a policy and a</text>
  <text x="242" y="184" class="s">kernel priority</text>
  <path class="lnk" d="M385,190 L413,190" marker-end="url(#ak)"/>
  <rect class="k" x="415" y="164" width="178" height="150" rx="3"/>
  <circle cx="428" cy="178" r="9" fill="#2c5d9b"/>
  <text x="428" y="182" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="442" y="182" class="s b">thr_new call:</text>
  <text x="424" y="200" class="s">takes a thread ID, writes it</text>
  <text x="424" y="214" class="s">to child_tid and parent_tid;</text>
  <text x="424" y="232" class="s">start(): a kernel stack with</text>
  <text x="424" y="246" class="s">a trap frame: pc = start_func,</text>
  <text x="424" y="260" class="s">x0 = arg, sp = stack top;</text>
  <text x="424" y="274" class="s">thread pointer = tls_base;</text>
  <text x="424" y="288" class="s">then the ready queue</text>
  <path class="lng" d="M593,300 L613,300" marker-end="url(#ag)"/>
  <rect class="g" x="615" y="280" width="170" height="62" rx="3"/>
  <circle cx="628" cy="294" r="9" fill="#3e7b34"/>
  <text x="628" y="298" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="642" y="298" class="s">first return to EL0:</text>
  <text x="642" y="312" class="s">start_func(arg), on its</text>
  <text x="642" y="326" class="s">own stack, with its ID</text>
  <path class="ln dash" d="M500,350 L187,350" marker-end="url(#a)"/>
  <text x="300" y="342" class="s c">0: created</text>
  <rect class="wu" x="15" y="332" width="170" height="44" rx="3"/>
  <circle cx="28" cy="346" r="9" fill="#9a6b2f"/>
  <text x="28" y="350" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="42" y="350" class="s">pthread_create() returns;</text>
  <text x="42" y="364" class="s">the ID is in the pthread</text>
  <text x="400" y="424" class="s c">The kernel builds nothing in the new thread's memory except its ID: stack and thread-local storage are the C library's.</text>
</svg>
