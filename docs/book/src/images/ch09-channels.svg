<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <rect class="u" x="20" y="30" width="220" height="200" rx="4"/>
  <text x="130" y="52" class="b c">client process</text>
  <text x="30" y="76" class="s">connections (coid →)</text>
  <rect class="wu" x="30" y="84" width="200" height="28" rx="0"/>
  <text x="38" y="102" class="m">0: stdin</text>
  <rect class="wu" x="30" y="116" width="200" height="28" rx="0"/>
  <text x="38" y="134" class="m">1: stdout</text>
  <rect class="wu" x="30" y="148" width="200" height="28" rx="0"/>
  <text x="38" y="166" class="m">3: fd 3</text>
  <rect class="wu" x="30" y="180" width="200" height="28" rx="0"/>
  <text x="38" y="198" class="m">0x40000000: side channel 0</text>
  <rect class="u" x="20" y="270" width="220" height="60" rx="4"/>
  <text x="130" y="289" class="c">another client</text>
  <text x="130" y="304" class="s c">its own connection,</text>
  <text x="130" y="319" class="s c">same channel</text>
  <rect class="k" x="290" y="150" width="190" height="56" rx="4"/>
  <text x="385" y="174.5" class="c">Connection</text>
  <text x="385" y="189.5" class="s c">scoid 0x10007, flags</text>
  <rect class="k" x="290" y="262" width="190" height="56" rx="4"/>
  <text x="385" y="286.5" class="c">Connection</text>
  <text x="385" y="301.5" class="s c">scoid 0x10009</text>
  <polyline class="lnk" points="230,162 288,172" marker-end="url(#ak)"/>
  <polyline class="lnk" points="240,300 288,292" marker-end="url(#ak)"/>
  <rect class="u" x="530" y="30" width="250" height="370" rx="4"/>
  <text x="655" y="52" class="b c">server process</text>
  <rect class="k" x="545" y="70" width="220" height="230" rx="4"/>
  <text x="655" y="90" class="b c">Channel (chid 1)</text>
  <text x="655" y="104" class="s c">one IrqSpinLock for all of it</text>
  <rect class="wk" x="555" y="114" width="200" height="32" rx="0"/>
  <text x="655" y="127.5" class="m c">receivers</text>
  <text x="655" y="140.5" class="s c">RECEIVE-blocked servers</text>
  <rect class="wk" x="555" y="150" width="200" height="32" rx="0"/>
  <text x="655" y="163.5" class="m c">pulse_receivers</text>
  <text x="655" y="176.5" class="s c">MsgReceivePulse()</text>
  <rect class="wk" x="555" y="186" width="200" height="32" rx="0"/>
  <text x="655" y="199.5" class="m c">senders</text>
  <text x="655" y="212.5" class="s c">SEND-blocked, by priority</text>
  <rect class="wk" x="555" y="222" width="200" height="32" rx="0"/>
  <text x="655" y="235.5" class="m c">repliers</text>
  <text x="655" y="248.5" class="s c">REPLY-blocked</text>
  <rect class="wk" x="555" y="258" width="200" height="32" rx="0"/>
  <text x="655" y="271.5" class="m c">pulses</text>
  <text x="655" y="284.5" class="s c">queued, by priority</text>
  <polyline class="lnk" points="480,178 543,178" marker-end="url(#ak)"/>
  <polyline class="lnk" points="480,290 512,290 512,200 543,200" marker-end="url(#ak)"/>
  <rect class="g" x="545" y="320" width="220" height="60" rx="4"/>
  <text x="655" y="346.5" class="c">server threads</text>
  <text x="655" y="361.5" class="s c">MsgReceive(chid), MsgReply(rcvid)</text>
  <polyline class="ln" points="655,320 655,302" marker-end="url(#a)"/>
  <text x="20" y="360" class="s">A file descriptor is a connection ID.</text>
  <text x="20" y="375" class="s">Side channels (from 0x40000000) are not file</text>
  <text x="20" y="390" class="s">descriptors; side channel 0 leads to process 1.</text>
</svg>
