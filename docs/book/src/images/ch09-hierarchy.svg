<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="340" fill="#ffffff"/>
  <text x="200" y="26" class="h c">servers sending to each other</text>
  <text x="610" y="26" class="h c">a send hierarchy</text>
  <line x1="410" y1="16" x2="410" y2="320" stroke="#999999" stroke-width="1"/>
  <rect class="r" x="60" y="80" width="120" height="56" rx="4"/>
  <text x="120" y="104.5" class="c">server A</text>
  <text x="120" y="119.5" class="s c">SEND-blocked on B</text>
  <rect class="r" x="230" y="80" width="120" height="56" rx="4"/>
  <text x="290" y="104.5" class="c">server B</text>
  <text x="290" y="119.5" class="s c">SEND-blocked on A</text>
  <polyline class="lnr" points="180,98 228,98" marker-end="url(#ar)"/>
  <polyline class="lnr" points="230,120 182,120" marker-end="url(#ar)"/>
  <text x="205" y="90" class="s c red">send</text>
  <text x="205" y="136" class="s c red">send</text>
  <text x="205" y="180" class="s c">Neither receives, so neither</text>
  <text x="205" y="194" class="s c">send is ever received: both</text>
  <text x="205" y="208" class="s c">wait for ever.</text>
  <rect class="u" x="540" y="50" width="140" height="46" rx="4"/>
  <text x="610" y="77" class="c">application</text>
  <polyline class="ln" points="590,96 590,138" marker-end="url(#a)"/>
  <text x="584" y="122" class="s e">MsgSend()</text>
  <polyline class="lng dash" points="640,138 640,98" marker-end="url(#ag)"/>
  <text x="646" y="122" class="s green">pulse</text>
  <rect class="k" x="540" y="140" width="140" height="46" rx="4"/>
  <text x="610" y="167" class="c">filesystem</text>
  <polyline class="ln" points="590,186 590,228" marker-end="url(#a)"/>
  <text x="584" y="212" class="s e">MsgSend()</text>
  <polyline class="lng dash" points="640,228 640,188" marker-end="url(#ag)"/>
  <text x="646" y="212" class="s green">pulse</text>
  <rect class="k" x="540" y="230" width="140" height="46" rx="4"/>
  <text x="610" y="257" class="c">disk driver</text>
  <text x="430" y="316" class="s">Messages go only down; news goes up as a pulse, which never blocks.</text>
</svg>
