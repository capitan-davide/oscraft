<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <text x="80" y="24" class="h">Without a lock</text>
  <text x="70" y="54" class="b e">thread 1</text>
  <path class="life" d="M80,64 L770,64"/>
  <text x="70" y="94" class="b e">thread 2</text>
  <path class="life" d="M80,104 L770,104"/>
  <rect class="k" x="90" y="38" width="90" height="26" rx="3"/>
  <text x="135.0" y="55" class="s c">reads 5</text>
  <rect class="k" x="290" y="38" width="90" height="26" rx="3"/>
  <text x="335.0" y="55" class="s c">adds 1</text>
  <rect class="k" x="490" y="38" width="90" height="26" rx="3"/>
  <text x="535.0" y="55" class="s c">writes 6</text>
  <rect class="u" x="190" y="78" width="90" height="26" rx="3"/>
  <text x="235.0" y="95" class="s c">reads 5</text>
  <rect class="u" x="390" y="78" width="90" height="26" rx="3"/>
  <text x="435.0" y="95" class="s c">adds 1</text>
  <rect class="r" x="590" y="78" width="90" height="26" rx="3"/>
  <text x="635.0" y="95" class="s c">writes 6</text>
  <text x="700" y="60" class="s red">counter = 6:</text>
  <text x="700" y="74" class="s red">one update lost</text>
  <text x="80" y="164" class="h">With a mutex</text>
  <text x="70" y="194" class="b e">thread 1</text>
  <path class="life" d="M80,204 L770,204"/>
  <text x="70" y="234" class="b e">thread 2</text>
  <path class="life" d="M80,244 L770,244"/>
  <rect class="g" x="90" y="178" width="60" height="26" rx="3"/>
  <text x="120.0" y="195" class="s c">lock</text>
  <rect class="k" x="152" y="178" width="70" height="26" rx="3"/>
  <text x="187.0" y="195" class="s c">reads 5</text>
  <rect class="k" x="224" y="178" width="70" height="26" rx="3"/>
  <text x="259.0" y="195" class="s c">writes 6</text>
  <rect class="g" x="296" y="178" width="64" height="26" rx="3"/>
  <text x="328.0" y="195" class="s c">unlock</text>
  <rect class="y" x="190" y="218" width="60" height="26" rx="3"/>
  <text x="220.0" y="235" class="s c">lock</text>
  <rect class="y" x="252" y="218" width="108" height="26" rx="3"/>
  <text x="306" y="235" class="s c">waits</text>
  <rect class="u" x="362" y="218" width="70" height="26" rx="3"/>
  <text x="397.0" y="235" class="s c">reads 6</text>
  <rect class="u" x="434" y="218" width="70" height="26" rx="3"/>
  <text x="469.0" y="235" class="s c">writes 7</text>
  <rect class="g" x="506" y="218" width="64" height="26" rx="3"/>
  <text x="538.0" y="235" class="s c">unlock</text>
  <path class="lng" d="M360,204 L360,216" marker-end="url(#ag)"/>
  <text x="700" y="200" class="s green">counter = 7</text>
  <text x="400" y="290" class="s c">Time runs to the right. Reading, adding and writing are three steps, and another thread can run between any two of them.</text>
  <text x="400" y="306" class="s c">The mutex makes the three steps a critical section that one thread at a time is in.</text>
</svg>
