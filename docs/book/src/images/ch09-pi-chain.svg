<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="260" fill="#ffffff"/>
  <rect class="g" x="20" y="60" width="150" height="70" rx="4"/>
  <text x="95" y="84" class="c">T3</text>
  <text x="95" y="99" class="s c">priority 30</text>
  <text x="95" y="114" class="s c">waits for M2</text>
  <rect class="y" x="230" y="70" width="90" height="50" rx="4"/>
  <text x="275" y="99" class="c">M2</text>
  <rect class="g" x="380" y="60" width="150" height="70" rx="4"/>
  <text x="455" y="84" class="c">T2</text>
  <text x="455" y="99" class="s c">base 10, runs at 30</text>
  <text x="455" y="114" class="s c">owns M2, waits for M1</text>
  <rect class="y" x="590" y="70" width="90" height="50" rx="4"/>
  <text x="635" y="99" class="c">M1</text>
  <rect class="g" x="620" y="160" width="150" height="70" rx="4"/>
  <text x="695" y="184" class="c">T1</text>
  <text x="695" y="199" class="s c">base 5, runs at 30</text>
  <text x="695" y="214" class="s c">owns M1</text>
  <polyline class="ln" points="170,95 228,95" marker-end="url(#a)"/>
  <text x="199" y="87" class="s c">waits</text>
  <polyline class="ln" points="320,95 378,95" marker-end="url(#a)"/>
  <text x="349" y="87" class="s c">owner</text>
  <polyline class="ln" points="530,95 588,95" marker-end="url(#a)"/>
  <text x="559" y="87" class="s c">waits</text>
  <polyline class="ln" points="680,95 695,95 695,158" marker-end="url(#a)"/>
  <text x="702" y="130" class="s">owner</text>
  <text x="20" y="170" class="s">raise(M2 → T2, 30), then along WAITING_ON:</text>
  <text x="20" y="185" class="s">raise(M1 → T1, 30). RAISED keeps, per owner, its</text>
  <text x="20" y="200" class="s">priority before the first raise and each mutex's raise.</text>
  <text x="20" y="215" class="s">Unlocking M1 drops T1 back to 5; at most 16 steps.</text>
</svg>
