<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <rect class="u" x="30" y="20" width="230" height="86" rx="4"/>
  <text x="145" y="40" class="b c">process A</text>
  <rect class="wu" x="50" y="52" width="190" height="42" rx="3"/>
  <text x="145" y="70" class="s c">the lock word</text>
  <text x="145" y="85" class="ms c">at 0x20c41040</text>
  <rect class="u" x="540" y="20" width="230" height="86" rx="4"/>
  <text x="655" y="40" class="b c">process B</text>
  <rect class="wu" x="560" y="52" width="190" height="42" rx="3"/>
  <text x="655" y="70" class="s c">the same word</text>
  <text x="655" y="85" class="ms c">at 0x7f001040</text>
  <rect class="y" x="300" y="44" width="200" height="54" rx="4"/>
  <text x="400" y="65" class="s c">one page of memory</text>
  <text x="400" y="82" class="ms c">physical 0x4a2f1040</text>
  <path class="ln" d="M240,73 L298,73" marker-end="url(#a)"/>
  <path class="ln" d="M560,73 L502,73" marker-end="url(#a)"/>
  <path class="lnk" d="M400,98 L400,150" marker-end="url(#ak)"/>
  <text x="408" y="128" class="s blue">key = the physical address</text>
  <text x="30" y="146" class="s blue">in the kernel</text>
  <rect class="k" x="30" y="152" width="740" height="76" rx="4"/>
  <text x="46" y="172" class="m b">WAITERS</text>
  <text x="130" y="172" class="s">key → the threads waiting on that word, in arrival order</text>
  <rect class="wk" x="46" y="184" width="150" height="32" rx="3"/>
  <text x="121" y="204" class="ms c">0x4a2f1040</text>
  <path class="lnk" d="M196,200 L228,200" marker-end="url(#ak)"/>
  <rect class="g" x="230" y="184" width="150" height="32" rx="3"/>
  <text x="305" y="204" class="s c">T5 of B, priority 20</text>
  <path class="lnk" d="M380,200 L400,200"/>
  <rect class="g" x="400" y="184" width="150" height="32" rx="3"/>
  <text x="475" y="204" class="s c">T9 of A, priority 30</text>
  <text x="566" y="204" class="s">queued only while they wait</text>
  <rect class="k" x="30" y="240" width="360" height="96" rx="4"/>
  <text x="46" y="260" class="m b">WAITING_ON</text>
  <text x="140" y="260" class="s">waiter → (key, the owner it raises)</text>
  <rect class="wk" x="46" y="272" width="328" height="24" rx="3"/>
  <text x="56" y="288" class="ms">T5  →  (0x4a2f1040, T2 of A)</text>
  <rect class="wk" x="46" y="302" width="328" height="24" rx="3"/>
  <text x="56" y="318" class="ms">T9  →  (0x4a2f1040, T2 of A)</text>
  <rect class="k" x="410" y="240" width="360" height="96" rx="4"/>
  <text x="426" y="260" class="m b">RAISED</text>
  <text x="486" y="260" class="s">owner → (its own priority, key → raised to)</text>
  <rect class="wk" x="426" y="272" width="328" height="24" rx="3"/>
  <text x="436" y="288" class="ms">T2  →  (10, { 0x4a2f1040 → 30 })</text>
  <text x="590" y="318" class="s c">T2 runs at max(10, 30) = 30</text>
  <text x="400" y="370" class="s c">T2 of process A holds a mutex in memory that both processes map. T5 and T9 wait for it.</text>
  <text x="400" y="386" class="s c">The wait queue is found by the word's physical address, the same for both; the two smaller tables</text>
  <text x="400" y="402" class="s c">exist only for waits that inherit priority, and say who is raised, by which lock, and to what.</text>
</svg>
