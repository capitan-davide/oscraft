<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <rect class="g" x="20" y="70" width="130" height="50" rx="4"/>
  <text x="85" y="92" class="b c">running</text>
  <text x="85" y="108" class="s c">calls MsgSend()</text>
  <rect class="y" x="220" y="70" width="150" height="50" rx="4"/>
  <text x="295" y="92" class="b c">SEND-blocked</text>
  <text x="295" y="108" class="s c">no server has it yet</text>
  <rect class="y" x="450" y="70" width="150" height="50" rx="4"/>
  <text x="525" y="92" class="b c">REPLY-blocked</text>
  <text x="525" y="108" class="s c">a server is working</text>
  <rect class="g" x="680" y="70" width="100" height="50" rx="4"/>
  <text x="730" y="92" class="b c">running</text>
  <text x="730" y="108" class="s c">has the reply</text>
  <path class="ln" d="M150,95 L218,95" marker-end="url(#a)"/>
  <text x="184" y="87" class="s c">send</text>
  <path class="ln" d="M370,95 L448,95" marker-end="url(#a)"/>
  <text x="409" y="76" class="s c">a server</text>
  <text x="409" y="87" class="s c">receives</text>
  <path class="lng" d="M600,95 L678,95" marker-end="url(#ag)"/>
  <text x="639" y="87" class="s c green">reply</text>
  <path class="ln dash" d="M85,70 L85,36 L525,36 L525,68" marker-end="url(#a)"/>
  <text x="305" y="28" class="s c">a server was already waiting: straight to REPLY-blocked</text>
  <text x="295" y="176" class="s c red">signal or timeout</text>
  <rect class="r" x="195" y="190" width="200" height="66" rx="4"/>
  <text x="295" y="210" class="b c">leaves at once</text>
  <text x="295" y="227" class="ms c">EINTR or ETIMEDOUT</text>
  <text x="295" y="244" class="s c">the server never saw the message</text>
  <path class="lnr" d="M295,120 L295,162" marker-end="url(#ar)"/>
  <text x="400" y="176" class="s"></text>
  <rect class="r" x="400" y="190" width="180" height="66" rx="4"/>
  <text x="490" y="210" class="s c">plain channel:</text>
  <text x="490" y="227" class="b c">leaves at once</text>
  <text x="490" y="244" class="s c">the server's reply fails: ESRCH</text>
  <rect class="k" x="600" y="190" width="185" height="66" rx="4"/>
  <text x="692" y="210" class="s c">channel that asked to be told:</text>
  <text x="692" y="227" class="b c">stays blocked</text>
  <text x="692" y="244" class="s c">the server gets an unblock pulse</text>
  <path class="lnr" d="M500,120 L490,188" marker-end="url(#ar)"/>
  <path class="lnk" d="M560,120 L640,188" marker-end="url(#ak)"/>
  <text x="458" y="152" class="s e red">signal or</text>
  <text x="458" y="164" class="s e red">timeout</text>
  <path class="lng" d="M745,188 L745,122" marker-end="url(#ag)"/>
  <text x="752" y="158" class="s green">reply</text>
  <text x="400" y="292" class="s c">Before a server has the message, nothing has happened yet, and the client can simply leave.</text>
  <text x="400" y="308" class="s c">After, only the server knows what has been done, so it may ask to be told.</text>
</svg>
