<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>
  <text x="200" y="28" class="h c">Asynchronous: the kernel keeps the message</text>
  <rect class="u" x="30" y="60" width="120" height="70" rx="4"/>
  <text x="90" y="88" class="c">sender</text>
  <text x="90" y="103" class="c">goes on running</text>
  <text x="90" y="118" class="s c"></text>
  <rect class="k" x="165" y="50" width="70" height="180" rx="4"/>
  <text x="200" y="68" class="b c">kernel</text>
  <text x="200" y="83" class="s c">queue</text>
  <rect class="wk" x="175" y="95" width="50" height="24" rx="2"/>
  <text x="200" y="111" class="ms c">msg 4</text>
  <rect class="wk" x="175" y="127" width="50" height="24" rx="2"/>
  <text x="200" y="143" class="ms c">msg 3</text>
  <rect class="wk" x="175" y="159" width="50" height="24" rx="2"/>
  <text x="200" y="175" class="ms c">msg 2</text>
  <rect class="wk" x="175" y="191" width="50" height="24" rx="2"/>
  <text x="200" y="207" class="ms c">msg 1</text>
  <rect class="u" x="250" y="150" width="120" height="70" rx="4"/>
  <text x="310" y="180" class="c">receiver</text>
  <text x="310" y="195" class="c">takes one later</text>
  <path class="lnk" d="M150,95 L173,107" marker-end="url(#ak)"/>
  <text x="160" y="86" class="s c blue">copy 1</text>
  <path class="ln" d="M150,95 L150,95"/>
  <path class="lnk" d="M227,203 L248,190" marker-end="url(#ak)"/>
  <text x="240" y="222" class="s c blue">copy 2</text>
  <text x="200" y="268" class="s c">Two copies of every message.</text>
  <text x="200" y="284" class="s c">The queue has a size: when it is full,</text>
  <text x="200" y="300" class="s c">the sender blocks after all, or the message is lost.</text>
  <text x="200" y="316" class="s c">A receiver cannot tell how old a message is.</text>
  <path class="life" d="M400,20 L400,325"/>
  <text x="600" y="28" class="h c">Synchronous: the sender waits</text>
  <rect class="u" x="430" y="60" width="150" height="110" rx="4"/>
  <text x="505" y="80" class="b c">sender</text>
  <rect class="wu" x="445" y="92" width="120" height="28" rx="2"/>
  <text x="505" y="110" class="ms c">its own buffer</text>
  <rect class="y" x="445" y="130" width="120" height="28" rx="2"/>
  <text x="505" y="148" class="s c">blocked</text>
  <rect class="u" x="630" y="60" width="150" height="110" rx="4"/>
  <text x="705" y="80" class="b c">receiver</text>
  <rect class="wu" x="645" y="92" width="120" height="28" rx="2"/>
  <text x="705" y="110" class="ms c">its own buffer</text>
  <text x="705" y="148" class="s c">works, then replies</text>
  <path class="lnk" d="M565,106 L643,106" marker-end="url(#ak)"/>
  <text x="604" y="98" class="s c blue">one copy</text>
  <path class="lng" d="M643,144 L567,144" marker-end="url(#ag)"/>
  <text x="604" y="162" class="s c green">reply</text>
  <rect class="k" x="430" y="190" width="350" height="34" rx="4"/>
  <text x="605" y="211" class="s c">kernel: no message storage, only who waits for whom</text>
  <text x="600" y="268" class="s c">One copy, straight between the two address spaces.</text>
  <text x="600" y="284" class="s c">Nothing to size, fill or lose.</text>
  <text x="600" y="300" class="s c">The reply tells the sender the work is done.</text>
  <text x="600" y="316" class="s c">The wait is also a scheduling fact: the receiver runs for the sender.</text>
</svg>
