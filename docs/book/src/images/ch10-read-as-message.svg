<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>
  <rect class="u" x="20" y="20" width="250" height="430" rx="4"/>
  <text x="145" y="42" class="h c">a FreeBSD program</text>
  <rect class="k" x="290" y="20" width="220" height="430" rx="4"/>
  <text x="400" y="42" class="h c">the kernel</text>
  <rect class="u" x="530" y="20" width="250" height="430" rx="4"/>
  <text x="655" y="42" class="h c">a server: tmpfs</text>
  <rect class="wu" x="40" y="60" width="210" height="44" rx="3"/>
  <text x="145" y="79" class="m c">n = read(fd, buf, 4096);</text>
  <text x="145" y="95" class="s c">the application</text>
  <rect class="wu" x="40" y="124" width="210" height="44" rx="3"/>
  <text x="145" y="143" class="c">FreeBSD's libc</text>
  <text x="145" y="159" class="s c">unchanged: calls __sys_read()</text>
  <rect class="g" x="40" y="188" width="210" height="96" rx="3"/>
  <text x="145" y="207" class="b c">libsys</text>
  <text x="145" y="224" class="s c">builds a 16-byte request:</text>
  <text x="145" y="242" class="ms c">{ _IO_READ, nbytes = 4096 }</text>
  <text x="145" y="260" class="s c">reply goes straight into buf</text>
  <text x="145" y="276" class="ms c">MsgSendv(fd, request, buf)</text>
  <path class="ln" d="M145,104 L145,122" marker-end="url(#a)"/>
  <path class="ln" d="M145,168 L145,186" marker-end="url(#a)"/>
  <rect class="wk" x="310" y="196" width="180" height="62" rx="3"/>
  <text x="400" y="215" class="s c">the connection fd leads</text>
  <text x="400" y="231" class="s c">to tmpfs's channel</text>
  <text x="400" y="248" class="c">copy the request</text>
  <rect class="y" x="310" y="276" width="180" height="40" rx="3"/>
  <text x="400" y="293" class="s c">the program's thread:</text>
  <text x="400" y="308" class="s c">REPLY-blocked</text>
  <rect class="wk" x="310" y="352" width="180" height="62" rx="3"/>
  <text x="400" y="371" class="c">copy the bytes into buf,</text>
  <text x="400" y="388" class="s c">the status is read()'s result</text>
  <text x="400" y="404" class="s c">wake the program</text>
  <rect class="wu" x="550" y="196" width="210" height="44" rx="3"/>
  <text x="655" y="215" class="ms c">MsgReceive(chid, ...)</text>
  <text x="655" y="231" class="s c">a server thread wakes</text>
  <rect class="wu" x="550" y="262" width="210" height="60" rx="3"/>
  <text x="655" y="287" class="c">the read handler</text>
  <text x="655" y="304" class="s c">finds the file's bytes</text>
  <rect class="wu" x="550" y="352" width="210" height="44" rx="3"/>
  <text x="655" y="371" class="ms c">MsgReply(rcvid, n, bytes)</text>
  <text x="655" y="387" class="s c">and back to MsgReceive()</text>
  <path class="ln" d="M655,240 L655,260" marker-end="url(#a)"/>
  <path class="ln" d="M655,322 L655,350" marker-end="url(#a)"/>
  <path class="lnk" d="M250,228 L308,228" marker-end="url(#ak)"/>
  <circle cx="279" cy="216" r="9" fill="#2c5d9b"/>
  <text x="279" y="220" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <path class="lnk" d="M490,218 L548,218" marker-end="url(#ak)"/>
  <circle cx="519" cy="206" r="9" fill="#2c5d9b"/>
  <text x="519" y="210" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <path class="lng" d="M548,374 L492,374" marker-end="url(#ag)"/>
  <circle cx="519" cy="362" r="9" fill="#3e7b34"/>
  <text x="519" y="366" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <path class="lng" d="M308,384 L252,384" marker-end="url(#ag)"/>
  <circle cx="279" cy="372" r="9" fill="#3e7b34"/>
  <text x="279" y="376" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <rect class="wu" x="40" y="362" width="210" height="44" rx="3"/>
  <text x="145" y="381" class="m c">read() returns n</text>
  <text x="145" y="397" class="s c">buf holds the file's bytes</text>
  <text x="400" y="440" class="s c">one kernel call from the program, two copies, no kernel buffer</text>
</svg>
