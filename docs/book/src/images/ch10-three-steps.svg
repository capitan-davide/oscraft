<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="200" y="26" class="h c">The server is waiting</text>
  <rect class="u" x="40" y="40" width="120" height="30" rx="4"/>
  <text x="100" y="60" class="c">client</text>
  <rect class="u" x="240" y="40" width="120" height="30" rx="4"/>
  <text x="300" y="60" class="c">server</text>
  <path class="life" d="M100,70 L100,360"/>
  <path class="life" d="M300,70 L300,360"/>
  <circle cx="362" cy="104" r="9" fill="#333333"/>
  <text x="362" y="108" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="376" y="100" class="s">receive:</text>
  <text x="376" y="113" class="s">nothing yet</text>
  <rect class="y" x="255" y="84" width="90" height="56" rx="3"/>
  <text x="300" y="108" class="s c">RECEIVE-</text>
  <text x="300" y="121" class="s c">blocked</text>
  <path class="lnk" d="M100,150 L298,150" marker-end="url(#ak)"/>
  <circle cx="178" cy="136" r="9" fill="#2c5d9b"/>
  <text x="178" y="140" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="192" y="140" class="s">send</text>
  <rect class="y" x="55" y="156" width="90" height="150" rx="3"/>
  <text x="100" y="226" class="s c">REPLY-</text>
  <text x="100" y="239" class="s c">blocked</text>
  <rect class="g" x="255" y="156" width="90" height="130" rx="3"/>
  <text x="300" y="216" class="s c">works on</text>
  <text x="300" y="229" class="s c">the request</text>
  <path class="lng" d="M300,300 L147,300" marker-end="url(#ag)"/>
  <circle cx="178" cy="286" r="9" fill="#3e7b34"/>
  <text x="178" y="290" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="192" y="290" class="s">reply</text>
  <rect class="g" x="55" y="308" width="90" height="40" rx="3"/>
  <text x="100" y="332" class="s c">runs again</text>
  <rect class="y" x="255" y="308" width="90" height="40" rx="3"/>
  <text x="300" y="325" class="s c">receive:</text>
  <text x="300" y="338" class="s c">waits again</text>
  <path class="life" d="M400,20 L400,360"/>
  <text x="600" y="26" class="h c">The server is busy</text>
  <rect class="u" x="440" y="40" width="120" height="30" rx="4"/>
  <text x="500" y="60" class="c">client</text>
  <rect class="u" x="640" y="40" width="120" height="30" rx="4"/>
  <text x="700" y="60" class="c">server</text>
  <path class="life" d="M500,70 L500,360"/>
  <path class="life" d="M700,70 L700,360"/>
  <rect class="g" x="655" y="84" width="90" height="110" rx="3"/>
  <text x="700" y="132" class="s c">busy with</text>
  <text x="700" y="145" class="s c">another</text>
  <text x="700" y="158" class="s c">request</text>
  <path class="lnk" d="M500,110 L653,110" marker-end="url(#ak)"/>
  <circle cx="578" cy="96" r="9" fill="#2c5d9b"/>
  <text x="578" y="100" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="592" y="100" class="s">send</text>
  <rect class="r" x="455" y="116" width="90" height="84" rx="3"/>
  <text x="500" y="154" class="s c">SEND-</text>
  <text x="500" y="167" class="s c">blocked</text>
  <text x="752" y="208" class="s"></text>
  <path class="ln dash" d="M698,204 L547,204" marker-end="url(#a)"/>
  <circle cx="538" cy="190" r="9" fill="#333333"/>
  <text x="538" y="194" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="552" y="194" class="s">receive: takes it</text>
  <rect class="y" x="455" y="210" width="90" height="96" rx="3"/>
  <text x="500" y="254" class="s c">REPLY-</text>
  <text x="500" y="267" class="s c">blocked</text>
  <rect class="g" x="655" y="210" width="90" height="76" rx="3"/>
  <text x="700" y="244" class="s c">works on</text>
  <text x="700" y="257" class="s c">the request</text>
  <path class="lng" d="M653,300 L547,300" marker-end="url(#ag)"/>
  <circle cx="578" cy="286" r="9" fill="#3e7b34"/>
  <text x="578" y="290" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="592" y="290" class="s">reply</text>
  <rect class="g" x="455" y="308" width="90" height="40" rx="3"/>
  <text x="500" y="332" class="s c">runs again</text>
  <rect class="y" x="655" y="308" width="90" height="40" rx="3"/>
  <text x="700" y="325" class="s c">receive:</text>
  <text x="700" y="338" class="s c">waits again</text>
  <text x="400" y="386" class="s c">Time runs downwards. The client is blocked from its send to the reply; the server is blocked only while it has nothing to do.</text>
</svg>
