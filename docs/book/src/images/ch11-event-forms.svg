<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <rect class="w" x="12" y="14" width="185" height="300" rx="4"/>
  <text x="104.5" y="36" class="h c">A small queued message</text>
  <rect class="k" x="26" y="60" width="157" height="34" rx="3"/>
  <text x="104" y="74" class="s c">queue of the program's</text>
  <text x="104" y="87" class="s c">channel</text>
  <rect class="wk" x="42" y="104" width="36" height="22" rx="2"/>
  <rect class="wk" x="86" y="104" width="36" height="22" rx="2"/>
  <rect class="y" x="130" y="104" width="36" height="22" rx="2"/>
  <text x="148" y="119" class="s c">new</text>
  <path class="lnk" d="M60,128 L60,160" marker-end="url(#ak)"/>
  <rect class="g" x="26" y="162" width="157" height="34" rx="3"/>
  <text x="104" y="176" class="s c">the thread takes it at</text>
  <text x="104" y="189" class="s c">its next receive</text>
  <text x="24" y="222" class="s">Arrives in order with the</text>
  <text x="24" y="236" class="s">program's other work.</text>
  <text x="24" y="250" class="s">Carries a little data.</text>
  <text x="24" y="264" class="s">Needs a receive loop.</text>
  <text x="24" y="290" class="s blue">suits: servers, event loops</text>
  <rect class="w" x="208" y="14" width="185" height="300" rx="4"/>
  <text x="300.5" y="36" class="h c">A signal</text>
  <rect class="g" x="222" y="60" width="157" height="26" rx="3"/>
  <text x="300" y="77" class="s c">the thread is running</text>
  <path class="lnr" d="M300,86 L300,108" marker-end="url(#ar)"/>
  <rect class="r" x="222" y="110" width="157" height="26" rx="3"/>
  <text x="300" y="127" class="s c">its handler runs instead</text>
  <path class="ln" d="M300,136 L300,158" marker-end="url(#a)"/>
  <rect class="g" x="222" y="160" width="157" height="26" rx="3"/>
  <text x="300" y="177" class="s c">continues where it was</text>
  <text x="220" y="222" class="s">Needs no loop: it cuts in</text>
  <text x="220" y="236" class="s">anywhere. The handler may</text>
  <text x="220" y="250" class="s">do very little safely, and a</text>
  <text x="220" y="264" class="s">blocked call fails early.</text>
  <text x="220" y="290" class="s blue">suits: simple programs</text>
  <rect class="w" x="404" y="14" width="185" height="300" rx="4"/>
  <text x="496.5" y="36" class="h c">Waking a waiting thread</text>
  <rect class="y" x="418" y="60" width="157" height="34" rx="3"/>
  <text x="496" y="74" class="s c">a thread waits in a call</text>
  <text x="496" y="87" class="s c">made for this event</text>
  <path class="lng" d="M496,94 L496,158" marker-end="url(#ag)"/>
  <text x="504" y="130" class="s">the event</text>
  <rect class="g" x="418" y="160" width="157" height="26" rx="3"/>
  <text x="496" y="177" class="s c">the call returns</text>
  <text x="416" y="222" class="s">The cheapest: nothing is</text>
  <text x="416" y="236" class="s">queued or copied. One</text>
  <text x="416" y="250" class="s">thread is tied to one</text>
  <text x="416" y="264" class="s">source of events.</text>
  <text x="416" y="290" class="s blue">suits: interrupt threads</text>
  <rect class="w" x="600" y="14" width="185" height="300" rx="4"/>
  <text x="692.5" y="36" class="h c">Starting a new thread</text>
  <rect class="w" x="614" y="60" width="157" height="26" rx="3"/>
  <text x="692" y="77" class="s c">nobody is waiting</text>
  <path class="lnk" d="M692,86 L692,108" marker-end="url(#ak)"/>
  <text x="700" y="101" class="s">the event</text>
  <rect class="k" x="614" y="110" width="157" height="26" rx="3"/>
  <text x="692" y="127" class="s c">the system makes a thread</text>
  <path class="lng" d="M692,136 L692,158" marker-end="url(#ag)"/>
  <rect class="g" x="614" y="160" width="157" height="26" rx="3"/>
  <text x="692" y="177" class="s c">it runs one function, ends</text>
  <text x="612" y="222" class="s">Nothing to prepare, and</text>
  <text x="612" y="236" class="s">each event is handled on</text>
  <text x="612" y="250" class="s">its own. The dearest: a</text>
  <text x="612" y="264" class="s">stack and a thread each.</text>
  <text x="612" y="290" class="s blue">suits: rare events</text>
</svg>
