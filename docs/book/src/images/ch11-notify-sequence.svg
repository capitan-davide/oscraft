<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
  <rect class="u" x="160" y="20" width="140" height="32" rx="4"/>
  <text x="230" y="41" class="c">client</text>
  <rect class="u" x="500" y="20" width="140" height="32" rx="4"/>
  <text x="570" y="41" class="c">server</text>
  <path class="life" d="M230,52 L230,400"/>
  <path class="life" d="M570,52 L570,400"/>
  <path class="lnk" d="M230,84 L568,84" marker-end="url(#ak)"/>
  <circle cx="294" cy="70" r="9" fill="#2c5d9b"/>
  <text x="294" y="74" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="310" y="74" class="s">send: "tell me when there is data" + an event</text>
  <rect class="y" x="185" y="89" width="90" height="30" rx="3"/>
  <text x="230" y="108" class="s c">blocked</text>
  <rect class="g" x="525" y="89" width="90" height="30" rx="3"/>
  <text x="570" y="108" class="s c">keeps the event</text>
  <path class="lng" d="M570,132 L232,132" marker-end="url(#ag)"/>
  <circle cx="294" cy="118" r="9" fill="#3e7b34"/>
  <text x="294" y="122" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="310" y="122" class="s">reply at once: "nothing yet"</text>
  <rect class="g" x="185" y="140" width="90" height="96" rx="3"/>
  <text x="230" y="178" class="s c">free: other</text>
  <text x="230" y="191" class="s c">work, or one</text>
  <text x="230" y="204" class="s c">wait for all</text>
  <text x="230" y="217" class="s c">its events</text>
  <rect class="y" x="525" y="140" width="90" height="70" rx="3"/>
  <text x="570" y="172" class="s c">waits for</text>
  <text x="570" y="185" class="s c">other clients</text>
  <path class="ln" d="M760,226 L617,226" marker-end="url(#a)"/>
  <text x="700" y="218" class="s c">data arrives</text>
  <rect class="g" x="525" y="214" width="90" height="44" rx="3"/>
  <text x="570" y="232" class="s c">delivers</text>
  <text x="570" y="245" class="s c">the event</text>
  <path class="lnk dash" d="M523,262 L232,262" marker-end="url(#ak)"/>
  <circle cx="294" cy="248" r="9" fill="#2c5d9b"/>
  <text x="294" y="252" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="310" y="252" class="s">the event: no reply, no waiting</text>
  <rect class="y" x="525" y="276" width="90" height="30" rx="3"/>
  <text x="570" y="295" class="s c">waits again</text>
  <rect class="g" x="185" y="270" width="90" height="40" rx="3"/>
  <text x="230" y="286" class="s c">notices</text>
  <text x="230" y="299" class="s c">the event</text>
  <path class="lnk" d="M230,316 L568,316" marker-end="url(#ak)"/>
  <circle cx="294" cy="302" r="9" fill="#2c5d9b"/>
  <text x="294" y="306" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="310" y="306" class="s">send: "read"</text>
  <rect class="y" x="185" y="321" width="90" height="30" rx="3"/>
  <text x="230" y="340" class="s c">blocked</text>
  <rect class="g" x="525" y="321" width="90" height="30" rx="3"/>
  <text x="570" y="340" class="s c">copies the data</text>
  <path class="lng" d="M570,364 L232,364" marker-end="url(#ag)"/>
  <circle cx="294" cy="350" r="9" fill="#3e7b34"/>
  <text x="294" y="354" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="310" y="354" class="s">reply: the data</text>
  <text x="400" y="420" class="s c">Every solid arrow is a synchronous message from client to server or its reply. Only the dashed one goes upwards, and it never blocks.</text>
</svg>
