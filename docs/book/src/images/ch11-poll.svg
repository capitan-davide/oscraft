<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
  <rect class="u" x="20" y="14" width="200" height="40" rx="4"/>
  <text x="120" y="31" class="c">a program in poll()</text>
  <text x="120" y="46" class="s c">libsys, in the caller's thread</text>
  <rect class="k" x="320" y="14" width="160" height="40" rx="4"/>
  <text x="400" y="39" class="c">kernel</text>
  <rect class="g" x="580" y="14" width="200" height="40" rx="4"/>
  <text x="680" y="31" class="c">netd</text>
  <text x="680" y="46" class="s c">owns the socket</text>
  <path class="life" d="M120,54 L120,470"/>
  <path class="life" d="M400,54 L400,470"/>
  <path class="life" d="M680,54 L680,470"/>
  <path class="lnk" d="M120,90 L398,90" marker-end="url(#ak)"/>
  <circle cx="138" cy="77" r="9" fill="#2c5d9b"/>
  <text x="138" y="81" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="154" y="82" class="s">register: a signal to this thread</text>
  <text x="392" y="106" class="s e green">returns a handle</text>
  <path class="lnk" d="M120,140 L678,140" marker-end="url(#ak)"/>
  <circle cx="138" cy="127" r="9" fill="#2c5d9b"/>
  <text x="138" y="131" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="154" y="132" class="s">_IO_NOTIFY on the descriptor: "is it readable? if not, arm this handle"</text>
  <rect class="g" x="625" y="146" width="110" height="34" rx="3"/>
  <text x="680" y="160" class="s c">not readable:</text>
  <text x="680" y="173" class="s c">keeps the handle</text>
  <path class="lng" d="M680,190 L122,190" marker-end="url(#ag)"/>
  <text x="620" y="204" class="s e green">reply: nothing ready</text>
  <path class="lnk" d="M120,238 L398,238" marker-end="url(#ak)"/>
  <circle cx="138" cy="225" r="9" fill="#2c5d9b"/>
  <text x="138" y="229" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="154" y="230" class="s">wait for the signal, with poll()'s timeout</text>
  <rect class="y" x="70" y="244" width="100" height="108" rx="3"/>
  <text x="120" y="290" class="s c">blocked in</text>
  <text x="120" y="303" class="s c">the kernel</text>
  <path class="ln" d="M795,290 L744,290" marker-end="url(#a)"/>
  <text x="795" y="262" class="s e">a packet</text>
  <rect class="g" x="618" y="268" width="124" height="44" rx="3"/>
  <text x="680" y="286" class="s c">the stack wakes</text>
  <text x="680" y="299" class="s c">the socket's waiters</text>
  <path class="lnk" d="M680,338 L402,338" marker-end="url(#ak)"/>
  <circle cx="662" cy="325" r="9" fill="#2c5d9b"/>
  <text x="662" y="329" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="646" y="330" class="s e">MsgDeliverEvent(client, handle)</text>
  <path class="lnk dash" d="M400,366 L172,366" marker-end="url(#ak)"/>
  <circle cx="382" cy="353" r="9" fill="#2c5d9b"/>
  <text x="382" y="357" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="366" y="358" class="s e">the registered signal</text>
  <rect class="g" x="70" y="356" width="100" height="24" rx="3"/>
  <text x="120" y="372" class="s c">wakes</text>
  <path class="lnk" d="M120,410 L678,410" marker-end="url(#ak)"/>
  <circle cx="138" cy="397" r="9" fill="#2c5d9b"/>
  <text x="138" y="401" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">6</text>
  <text x="154" y="402" class="s">_IO_NOTIFY again: "what is ready?" (and disarm)</text>
  <path class="lng" d="M680,440 L122,440" marker-end="url(#ag)"/>
  <text x="672" y="454" class="s e green">reply: readable</text>
  <text x="128" y="466" class="s">unregisters the handle; poll() returns POLLIN</text>
  <text x="400" y="490" class="s c">Steps 1 and 2 are repeated for every descriptor in the set, each with its own server; one wait covers them all.</text>
</svg>
