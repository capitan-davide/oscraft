<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <text x="150" y="26" class="h c">A pulse, as the receiver gets it</text>
  <rect class="w" x="30" y="44" width="56" height="30" rx="0"/>
  <text x="58.0" y="63" class="s c">type</text>
  <text x="32" y="88" class="ms">0</text>
  <rect class="w" x="86" y="44" width="56" height="30" rx="0"/>
  <text x="114.0" y="63" class="s c">subtype</text>
  <text x="88" y="88" class="ms">2</text>
  <rect class="y" x="142" y="44" width="44" height="30" rx="0"/>
  <text x="164.0" y="63" class="s c">code</text>
  <text x="144" y="88" class="ms">4</text>
  <rect class="n" x="186" y="44" width="84" height="30" rx="0"/>
  <text x="228.0" y="63" class="s c"></text>
  <text x="188" y="88" class="ms">5</text>
  <rect class="y" x="30" y="100" width="240" height="30" rx="0"/>
  <text x="150" y="119" class="s c">value: 64 bits</text>
  <text x="32" y="144" class="ms">8</text>
  <rect class="k" x="30" y="156" width="120" height="30" rx="0"/>
  <text x="90" y="175" class="s c">scoid</text>
  <text x="32" y="200" class="ms">16</text>
  <rect class="n" x="150" y="156" width="120" height="30" rx="0"/>
  <text x="152" y="200" class="ms">20</text>
  <text x="30" y="230" class="s">24 bytes. Type and subtype are 0. The code is</text>
  <text x="30" y="244" class="s">one signed byte: below 0 the kernel's, from 0</text>
  <text x="30" y="258" class="s">up a program's own. The scoid says which</text>
  <text x="30" y="272" class="s">client connection the pulse came on.</text>
  <text x="30" y="286" class="s"></text>
  <text x="30" y="300" class="s">The priority is not in the bytes: the receiving</text>
  <text x="30" y="314" class="s">thread runs at it.</text>
  <path class="life" d="M300,14 L300,346"/>
  <text x="555" y="26" class="h c">Sending one: never a wait</text>
  <rect class="w" x="330" y="44" width="150" height="40" rx="4"/>
  <text x="405" y="61" class="s c">a pulse for the channel</text>
  <text x="405" y="75" class="s c">priority 21</text>
  <path class="ln" d="M480,64 L538,64" marker-end="url(#a)"/>
  <rect class="k" x="540" y="44" width="240" height="40" rx="4"/>
  <text x="660" y="61" class="s c">is a server thread waiting</text>
  <text x="660" y="75" class="s c">to receive on the channel?</text>
  <path class="lng" d="M600,84 L600,118" marker-end="url(#ag)"/>
  <text x="608" y="106" class="s green">yes</text>
  <rect class="g" x="540" y="120" width="120" height="62" rx="4"/>
  <text x="600" y="138" class="s c">copied into its</text>
  <text x="600" y="152" class="s c">buffer; it wakes</text>
  <text x="600" y="166" class="s c">at priority 21</text>
  <path class="ln" d="M720,84 L720,118" marker-end="url(#a)"/>
  <text x="728" y="106" class="s">no</text>
  <rect class="y" x="670" y="120" width="110" height="62" rx="4"/>
  <text x="725" y="138" class="s c">kept in the</text>
  <text x="725" y="152" class="s c">channel's</text>
  <text x="725" y="166" class="s c">pulse queue</text>
  <text x="515" y="214" class="s c b">The channel's pulse queue: by priority, then arrival</text>
  <rect class="w" x="344" y="228" width="66" height="34" rx="2"/>
  <text x="377" y="249" class="s c">prio 30</text>
  <rect class="w" x="414" y="228" width="66" height="34" rx="2"/>
  <text x="447" y="249" class="s c">prio 21</text>
  <rect class="y" x="484" y="228" width="66" height="34" rx="2"/>
  <text x="517" y="249" class="s c">prio 21</text>
  <rect class="w" x="554" y="228" width="66" height="34" rx="2"/>
  <text x="587" y="249" class="s c">prio 10</text>
  <rect class="w" x="624" y="228" width="66" height="34" rx="2"/>
  <text x="657" y="249" class="s c">prio 10</text>
  <text x="517" y="278" class="s c">the new one: behind</text>
  <text x="517" y="291" class="s c">the earlier 21</text>
  <path class="ln" d="M725,182 L725,245 L692,245" marker-end="url(#a)"/>
  <text x="330" y="316" class="s">Queued messages and pulses raise the server's last receiver to their priority, so the</text>
  <text x="330" y="330" class="s">queue is emptied at the priority of the most urgent thing in it (Chapter 10).</text>
</svg>
