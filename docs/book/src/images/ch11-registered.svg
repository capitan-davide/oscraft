<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <rect class="u" x="50" y="16" width="140" height="32" rx="4"/>
  <text x="120" y="37" class="c">client</text>
  <rect class="k" x="310" y="16" width="180" height="32" rx="4"/>
  <text x="400" y="37" class="c">kernel</text>
  <rect class="u" x="620" y="16" width="140" height="32" rx="4"/>
  <text x="690" y="37" class="c">server</text>
  <path class="life" d="M120,48 L120,300"/>
  <path class="life" d="M400,48 L400,300"/>
  <path class="life" d="M690,48 L690,300"/>
  <rect class="y" x="310" y="84" width="180" height="78" rx="3"/>
  <text x="400" y="100" class="s c b">the client's registered events</text>
  <text x="320" y="119" class="ms">0  (free)</text>
  <text x="320" y="135" class="ms">1  pulse, code 5 → server</text>
  <text x="320" y="151" class="ms">2  signal 30   → anyone</text>
  <path class="lnk" d="M120,74 L308,104" marker-end="url(#ak)"/>
  <circle cx="140" cy="70" r="9" fill="#2c5d9b"/>
  <text x="140" y="74" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="156" y="62" class="s">register: this event,</text>
  <text x="156" y="74" class="s">deliverable by the server</text>
  <path class="lng" d="M308,140 L122,160" marker-end="url(#ag)"/>
  <text x="160" y="172" class="s green">handle 1</text>
  <path class="lnk" d="M120,196 L688,196" marker-end="url(#ak)"/>
  <circle cx="140" cy="182" r="9" fill="#2c5d9b"/>
  <text x="140" y="186" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="156" y="188" class="s">request: "notify me with handle 1"</text>
  <rect class="w" x="510" y="202" width="0" height="0" rx="4"/>
  <path class="lnk" d="M690,244 L402,244" marker-end="url(#ak)"/>
  <circle cx="670" cy="230" r="9" fill="#2c5d9b"/>
  <text x="670" y="234" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="654" y="236" class="s e">deliver to the client: handle 1</text>
  <path class="lnk dash" d="M400,282 L122,282" marker-end="url(#ak)"/>
  <circle cx="380" cy="268" r="9" fill="#2c5d9b"/>
  <text x="380" y="272" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="364" y="274" class="s e">entry 1, server allowed: the pulse</text>
  <path class="life" d="M20,316 L780,316"/>
  <text x="400" y="338" class="h c">What the server cannot do</text>
  <rect class="u" x="620" y="354" width="140" height="44" rx="4"/>
  <text x="690" y="372" class="s c">a faulty or</text>
  <text x="690" y="386" class="s c">hostile server</text>
  <rect class="r" x="310" y="354" width="180" height="44" rx="4"/>
  <text x="400" y="372" class="s c b">not a handle: refused</text>
  <text x="400" y="386" class="s c">a handle not for it: refused</text>
  <rect class="u" x="50" y="354" width="140" height="44" rx="4"/>
  <text x="120" y="372" class="s c">gets nothing it</text>
  <text x="120" y="386" class="s c">did not ask for</text>
  <path class="lnr" d="M618,376 L492,376" marker-end="url(#ar)"/>
  <text x="557" y="368" class="s c red">deliver: "signal 9"</text>
</svg>
