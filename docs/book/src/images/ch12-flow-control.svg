<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <text x="440" y="22" class="s c">the buffer</text>
  <text x="20" y="60" class="b">Some data,</text>
  <rect class="g" x="150" y="34" width="130" height="44" rx="4"/>
  <text x="215" y="53" class="c">writer</text>
  <text x="215" y="69" class="s c">write() returns</text>
  <path class="ln" d="M280,56 L318,56" marker-end="url(#a)"/>
  <rect class="w" x="320" y="40" width="240" height="32" rx="0"/>
  <rect class="y" x="320" y="40" width="110" height="32" rx="0"/>
  <path class="ln" d="M560,56 L598,56" marker-end="url(#a)"/>
  <rect class="g" x="600" y="34" width="130" height="44" rx="4"/>
  <text x="665" y="53" class="c">reader</text>
  <text x="665" y="69" class="s c">read() returns</text>
  <text x="440" y="92" class="s c">Neither waits: the writer has left its data and gone on, the reader takes what is there.</text>
  <text x="20" y="76" class="b">some room</text>
  <text x="20" y="154" class="b">Full</text>
  <rect class="y" x="150" y="128" width="130" height="44" rx="4"/>
  <text x="215" y="147" class="c">writer</text>
  <text x="215" y="163" class="s c">write() waits</text>
  <path class="ln" d="M280,150 L318,150" marker-end="url(#a)"/>
  <rect class="w" x="320" y="134" width="240" height="32" rx="0"/>
  <rect class="y" x="320" y="134" width="240" height="32" rx="0"/>
  <path class="ln" d="M560,150 L598,150" marker-end="url(#a)"/>
  <rect class="g" x="600" y="128" width="130" height="44" rx="4"/>
  <text x="665" y="147" class="c">reader</text>
  <text x="665" y="163" class="s c">read() returns</text>
  <text x="440" y="186" class="s c">The writer is held until the reader has made room: a fast producer runs at its consumer's pace.</text>
  <text x="20" y="248" class="b">Empty</text>
  <rect class="g" x="150" y="222" width="130" height="44" rx="4"/>
  <text x="215" y="241" class="c">writer</text>
  <text x="215" y="257" class="s c">write() returns</text>
  <path class="ln" d="M280,244 L318,244" marker-end="url(#a)"/>
  <rect class="w" x="320" y="228" width="240" height="32" rx="0"/>
  <path class="ln" d="M560,244 L598,244" marker-end="url(#a)"/>
  <rect class="y" x="600" y="222" width="130" height="44" rx="4"/>
  <text x="665" y="241" class="c">reader</text>
  <text x="665" y="257" class="s c">read() waits</text>
  <text x="440" y="280" class="s c">The reader is held until something is written, or until no writer is left.</text>
  <text x="400" y="316" class="s c">A non-blocking end never waits: where it would have, the call fails at once with "try again".</text>
</svg>
