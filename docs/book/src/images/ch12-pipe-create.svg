<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>
  <rect class="u" x="20" y="14" width="200" height="40" rx="4"/>
  <text x="120" y="31" class="c">a program in pipe()</text>
  <text x="120" y="46" class="s c">libsys</text>
  <rect class="k" x="320" y="14" width="160" height="40" rx="4"/>
  <text x="400" y="39" class="c">kernel</text>
  <rect class="k" x="580" y="14" width="200" height="40" rx="4"/>
  <text x="680" y="31" class="c">the pipe server</text>
  <text x="680" y="46" class="ms c">user/pipe</text>
  <path class="life" d="M120,54 L120,440"/>
  <path class="life" d="M400,54 L400,440"/>
  <path class="life" d="M680,54 L680,440"/>
  <path class="lnk" d="M120,92 L678,92" marker-end="url(#ak)"/>
  <circle cx="138" cy="79" r="9" fill="#2c5d9b"/>
  <text x="138" y="83" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="154" y="84" class="s">open "/" as a pipe, on a new connection: descriptor 3</text>
  <path class="lnk" d="M680,134 L402,134" marker-end="url(#ak)"/>
  <circle cx="662" cy="121" r="9" fill="#2c5d9b"/>
  <text x="662" y="125" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="646" y="126" class="s e">PipeOpen(client, new pipe, sizes)</text>
  <rect class="y" x="314" y="142" width="172" height="44" rx="3"/>
  <text x="400" y="160" class="s c">makes the pipe;</text>
  <text x="400" y="174" class="s c">binds 3 to it as the read end</text>
  <path class="lng" d="M488,176 L678,176" marker-end="url(#ag)"/>
  <text x="672" y="190" class="s e green">the pipe's ID</text>
  <path class="lng" d="M680,214 L122,214" marker-end="url(#ag)"/>
  <text x="154" y="208" class="s green">reply: opened</text>
  <path class="lnk" d="M120,256 L398,256" marker-end="url(#ak)"/>
  <circle cx="138" cy="243" r="9" fill="#2c5d9b"/>
  <text x="138" y="247" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="154" y="248" class="s">a second connection to the server: descriptor 4</text>
  <path class="lnk" d="M120,298 L678,298" marker-end="url(#ak)"/>
  <circle cx="138" cy="285" r="9" fill="#2c5d9b"/>
  <text x="138" y="289" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="154" y="290" class="s">on 4: "open the other end of what 3 is"</text>
  <path class="lnk" d="M680,340 L402,340" marker-end="url(#ak)"/>
  <circle cx="662" cy="327" r="9" fill="#2c5d9b"/>
  <text x="662" y="331" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="646" y="332" class="s e">PipeOpen(client, that pipe, other side)</text>
  <rect class="y" x="314" y="348" width="172" height="30" rx="3"/>
  <text x="400" y="367" class="s c">binds 4 to it as the write end</text>
  <path class="lng" d="M680,400 L122,400" marker-end="url(#ag)"/>
  <text x="154" y="394" class="s green">reply: opened</text>
  <text x="128" y="426" class="s">pipe() returns {3, 4}</text>
  <text x="400" y="458" class="s c">The server is asked twice and then steps aside: it never sees a byte of what flows through the pipe.</text>
</svg>
