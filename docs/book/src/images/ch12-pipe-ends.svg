<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>
  <text x="200" y="24" class="h c">The last writer closes</text>
  <rect class="u" x="30" y="38" width="120" height="28" rx="4"/>
  <rect class="y" x="160" y="38" width="80" height="28" rx="0"/>
  <rect class="u" x="250" y="38" width="120" height="28" rx="4"/>
  <text x="90" y="56" class="c">writer</text>
  <text x="200" y="56" class="s c">pipe</text>
  <text x="310" y="56" class="c">reader</text>
  <path class="life" d="M90,66 L90,200"/>
  <path class="life" d="M310,66 L310,200"/>
  <rect class="y" x="260" y="78" width="100" height="60" rx="3"/>
  <text x="310" y="98" class="s c">read() waits:</text>
  <text x="310" y="111" class="s c">the pipe is</text>
  <text x="310" y="124" class="s c">empty</text>
  <rect class="w" x="40" y="100" width="100" height="26" rx="3"/>
  <text x="90" y="117" class="s c">close()</text>
  <path class="lnk dash" d="M140,150 L258,150" marker-end="url(#ak)"/>
  <text x="200" y="144" class="s c">writers: 0</text>
  <rect class="g" x="260" y="146" width="100" height="44" rx="3"/>
  <text x="310" y="164" class="s c">read() returns 0:</text>
  <text x="310" y="177" class="s c">end of file</text>
  <text x="30" y="224" class="s">Data still in the buffer is read first.</text>
  <text x="30" y="238" class="s">A reader in poll() is told too.</text>
  <path class="life" d="M400,14 L400,280"/>
  <text x="600" y="24" class="h c">The last reader closes</text>
  <rect class="u" x="430" y="38" width="120" height="28" rx="4"/>
  <rect class="y" x="560" y="38" width="80" height="28" rx="0"/>
  <rect class="u" x="650" y="38" width="120" height="28" rx="4"/>
  <text x="490" y="56" class="c">writer</text>
  <text x="600" y="56" class="s c">pipe</text>
  <text x="710" y="56" class="c">reader</text>
  <path class="life" d="M490,66 L490,200"/>
  <path class="life" d="M710,66 L710,200"/>
  <rect class="y" x="440" y="78" width="100" height="60" rx="3"/>
  <text x="490" y="98" class="s c">write() waits:</text>
  <text x="490" y="111" class="s c">the pipe is</text>
  <text x="490" y="124" class="s c">full</text>
  <rect class="w" x="660" y="100" width="100" height="26" rx="3"/>
  <text x="710" y="117" class="s c">close()</text>
  <path class="lnr dash" d="M658,150 L552,150" marker-end="url(#ar)"/>
  <text x="600" y="144" class="s c">readers: 0</text>
  <rect class="r" x="430" y="146" width="120" height="44" rx="3"/>
  <text x="490" y="164" class="s c">SIGPIPE, and</text>
  <text x="490" y="177" class="s c">write() fails: EPIPE</text>
  <text x="430" y="224" class="s">Nobody will ever read what is written, so the</text>
  <text x="430" y="238" class="s">writer is stopped rather than left to fill the buffer.</text>
  <text x="400" y="290" class="s c">A pipe counts the descriptors open on each side; an end is gone only when its last copy is closed.</text>
</svg>
