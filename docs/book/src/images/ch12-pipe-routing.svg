<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <rect class="u" x="20" y="40" width="150" height="150" rx="4"/>
  <text x="95" y="60" class="c">a program</text>
  <rect class="wu" x="36" y="76" width="118" height="30" rx="2"/>
  <text x="95" y="95" class="s c">fd 3: read()</text>
  <rect class="wu" x="36" y="126" width="118" height="30" rx="2"/>
  <text x="95" y="145" class="s c">fd 4: write()</text>
  <text x="95" y="178" class="s c">its connections</text>
  <rect class="frame" x="200" y="14" width="370" height="372" rx="4"/>
  <text x="385" y="32" class="h c">kernel</text>
  <rect class="k" x="216" y="66" width="150" height="50" rx="3"/>
  <text x="291" y="85" class="s c b">connection 3</text>
  <text x="291" y="101" class="s c">bound: read end</text>
  <rect class="k" x="216" y="122" width="150" height="50" rx="3"/>
  <text x="291" y="141" class="s c b">connection 4</text>
  <text x="291" y="157" class="s c">bound: write end</text>
  <path class="ln" d="M154,91 L214,91" marker-end="url(#a)"/>
  <path class="ln" d="M154,141 L214,147" marker-end="url(#a)"/>
  <rect class="y" x="410" y="56" width="146" height="130" rx="3"/>
  <text x="483" y="74" class="c">the pipe</text>
  <text x="420" y="94" class="s">buffer: 65536 bytes</text>
  <text x="420" y="109" class="s">atomic size: 512</text>
  <text x="420" y="124" class="s">readers: 1  writers: 1</text>
  <text x="420" y="139" class="s">threads waiting to read</text>
  <text x="420" y="154" class="s">threads waiting to write</text>
  <text x="420" y="169" class="s">armed notifications</text>
  <path class="lnk" d="M366,91 L408,100" marker-end="url(#ak)"/>
  <path class="lnk" d="M366,147 L408,138" marker-end="url(#ak)"/>
  <rect class="k" x="216" y="226" width="340" height="50" rx="3"/>
  <text x="386" y="246" class="s c">MsgSendv() on a connection: is it bound to a pipe,</text>
  <text x="386" y="262" class="s c">and is the message a read or a write?</text>
  <path class="lng" d="M300,276 L300,316" marker-end="url(#ag)"/>
  <text x="308" y="300" class="s green">yes</text>
  <rect class="g" x="216" y="318" width="170" height="52" rx="3"/>
  <text x="301" y="336" class="s c">the kernel copies to or from</text>
  <text x="301" y="349" class="s c">the pipe's buffer, in the</text>
  <text x="301" y="362" class="s c">caller's own thread</text>
  <path class="ln" d="M556,251 L628,251" marker-end="url(#a)"/>
  <text x="592" y="243" class="s c">no</text>
  <rect class="k" x="630" y="40" width="150" height="330" rx="4"/>
  <text x="705" y="60" class="c">the pipe server</text>
  <text x="705" y="76" class="ms c">user/pipe</text>
  <text x="705" y="104" class="s c b">receives only:</text>
  <text x="642" y="126" class="s">the two opens</text>
  <text x="642" y="142" class="s">a copied descriptor</text>
  <text x="642" y="158" class="s">  (dup, fork)</text>
  <text x="642" y="174" class="s">poll() and select()</text>
  <text x="642" y="190" class="s">  asking and arming</text>
  <text x="642" y="206" class="s">fcntl(): O_NONBLOCK</text>
  <text x="642" y="222" class="s">fstat(), FIONREAD</text>
  <text x="642" y="238" class="s">fpathconf()</text>
  <text x="642" y="254" class="s">lseek(): refused</text>
  <text x="642" y="270" class="s">close()</text>
  <text x="642" y="300" class="s">and answers with</text>
  <text x="642" y="315" class="s">PipeOpen(), PipeCtl()</text>
  <text x="642" y="330" class="s">and PipeClose()</text>
</svg>
