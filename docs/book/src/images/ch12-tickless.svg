  <polyline class="lnr" points="393.5,106 393.5,164" marker-end="url(#ar)"/>
  <text x="398" y="132" class="s red">a thread on CPU 0 arms a timeout of</text>
  <text x="398" y="145" class="s red">CPU 1's family due at tick 7:</text>
  <text x="398" y="158" class="s red">deadline_armed() sends an IPI</text>
  <text x="398" y="214" class="s">woken: idle_until = tick 7</text>
  <text x="110" y="40" class="s">One grid of ticks for all CPUs; an idle CPU keeps only the tick of its first deadline.</text>
