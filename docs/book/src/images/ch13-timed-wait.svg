<svg xmlns="http://www.w3.org/2000/svg" width="800" height="512" viewBox="0 0 800 512" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="512" fill="#ffffff"/>
  <rect class="u" x="10" y="14" width="170" height="32" rx="4"/>
  <text x="95" y="35" class="c">program + libthr</text>
  <path class="life" d="M95,46 L95,462"/>
  <rect class="g" x="200" y="14" width="170" height="32" rx="4"/>
  <text x="285" y="35" class="c">libsys</text>
  <path class="life" d="M285,46 L285,462"/>
  <rect class="k" x="410" y="14" width="170" height="32" rx="4"/>
  <text x="495" y="35" class="c">kernel</text>
  <path class="life" d="M495,46 L495,462"/>
  <rect class="y" x="615" y="14" width="170" height="32" rx="4"/>
  <text x="700" y="35" class="c">CPU's timeout queue</text>
  <path class="life" d="M700,46 L700,462"/>
  <path class="ln" d="M95,90 L283,90" marker-end="url(#a)"/>
  <text x="190.0" y="84" class="s c">_umtx_op(lock, deadline)</text>
  <text x="15" y="66" class="s">pthread_mutex_timedlock()</text>
  <path class="ln" d="M285,112 L493,112" marker-end="url(#a)"/>
  <text x="390.0" y="106" class="s c">TimerTimeout(clock, SEM | ABSTIME)</text>
  <circle cx="269" cy="112" r="9" fill="#333333"/>
  <text x="269" y="116" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <rect class="wk" x="400" y="120" width="190" height="38" rx="4"/>
  <text x="495" y="136" class="s c">thread.armed_timeout =</text>
  <text x="495" y="150" class="ms c">(deadline, SEM)</text>
  <path class="ln" d="M495,172 L287,172" marker-end="url(#a)"/>
  <text x="390.0" y="166" class="s c">returns at once</text>
  <path class="ln" d="M285,206 L493,206" marker-end="url(#a)"/>
  <text x="390.0" y="200" class="s c">futex wait on the lock word</text>
  <circle cx="269" cy="206" r="9" fill="#333333"/>
  <text x="269" y="210" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <rect class="wk" x="400" y="214" width="190" height="38" rx="4"/>
  <text x="495" y="230" class="s c">still locked: the thread will</text>
  <text x="495" y="244" class="s c">block in state SEM</text>
  <path class="ln" d="M495,270 L698,270" marker-end="url(#a)"/>
  <text x="597.5" y="264" class="s c">timeout::arm(SEM)</text>
  <circle cx="527.5" cy="264" r="9" fill="#333333"/>
  <text x="527.5" y="268" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <rect class="y" x="625" y="278" width="150" height="34" rx="3"/>
  <text x="700" y="299" class="ms c">(deadline, thread)</text>
  <rect class="y" x="435" y="290" width="120" height="62" rx="3"/>
  <text x="495" y="316" class="c">blocked</text>
  <text x="495" y="332" class="s c">the mutex stays held</text>
  <text x="700" y="338" class="s c">a tick at or after the deadline</text>
  <path class="lnr" d="M700,384 L497,384" marker-end="url(#ar)"/>
  <text x="597.5" y="378" class="s c red">expire(): unblock(thread, ETIMEDOUT)</text>
  <circle cx="716" cy="384" r="9" fill="#aa2222"/>
  <text x="716" y="388" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <path class="lnr" d="M495,416 L287,416" marker-end="url(#ar)"/>
  <text x="390.0" y="410" class="s c red">ETIMEDOUT</text>
  <path class="lnr" d="M285,444 L97,444" marker-end="url(#ar)"/>
  <text x="190.0" y="438" class="s c red">ETIMEDOUT</text>
  <text x="400" y="484" class="s c">The deadline is given in one kernel call and used by the next. Had the lock been free, or been released in time,</text>
  <text x="400" y="500" class="s c">the armed timeout would simply have been forgotten when the second call returned.</text>
</svg>
