<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>
  <text x="20" y="24" class="h">The user stack while a handler runs</text>
  <rect class="g" x="20" y="40" width="330" height="50" rx="0"/>
  <text x="185.0" y="69" class="s c">the interrupted code's frames</text>
  <rect class="y" x="20" y="90" width="330" height="170" rx="0"/>
  <text x="185.0" y="110" class="b c">ucontext_t (944 bytes)</text>
  <rect class="w" x="34" y="122" width="302" height="34" rx="2"/>
  <text x="44" y="143" class="ms">+0</text>
  <text x="90" y="143" class="s">uc_sigmask: the mask to restore (16 bytes)</text>
  <rect class="w" x="34" y="164" width="302" height="34" rx="2"/>
  <text x="44" y="185" class="ms">+16</text>
  <text x="90" y="185" class="s">x0 to x30, sp, pc, pstate</text>
  <rect class="w" x="34" y="206" width="302" height="34" rx="2"/>
  <text x="44" y="227" class="ms">+288</text>
  <text x="90" y="227" class="s">v0 to v31, FPSR, FPCR, flags</text>
  <rect class="u" x="20" y="260" width="330" height="110" rx="0"/>
  <text x="185.0" y="280" class="b c">frame (96 bytes)</text>
  <rect class="w" x="34" y="288" width="302" height="22" rx="2"/>
  <text x="44" y="303" class="ms">+0</text>
  <text x="90" y="303" class="s">siginfo_t (80 bytes)</text>
  <rect class="w" x="34" y="314" width="302" height="22" rx="2"/>
  <text x="44" y="329" class="ms">+80</text>
  <text x="90" y="329" class="s">the handler's address</text>
  <rect class="w" x="34" y="340" width="302" height="22" rx="2"/>
  <text x="44" y="355" class="ms">+88</text>
  <text x="90" y="355" class="s">the address of the ucontext_t</text>
  <rect class="w" x="20" y="370" width="330" height="44" rx="0"/>
  <text x="185.0" y="396" class="s c">the trampoline's and the handler's frames</text>
  <text x="358" y="94" class="s">sp before</text>
  <text x="358" y="374" class="s">sp = x0</text>
  <text x="358" y="388" class="s">at entry</text>
  <path class="ln dash" d="M336,353 L390,353 L390,200 L352,200" marker-end="url(#a)"/>
  <rect class="k" x="480" y="40" width="300" height="46" rx="4"/>
  <circle cx="466" cy="63" r="9" fill="#333333"/>
  <text x="466" y="67" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="630.0" y="59" class="c">kernel: deliver()</text>
  <text x="630.0" y="75" class="s c">takes the lowest pending, unblocked signal</text>
  <path class="ln" d="M630.0,86 L630.0,102" marker-end="url(#a)"/>
  <rect class="k" x="480" y="104" width="300" height="46" rx="4"/>
  <circle cx="466" cy="127" r="9" fill="#333333"/>
  <text x="466" y="131" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="630.0" y="123" class="c">kernel: enter_handler()</text>
  <text x="630.0" y="139" class="s c">writes both structures; pc = trampoline</text>
  <path class="ln" d="M630.0,150 L630.0,166" marker-end="url(#a)"/>
  <rect class="g" x="480" y="168" width="300" height="46" rx="4"/>
  <circle cx="466" cy="191" r="9" fill="#333333"/>
  <text x="466" y="195" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="630.0" y="187" class="c">libsys: __oscraft_sigstub(frame)</text>
  <text x="630.0" y="203" class="s c">calls handler(signo, &amp;siginfo, &amp;ucontext)</text>
  <path class="ln" d="M630.0,214 L630.0,230" marker-end="url(#a)"/>
  <rect class="u" x="480" y="232" width="300" height="46" rx="4"/>
  <circle cx="466" cy="255" r="9" fill="#333333"/>
  <text x="466" y="259" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="630.0" y="251" class="c">the program's handler</text>
  <text x="630.0" y="267" class="s c">runs with the signal blocked; returns</text>
  <path class="ln" d="M630.0,278 L630.0,294" marker-end="url(#a)"/>
  <rect class="g" x="480" y="296" width="300" height="46" rx="4"/>
  <circle cx="466" cy="319" r="9" fill="#333333"/>
  <text x="466" y="323" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="630.0" y="315" class="c">libsys: SignalReturn(frame)</text>
  <text x="630.0" y="331" class="s c">a kernel call that does not return</text>
  <path class="ln" d="M630.0,342 L630.0,358" marker-end="url(#a)"/>
  <rect class="k" x="480" y="360" width="300" height="46" rx="4"/>
  <circle cx="466" cy="383" r="9" fill="#333333"/>
  <text x="466" y="387" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">6</text>
  <text x="630.0" y="379" class="c">kernel: signal_return()</text>
  <text x="630.0" y="395" class="s c">registers, FP state and mask from the ucontext</text>
  <text x="400" y="446" class="s c">The context is in the program's memory, and the handler may change it: what SignalReturn() restores is what it finds,</text>
  <text x="400" y="462" class="s c">except the processor mode, which stays user mode whatever the saved pstate says.</text>
</svg>
