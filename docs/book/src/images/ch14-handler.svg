<svg xmlns="http://www.w3.org/2000/svg" width="800" height="412" viewBox="0 0 800 412" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="412" fill="#ffffff"/>
  <text x="20" y="24" class="h">What the thread executes</text>
  <rect class="g" x="20" y="76" width="220" height="40" rx="4"/>
  <text x="130" y="101" class="c">the program's code</text>
  <rect class="k" x="240" y="76" width="60" height="40" rx="4"/>
  <text x="270" y="94" class="s c">kernel</text>
  <text x="270" y="108" class="s c">saves</text>
  <rect class="u" x="300" y="76" width="200" height="40" rx="4"/>
  <text x="400" y="101" class="c">the handler</text>
  <rect class="k" x="500" y="76" width="60" height="40" rx="4"/>
  <text x="530" y="94" class="s c">kernel</text>
  <text x="530" y="108" class="s c">restores</text>
  <rect class="g" x="560" y="76" width="220" height="40" rx="4"/>
  <text x="670" y="101" class="c">the program's code</text>
  <path class="ln" d="M20,134 L780,134" marker-end="url(#a)"/>
  <text x="780" y="150" class="s e">time</text>
  <path class="lnr" d="M240,62 L240,76"/>
  <text x="240" y="58" class="s c red">a signal is delivered here, between two instructions</text>
  <text x="670" y="70" class="s c">continues where it was interrupted</text>
  <text x="20" y="172" class="h">The thread's stack (it grows downwards)</text>
  <text x="140" y="196" class="s c">before</text>
  <rect class="g" x="40" y="204" width="200" height="60" rx="0"/>
  <text x="140" y="238.0" class="s c">the program's frames</text>
  <rect class="w" x="40" y="264" width="200" height="110" rx="0"/>
  <text x="140" y="323.0" class="s c">free</text>
  <text x="400" y="196" class="s c">while the handler runs</text>
  <rect class="g" x="300" y="204" width="200" height="60" rx="0"/>
  <text x="400" y="238.0" class="s c">the program's frames</text>
  <rect class="y" x="300" y="264" width="200" height="60" rx="0"/>
  <text x="400" y="291.0" class="s c">saved context: registers,</text>
  <text x="400" y="305.0" class="s c">program counter, signal mask</text>
  <rect class="u" x="300" y="324" width="200" height="30" rx="0"/>
  <text x="400" y="343.0" class="s c">the handler's frames</text>
  <rect class="w" x="300" y="354" width="200" height="20" rx="0"/>
  <text x="400" y="368.0" class="s c"></text>
  <text x="660" y="196" class="s c">after</text>
  <rect class="g" x="560" y="204" width="200" height="60" rx="0"/>
  <text x="660" y="238.0" class="s c">the program's frames</text>
  <rect class="w" x="560" y="264" width="200" height="110" rx="0"/>
  <text x="660" y="323.0" class="s c">free</text>
  <path class="ln" d="M245,289 L295,289" marker-end="url(#a)"/>
  <path class="ln" d="M505,289 L555,289" marker-end="url(#a)"/>
  <text x="400" y="398" class="s c">The interrupted code never called the handler. The kernel saves its state on the thread's stack, and puts it back afterwards.</text>
</svg>
