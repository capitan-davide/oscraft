<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
  <text x="20" y="24" class="h">Posting a signal to a process</text>
  <rect class="k" x="80" y="44" width="340" height="46" rx="4"/>
  <circle cx="100" cy="67.0" r="9" fill="#2c5d9b"/>
  <text x="100" y="71.0" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="260" y="63" class="c">SIGSTOP or SIGCONT?</text>
  <text x="260" y="79" class="s c">job control is done first</text>
  <path class="ln" d="M420,67 L498,67" marker-end="url(#a)"/>
  <rect class="r" x="500" y="44" width="280" height="46" rx="4"/>
  <text x="640" y="63" class="c">stop the process / let it go on</text>
  <text x="640" y="79" class="s c">SIGSTOP ends here; SIGCONT goes on down</text>
  <rect class="k" x="80" y="120" width="340" height="46" rx="4"/>
  <circle cx="100" cy="143.0" r="9" fill="#2c5d9b"/>
  <text x="100" y="147.0" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="260" y="139" class="c">ignored, and no thread blocks or waits for it?</text>
  <text x="260" y="155" class="s c">action SIG_IGN, or SIG_DFL with a default of nothing</text>
  <path class="ln" d="M420,143 L498,143" marker-end="url(#a)"/>
  <rect class="n" x="500" y="120" width="280" height="46" rx="4"/>
  <text x="640" y="139" class="c">dropped</text>
  <text x="640" y="155" class="s c">nothing is recorded</text>
  <rect class="k" x="80" y="196" width="340" height="46" rx="4"/>
  <circle cx="100" cy="219.0" r="9" fill="#2c5d9b"/>
  <text x="100" y="223.0" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="260" y="215" class="c">a stop signal at its default action?</text>
  <text x="260" y="231" class="s c">SIGTSTP, SIGTTIN, SIGTTOU, that no thread blocks</text>
  <path class="ln" d="M420,219 L498,219" marker-end="url(#a)"/>
  <rect class="r" x="500" y="196" width="280" height="46" rx="4"/>
  <text x="640" y="215" class="c">stop the process</text>
  <text x="640" y="231" class="s c">its parent gets SIGCHLD</text>
  <rect class="y" x="80" y="272" width="340" height="46" rx="4"/>
  <circle cx="100" cy="295.0" r="9" fill="#2c5d9b"/>
  <text x="100" y="299.0" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="260" y="291" class="c">record it as pending</text>
  <text x="260" y="307" class="s c">for the process, or for the one thread named</text>
  <path class="ln" d="M250,90 L250,118" marker-end="url(#a)"/>
  <path class="ln" d="M250,166 L250,194" marker-end="url(#a)"/>
  <path class="ln" d="M250,242 L250,270" marker-end="url(#a)"/>
  <text x="428" y="60" class="s">yes</text>
  <text x="258" y="106" class="s">no</text>
  <text x="428" y="136" class="s">yes</text>
  <text x="258" y="182" class="s">no</text>
  <text x="428" y="212" class="s">yes</text>
  <text x="258" y="258" class="s">no</text>
  <text x="500" y="291" class="s">real-time signals: every instance is queued</text>
  <text x="500" y="307" class="s">others: a second one while pending is dropped</text>
  <path class="ln" d="M250,318 L250,338 L110,338 L110,358" marker-end="url(#a)"/>
  <text x="258" y="334" class="s">then look for a thread that can take it</text>
  <rect class="g" x="20" y="360" width="180" height="70" rx="4"/>
  <text x="110" y="380" class="c">a thread waiting for it</text>
  <text x="110" y="398" class="s c">in sigwaitinfo(): woken</text>
  <text x="110" y="414" class="s c">returns the signal's number</text>
  <path class="ln dash" d="M200,395 L213,395" marker-end="url(#a)"/>
  <rect class="g" x="214" y="360" width="180" height="70" rx="4"/>
  <text x="304" y="380" class="c">a thread blocked in a call</text>
  <text x="304" y="398" class="s c">that does not block the signal:</text>
  <text x="304" y="414" class="s c">its call fails with EINTR</text>
  <path class="ln dash" d="M394,395 L407,395" marker-end="url(#a)"/>
  <rect class="g" x="408" y="360" width="180" height="70" rx="4"/>
  <text x="498" y="380" class="c">a thread running user code</text>
  <text x="498" y="398" class="s c">on another CPU: interrupted</text>
  <text x="498" y="414" class="s c">by an interprocessor interrupt</text>
  <path class="ln dash" d="M588,395 L601,395" marker-end="url(#a)"/>
  <rect class="n" x="602" y="360" width="180" height="70" rx="4"/>
  <text x="692" y="380" class="c">none of these</text>
  <text x="692" y="398" class="s c">the signal waits for a thread</text>
  <text x="692" y="414" class="s c">to unblock it</text>
  <text x="400" y="462" class="s c">Except in the first case the signal stays pending: it is taken, and its action carried out, by whichever thread</text>
  <text x="400" y="478" class="s c">next passes through the kernel's return to user mode with the signal unblocked.</text>
  <text x="400" y="502" class="s c">The dashed arrows mean "if there is no such thread".</text>
</svg>
