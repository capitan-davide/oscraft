<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="195" y="24" class="h c">A handler without SA_RESTART</text>
  <rect class="u" x="30" y="36" width="140" height="28" rx="4"/>
  <text x="100" y="55" class="c">thread</text>
  <rect class="k" x="220" y="36" width="140" height="28" rx="4"/>
  <text x="290" y="55" class="c">kernel</text>
  <path class="life" d="M100,64 L100,392"/>
  <path class="life" d="M290,64 L290,392"/>
  <path class="ln" d="M100,90 L288,90" marker-end="url(#a)"/>
  <text x="195.0" y="84" class="s c">read(): MsgSendv()</text>
  <rect class="y" x="230" y="98" width="120" height="50" rx="3"/>
  <text x="290" y="119" class="s c">blocked, waiting</text>
  <text x="290" y="133" class="s c">for the server</text>
  <path class="lnr" d="M390,160 L292,160" marker-end="url(#ar)"/>
  <text x="390" y="152" class="s e red">signal</text>
  <rect class="wk" x="210" y="168" width="160" height="36" rx="4"/>
  <text x="290" y="183" class="s c">the wait ends: EINTR</text>
  <text x="290" y="197" class="s c">result = EINTR</text>
  <path class="lnr" d="M290,222 L102,222" marker-end="url(#ar)"/>
  <text x="195.0" y="216" class="s c red">enter the handler</text>
  <rect class="u" x="45" y="230" width="110" height="40" rx="3"/>
  <text x="100" y="254" class="s c">handler runs</text>
  <path class="ln" d="M100,286 L288,286" marker-end="url(#a)"/>
  <text x="195.0" y="280" class="s c">SignalReturn()</text>
  <path class="lnr" d="M290,320 L102,320" marker-end="url(#ar)"/>
  <text x="195.0" y="314" class="s c red">read() returns -1, EINTR</text>
  <text x="100" y="350" class="s c">the program must</text>
  <text x="100" y="364" class="s c">check and retry</text>
  <path class="life" d="M400,14 L400,396"/>
  <text x="595" y="24" class="h c">A handler with SA_RESTART</text>
  <rect class="u" x="430" y="36" width="140" height="28" rx="4"/>
  <text x="500" y="55" class="c">thread</text>
  <rect class="k" x="620" y="36" width="140" height="28" rx="4"/>
  <text x="690" y="55" class="c">kernel</text>
  <path class="life" d="M500,64 L500,392"/>
  <path class="life" d="M690,64 L690,392"/>
  <path class="ln" d="M500,90 L688,90" marker-end="url(#a)"/>
  <text x="595.0" y="84" class="s c">read(): MsgSendv()</text>
  <rect class="y" x="630" y="98" width="120" height="50" rx="3"/>
  <text x="690" y="119" class="s c">blocked, waiting</text>
  <text x="690" y="133" class="s c">for the server</text>
  <path class="lnr" d="M790,160 L692,160" marker-end="url(#ar)"/>
  <text x="790" y="152" class="s e red">signal</text>
  <rect class="wk" x="610" y="168" width="160" height="36" rx="4"/>
  <text x="690" y="183" class="s c">the wait ends: EINTR</text>
  <text x="690" y="197" class="s c">pc moved back to the call</text>
  <text x="690" y="197" class="s"></text>
  <path class="lnr" d="M690,222 L502,222" marker-end="url(#ar)"/>
  <text x="595.0" y="216" class="s c red">enter the handler</text>
  <rect class="u" x="445" y="230" width="110" height="40" rx="3"/>
  <text x="500" y="254" class="s c">handler runs</text>
  <path class="ln" d="M500,286 L688,286" marker-end="url(#a)"/>
  <text x="595.0" y="280" class="s c">SignalReturn()</text>
  <path class="lng" d="M690,320 L502,320" marker-end="url(#ag)"/>
  <text x="595.0" y="314" class="s c green">resume at the call</text>
  <path class="lng" d="M500,356 L688,356" marker-end="url(#ag)"/>
  <text x="595.0" y="350" class="s c green">the same MsgSendv()</text>
  <text x="500" y="384" class="s c">read() does not see EINTR</text>
  <text x="400" y="420" class="s c">With SA_RESTART the kernel does not complete the interrupted call. It moves the program counter back by one</text>
  <text x="400" y="436" class="s c">instruction before saving the context, so that returning from the handler makes the same kernel call again.</text>
</svg>
