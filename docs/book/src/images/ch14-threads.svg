<svg xmlns="http://www.w3.org/2000/svg" width="800" height="356" viewBox="0 0 800 356" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="356" fill="#ffffff"/>
  <rect class="frame" x="150" y="14" width="630" height="270" rx="4"/>
  <text x="166" y="36" class="h">one process</text>
  <rect class="y" x="170" y="50" width="590" height="44" rx="4"/>
  <text x="465" y="69" class="b c">pending for the process</text>
  <text x="465" y="85" class="ms c">SIGTERM</text>
  <rect class="u" x="170" y="140" width="190" height="60" rx="4"/>
  <text x="265" y="160" class="b c">thread 1</text>
  <text x="265" y="177" class="s c">mask: blocks SIGTERM</text>
  <rect class="y" x="190" y="214" width="150" height="46" rx="3"/>
  <text x="265" y="232" class="s c">pending for this thread</text>
  <text x="265" y="249" class="ms c">none</text>
  <rect class="u" x="370" y="140" width="190" height="60" rx="4"/>
  <text x="465" y="160" class="b c">thread 2</text>
  <text x="465" y="177" class="s c">mask: blocks nothing</text>
  <rect class="y" x="390" y="214" width="150" height="46" rx="3"/>
  <text x="465" y="232" class="s c">pending for this thread</text>
  <text x="465" y="249" class="ms c">none</text>
  <rect class="u" x="570" y="140" width="190" height="60" rx="4"/>
  <text x="665" y="160" class="b c">thread 3</text>
  <text x="665" y="177" class="s c">mask: blocks SIGTERM</text>
  <rect class="y" x="590" y="214" width="150" height="46" rx="3"/>
  <text x="665" y="232" class="s c">pending for this thread</text>
  <text x="665" y="249" class="ms c">SIGUSR1</text>
  <path class="lng" d="M465,94 L465,138" marker-end="url(#ag)"/>
  <text x="473" y="120" class="s green">any thread that does not block it</text>
  <path class="ln" d="M60,72 L168,72" marker-end="url(#a)"/>
  <text x="20" y="54" class="ms">kill(pid, SIGTERM)</text>
  <path class="ln" d="M20,300 L665,300 L665,262" marker-end="url(#a)"/>
  <text x="20" y="318" class="ms">pthread_kill(thread 3, SIGUSR1)</text>
  <text x="400" y="344" class="s c">Actions belong to the process. Each thread has its own mask, and its own set of signals sent to it alone.</text>
</svg>
