<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <text x="90" y="36" class="h c">Devices</text>
  <rect class="n" x="20" y="60" width="140" height="40" rx="4"/>
  <text x="90" y="84" class="c">network device</text>
  <path class="ln" d="M160,80 L250,80" marker-end="url(#a)"/>
  <rect class="n" x="20" y="130" width="140" height="40" rx="4"/>
  <text x="90" y="154" class="c">serial port</text>
  <path class="ln" d="M160,150 L250,150" marker-end="url(#a)"/>
  <rect class="n" x="20" y="200" width="140" height="40" rx="4"/>
  <text x="90" y="224" class="c">disk controller</text>
  <path class="ln" d="M160,220 L250,220" marker-end="url(#a)"/>
  <text x="205" y="52" class="s c">interrupt</text>
  <text x="205" y="64" class="s c">lines</text>
  <rect class="n" x="250" y="44" width="300" height="212" rx="4"/>
  <text x="400" y="36" class="h c">Interrupt controller</text>
  <text x="266" y="60" class="s b">enabled?</text>
  <text x="356" y="60" class="s b">pending?</text>
  <text x="446" y="60" class="s b">priority, CPU</text>
  <rect class="g" x="262" y="66" width="78" height="28" rx="3"/>
  <text x="301" y="84" class="s c">yes</text>
  <rect class="y" x="352" y="66" width="78" height="28" rx="3"/>
  <text x="391" y="84" class="s c">yes</text>
  <rect class="w" x="442" y="66" width="96" height="28" rx="3"/>
  <text x="490" y="84" class="s c">high, CPU 0</text>
  <rect class="g" x="262" y="136" width="78" height="28" rx="3"/>
  <text x="301" y="154" class="s c">yes</text>
  <rect class="w" x="352" y="136" width="78" height="28" rx="3"/>
  <text x="391" y="154" class="s c">no</text>
  <rect class="w" x="442" y="136" width="96" height="28" rx="3"/>
  <text x="490" y="154" class="s c">low, CPU 0</text>
  <rect class="r" x="262" y="206" width="78" height="28" rx="3"/>
  <text x="301" y="224" class="s c">masked</text>
  <rect class="y" x="352" y="206" width="78" height="28" rx="3"/>
  <text x="391" y="224" class="s c">yes</text>
  <rect class="w" x="442" y="206" width="96" height="28" rx="3"/>
  <text x="490" y="224" class="s c">low, CPU 1</text>
  <text x="400" y="248" class="s c">picks the highest-priority pending, enabled line</text>
  <text x="700" y="36" class="h c">Processors</text>
  <rect class="k" x="640" y="60" width="120" height="60" rx="4"/>
  <text x="700" y="86" class="b c">CPU 0</text>
  <text x="700" y="102" class="s c">handler runs</text>
  <rect class="k" x="640" y="180" width="120" height="60" rx="4"/>
  <text x="700" y="206" class="b c">CPU 1</text>
  <text x="700" y="222" class="s c">not interrupted</text>
  <path class="lnr" d="M550,68 L640,68" marker-end="url(#ar)"/>
  <text x="618" y="62" class="s c red">IRQ</text>
  <circle cx="578" cy="68" r="9" fill="#333333"/>
  <text x="578" y="72" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <path class="lnk" d="M640,90 L550,90" marker-end="url(#ak)"/>
  <circle cx="596" cy="90" r="9" fill="#2c5d9b"/>
  <text x="596" y="94" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <path class="lnk" d="M640,112 L550,112" marker-end="url(#ak)"/>
  <circle cx="614" cy="112" r="9" fill="#2c5d9b"/>
  <text x="614" y="116" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <circle cx="205" cy="80" r="9" fill="#333333"/>
  <text x="205" y="84" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <circle cx="750" cy="70" r="9" fill="#333333"/>
  <text x="750" y="74" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <circle cx="30" cy="286" r="9" fill="#333333"/>
  <text x="30" y="290" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="46" y="290" class="s">A device raises its line.</text>
  <circle cx="30" cy="308" r="9" fill="#333333"/>
  <text x="30" y="312" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="46" y="312" class="s">The controller marks it pending and, if it is enabled, signals a CPU.</text>
  <circle cx="30" cy="330" r="9" fill="#2c5d9b"/>
  <text x="30" y="334" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="46" y="334" class="s">The CPU's handler acknowledges: it asks which interrupt this is.</text>
  <circle cx="430" cy="286" r="9" fill="#333333"/>
  <text x="430" y="290" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="446" y="290" class="s">The handler for that interrupt runs.</text>
  <circle cx="430" cy="308" r="9" fill="#2c5d9b"/>
  <text x="430" y="312" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="446" y="312" class="s">End of interrupt: the controller may</text>
  <text x="446" y="325" class="s">signal the next one. The third line stays</text>
  <text x="446" y="338" class="s">pending until software unmasks it.</text>
</svg>
