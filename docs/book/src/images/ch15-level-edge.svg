<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="20" y="24" class="h">Edge-triggered: the event is the change</text>
  <text x="160" y="64" class="s e">the device's line</text>
  <text x="160" y="108" class="s e">at the controller</text>
  <text x="160" y="152" class="s e">software</text>
  <path class="ln" d="M170,68 L260,68 L260,46 L285,46 L285,68 L520,68 L520,46 L545,46 L545,68 L770,68"/>
  <rect class="y" x="260" y="94" width="110" height="24" rx="3"/>
  <text x="315" y="110" class="s c">pending</text>
  <rect class="y" x="520" y="94" width="110" height="24" rx="3"/>
  <text x="575" y="110" class="s c">pending</text>
  <rect class="g" x="370" y="138" width="90" height="24" rx="3"/>
  <text x="415" y="154" class="s c">handler</text>
  <rect class="g" x="630" y="138" width="90" height="24" rx="3"/>
  <text x="675" y="154" class="s c">handler</text>
  <path class="life" d="M260,46 L260,94"/>
  <path class="life" d="M520,46 L520,94"/>
  <text x="480" y="86" class="s c">the controller remembers the pulse; one interrupt per pulse</text>
  <text x="20" y="214" class="h">Level-triggered: the line stays active until the device is served</text>
  <text x="160" y="254" class="s e">the device's line</text>
  <text x="160" y="298" class="s e">at the controller</text>
  <text x="160" y="342" class="s e">software</text>
  <path class="ln" d="M170,258 L260,258 L260,236 L560,236 L560,258 L770,258"/>
  <rect class="g" x="170" y="284" width="110" height="24" rx="3"/>
  <text x="225" y="300" class="s c">unmasked</text>
  <rect class="r" x="280" y="284" width="320" height="24" rx="3"/>
  <text x="440" y="300" class="s c">masked: the active line reaches no CPU</text>
  <rect class="g" x="600" y="284" width="170" height="24" rx="3"/>
  <text x="685" y="300" class="s c">unmasked</text>
  <rect class="k" x="260" y="328" width="60" height="24" rx="3"/>
  <text x="290" y="344" class="s c">handler</text>
  <rect class="u" x="420" y="328" width="140" height="24" rx="3"/>
  <text x="490" y="344" class="s c">driver serves the device</text>
  <path class="life" d="M260,236 L260,328"/>
  <path class="life" d="M560,236 L560,328"/>
  <path class="lng" d="M600,364 L600,310" marker-end="url(#ag)"/>
  <text x="608" y="364" class="s green">safe to unmask: the line is quiet</text>
  <text x="20" y="386" class="s">Unmasked while the line is still active, a level-triggered interrupt is taken again at once, before any driver has run.</text>
</svg>
