<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>
  <rect class="n" x="20" y="20" width="170" height="44" rx="4"/>
  <text x="105" y="39" class="b c">device</text>
  <text x="105" y="54" class="s c">raises its interrupt line</text>
  <rect class="n" x="20" y="92" width="170" height="44" rx="4"/>
  <text x="105" y="111" class="b c">GICv2</text>
  <text x="105" y="126" class="s c">signals a CPU</text>
  <path class="ln" d="M105,64 L105,92" marker-end="url(#a)"/>
  <rect class="k" x="250" y="92" width="270" height="44" rx="4"/>
  <text x="385.0" y="111" class="b c">exception vector: IRQ</text>
  <text x="385.0" y="126" class="s c">the interrupted thread's registers are saved</text>
  <path class="lnr" d="M190,114 L250,114" marker-end="url(#ar)"/>
  <text x="212" y="108" class="s c red">IRQ</text>
  <rect class="k" x="250" y="160" width="270" height="70" rx="4"/>
  <text x="385.0" y="179" class="b c">interrupt::handle()</text>
  <text x="385.0" y="194" class="s c">for each controller: run its id fragment</text>
  <text x="385.0" y="207" class="s c">(-1: not mine, try the next)</text>
  <text x="385.0" y="220" class="s c">vector = base + cpu × stride + number</text>
  <rect class="k" x="250" y="254" width="270" height="44" rx="4"/>
  <text x="385.0" y="273" class="b c">the kernel's handler for the vector</text>
  <text x="385.0" y="288" class="s c">one function per vector</text>
  <rect class="k" x="250" y="322" width="270" height="44" rx="4"/>
  <text x="385.0" y="341" class="b c">the controller's eoi fragment</text>
  <text x="385.0" y="356" class="s c">end of interrupt</text>
  <rect class="k" x="250" y="390" width="270" height="44" rx="4"/>
  <text x="385.0" y="409" class="b c">sched::preempt()</text>
  <text x="385.0" y="424" class="s c">switch if a handler made a thread ready</text>
  <path class="ln" d="M385.0,136 L385.0,160" marker-end="url(#a)"/>
  <path class="ln" d="M385.0,230 L385.0,254" marker-end="url(#a)"/>
  <path class="ln" d="M385.0,298 L385.0,322" marker-end="url(#a)"/>
  <path class="ln" d="M385.0,366 L385.0,390" marker-end="url(#a)"/>
  <circle cx="236" cy="114" r="9" fill="#333333"/>
  <text x="236" y="118" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <circle cx="236" cy="195" r="9" fill="#333333"/>
  <text x="236" y="199" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <circle cx="236" cy="276" r="9" fill="#333333"/>
  <text x="236" y="280" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <circle cx="236" cy="344" r="9" fill="#333333"/>
  <text x="236" y="348" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <circle cx="236" cy="412" r="9" fill="#333333"/>
  <text x="236" y="416" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <rect class="y" x="20" y="176" width="170" height="84" rx="4"/>
  <text x="105" y="196" class="b c">system page</text>
  <text x="105" y="212" class="s c">per controller: id and eoi</text>
  <text x="105" y="225" class="s c">code fragments, mask and</text>
  <text x="105" y="238" class="s c">unmask callouts</text>
  <rect class="wk" x="20" y="290" width="170" height="76" rx="3"/>
  <text x="105" y="310" class="b c">at boot</text>
  <text x="105" y="326" class="s c">fragments copied into one</text>
  <text x="105" y="339" class="s c">page of kernel code,</text>
  <text x="105" y="352" class="s c">each ended with a return</text>
  <path class="ln" d="M105,260 L105,290" marker-end="url(#a)"/>
  <path class="lnk dash" d="M190,328 L222,328 L222,214 L250,214" marker-end="url(#ak)"/>
  <path class="lnk dash" d="M222,328 L222,358 L250,358" marker-end="url(#ak)"/>
  <rect class="wk" x="580" y="176" width="200" height="40" rx="3"/>
  <text x="680" y="194" class="m c">clock::tick</text>
  <text x="680" y="209" class="s c">each CPU's timer vector</text>
  <rect class="wk" x="580" y="226" width="200" height="40" rx="3"/>
  <text x="680" y="244" class="m c">ipi::handler</text>
  <text x="680" y="259" class="s c">each CPU's IPI vector</text>
  <rect class="wk" x="580" y="276" width="200" height="68" rx="3"/>
  <text x="680" y="294" class="m c">ker::interrupt::irq</text>
  <text x="680" y="309" class="s c">a vector a driver attached to:</text>
  <text x="680" y="322" class="s c">mask it at the controller,</text>
  <text x="680" y="335" class="s c">wake the driver's thread</text>
  <path class="lnk" d="M520,276 L550,276"/>
  <path class="lnk" d="M550,196 L550,310"/>
  <path class="lnk" d="M550,196 L580,196" marker-end="url(#ak)"/>
  <path class="lnk" d="M550,246 L580,246" marker-end="url(#ak)"/>
  <path class="lnk" d="M550,310 L580,310" marker-end="url(#ak)"/>
  <rect class="u" x="580" y="384" width="200" height="66" rx="4"/>
  <text x="680" y="404" class="b c">the driver's interrupt thread</text>
  <text x="680" y="420" class="s c">in its own process:</text>
  <text x="680" y="433" class="s c">InterruptWait() returns</text>
  <path class="lng" d="M680,344 L680,384" marker-end="url(#ag)"/>
  <text x="20" y="400" class="s">Steps 2 to 4 run with interrupts masked,</text>
  <text x="20" y="414" class="s">on the kernel stack of the thread that</text>
  <text x="20" y="428" class="s">was interrupted.</text>
</svg>
