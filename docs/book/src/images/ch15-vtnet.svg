<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
  <rect class="n" x="15" y="14" width="130" height="38" rx="4"/>
  <text x="80" y="30" class="s c b">virtio network</text>
  <text x="80" y="44" class="s c b">device (QEMU)</text>
  <path class="life" d="M80,52 L80,540"/>
  <rect class="n" x="150" y="14" width="130" height="38" rx="4"/>
  <text x="215" y="38" class="b c">GICv2</text>
  <path class="life" d="M215,52 L215,540"/>
  <rect class="k" x="295" y="14" width="130" height="38" rx="4"/>
  <text x="360" y="38" class="b c">kernel</text>
  <path class="life" d="M360,52 L360,540"/>
  <rect class="u" x="475" y="14" width="130" height="38" rx="4"/>
  <text x="540" y="30" class="s c b">netd: the driver's</text>
  <text x="540" y="44" class="s c b">interrupt thread</text>
  <path class="life" d="M540,52 L540,540"/>
  <rect class="u" x="650" y="14" width="130" height="38" rx="4"/>
  <text x="715" y="38" class="b c">pcid</text>
  <path class="life" d="M715,52 L715,540"/>
  <text x="14" y="76" class="h">Setting up, once</text>
  <path class="lnk" d="M540,96 L715,96" marker-end="url(#ak)"/>
  <text x="627.5" y="90" class="s c">ioctl(PCIOCROUTE): where is this device's interrupt?</text>
  <path class="lng dash" d="M715,122 L540,122" marker-end="url(#ag)"/>
  <text x="627.5" y="116" class="s c">vector 32 + n</text>
  <path class="lnk" d="M540,150 L360,150" marker-end="url(#ak)"/>
  <text x="450.0" y="144" class="s c">InterruptAttachThread(vector)</text>
  <path class="ln" d="M360,150 L215,150" marker-end="url(#a)"/>
  <text x="287.5" y="144" class="s c">unmask</text>
  <path class="lnk" d="M540,180 L360,180" marker-end="url(#ak)"/>
  <text x="450.0" y="174" class="s c">InterruptWait(UNMASK)</text>
  <rect class="y" x="475.0" y="190" width="130" height="23" rx="3"/>
  <text x="540" y="205" class="s c">blocked, waiting</text>
  <path class="life" d="M10,232 L790,232"/>
  <text x="14" y="254" class="h">A packet arrives</text>
  <path class="lnr" d="M80,280 L215,280" marker-end="url(#ar)"/>
  <text x="147.5" y="274" class="s c">line active</text>
  <path class="lnr" d="M215,304 L360,304" marker-end="url(#ar)"/>
  <text x="287.5" y="298" class="s c">IRQ</text>
  <rect class="k" x="285.0" y="314" width="150" height="49" rx="3"/>
  <text x="360" y="329" class="s c">irq(): mask the vector,</text>
  <text x="360" y="342" class="s c">wake the thread;</text>
  <text x="360" y="355" class="s c">end of interrupt</text>
  <path class="ln" d="M285,340 L215,340" marker-end="url(#a)"/>
  <text x="250.0" y="334" class="s c">mask</text>
  <path class="lng" d="M360,384 L540,384" marker-end="url(#ag)"/>
  <text x="455" y="378" class="s c">InterruptWait() returns</text>
  <rect class="u" x="465.0" y="396" width="150" height="49" rx="3"/>
  <text x="540" y="411" class="s c">vtpci_intx_intr():</text>
  <text x="540" y="424" class="s c">reads the device's</text>
  <text x="540" y="437" class="s c">interrupt status</text>
  <path class="ln dash" d="M540,456 L80,456" marker-end="url(#a)"/>
  <text x="310.0" y="450" class="s c">reading the status register makes the device drop its line</text>
  <rect class="u" x="465.0" y="468" width="150" height="36" rx="3"/>
  <text x="540" y="483" class="s c">the packets go up</text>
  <text x="540" y="496" class="s c">FreeBSD's network stack</text>
  <path class="lnk" d="M540,524 L360,524" marker-end="url(#ak)"/>
  <text x="450.0" y="518" class="s c">InterruptWait(UNMASK)</text>
  <path class="ln" d="M360,524 L215,524" marker-end="url(#a)"/>
  <text x="287.5" y="518" class="s c">unmask</text>
  <circle cx="22" cy="280" r="9" fill="#333333"/>
  <text x="22" y="284" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <circle cx="22" cy="304" r="9" fill="#333333"/>
  <text x="22" y="308" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <circle cx="22" cy="340" r="9" fill="#333333"/>
  <text x="22" y="344" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <circle cx="22" cy="420" r="9" fill="#333333"/>
  <text x="22" y="424" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <circle cx="22" cy="488" r="9" fill="#333333"/>
  <text x="22" y="492" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <circle cx="22" cy="524" r="9" fill="#333333"/>
  <text x="22" y="528" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">6</text>
</svg>
