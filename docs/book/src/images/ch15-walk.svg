<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="410" fill="#ffffff"/>
  <text x="410" y="24" class="b c">a user virtual address (39 bits)</text>
  <rect class="k" x="100" y="36" width="150" height="44" rx="0"/>
  <text x="175" y="54.5" class="s c">L1 index</text>
  <text x="175" y="69.5" class="ms c">bits 38:30</text>
  <rect class="k" x="250" y="36" width="150" height="44" rx="0"/>
  <text x="325" y="54.5" class="s c">L2 index</text>
  <text x="325" y="69.5" class="ms c">bits 29:21</text>
  <rect class="k" x="400" y="36" width="150" height="44" rx="0"/>
  <text x="475" y="54.5" class="s c">L3 index</text>
  <text x="475" y="69.5" class="ms c">bits 20:12</text>
  <rect class="y" x="550" y="36" width="160" height="44" rx="0"/>
  <text x="630" y="54.5" class="s c">offset</text>
  <text x="630" y="69.5" class="ms c">bits 11:0</text>
  <rect class="w" x="60" y="150" width="150" height="150" rx="0"/>
  <text x="135" y="316" class="s c">level-1 table</text>
  <line x1="60" y1="175" x2="210" y2="175" stroke="#ccc" stroke-width="1"/>
  <line x1="60" y1="200" x2="210" y2="200" stroke="#ccc" stroke-width="1"/>
  <line x1="60" y1="225" x2="210" y2="225" stroke="#ccc" stroke-width="1"/>
  <line x1="60" y1="250" x2="210" y2="250" stroke="#ccc" stroke-width="1"/>
  <line x1="60" y1="275" x2="210" y2="275" stroke="#ccc" stroke-width="1"/>
  <line x1="60" y1="300" x2="210" y2="300" stroke="#ccc" stroke-width="1"/>
  <rect class="g" x="60" y="225" width="150" height="25" rx="0"/>
  <text x="135" y="241.5" class="s c">entry</text>
  <polyline class="ln dash" points="175,80 175,120 135,120 135,223" marker-end="url(#a)"/>
  <polyline class="lnk" points="210,237 248,237 248,152" marker-end="url(#ak)"/>
  <rect class="w" x="250" y="150" width="150" height="150" rx="0"/>
  <text x="325" y="316" class="s c">level-2 table</text>
  <line x1="250" y1="175" x2="400" y2="175" stroke="#ccc" stroke-width="1"/>
  <line x1="250" y1="200" x2="400" y2="200" stroke="#ccc" stroke-width="1"/>
  <line x1="250" y1="225" x2="400" y2="225" stroke="#ccc" stroke-width="1"/>
  <line x1="250" y1="250" x2="400" y2="250" stroke="#ccc" stroke-width="1"/>
  <line x1="250" y1="275" x2="400" y2="275" stroke="#ccc" stroke-width="1"/>
  <line x1="250" y1="300" x2="400" y2="300" stroke="#ccc" stroke-width="1"/>
  <rect class="g" x="250" y="225" width="150" height="25" rx="0"/>
  <text x="325" y="241.5" class="s c">entry</text>
  <polyline class="ln dash" points="325,80 325,120 325,120 325,223" marker-end="url(#a)"/>
  <polyline class="lnk" points="400,237 438,237 438,152" marker-end="url(#ak)"/>
  <rect class="w" x="440" y="150" width="150" height="150" rx="0"/>
  <text x="515" y="316" class="s c">level-3 table</text>
  <line x1="440" y1="175" x2="590" y2="175" stroke="#ccc" stroke-width="1"/>
  <line x1="440" y1="200" x2="590" y2="200" stroke="#ccc" stroke-width="1"/>
  <line x1="440" y1="225" x2="590" y2="225" stroke="#ccc" stroke-width="1"/>
  <line x1="440" y1="250" x2="590" y2="250" stroke="#ccc" stroke-width="1"/>
  <line x1="440" y1="275" x2="590" y2="275" stroke="#ccc" stroke-width="1"/>
  <line x1="440" y1="300" x2="590" y2="300" stroke="#ccc" stroke-width="1"/>
  <rect class="g" x="440" y="225" width="150" height="25" rx="0"/>
  <text x="515" y="241.5" class="s c">entry</text>
  <polyline class="ln dash" points="475,80 475,120 515,120 515,223" marker-end="url(#a)"/>
  <rect class="y" x="20" y="330" width="110" height="28" rx="2"/>
  <text x="75" y="348" class="ms c">TTBR0_EL1</text>
  <polyline class="lnk" points="75,330 75,302" marker-end="url(#ak)"/>
  <rect class="y" x="640" y="150" width="150" height="150" rx="0"/>
  <text x="715" y="316" class="s c">the 4 KiB frame</text>
  <rect class="g" x="640" y="250" width="150" height="20" rx="0"/>
  <text x="715" y="264" class="s c">the byte</text>
  <polyline class="lnk" points="590,237 638,237" marker-end="url(#ak)"/>
  <text x="615" y="230" class="s c">frame</text>
  <polyline class="ln dash" points="630,80 630,120 715,120 715,248" marker-end="url(#a)"/>
  <text x="160" y="380" class="s">Each table is one page of 512 entries; each entry points to the next table, and the last one to the frame.</text>
  <text x="160" y="396" class="s">The TLB caches the result, so most accesses need no walk at all.</text>
</svg>
