<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="140.0" y="26" class="h c">All in the handler</text>
  <text x="140.0" y="42" class="s c">simple kernels, old drivers</text>
  <rect class="frame" x="20" y="54" width="240" height="250" rx="4"/>
  <path class="lnr dash" d="M20,170 L260,170"/>
  <rect class="u" x="40" y="86" width="200" height="44" rx="4"/>
  <text x="140.0" y="105" class="s c">threads wait until the</text>
  <text x="140.0" y="118" class="s c">handler has finished</text>
  <rect class="k" x="40" y="188" width="200" height="100" rx="4"/>
  <text x="140.0" y="212" class="b c">interrupt handler</text>
  <text x="140.0" y="232" class="s c">acknowledge the device,</text>
  <text x="140.0" y="246" class="s c">move the data,</text>
  <text x="140.0" y="260" class="s c">run the protocol</text>
  <text x="400.0" y="26" class="h c">Handler and kernel thread</text>
  <text x="400.0" y="42" class="s c">most monolithic kernels</text>
  <rect class="frame" x="280" y="54" width="240" height="250" rx="4"/>
  <path class="lnr dash" d="M280,170 L520,170"/>
  <rect class="u" x="300" y="86" width="200" height="44" rx="4"/>
  <text x="400.0" y="105" class="s c">threads of higher priority</text>
  <text x="400.0" y="118" class="s c">than the driver's keep running</text>
  <rect class="k" x="290" y="188" width="102" height="100" rx="4"/>
  <text x="341" y="212" class="b c">handler</text>
  <text x="341" y="232" class="s c">quiet the</text>
  <text x="341" y="246" class="s c">device, wake</text>
  <text x="341" y="260" class="s c">the thread</text>
  <rect class="g" x="408" y="188" width="102" height="100" rx="4"/>
  <text x="459" y="212" class="b c">thread</text>
  <text x="459" y="232" class="s c">the real work,</text>
  <text x="459" y="246" class="s c">scheduled by</text>
  <text x="459" y="260" class="s c">priority</text>
  <path class="ln" d="M392,238 L408,238" marker-end="url(#a)"/>
  <text x="660.0" y="26" class="h c">Thread in the driver's process</text>
  <text x="660.0" y="42" class="s c">a microkernel</text>
  <rect class="frame" x="540" y="54" width="240" height="250" rx="4"/>
  <path class="lnr dash" d="M540,170 L780,170"/>
  <rect class="g" x="560" y="66" width="200" height="82" rx="4"/>
  <text x="660.0" y="86" class="b c">driver process: its thread</text>
  <text x="660.0" y="104" class="s c">serves the device through</text>
  <text x="660.0" y="118" class="s c">registers mapped into the process,</text>
  <text x="660.0" y="132" class="s c">scheduled by priority</text>
  <rect class="k" x="560" y="210" width="200" height="62" rx="4"/>
  <text x="660.0" y="232" class="b c">kernel's handler</text>
  <text x="660.0" y="248" class="s c">mask the interrupt, wake the thread</text>
  <path class="ln" d="M660.0,210 L660.0,148" marker-end="url(#a)"/>
  <text x="26" y="166" class="s red">user mode</text>
  <text x="26" y="182" class="s red">kernel mode</text>
  <text x="286" y="166" class="s red">user mode</text>
  <text x="286" y="182" class="s red">kernel mode</text>
  <text x="546" y="166" class="s red">user mode</text>
  <text x="546" y="182" class="s red">kernel mode</text>
  <text x="20" y="326" class="s">From left to right, less and less code runs where it cannot be preempted, and less driver code runs with the kernel's privileges.</text>
  <text x="20" y="341" class="s">In the last design a faulty driver can harm only its own process, and the kernel's handler is the same few steps for every device.</text>
</svg>
