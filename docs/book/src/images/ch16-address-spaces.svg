<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
  <text x="20" y="24" class="h">The upper half: the kernel, the same in every process</text>
  <rect class="n" x="210" y="40" width="300" height="50" rx="2"/>
  <text x="360.0" y="69.0" class="c">linear map of RAM</text>
  <text x="200" y="94" class="ms e">0xffffffc000000000</text>
  <text x="522" y="65.0" class="s">every frame of RAM at this address plus its</text>
  <text x="522" y="78.0" class="s">physical one: virt's RAM is at 0xffffffc040000000</text>
  <text x="360.0" y="106" class="c">⋮</text>
  <rect class="k" x="210" y="112" width="300" height="44" rx="2"/>
  <text x="360.0" y="138.0" class="c">kernel pages: heap, stacks, windows</text>
  <text x="200" y="160" class="ms e">0xffffff8080000000</text>
  <text x="522" y="138.0" class="s">handed out upwards as the kernel needs them</text>
  <rect class="k" x="210" y="156" width="300" height="44" rx="2"/>
  <text x="360.0" y="182.0" class="c">the boot image's programs: the kernel</text>
  <text x="200" y="204" class="ms e">0xffffff8060000000</text>
  <text x="522" y="178.0" class="s">mapped by the startup; the kernel starts</text>
  <text x="522" y="191.0" class="s">1 MiB above</text>
  <rect class="y" x="210" y="200" width="300" height="40" rx="2"/>
  <text x="360.0" y="224.0" class="c">system page, callouts</text>
  <text x="200" y="244" class="ms e">0xffffff8040200000</text>
  <text x="522" y="224.0" class="s">written by the startup</text>
  <rect class="w" x="210" y="240" width="300" height="34" rx="2"/>
  <text x="360.0" y="261.0" class="c">window on the level-2 tables</text>
  <text x="200" y="278" class="ms e">0xffffff8040000000</text>
  <text x="522" y="261.0" class="s">the kernel's own translation tables,</text>
  <rect class="w" x="210" y="274" width="300" height="34" rx="2"/>
  <text x="360.0" y="295.0" class="c">window on the level-3 tables</text>
  <text x="200" y="312" class="ms e">0xffffff8000000000</text>
  <text x="522" y="295.0" class="s">visible as memory (Figure 16.6)</text>
  <text x="20" y="348" class="h">The lower half: one per process</text>
  <text x="200" y="368" class="ms e">0x0000008000000000</text>
  <rect class="u" x="210" y="364" width="300" height="44" rx="2"/>
  <text x="360.0" y="390.0" class="c">mmap() without an address</text>
  <text x="200" y="412" class="ms e">0x0000001000000000</text>
  <text x="522" y="386.0" class="s">512 GiB of addresses in all;</text>
  <text x="522" y="399.0" class="s">new mappings are placed from 64 GiB up</text>
  <text x="360.0" y="424" class="c">⋮</text>
  <rect class="u" x="210" y="430" width="300" height="44" rx="2"/>
  <text x="360.0" y="456.0" class="c">the program and its loader</text>
  <text x="200" y="478" class="ms e">0x0000000000000000</text>
  <text x="522" y="452.0" class="s">placed when the program is loaded</text>
  <text x="522" y="465.0" class="s">(Chapter 19)</text>
  <text x="20" y="494" class="s">Addresses between the two halves are not valid. The upper half translates through one set of tables for the</text>
  <text x="20" y="508" class="s">whole system, the lower half through the tables of the process that is running.</text>
</svg>
