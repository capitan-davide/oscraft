<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <text x="20" y="26" class="h">Backed on demand</text>
  <text x="20" y="42" class="s">the kernel only notes the mapping; a frame is found when a page is first touched</text>
  <path class="ln" d="M20,112 L780,112" marker-end="url(#a)"/>
  <rect class="k" x="40" y="60" width="40" height="36" rx="3"/>
  <text x="60" y="82" class="s c">mmap</text>
  <rect class="g" x="80" y="60" width="130" height="36" rx="3"/>
  <text x="145" y="82" class="s c">program runs</text>
  <rect class="r" x="210" y="60" width="46" height="36" rx="3"/>
  <text x="233" y="82" class="s c">fault</text>
  <rect class="g" x="256" y="60" width="74" height="36" rx="3"/>
  <text x="293.0" y="82" class="s c">runs</text>
  <rect class="r" x="330" y="60" width="46" height="36" rx="3"/>
  <text x="353" y="82" class="s c">fault</text>
  <rect class="g" x="376" y="60" width="104" height="36" rx="3"/>
  <text x="428.0" y="82" class="s c">runs</text>
  <rect class="r" x="480" y="60" width="46" height="36" rx="3"/>
  <text x="503" y="82" class="s c">fault</text>
  <rect class="g" x="526" y="60" width="114" height="36" rx="3"/>
  <text x="583.0" y="82" class="s c">runs</text>
  <rect class="r" x="640" y="60" width="46" height="36" rx="3"/>
  <text x="663" y="82" class="s c">fault</text>
  <rect class="g" x="686" y="60" width="84" height="36" rx="3"/>
  <text x="728" y="82" class="s c">runs</text>
  <text x="233" y="128" class="s c">first touch</text>
  <text x="353" y="128" class="s c">first touch</text>
  <text x="503" y="128" class="s c">first touch</text>
  <text x="663" y="128" class="s c red">first touch: and if no frame is free now?</text>
  <text x="20" y="186" class="h">Backed when mapped</text>
  <text x="20" y="202" class="s">every page has its frame before mmap() returns, or mmap() fails</text>
  <path class="ln" d="M20,272 L780,272" marker-end="url(#a)"/>
  <rect class="k" x="40" y="220" width="200" height="36" rx="3"/>
  <text x="140" y="236" class="s c">mmap: allocate and</text>
  <text x="140" y="249" class="s c">fill every page</text>
  <rect class="g" x="240" y="220" width="530" height="36" rx="3"/>
  <text x="505" y="242" class="s c">program runs: no fault, at any time</text>
  <text x="40" y="288" class="s">the whole cost, at a moment the program chose</text>
  <text x="770" y="310" class="s e">time</text>
</svg>
