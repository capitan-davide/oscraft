<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
  <text x="20" y="24" class="h">Physical addresses of QEMU's virt</text>
  <rect class="w" x="20" y="36" width="70" height="40" rx="2"/>
  <text x="55" y="60" class="s c">...</text>
  <rect class="n" x="90" y="36" width="70" height="40" rx="2"/>
  <text x="125" y="60" class="s c">GIC</text>
  <rect class="n" x="160" y="36" width="70" height="40" rx="2"/>
  <text x="195" y="60" class="s c">UART</text>
  <rect class="w" x="230" y="36" width="90" height="40" rx="2"/>
  <text x="275" y="60" class="s c">other devices</text>
  <rect class="g" x="320" y="36" width="400" height="40" rx="2"/>
  <text x="520" y="60" class="b c">RAM, 2 GiB</text>
  <rect class="w" x="720" y="36" width="60" height="40" rx="2"/>
  <text x="750" y="60" class="s c">...</text>
  <path class="ln" d="M90,76 L90,84"/>
  <text x="90" y="96" class="ms c">0x08000000</text>
  <path class="ln" d="M160,76 L160,84"/>
  <text x="160" y="96" class="ms c">0x09000000</text>
  <path class="ln" d="M320,76 L320,84"/>
  <text x="320" y="96" class="ms c">0x40000000</text>
  <path class="ln" d="M720,76 L720,84"/>
  <text x="720" y="96" class="ms c">0xC0000000</text>
  <text x="20" y="122" class="h">The RAM: what was free at boot is the allocator's (not to scale)</text>
  <rect class="n" x="20" y="132" width="110" height="44" rx="2"/>
  <text x="75.0" y="152" class="s c">boot image,</text>
  <text x="75.0" y="165" class="s c">kernel, startup</text>
  <rect class="g" x="130" y="132" width="250" height="44" rx="2"/>
  <rect class="n" x="380" y="132" width="30" height="44" rx="2"/>
  <rect class="g" x="410" y="132" width="130" height="44" rx="2"/>
  <text x="475.0" y="159" class="s c">free range 2</text>
  <rect class="n" x="540" y="132" width="30" height="44" rx="2"/>
  <rect class="g" x="570" y="132" width="210" height="44" rx="2"/>
  <text x="675.0" y="159" class="s c">free range 3</text>
  <rect class="u" x="130" y="132" width="120" height="44" rx="2"/>
  <text x="190" y="152" class="s c">range 1: handed</text>
  <text x="190" y="165" class="s c">out since boot</text>
  <text x="315" y="152" class="s c">range 1:</text>
  <text x="315" y="165" class="s c">never used yet</text>
  <path class="lnk" d="M250,206 L250,178" marker-end="url(#ak)"/>
  <text x="250" y="220" class="s c">next: fresh frames are taken in order</text>
  <text x="475" y="194" class="s c">in use: not the</text>
  <text x="475" y="207" class="s c">allocator's</text>
  <path class="life" d="M395,176 L440,184"/>
  <path class="life" d="M555,176 L510,184"/>
  <text x="20" y="258" class="h">What the allocator keeps</text>
  <rect class="y" x="20" y="270" width="240" height="92" rx="4"/>
  <text x="140" y="290" class="b c">stack of freed frames</text>
  <text x="140" y="307" class="s c">a frame given back is pushed here</text>
  <text x="140" y="321" class="s c">and is the first to be handed out;</text>
  <text x="140" y="335" class="s c">room for every frame from the start</text>
  <rect class="y" x="280" y="270" width="240" height="92" rx="4"/>
  <text x="400" y="290" class="b c">bitmap: one bit per frame</text>
  <text x="400" y="307" class="s c">set while the frame is free; searched</text>
  <text x="400" y="321" class="s c">for runs of adjacent frames</text>
  <text x="400" y="335" class="s c">(contiguous memory for devices)</text>
  <rect class="y" x="540" y="270" width="240" height="92" rx="4"/>
  <text x="660" y="290" class="b c">share counts</text>
  <text x="660" y="307" class="s c">extra mappings of a frame after</text>
  <text x="660" y="321" class="s c">a copy-on-write fork(); the frame is</text>
  <text x="660" y="335" class="s c">free when the last one goes</text>
  <rect class="r" x="20" y="378" width="760" height="36" rx="3"/>
  <text x="400" y="400" class="s c">the kernel's reserve: the last 16 MiB of free frames are never given to a process, which gets ENOMEM instead</text>
</svg>
