<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="130" y="24" class="h c">A process's memory map</text>
  <text x="520" y="24" class="h c">What stands behind each region</text>
  <rect class="y" x="20" y="40" width="220" height="50" rx="3"/>
  <text x="130" y="62" class="c">shared memory object</text>
  <text x="130" y="78" class="s c">read, write; shared</text>
  <path class="ln" d="M240,65 L300,65" marker-end="url(#a)"/>
  <rect class="y" x="300" y="40" width="480" height="50" rx="3"/>
  <text x="312" y="62" class="b">the object's frames</text>
  <text x="312" y="78" class="s">allocated when the object was sized; another process maps the same ones</text>
  <rect class="n" x="20" y="100" width="220" height="50" rx="3"/>
  <text x="130" y="122" class="c">device registers</text>
  <text x="130" y="138" class="s c">read, write; uncached</text>
  <path class="ln" d="M240,125 L300,125" marker-end="url(#a)"/>
  <rect class="n" x="300" y="100" width="480" height="50" rx="3"/>
  <text x="312" y="122" class="b">the device, not RAM</text>
  <text x="312" y="138" class="s">physical addresses outside the kernel's memory; never freed</text>
  <rect class="w" x="20" y="160" width="220" height="50" rx="3"/>
  <text x="130" y="182" class="c">reservation</text>
  <text x="130" y="198" class="s c">no access</text>
  <path class="life" d="M240,185 L300,185" marker-end="url(#a)"/>
  <rect class="w" x="300" y="160" width="480" height="50" rx="3"/>
  <text x="312" y="182" class="b">nothing</text>
  <text x="312" y="198" class="s">addresses kept, no frames until mprotect() makes them accessible</text>
  <rect class="u" x="20" y="220" width="220" height="50" rx="3"/>
  <text x="130" y="242" class="c">heap, stack, anonymous memory</text>
  <text x="130" y="258" class="s c">read, write; private</text>
  <path class="ln" d="M240,245 L300,245" marker-end="url(#a)"/>
  <rect class="u" x="300" y="220" width="480" height="50" rx="3"/>
  <text x="312" y="242" class="b">the process's own frames</text>
  <text x="312" y="258" class="s">allocated and zeroed when mapped</text>
  <rect class="u" x="20" y="280" width="220" height="50" rx="3"/>
  <text x="130" y="302" class="c">program data</text>
  <text x="130" y="318" class="s c">read, write; private</text>
  <path class="ln" d="M240,305 L300,305" marker-end="url(#a)"/>
  <rect class="u" x="300" y="280" width="480" height="50" rx="3"/>
  <text x="312" y="302" class="b">the process's own frames</text>
  <text x="312" y="318" class="s">allocated when mapped and filled from the file</text>
  <rect class="g" x="20" y="340" width="220" height="50" rx="3"/>
  <text x="130" y="362" class="c">program code</text>
  <text x="130" y="378" class="s c">read, execute</text>
  <path class="ln" d="M240,365 L300,365" marker-end="url(#a)"/>
  <rect class="g" x="300" y="340" width="480" height="50" rx="3"/>
  <text x="312" y="362" class="b">the boot image's own pages</text>
  <text x="312" y="378" class="s">mapped in place, read-only; the same frames in every process running it</text>
  <path class="ln" d="M10,392 L10,44" marker-end="url(#a)"/>
  <text x="22" y="416" class="s">addresses grow upwards; regions never overlap, and each records its permissions, its kind and how it was mapped</text>
</svg>
