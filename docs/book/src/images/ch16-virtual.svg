<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="105" y="26" class="h c">Process A's addresses</text>
  <rect class="frame" x="20" y="36" width="170" height="330" rx="4"/>
  <rect class="k" x="35" y="50" width="140" height="30" rx="3"/>
  <text x="105" y="69" class="s c">the kernel</text>
  <rect class="u" x="35" y="120" width="140" height="30" rx="3"/>
  <text x="105" y="139" class="s c">stack</text>
  <rect class="w" x="35" y="170" width="140" height="30" rx="3"/>
  <text x="105" y="189" class="s c">nothing mapped</text>
  <rect class="y" x="35" y="220" width="140" height="30" rx="3"/>
  <text x="105" y="239" class="s c">shared buffer</text>
  <rect class="u" x="35" y="270" width="140" height="30" rx="3"/>
  <text x="105" y="289" class="s c">data</text>
  <rect class="u" x="35" y="320" width="140" height="30" rx="3"/>
  <text x="105" y="339" class="s c">code</text>
  <text x="695" y="26" class="h c">Process B's addresses</text>
  <rect class="frame" x="610" y="36" width="170" height="330" rx="4"/>
  <rect class="k" x="625" y="50" width="140" height="30" rx="3"/>
  <text x="695" y="69" class="s c">the kernel</text>
  <rect class="u" x="625" y="120" width="140" height="30" rx="3"/>
  <text x="695" y="139" class="s c">stack</text>
  <rect class="y" x="625" y="170" width="140" height="30" rx="3"/>
  <text x="695" y="189" class="s c">shared buffer</text>
  <rect class="w" x="625" y="220" width="140" height="30" rx="3"/>
  <text x="695" y="239" class="s c">nothing mapped</text>
  <rect class="u" x="625" y="270" width="140" height="30" rx="3"/>
  <text x="695" y="289" class="s c">data</text>
  <rect class="u" x="625" y="320" width="140" height="30" rx="3"/>
  <text x="695" y="339" class="s c">code</text>
  <text x="400" y="26" class="h c">Physical memory: frames</text>
  <rect class="k" x="340" y="40" width="120" height="30" rx="2"/>
  <text x="400" y="59" class="s c">kernel</text>
  <rect class="u" x="340" y="76" width="120" height="30" rx="2"/>
  <text x="400" y="95" class="s c">A</text>
  <rect class="u" x="340" y="112" width="120" height="30" rx="2"/>
  <text x="400" y="131" class="s c">B</text>
  <rect class="y" x="340" y="148" width="120" height="30" rx="2"/>
  <text x="400" y="167" class="s c">shared</text>
  <rect class="u" x="340" y="184" width="120" height="30" rx="2"/>
  <text x="400" y="203" class="s c">A</text>
  <rect class="w" x="340" y="220" width="120" height="30" rx="2"/>
  <text x="400" y="239" class="s c">free</text>
  <rect class="u" x="340" y="256" width="120" height="30" rx="2"/>
  <text x="400" y="275" class="s c">B</text>
  <rect class="g" x="340" y="292" width="120" height="30" rx="2"/>
  <text x="400" y="311" class="s c">program file</text>
  <rect class="w" x="340" y="328" width="120" height="30" rx="2"/>
  <text x="400" y="347" class="s c">free</text>
  <path class="lnk" d="M175,65 L340,55" marker-end="url(#ak)"/>
  <path class="lnk" d="M625,65 L460,55" marker-end="url(#ak)"/>
  <path class="ln" d="M175,135 L340,91" marker-end="url(#a)"/>
  <path class="ln" d="M175,285 L340,199" marker-end="url(#a)"/>
  <path class="lng" d="M175,235 L340,163" marker-end="url(#ag)"/>
  <path class="ln" d="M175,335 L340,307" marker-end="url(#a)"/>
  <path class="ln" d="M625,135 L460,271" marker-end="url(#a)"/>
  <path class="ln" d="M625,285 L460,127" marker-end="url(#a)"/>
  <path class="lng" d="M625,185 L460,163" marker-end="url(#ag)"/>
  <path class="ln" d="M625,335 L460,307" marker-end="url(#a)"/>
  <text x="400" y="382" class="s c">The same address means different frames in A and in B. A frame is shared only where both have it mapped.</text>
</svg>
