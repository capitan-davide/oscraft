  <rect class="w" x="432" y="150" width="78" height="24" rx="2"/>
  <rect class="y" x="402" y="182" width="30" height="24" rx="2"/>
  <text x="417" y="199" class="m c">3</text>
  <rect class="w" x="432" y="182" width="78" height="24" rx="2"/>
  <rect class="y" x="402" y="214" width="30" height="24" rx="2"/>
