  <path class="lnk" d="M510,194 L566,194 L566,216 L618,216" marker-end="url(#ak)"/>
  <text x="471" y="230" class="s c">free</text>
  <text x="400" y="326" class="s c">Threads share everything in the box. Another process can reach none of it, except through the kernel.</text>
