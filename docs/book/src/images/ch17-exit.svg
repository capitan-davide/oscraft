<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="490" fill="#ffffff"/>
  <rect class="u" x="5" y="14" width="150" height="30" rx="4"/>
  <text x="80" y="34" class="c">parent</text>
  <path class="life" d="M80,44 L80,472"/>
  <rect class="r" x="215" y="14" width="150" height="30" rx="4"/>
  <text x="290" y="34" class="c">the ending process</text>
  <path class="life" d="M290,44 L290,472"/>
  <rect class="k" x="425" y="14" width="150" height="30" rx="4"/>
  <text x="500" y="34" class="c">process 1</text>
  <path class="life" d="M500,44 L500,472"/>
  <rect class="u" x="625" y="14" width="150" height="30" rx="4"/>
  <text x="700" y="34" class="c">servers and clients</text>
  <path class="life" d="M700,44 L700,472"/>
  <rect class="y" x="195.0" y="54" width="190" height="38" rx="3"/>
  <text x="290" y="69" class="s c">_exit() or a fatal signal:</text>
  <text x="290" y="83" class="s c">every thread is told to end</text>
  <rect class="r" x="195.0" y="100" width="190" height="38" rx="3"/>
  <text x="290" y="115" class="s c">the last thread ends:</text>
  <text x="290" y="129" class="s c">the process is a zombie</text>
  <rect class="y" x="15.0" y="100" width="130" height="38" rx="3"/>
  <text x="80" y="115" class="s c">may be blocked</text>
  <text x="80" y="129" class="s c">in wait()</text>
  <path class="ln" d="M290,168 L82,168" marker-end="url(#a)"/>
  <circle cx="274" cy="156" r="9" fill="#333333"/>
  <text x="274" y="160" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="260" y="160" class="s e">SIGCHLD; its CPU time</text>
  <circle cx="190" cy="203" r="9" fill="#333333"/>
  <text x="190" y="207" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <rect class="w" x="213.0" y="184" width="170" height="38" rx="3"/>
  <text x="298" y="199" class="s c">timers and interrupt</text>
  <text x="298" y="213" class="s c">attachments removed</text>
  <path class="lnk" d="M290,250 L498,250" marker-end="url(#ak)"/>
  <circle cx="310" cy="238" r="9" fill="#2c5d9b"/>
  <text x="310" y="242" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="324" y="242" class="s">pulse: process ended</text>
  <path class="ln" d="M290,284 L698,284" marker-end="url(#a)"/>
  <circle cx="310" cy="272" r="9" fill="#333333"/>
  <text x="310" y="276" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="324" y="276" class="s">connections close: each server gets a disconnect pulse</text>
  <path class="lnr" d="M290,318 L698,318" marker-end="url(#ar)"/>
  <circle cx="310" cy="306" r="9" fill="#aa2222"/>
  <text x="310" y="310" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="324" y="310" class="s">channels destroyed: blocked clients fail with ESRCH</text>
  <path class="lnr" d="M260,334 L320,334"/>
  <text x="290" y="350" class="s c red">no thread left</text>
  <rect class="wk" x="400.0" y="340" width="200" height="52" rx="3"/>
  <text x="500" y="355" class="s c">frees its memory and page tables,</text>
  <text x="500" y="369" class="s c">open files, registered names,</text>
  <text x="500" y="383" class="s c">its session's terminal</text>
  <rect class="wk" x="400.0" y="404" width="200" height="52" rx="3"/>
  <text x="500" y="419" class="s c">answers a held wait, removes</text>
  <text x="500" y="433" class="s c">the zombie (its slot is free),</text>
  <text x="500" y="447" class="s c">adopts its children</text>
  <path class="lng" d="M400,430 L82,430" marker-end="url(#ag)"/>
  <text x="240" y="422" class="s c">wait() returns the exit status</text>
</svg>
