<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>
  <rect class="k" x="20" y="60" width="150" height="96" rx="4"/>
  <text x="95.0" y="82" class="h c">created</text>
  <text x="95.0" y="104" class="s c">an ID, an empty</text>
  <text x="95.0" y="119" class="s c">address space,</text>
  <text x="95.0" y="134" class="s c">inherited handles</text>
  <rect class="g" x="215" y="60" width="150" height="96" rx="4"/>
  <text x="290.0" y="82" class="h c">running</text>
  <text x="290.0" y="104" class="s c">memory, threads,</text>
  <text x="290.0" y="119" class="s c">handles, timers:</text>
  <text x="290.0" y="134" class="s c">everything</text>
  <rect class="r" x="455" y="60" width="150" height="96" rx="4"/>
  <text x="530.0" y="82" class="h c">zombie</text>
  <text x="530.0" y="104" class="s c">an ID and an</text>
  <text x="530.0" y="119" class="s c">exit status;</text>
  <text x="530.0" y="134" class="s c">nothing else</text>
  <rect class="n" x="680" y="60" width="110" height="96" rx="4"/>
  <text x="735.0" y="82" class="h c">gone</text>
  <text x="735.0" y="104" class="s c">the ID may</text>
  <text x="735.0" y="119" class="s c">be given to</text>
  <text x="735.0" y="134" class="s c">another process</text>
  <path class="ln" d="M170,108 L213,108" marker-end="url(#a)"/>
  <text x="192" y="98" class="s c">first</text>
  <text x="192" y="126" class="s c">thread</text>
  <path class="ln" d="M365,96 L453,96" marker-end="url(#a)"/>
  <text x="409" y="74" class="s c">exit(), or a</text>
  <text x="409" y="88" class="s c">fatal signal</text>
  <text x="409" y="116" class="s c">last thread</text>
  <text x="409" y="130" class="s c">ends</text>
  <path class="ln" d="M605,108 L678,108" marker-end="url(#a)"/>
  <text x="642" y="98" class="s c">parent's</text>
  <text x="642" y="126" class="s c">wait()</text>
  <rect class="y" x="215" y="214" width="150" height="50" rx="4"/>
  <text x="290" y="236" class="h c">stopped</text>
  <text x="290" y="252" class="s c">no thread runs</text>
  <path class="ln" d="M260,156 L260,212" marker-end="url(#a)"/>
  <text x="254" y="190" class="s e">SIGSTOP</text>
  <path class="ln" d="M320,214 L320,158" marker-end="url(#a)"/>
  <text x="326" y="190" class="s">SIGCONT</text>
  <path class="lnr" d="M455,180 L605,180"/>
  <path class="lnr" d="M455,174 L455,186"/>
  <path class="lnr" d="M605,174 L605,186"/>
  <text x="530" y="200" class="s c">memory freed, handles closed,</text>
  <text x="530" y="214" class="s c">parent notified (SIGCHLD)</text>
</svg>
