<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
  <rect class="u" x="10" y="14" width="130" height="30" rx="4"/>
  <text x="70" y="34" class="s c">a program, user 1001</text>
  <rect class="g" x="180" y="14" width="400" height="30" rx="4"/>
  <text x="380" y="34" class="c">netd</text>
  <rect class="k" x="640" y="14" width="140" height="30" rx="4"/>
  <text x="710" y="34" class="c">kernel</text>
  <path class="life" d="M70,44 L70,410"/>
  <path class="life" d="M710,44 L710,410"/>
  <rect class="wk" x="180" y="56" width="190" height="354" rx="3"/>
  <text x="275" y="74" class="b c">bsdkern's privilege.rs</text>
  <rect class="g" x="390" y="56" width="190" height="354" rx="3"/>
  <text x="485" y="74" class="b c">FreeBSD's network code</text>
  <rect class="w" x="190.0" y="86" width="170" height="38" rx="3"/>
  <text x="275" y="101" class="s c">at start: creates the ability</text>
  <text x="275" y="115" class="s c">network/privport by name</text>
  <path class="lnk dash" d="M360,105 L708,105" marker-end="url(#ak)"/>
  <text x="610" y="99" class="s c">process 1 gives it an ID</text>
  <path class="ln" d="M70,152 L178,152" marker-end="url(#a)"/>
  <circle cx="84" cy="140" r="9" fill="#333333"/>
  <text x="84" y="144" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="98" y="144" class="s">bind(), port 80</text>
  <rect class="w" x="190.0" y="162" width="170" height="38" rx="3"/>
  <text x="275" y="177" class="s c">this thread now works</text>
  <text x="275" y="191" class="s c">for that client</text>
  <path class="ln" d="M360,181 L398,181" marker-end="url(#a)"/>
  <circle cx="380" cy="168" r="9" fill="#333333"/>
  <text x="380" y="172" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <rect class="w" x="400.0" y="162" width="170" height="38" rx="3"/>
  <text x="485" y="177" class="s c">in_pcbbind(): a port below</text>
  <text x="485" y="191" class="s c">1024 needs a privilege</text>
  <rect class="w" x="400.0" y="210" width="170" height="38" rx="3"/>
  <text x="485" y="225" class="ms c">priv_check(td, PRIV_</text>
  <text x="485" y="239" class="ms c">NETINET_RESERVEDPORT)</text>
  <path class="lng" d="M400,229 L362,229" marker-end="url(#ag)"/>
  <circle cx="380" cy="216" r="9" fill="#3e7b34"/>
  <text x="380" y="220" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <rect class="w" x="190.0" y="210" width="170" height="38" rx="3"/>
  <text x="275" y="225" class="s c">its table: that privilege</text>
  <text x="275" y="239" class="s c">is network/privport</text>
  <path class="lnk" d="M275,248 L275,272 L708,272" marker-end="url(#ak)"/>
  <circle cx="600" cy="260" r="9" fill="#2c5d9b"/>
  <text x="600" y="264" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="590" y="266" class="s e">ConnectClientInfoAble(client, ability)</text>
  <rect class="wk" x="642.0" y="282" width="136" height="52" rx="3"/>
  <text x="710" y="297" class="s c">the client's abilities:</text>
  <text x="710" y="311" class="s c">not root, not</text>
  <text x="710" y="325" class="s c">granted: no</text>
  <path class="lnr dash" d="M642,320 L315,320 L315,338" marker-end="url(#ar)"/>
  <circle cx="600" cy="308" r="9" fill="#aa2222"/>
  <text x="600" y="312" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="590" y="314" class="s e">not held</text>
  <rect class="w" x="190.0" y="340" width="170" height="24" rx="3"/>
  <text x="275" y="355" class="s c">priv_check() returns EPERM</text>
  <path class="lnr" d="M360,352 L398,352" marker-end="url(#ar)"/>
  <rect class="w" x="400.0" y="340" width="170" height="24" rx="3"/>
  <text x="485" y="355" class="s c">bind fails: EACCES</text>
  <path class="lnr" d="M400,384 L72,384" marker-end="url(#ar)"/>
  <text x="125" y="378" class="s c red">EACCES</text>
</svg>
