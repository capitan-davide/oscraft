<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <text x="205" y="26" class="h c">One privilege: the superuser</text>
  <text x="205" y="42" class="s c">the driver must run as root to do two things</text>
  <rect class="u" x="20" y="56" width="110" height="60" rx="4"/>
  <text x="75" y="82" class="c">network</text>
  <text x="75" y="98" class="c">driver</text>
  <rect class="g" x="170" y="56" width="220" height="26" rx="3"/>
  <text x="180" y="73" class="s">receive its interrupt</text>
  <text x="384" y="73" class="s e green">needed</text>
  <path class="lng" d="M130,86 L150,86 L150,69 L168,69" marker-end="url(#ag)"/>
  <rect class="g" x="170" y="90" width="220" height="26" rx="3"/>
  <text x="180" y="107" class="s">map its device's registers</text>
  <text x="384" y="107" class="s e green">needed</text>
  <path class="lng" d="M130,86 L150,86 L150,103 L168,103" marker-end="url(#ag)"/>
  <rect class="r" x="170" y="124" width="220" height="26" rx="3"/>
  <text x="180" y="141" class="s">open any file</text>
  <text x="384" y="141" class="s e red">also held</text>
  <path class="lnr" d="M130,86 L150,86 L150,137 L168,137" marker-end="url(#ar)"/>
  <rect class="r" x="170" y="158" width="220" height="26" rx="3"/>
  <text x="180" y="175" class="s">kill any process</text>
  <text x="384" y="175" class="s e red">also held</text>
  <path class="lnr" d="M130,86 L150,86 L150,171 L168,171" marker-end="url(#ar)"/>
  <rect class="r" x="170" y="192" width="220" height="26" rx="3"/>
  <text x="180" y="209" class="s">set the clock</text>
  <text x="384" y="209" class="s e red">also held</text>
  <path class="lnr" d="M130,86 L150,86 L150,205 L168,205" marker-end="url(#ar)"/>
  <rect class="r" x="170" y="226" width="220" height="26" rx="3"/>
  <text x="180" y="243" class="s">map any physical memory</text>
  <text x="384" y="243" class="s e red">also held</text>
  <path class="lnr" d="M130,86 L150,86 L150,239 L168,239" marker-end="url(#ar)"/>
  <rect class="r" x="170" y="260" width="220" height="26" rx="3"/>
  <text x="180" y="277" class="s">become any user</text>
  <text x="384" y="277" class="s e red">also held</text>
  <path class="lnr" d="M130,86 L150,86 L150,273 L168,273" marker-end="url(#ar)"/>
  <text x="75" y="150" class="s c red">a bug here</text>
  <text x="75" y="164" class="s c red">can misuse</text>
  <text x="75" y="178" class="s c red">everything</text>
  <path class="life" d="M400,16 L400,300"/>
  <text x="605" y="26" class="h c">One privilege per kind of operation</text>
  <text x="605" y="42" class="s c">the driver is given the two it needs</text>
  <rect class="u" x="420" y="56" width="110" height="60" rx="4"/>
  <text x="475" y="82" class="c">network</text>
  <text x="475" y="98" class="c">driver</text>
  <rect class="g" x="570" y="56" width="220" height="26" rx="3"/>
  <text x="580" y="73" class="s">receive its interrupt</text>
  <text x="784" y="73" class="s e green">needed</text>
  <path class="lng" d="M530,86 L550,86 L550,69 L568,69" marker-end="url(#ag)"/>
  <rect class="g" x="570" y="90" width="220" height="26" rx="3"/>
  <text x="580" y="107" class="s">map its device's registers</text>
  <text x="784" y="107" class="s e green">needed</text>
  <path class="lng" d="M530,86 L550,86 L550,103 L568,103" marker-end="url(#ag)"/>
  <rect class="n" x="570" y="124" width="220" height="26" rx="3"/>
  <text x="580" y="141" class="s">open any file</text>
  <text x="784" y="141" class="s e ">not held</text>
  <rect class="n" x="570" y="158" width="220" height="26" rx="3"/>
  <text x="580" y="175" class="s">kill any process</text>
  <text x="784" y="175" class="s e ">not held</text>
  <rect class="n" x="570" y="192" width="220" height="26" rx="3"/>
  <text x="580" y="209" class="s">set the clock</text>
  <text x="784" y="209" class="s e ">not held</text>
  <rect class="n" x="570" y="226" width="220" height="26" rx="3"/>
  <text x="580" y="243" class="s">map any physical memory</text>
  <text x="784" y="243" class="s e ">not held</text>
  <rect class="n" x="570" y="260" width="220" height="26" rx="3"/>
  <text x="580" y="277" class="s">become any user</text>
  <text x="784" y="277" class="s e ">not held</text>
  <text x="475" y="150" class="s c">a bug here</text>
  <text x="475" y="164" class="s c">can misuse</text>
  <text x="475" y="178" class="s c">two things</text>
</svg>
