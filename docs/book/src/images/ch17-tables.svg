  <text x="84" y="198" class="m c">28681</text>
  <rect class="y" x="116" y="182" width="64" height="24" rx="2"/>
  <text x="148" y="198" class="s c">sh</text>
  <rect class="w" x="20" y="236" width="160" height="86" rx="4"/>
