  <text x="268" y="245" class="ms c">0</text>
  <rect class="y" x="286" y="230" width="36" height="22" rx="2"/>
  <text x="304" y="245" class="ms c">1</text>
  <rect class="y" x="322" y="230" width="36" height="22" rx="2"/>
