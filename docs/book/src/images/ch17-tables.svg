  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="100" y="24" class="h c">the process table</text>
  <text x="100" y="40" class="s c">in slot order</text>
  <text x="36" y="62" class="s c">slot</text>
  <text x="84" y="62" class="s c">ID</text>
  <text x="146" y="62" class="s c">program</text>
