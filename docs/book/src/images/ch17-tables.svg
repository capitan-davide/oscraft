  <rect class="k" x="34" y="264" width="76" height="22" rx="2"/>
  <text x="72" y="279" class="m c">0x7000</text>
  <rect class="y" x="110" y="264" width="56" height="22" rx="2"/>
  <text x="138" y="279" class="m c">009</text>
  <text x="72" y="300" class="s c">generation</text>
  <text x="138" y="300" class="s c">slot</text>
  <text x="100" y="314" class="s c">bits 12 and up | bits 0-11</text>
  <rect class="k" x="230" y="14" width="250" height="322" rx="4"/>
  <text x="355" y="34" class="h c">Process (sh)</text>
  <path class="lnk" d="M180,194 L228,194" marker-end="url(#ak)"/>
  <rect class="wk" x="242" y="46" width="226" height="32" rx="3"/>
  <text x="250" y="60" class="b">identity</text>
  <text x="250" y="73" class="s">pid, ppid, pgid, sid, cred, personality</text>
  <rect class="wk" x="242" y="84" width="226" height="32" rx="3"/>
  <text x="250" y="98" class="b">memory</text>
  <text x="250" y="111" class="s">aspace (page tables), mem (regions)</text>
  <rect class="wk" x="242" y="122" width="226" height="32" rx="3"/>
  <text x="250" y="136" class="b">signals, limits, abilities</text>
  <text x="250" y="149" class="s">each under its own lock</text>
  <text x="250" y="172" class="b">channels[ ]   none: sh serves nobody</text>
  <rect class="w" x="250" y="178" width="36" height="22" rx="2"/>
  <text x="268" y="193" class="ms c">-</text>
