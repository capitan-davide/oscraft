  <text x="412" y="297" class="ms c"></text>
  <rect class="w" x="430" y="282" width="36" height="22" rx="2"/>
  <text x="448" y="297" class="ms c"></text>
  <text x="355" y="326" class="s c">an entry takes the lowest free index</text>
  <rect class="k" x="560" y="14" width="220" height="78" rx="4"/>
  <text x="670" y="32" class="h c">process 1</text>
  <rect class="wk" x="574" y="42" width="192" height="20" rx="3"/>
  <text x="670" y="56" class="s c">channel 1: system manager</text>
  <rect class="wk" x="574" y="66" width="192" height="20" rx="3"/>
  <text x="670" y="80" class="s c">channel 2: console</text>
  <rect class="u" x="560" y="110" width="220" height="52" rx="4"/>
  <text x="670" y="128" class="h c">tmpfs</text>
  <rect class="wu" x="574" y="136" width="192" height="20" rx="3"/>
  <text x="670" y="150" class="s c">channel 1: files under /tmp</text>
  <path class="ln" d="M268,252 L268,258 L500,258 L500,76 L572,76" marker-end="url(#a)"/>
  <path class="ln" d="M376,252 L376,262 L540,262 L540,146 L572,146" marker-end="url(#a)"/>
  <path class="ln" d="M268,304 L268,312 L490,312 L490,52 L572,52" marker-end="url(#a)"/>
  <text x="670" y="200" class="s c">A connection holds its channel.</text>
  <text x="670" y="215" class="s c">A channel names its owner by</text>
  <text x="670" y="230" class="s c">process ID only, so it never</text>
  <text x="670" y="245" class="s c">keeps a process alive.</text>
  <rect class="n" x="20" y="356" width="760" height="68" rx="4"/>
  <text x="34" y="374" class="b">kernel-wide tables, entries marked with their process</text>
  <rect class="w" x="34" y="382" width="228" height="34" rx="3"/>
  <text x="44" y="396" class="b">threads</text>
  <text x="44" y="410" class="s">each holds a counted reference to its Process</text>
  <rect class="w" x="300" y="382" width="228" height="34" rx="3"/>
  <text x="310" y="396" class="b">timers</text>
  <text x="310" y="410" class="s">removed when the process ends</text>
  <rect class="w" x="540" y="382" width="226" height="34" rx="3"/>
  <text x="550" y="396" class="b">interrupt attachments</text>
  <text x="550" y="410" class="s">detached when the process ends</text>
