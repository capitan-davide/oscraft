<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <rect class="u" x="15.0" y="14" width="130" height="30" rx="4"/>
  <text x="80" y="34" class="c">parent</text>
  <path class="life" d="M80,44 L80,424"/>
  <rect class="k" x="225.0" y="14" width="170" height="30" rx="4"/>
  <text x="310" y="34" class="c">process 1 (sysmgr)</text>
  <path class="life" d="M310,44 L310,424"/>
  <rect class="u" x="465.0" y="14" width="130" height="30" rx="4"/>
  <text x="530" y="34" class="c">child</text>
  <path class="life" d="M530,44 L530,424"/>
  <rect class="u" x="680.0" y="14" width="100" height="30" rx="4"/>
  <text x="730" y="34" class="c">tmpfs</text>
  <path class="life" d="M730,44 L730,424"/>
  <path class="lnk" d="M80,70 L308,70" marker-end="url(#ak)"/>
  <circle cx="96" cy="58" r="9" fill="#2c5d9b"/>
  <text x="96" y="62" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="110" y="62" class="s">fork request</text>
  <rect class="y" x="35" y="76" width="90" height="290" rx="3"/>
  <text x="80" y="200" class="s c">REPLY-</text>
  <text x="80" y="213" class="s c">blocked</text>
  <text x="80" y="236" class="s c">its registers</text>
  <text x="80" y="249" class="s c">are saved</text>
  <rect class="wk" x="200" y="80" width="220" height="104" rx="3"/>
  <circle cx="186" cy="132" r="9" fill="#333333"/>
  <text x="186" y="136" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="310" y="98" class="s c">a new process: copies of the</text>
  <text x="310" y="112" class="s c">descriptors, credentials, signals</text>
  <text x="310" y="126" class="s c">copy the memory</text>
  <text x="310" y="140" class="s c">note: answer the parent later</text>
  <text x="310" y="154" class="s c">a thread from the parent's registers,</text>
  <text x="310" y="168" class="s c">its result changed</text>
  <path class="lnk dash" d="M420,170 L528,170" marker-end="url(#ak)"/>
  <text x="440" y="164" class="s c">ready to run</text>
  <rect class="wu" x="450" y="184" width="160" height="46" rx="3"/>
  <text x="530" y="202" class="s c">still in the kernel:</text>
  <text x="530" y="216" class="s c">one message per descriptor</text>
  <circle cx="436" cy="207" r="9" fill="#333333"/>
  <text x="436" y="211" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <path class="ln" d="M610,222 L728,222" marker-end="url(#a)"/>
  <text x="670" y="200" class="s c">"a copy of the</text>
  <text x="670" y="213" class="s c">parent's descriptor 3"</text>
  <path class="lng" d="M730,254 L532,254" marker-end="url(#ag)"/>
  <text x="670" y="268" class="s c">shares the open file</text>
  <path class="ln dash" d="M530,286 L312,286" marker-end="url(#a)"/>
  <circle cx="514" cy="274" r="9" fill="#333333"/>
  <text x="514" y="278" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="500" y="278" class="s e">pulse: start-up done</text>
  <rect class="wk" x="230" y="296" width="160" height="30" rx="3"/>
  <text x="310" y="315" class="s c">answer the held request</text>
  <path class="lng" d="M230,366 L127,366" marker-end="url(#ag)"/>
  <circle cx="170" cy="354" r="9" fill="#3e7b34"/>
  <text x="170" y="358" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="184" y="358" class="s">reply: the child's ID</text>
  <rect class="g" x="20" y="376" width="120" height="40" rx="3"/>
  <text x="80" y="392" class="s c">fork() returns</text>
  <text x="80" y="406" class="s c">the child's ID</text>
  <rect class="g" x="450" y="300" width="160" height="70" rx="3"/>
  <text x="530" y="318" class="s c">returns to user mode, from</text>
  <text x="530" y="332" class="s c">the same call as the parent:</text>
  <text x="530" y="346" class="s c">its result has a mark,</text>
  <text x="530" y="360" class="s c">so fork() returns 0</text>
</svg>
