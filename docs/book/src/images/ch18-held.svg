<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <rect class="u" x="20.0" y="14" width="140" height="30" rx="4"/>
  <text x="90" y="34" class="c">parent (sh)</text>
  <path class="life" d="M90,44 L90,384"/>
  <rect class="k" x="250.0" y="14" width="160" height="30" rx="4"/>
  <text x="330" y="34" class="c">sysmgr thread</text>
  <path class="life" d="M330,44 L330,384"/>
  <rect class="u" x="495.0" y="14" width="130" height="30" rx="4"/>
  <text x="560" y="34" class="c">another client</text>
  <path class="life" d="M560,44 L560,384"/>
  <rect class="u" x="665.0" y="14" width="110" height="30" rx="4"/>
  <text x="720" y="34" class="c">child (ls)</text>
  <path class="life" d="M720,44 L720,384"/>
  <path class="lnk" d="M90,70 L328,70" marker-end="url(#ak)"/>
  <circle cx="106" cy="58" r="9" fill="#2c5d9b"/>
  <text x="106" y="62" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="120" y="62" class="s">wait request</text>
  <rect class="y" x="45" y="76" width="90" height="250" rx="3"/>
  <text x="90" y="196" class="s c">REPLY-</text>
  <text x="90" y="209" class="s c">blocked</text>
  <rect class="wk" x="230" y="80" width="200" height="46" rx="3"/>
  <text x="330" y="98" class="s c">no child has ended: keep the</text>
  <text x="330" y="112" class="s c">receive ID in a list, reply later</text>
  <circle cx="216" cy="103" r="9" fill="#333333"/>
  <text x="216" y="107" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <rect class="g" x="680" y="60" width="80" height="180" rx="3"/>
  <text x="720" y="150" class="s c">runs</text>
  <path class="lnk" d="M560,160 L332,160" marker-end="url(#ak)"/>
  <circle cx="450" cy="148" r="9" fill="#2c5d9b"/>
  <text x="450" y="152" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="464" y="152" class="s">mmap request</text>
  <path class="lng" d="M330,190 L558,190" marker-end="url(#ag)"/>
  <text x="450" y="184" class="s c">reply</text>
  <text x="320" y="178" class="s e">served at once</text>
  <path class="ln dash" d="M720,250 L332,250" marker-end="url(#a)"/>
  <circle cx="660" cy="238" r="9" fill="#333333"/>
  <text x="660" y="242" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="646" y="242" class="s e">exits: the kernel sends a pulse</text>
  <rect class="wk" x="230" y="260" width="200" height="46" rx="3"/>
  <text x="330" y="278" class="s c">look through the held waits:</text>
  <text x="330" y="292" class="s c">this one is now satisfied</text>
  <circle cx="216" cy="283" r="9" fill="#333333"/>
  <text x="216" y="287" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <path class="lng" d="M230,326 L137,326" marker-end="url(#ag)"/>
  <circle cx="190" cy="314" r="9" fill="#3e7b34"/>
  <text x="190" y="318" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">6</text>
  <text x="204" y="318" class="s">reply: the status</text>
  <rect class="g" x="45" y="334" width="90" height="36" rx="3"/>
  <text x="90" y="356" class="s c">wait() returns</text>
</svg>
