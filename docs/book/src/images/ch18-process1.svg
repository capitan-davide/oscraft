<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <rect class="u" x="40" y="14" width="200" height="62" rx="4"/>
  <text x="140" y="32" class="b c">sh</text>
  <rect class="wu" x="50" y="42" width="180" height="26" rx="3"/>
  <text x="140" y="59" class="ms c">connection 0x40000000</text>
  <path class="ln" d="M140,68 L140,100 L386,100 L386,150" marker-end="url(#a)"/>
  <rect class="u" x="300" y="14" width="200" height="62" rx="4"/>
  <text x="400" y="32" class="b c">netd</text>
  <rect class="wu" x="310" y="42" width="180" height="26" rx="3"/>
  <text x="400" y="59" class="ms c">connection 0x40000000</text>
  <path class="ln" d="M400,68 L400,100 L400,100 L400,150" marker-end="url(#a)"/>
  <rect class="u" x="560" y="14" width="200" height="62" rx="4"/>
  <text x="660" y="32" class="b c">ps</text>
  <rect class="wu" x="570" y="42" width="180" height="26" rx="3"/>
  <text x="660" y="59" class="ms c">connection 0x40000000</text>
  <path class="ln" d="M660,68 L660,100 L414,100 L414,150" marker-end="url(#a)"/>
  <text x="408" y="94" class="s">every process: fork, wait, mmap, open, sysctl ...</text>
  <path class="life" d="M20,118 L780,118"/>
  <text x="776" y="114" class="s e">user mode</text>
  <text x="776" y="132" class="s e">kernel mode</text>
  <rect class="k" x="20" y="138" width="760" height="248" rx="4"/>
  <text x="34" y="158" class="h">process 1 (kernel)</text>
  <rect class="y" x="300" y="152" width="200" height="26" rx="3"/>
  <text x="400" y="169" class="s c">channel 1: system manager</text>
  <path class="lnk" d="M400,178 L400,198" marker-end="url(#ak)"/>
  <rect class="g" x="300" y="200" width="200" height="58" rx="3"/>
  <text x="400" y="218" class="b c">thread sysmgr</text>
  <text x="400" y="234" class="s c">receives, dispatches by type,</text>
  <text x="400" y="247" class="s c">replies or holds; never sends</text>
  <rect class="wk" x="34" y="290" width="176" height="40" rx="3"/>
  <text x="122" y="306" class="b c">process manager</text>
  <text x="122" y="321" class="s c">fork, wait, IDs, sessions</text>
  <path class="lnk" d="M400,258 L400,274 L122,274 L122,288" marker-end="url(#ak)"/>
  <rect class="wk" x="220" y="290" width="176" height="40" rx="3"/>
  <text x="308" y="306" class="b c">memory manager</text>
  <text x="308" y="321" class="s c">mmap, shared memory</text>
  <path class="lnk" d="M400,258 L400,274 L308,274 L308,288" marker-end="url(#ak)"/>
  <rect class="wk" x="406" y="290" width="176" height="40" rx="3"/>
  <text x="494" y="306" class="b c">pathname manager</text>
  <text x="494" y="321" class="s c">who serves a path</text>
  <path class="lnk" d="M400,258 L400,274 L494,274 L494,288" marker-end="url(#ak)"/>
  <rect class="wk" x="592" y="290" width="176" height="40" rx="3"/>
  <text x="680" y="306" class="b c">built-in files</text>
  <text x="680" y="321" class="s c">/proc, /dev/shmem, image</text>
  <path class="lnk" d="M400,258 L400,274 L680,274 L680,288" marker-end="url(#ak)"/>
  <rect class="g" x="560" y="200" width="206" height="58" rx="3"/>
  <text x="663" y="218" class="b c">thread kernel-worker</text>
  <text x="663" y="234" class="s c">jobs that must send to</text>
  <text x="663" y="247" class="s c">other servers</text>
  <path class="lnk dash" d="M500,229 L558,229" marker-end="url(#ak)"/>
  <text x="529" y="222" class="s c">defer</text>
  <rect class="y" x="34" y="172" width="200" height="24" rx="3"/>
  <text x="134" y="188" class="s c">channel 2: console</text>
  <rect class="g" x="34" y="200" width="200" height="58" rx="3"/>
  <text x="134" y="218" class="b c">devtext, devtext-poll</text>
  <text x="134" y="234" class="s c">the console /dev/text</text>
  <text x="134" y="247" class="s c">on the serial port</text>
  <text x="400" y="352" class="s c">also: bootscript (runs the boot script), sigev-thread (events that start threads),</text>
  <text x="400" y="366" class="s c">and the kernel's own threads: one idle thread per processor</text>
</svg>
