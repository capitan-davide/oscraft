<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="350" fill="#ffffff"/>
  <rect class="u" x="20" y="14" width="330" height="220" rx="4"/>
  <text x="34" y="34" class="h">ps</text>
  <rect class="g" x="34" y="46" width="302" height="38" rx="3"/>
  <text x="44" y="62" class="b">ps</text>
  <text x="44" y="77" class="s">prints a line per record</text>
  <rect class="g" x="34" y="92" width="302" height="38" rx="3"/>
  <text x="44" y="108" class="b">libkvm: kvm_getprocs()</text>
  <text x="44" y="123" class="s">asks for all processes</text>
  <path class="ln" d="M185,84 L185,91" marker-end="url(#a)"/>
  <rect class="g" x="34" y="138" width="302" height="38" rx="3"/>
  <text x="44" y="154" class="b">libc: sysctl()</text>
  <text x="44" y="169" class="s">name: kern.proc ...</text>
  <path class="ln" d="M185,130 L185,137" marker-end="url(#a)"/>
  <rect class="k" x="34" y="184" width="302" height="38" rx="3"/>
  <text x="44" y="200" class="b">libsys</text>
  <text x="44" y="215" class="s">a value of its own? no: send to process 1</text>
  <path class="ln" d="M185,176 L185,183" marker-end="url(#a)"/>
  <rect class="k" x="450" y="14" width="330" height="220" rx="4"/>
  <text x="464" y="34" class="h">process 1</text>
  <rect class="wk" x="464" y="46" width="302" height="38" rx="3"/>
  <text x="474" y="62" class="b">sysmgr thread</text>
  <text x="474" y="77" class="s">a sysctl message: its own handler</text>
  <rect class="wk" x="464" y="92" width="302" height="38" rx="3"/>
  <text x="474" y="108" class="b">for each entry of the process table</text>
  <text x="474" y="123" class="s">fill one struct kinfo_proc</text>
  <path class="lnk" d="M615,84 L615,91" marker-end="url(#ak)"/>
  <rect class="y" x="464" y="140" width="302" height="84" rx="3"/>
  <text x="474" y="156" class="b">struct kinfo_proc: 1088 bytes</text>
  <text x="474" y="172" class="ms">ki_pid, ki_ppid, ki_pgid, ki_sid, ki_uid ...</text>
  <text x="474" y="185" class="ms">ki_stat: from the threads' states</text>
  <text x="474" y="198" class="ms">ki_runtime: CPU time of its threads</text>
  <text x="474" y="211" class="ms">ki_comm: the program's name</text>
  <path class="lnk" d="M615,130 L615,139" marker-end="url(#ak)"/>
  <path class="lnk" d="M336,196 L400,196 L400,58 L462,58" marker-end="url(#ak)"/>
  <circle cx="400" cy="120" r="9" fill="#2c5d9b"/>
  <text x="400" y="124" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <path class="lng" d="M464,212 L338,212" marker-end="url(#ag)"/>
  <circle cx="400" cy="224" r="9" fill="#3e7b34"/>
  <text x="400" y="228" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="400" y="250" class="s c">one message, one reply:</text>
  <text x="400" y="264" class="s c">all the records</text>
  <rect class="w" x="20" y="284" width="760" height="54" rx="3"/>
  <text x="80" y="304" class="m e">PID</text>
  <text x="124" y="304" class="m e">TT</text>
  <text x="136" y="304" class="m">STAT</text>
  <text x="236" y="304" class="m e">TIME</text>
  <text x="246" y="304" class="m">COMMAND</text>
  <text x="80" y="322" class="m e">28681</text>
  <text x="124" y="322" class="m e">text</text>
  <text x="136" y="322" class="m">Ss+</text>
  <text x="236" y="322" class="m e">0:00.19</text>
  <text x="246" y="322" class="m">/bin/sh</text>
  <path class="ln" d="M120,234 L120,282" marker-end="url(#a)"/>
  <circle cx="134" cy="258" r="9" fill="#333333"/>
  <text x="134" y="262" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="770" y="316" class="s e">the arguments come from a second request, per process</text>
</svg>
