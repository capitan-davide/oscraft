<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <rect class="frame" x="20" y="40" width="500" height="200" rx="4"/>
  <text x="34" y="58" class="b">session 28681: everything started from the console's shell</text>
  <rect class="u" x="40" y="76" width="120" height="50" rx="4"/>
  <text x="100" y="96" class="c">sh  28681</text>
  <text x="100" y="112" class="s c">session leader</text>
  <rect class="frame" x="190" y="70" width="310" height="70" rx="4"/>
  <text x="200" y="86" class="s">process group 32778: sleep 100 &amp;</text>
  <rect class="u" x="204" y="94" width="110" height="36" rx="4"/>
  <text x="259" y="116" class="s c">sleep  32778</text>
  <text x="410" y="116" class="s c">background</text>
  <rect class="g" x="190" y="152" width="310" height="76" rx="3"/>
  <text x="200" y="168" class="s">process group 36875: ls | wc</text>
  <text x="490" y="168" class="s e green">foreground</text>
  <rect class="u" x="204" y="178" width="110" height="36" rx="4"/>
  <text x="259" y="200" class="s c">ls  36875</text>
  <rect class="u" x="330" y="178" width="110" height="36" rx="4"/>
  <text x="385" y="200" class="s c">wc  36876</text>
  <rect class="k" x="580" y="40" width="200" height="110" rx="4"/>
  <text x="680" y="60" class="b c">console /dev/text</text>
  <text x="680" y="76" class="s c">(process 1's devtext)</text>
  <rect class="wk" x="594" y="88" width="172" height="50" rx="3"/>
  <text x="680" y="106" class="s c">foreground group:</text>
  <text x="680" y="121" class="s c">36875</text>
  <rect class="n" x="580" y="186" width="200" height="40" rx="4"/>
  <text x="680" y="204" class="c">keyboard: Ctrl-C</text>
  <text x="680" y="219" class="s c">(the serial port)</text>
  <path class="ln" d="M680,186 L680,152" marker-end="url(#a)"/>
  <path class="lnr" d="M594,124 L540,124 L540,190 L502,190" marker-end="url(#ar)"/>
  <text x="548" y="176" class="s red">SIGINT</text>
  <text x="548" y="190" class="s red">to each</text>
  <rect class="k" x="20" y="262" width="760" height="84" rx="4"/>
  <text x="34" y="282" class="b">what process 1 keeps</text>
  <rect class="wk" x="34" y="292" width="350" height="44" rx="3"/>
  <text x="44" y="308" class="s">in each process: its group and its session</text>
  <text x="44" y="322" class="s">(the kernel's Process structure)</text>
  <rect class="wk" x="400" y="292" width="366" height="44" rx="3"/>
  <text x="410" y="308" class="s">per session: its controlling terminal, as a connection</text>
  <text x="410" y="322" class="s">of process 1's own, closed when the leader ends</text>
</svg>
