<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>
  <text x="20" y="24" class="h">The parent waits first</text>
  <text x="70" y="56" class="e">parent</text>
  <text x="70" y="96" class="e">child</text>
  <rect class="g" x="80" y="40" width="150" height="24" rx="3"/>
  <text x="155" y="56" class="s c">runs</text>
  <rect class="y" x="230" y="40" width="250" height="24" rx="3"/>
  <text x="355" y="56" class="s c">blocked in wait()</text>
  <rect class="g" x="480" y="40" width="120" height="24" rx="3"/>
  <text x="540" y="56" class="s c">has the status</text>
  <rect class="g" x="150" y="80" width="330" height="24" rx="3"/>
  <text x="315" y="96" class="s c">runs</text>
  <path class="ln" d="M150,64 L150,78" marker-end="url(#a)"/>
  <text x="144" y="76" class="s e">fork()</text>
  <path class="lng" d="M480,80 L480,66" marker-end="url(#ag)"/>
  <text x="488" y="96" class="s">exit(3): no zombie is ever seen</text>
  <text x="20" y="144" class="h">The child ends first</text>
  <text x="70" y="176" class="e">parent</text>
  <text x="70" y="216" class="e">child</text>
  <rect class="g" x="80" y="160" width="480" height="24" rx="3"/>
  <text x="320" y="176" class="s c">runs, busy with something else</text>
  <rect class="g" x="560" y="160" width="120" height="24" rx="3"/>
  <text x="620" y="176" class="s c">has the status</text>
  <rect class="g" x="150" y="200" width="150" height="24" rx="3"/>
  <text x="225" y="216" class="s c">runs</text>
  <rect class="r" x="300" y="200" width="260" height="24" rx="3"/>
  <text x="430" y="216" class="s c">zombie: an ID and the status 3</text>
  <path class="ln" d="M150,184 L150,198" marker-end="url(#a)"/>
  <text x="144" y="196" class="s e">fork()</text>
  <path class="ln dash" d="M300,200 L300,186" marker-end="url(#a)"/>
  <text x="306" y="196" class="s"></text>
  <text x="232" y="240" class="s">exit(3): SIGCHLD to the parent</text>
  <path class="lng" d="M560,200 L560,186" marker-end="url(#ag)"/>
  <text x="568" y="216" class="s">wait() returns at once; the zombie goes</text>
  <text x="400" y="280" class="s c">A child whose parent ends first is given to the first process, which collects every child it is handed.</text>
</svg>
