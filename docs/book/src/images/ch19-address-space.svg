<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
  <text x="400.0" y="22" class="h c">A process's address space after loading</text>
  <rect class="y" x="250" y="40" width="300" height="36" rx="0"/>
  <text x="400.0" y="56.0" class="c">the system page</text>
  <text x="400.0" y="70.0" class="s c">read-only, the same in every process</text>
  <text x="240" y="44" class="ms e">0x80_0000_0000</text>
  <path class="ln" d="M244,40 L250,40"/>
  <rect class="w" x="250" y="76" width="300" height="16" rx="0"/>
  <text x="240" y="80" class="ms e">0x7f_ffff_d000</text>
  <path class="ln" d="M244,76 L250,76"/>
  <rect class="u" x="250" y="92" width="300" height="60" rx="0"/>
  <text x="400.0" y="120.0" class="c">the main thread's stack</text>
  <text x="400.0" y="134.0" class="s c">512 KiB, every page backed at load time</text>
  <text x="240" y="96" class="ms e">0x7f_ffff_c000</text>
  <path class="ln" d="M244,92 L250,92"/>
  <rect class="r" x="250" y="152" width="300" height="20" rx="0"/>
  <text x="400.0" y="166.0" class="s c">guard page: never mapped</text>
  <text x="240" y="156" class="ms e">0x7f_fff7_c000</text>
  <path class="ln" d="M244,152 L250,152"/>
  <rect class="w" x="250" y="172" width="300" height="40" rx="0"/>
  <text x="400.0" y="196.0" class="c">...</text>
  <rect class="g" x="250" y="212" width="300" height="54" rx="0"/>
  <text x="400.0" y="237.0" class="c">mmap() without an address</text>
  <text x="400.0" y="251.0" class="s c">shared libraries, heap, thread stacks</text>
  <rect class="w" x="250" y="266" width="300" height="30" rx="0"/>
  <text x="400.0" y="285.0" class="c">...</text>
  <text x="240" y="270" class="ms e">0x10_0000_0000  (64 GiB)</text>
  <path class="ln" d="M244,266 L250,266"/>
  <rect class="g" x="250" y="296" width="300" height="44" rx="0"/>
  <text x="400.0" y="316.0" class="c">ld-elf.so.1</text>
  <text x="400.0" y="330.0" class="s c">only for a dynamically linked program</text>
  <rect class="w" x="250" y="340" width="300" height="30" rx="0"/>
  <text x="400.0" y="359.0" class="c">...</text>
  <text x="240" y="344" class="ms e">0x4_0000_0000  (16 GiB)</text>
  <path class="ln" d="M244,340 L250,340"/>
  <rect class="k" x="250" y="370" width="300" height="54" rx="0"/>
  <text x="400.0" y="395.0" class="c">the program</text>
  <text x="400.0" y="409.0" class="s c">its segments, if position-independent</text>
  <rect class="w" x="250" y="424" width="300" height="40" rx="0"/>
  <text x="400.0" y="442.0" class="c">a program linked for fixed</text>
  <text x="400.0" y="456.0" class="s c">addresses lies where it says</text>
  <text x="240" y="428" class="ms e">0x1_0000_0000  (4 GiB)</text>
  <path class="ln" d="M244,424 L250,424"/>
  <text x="240" y="468" class="ms e">0</text>
  <path class="ln" d="M244,464 L250,464"/>
  <rect class="wu" x="574" y="92" width="190" height="44" rx="3"/>
  <text x="669" y="110" class="s c">at its top: the initial stack</text>
  <text x="669" y="124" class="s c">(Figure 19.6)</text>
  <path class="ln dash" d="M550,100 L574,100"/>
  <text x="574" y="44" class="s">512 GiB: the end of user space</text>
  <text x="574" y="338" class="s">entry point for a</text>
  <text x="574" y="352" class="s">dynamic program</text>
  <text x="574" y="420" class="s">entry point for a</text>
  <text x="574" y="434" class="s">static program</text>
  <text x="400" y="486" class="s c">Not to scale. Addresses are those of QEMU's virt; high addresses at the top.</text>
</svg>
