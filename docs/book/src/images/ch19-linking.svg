<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="160" y="24" class="h c">Statically linked</text>
  <rect class="u" x="30" y="40" width="260" height="110" rx="4"/>
  <text x="160" y="58" class="b c">the program's file</text>
  <rect class="wu" x="45" y="68" width="230" height="30" rx="2"/>
  <text x="160" y="87" class="c">the program's own code</text>
  <rect class="g" x="45" y="104" width="230" height="34" rx="2"/>
  <text x="160" y="119" class="s c">the library functions it uses,</text>
  <text x="160" y="132" class="s c">copied in by the linker</text>
  <path class="ln" d="M160,150 L160,206" marker-end="url(#a)"/>
  <circle cx="180" cy="178" r="9" fill="#333333"/>
  <text x="180" y="182" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <rect class="k" x="30" y="208" width="260" height="50" rx="4"/>
  <text x="160" y="230" class="c">one image in memory</text>
  <text x="160" y="246" class="s c">nothing left to resolve</text>
  <text x="30" y="300" class="s">1  The kernel maps the segments and starts</text>
  <text x="30" y="314" class="s">    the program at its entry point.</text>
  <path class="life" d="M320,16 L320,384"/>
  <text x="565" y="24" class="h c">Dynamically linked</text>
  <rect class="u" x="350" y="40" width="150" height="84" rx="4"/>
  <text x="425" y="58" class="b c">the program's file</text>
  <rect class="wu" x="360" y="66" width="130" height="22" rx="2"/>
  <text x="425" y="82" class="s c">its own code</text>
  <rect class="y" x="360" y="92" width="130" height="24" rx="2"/>
  <text x="425" y="108" class="s c">names its interpreter</text>
  <rect class="g" x="512" y="60" width="126" height="44" rx="4"/>
  <text x="575" y="79" class="c">the dynamic</text>
  <text x="575" y="94" class="c">loader's file</text>
  <rect class="g" x="650" y="60" width="130" height="44" rx="4"/>
  <text x="715" y="79" class="c">shared</text>
  <text x="715" y="94" class="c">libraries' files</text>
  <path class="ln dash" d="M490,104 L510,90" marker-end="url(#a)"/>
  <rect class="k" x="340" y="190" width="450" height="78" rx="4"/>
  <text x="565" y="206" class="b c">the process's memory</text>
  <rect class="wu" x="350" y="216" width="150" height="40" rx="2"/>
  <text x="425" y="240" class="c">program</text>
  <rect class="g" x="512" y="216" width="126" height="40" rx="2"/>
  <text x="575" y="240" class="c">dynamic loader</text>
  <rect class="g" x="650" y="216" width="130" height="40" rx="2"/>
  <text x="715" y="240" class="c">libraries</text>
  <path class="ln" d="M425,124 L425,214" marker-end="url(#a)"/>
  <circle cx="441" cy="158" r="9" fill="#333333"/>
  <text x="441" y="162" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <path class="ln" d="M575,104 L575,214" marker-end="url(#a)"/>
  <circle cx="591" cy="158" r="9" fill="#333333"/>
  <text x="591" y="162" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <path class="lng" d="M715,104 L715,214" marker-end="url(#ag)"/>
  <circle cx="731" cy="158" r="9" fill="#3e7b34"/>
  <text x="731" y="162" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <path class="lng" d="M575,258 L575,280 L425,280 L425,258" marker-end="url(#ag)"/>
  <circle cx="500" cy="280" r="9" fill="#3e7b34"/>
  <text x="500" y="284" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="350" y="314" class="s">1  The kernel maps the program and the interpreter it names.</text>
  <text x="350" y="329" class="s">2  The kernel starts the loader, not the program.</text>
  <text x="350" y="344" class="s">3  The loader maps each library the program needs and fills in</text>
  <text x="350" y="359" class="s">    the addresses the program left open.</text>
  <text x="350" y="374" class="s">4  The loader jumps to the program's entry point.</text>
</svg>
