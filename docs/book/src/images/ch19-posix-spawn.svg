<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>
  <rect class="u" x="40" y="30" width="160" height="30" rx="4"/>
  <text x="120" y="50" class="c">parent</text>
  <path class="life" d="M120,60 L120,430"/>
  <rect class="k" x="320" y="30" width="160" height="30" rx="4"/>
  <text x="400" y="50" class="c">process 1</text>
  <path class="life" d="M400,60 L400,430"/>
  <rect class="u" x="600" y="30" width="160" height="30" rx="4"/>
  <text x="680" y="50" class="c">child</text>
  <path class="life" d="M680,60 L680,430"/>
  <rect class="wu" x="20.0" y="72" width="200" height="48" rx="3"/>
  <text x="120" y="86.0" class="s c">posix_spawn() in libc:</text>
  <text x="120" y="100.0" class="s c">rfork(RFSPAWN) gives EINVAL,</text>
  <text x="120" y="114.0" class="s c">so it calls vfork()</text>
  <path class="lnk" d="M120,136 L398,136" marker-end="url(#ak)"/>
  <circle cx="250" cy="122" r="9" fill="#2c5d9b"/>
  <text x="250" y="126" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="264" y="126" class="ms">_PROC_FORK</text>
  <rect class="y" x="65.0" y="144" width="110" height="150" rx="3"/>
  <text x="120" y="223.0" class="s c">REPLY-blocked</text>
  <rect class="k" x="300.0" y="144" width="200" height="34" rx="3"/>
  <text x="400" y="165.0" class="s c">copies the process</text>
  <path class="lnk" d="M500,168 L678,186" marker-end="url(#ak)"/>
  <rect class="u" x="580.0" y="188" width="200" height="48" rx="3"/>
  <text x="680" y="209.0" class="s c">tells the servers about its</text>
  <text x="680" y="223.0" class="s c">copied descriptors (Chapter 18)</text>
  <path class="ln dash" d="M580,228 L402,248" marker-end="url(#a)"/>
  <text x="540" y="254" class="s c">pulse: ready</text>
  <path class="lng" d="M400,294 L177,294" marker-end="url(#ag)"/>
  <circle cx="250" cy="280" r="9" fill="#3e7b34"/>
  <text x="250" y="284" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="264" y="284" class="s">reply: the child's ID</text>
  <rect class="g" x="30.0" y="302" width="180" height="48" rx="3"/>
  <text x="120" y="323.0" class="s c">posix_spawn() returns</text>
  <text x="120" y="337.0" class="s c">the child's ID</text>
  <rect class="wu" x="565.0" y="262" width="230" height="60" rx="3"/>
  <text x="680" y="282.0" class="s c">fork() returns 0: libc applies the</text>
  <text x="680" y="296.0" class="s c">attributes and file actions with</text>
  <text x="680" y="310.0" class="s c">dup2(), close(), open(), sigprocmask()</text>
  <path class="lnk" d="M680,340 L402,340" marker-end="url(#ak)"/>
  <circle cx="530" cy="326" r="9" fill="#2c5d9b"/>
  <text x="530" y="330" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="544" y="330" class="ms">_PROC_SPAWN, exec flag</text>
  <rect class="k" x="300.0" y="348" width="200" height="34" rx="3"/>
  <text x="400" y="369.0" class="s c">replaces the child's image</text>
  <path class="lng" d="M500,372 L678,392" marker-end="url(#ag)"/>
  <rect class="g" x="580.0" y="394" width="200" height="30" rx="3"/>
  <text x="680" y="413.0" class="s c">the new program runs</text>
  <text x="120" y="384" class="s c">The parent has its answer</text>
  <text x="120" y="398" class="s c">before the child's exec.</text>
</svg>
