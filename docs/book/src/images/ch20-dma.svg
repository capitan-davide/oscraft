<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <text x="200" y="24" class="h c">A device follows one address and a length</text>
  <text x="308" y="62" class="s">virtual pages</text>
  <text x="368" y="126" class="s">frames</text>
  <rect class="u" x="100" y="44" width="50" height="26" rx="0"/>
  <text x="125" y="62" class="s c">page 0</text>
  <rect class="u" x="150" y="44" width="50" height="26" rx="0"/>
  <text x="175" y="62" class="s c">page 1</text>
  <rect class="u" x="200" y="44" width="50" height="26" rx="0"/>
  <text x="225" y="62" class="s c">page 2</text>
  <rect class="u" x="250" y="44" width="50" height="26" rx="0"/>
  <text x="275" y="62" class="s c">page 3</text>
  <rect class="k" x="60" y="134" width="50" height="26" rx="0"/>
  <rect class="k" x="110" y="134" width="50" height="26" rx="0"/>
  <rect class="n" x="160" y="134" width="50" height="26" rx="0"/>
  <rect class="k" x="210" y="134" width="50" height="26" rx="0"/>
  <rect class="n" x="260" y="134" width="50" height="26" rx="0"/>
  <rect class="k" x="310" y="134" width="50" height="26" rx="0"/>
  <text x="85" y="152" class="s c">0</text>
  <path class="ln" d="M125,70 L85,132" marker-end="url(#a)"/>
  <text x="235" y="152" class="s c">1</text>
  <path class="ln" d="M175,70 L235,132" marker-end="url(#a)"/>
  <text x="135" y="152" class="s c">2</text>
  <path class="ln" d="M225,70 L135,132" marker-end="url(#a)"/>
  <text x="335" y="152" class="s c">3</text>
  <path class="ln" d="M275,70 L335,132" marker-end="url(#a)"/>
  <text x="200" y="184" class="s c">Scattered frames: contiguous for the program,</text>
  <text x="200" y="198" class="s c red">four separate pieces for the device.</text>
  <rect class="u" x="100" y="226" width="50" height="26" rx="0"/>
  <text x="125" y="244" class="s c">page 0</text>
  <rect class="u" x="150" y="226" width="50" height="26" rx="0"/>
  <text x="175" y="244" class="s c">page 1</text>
  <rect class="u" x="200" y="226" width="50" height="26" rx="0"/>
  <text x="225" y="244" class="s c">page 2</text>
  <rect class="u" x="250" y="226" width="50" height="26" rx="0"/>
  <text x="275" y="244" class="s c">page 3</text>
  <rect class="n" x="60" y="296" width="50" height="26" rx="0"/>
  <rect class="g" x="110" y="296" width="50" height="26" rx="0"/>
  <text x="135" y="314" class="s c">0</text>
  <rect class="g" x="160" y="296" width="50" height="26" rx="0"/>
  <text x="185" y="314" class="s c">1</text>
  <rect class="g" x="210" y="296" width="50" height="26" rx="0"/>
  <text x="235" y="314" class="s c">2</text>
  <rect class="g" x="260" y="296" width="50" height="26" rx="0"/>
  <text x="285" y="314" class="s c">3</text>
  <rect class="n" x="310" y="296" width="50" height="26" rx="0"/>
  <path class="lng" d="M125,252 L135,294" marker-end="url(#ag)"/>
  <path class="lng" d="M175,252 L185,294" marker-end="url(#ag)"/>
  <path class="lng" d="M225,252 L235,294" marker-end="url(#ag)"/>
  <path class="lng" d="M275,252 L285,294" marker-end="url(#ag)"/>
  <text x="200" y="344" class="s c green">One contiguous run: one address, one length.</text>
  <path class="life" d="M400,16 L400,344"/>
  <text x="600" y="24" class="h c">A device reaches only some addresses</text>
  <rect class="n" x="470" y="50" width="150" height="110" rx="0"/>
  <text x="545.0" y="96" class="c">RAM above 4 GiB</text>
  <text x="545.0" y="112" class="s c">the device cannot</text>
  <text x="545.0" y="126" class="s c">name these addresses</text>
  <rect class="g" x="470" y="160" width="150" height="130" rx="0"/>
  <text x="545.0" y="216" class="c">RAM below 4 GiB</text>
  <text x="545.0" y="232" class="s c">a pool the driver</text>
  <text x="545.0" y="246" class="s c">can ask for by name</text>
  <text x="462" y="164" class="ms e">4 GiB</text>
  <text x="462" y="294" class="ms e">0</text>
  <rect class="n" x="670" y="196" width="110" height="50" rx="4"/>
  <text x="725" y="216" class="s c">a device with</text>
  <text x="725" y="232" class="s c">32-bit addresses</text>
  <path class="lng" d="M670,221 L623,221" marker-end="url(#ag)"/>
  <path class="lnr dash" d="M725,196 L725,100 L623,100" marker-end="url(#ar)"/>
  <text x="600" y="322" class="s c">The buffer must come from memory the device</text>
  <text x="600" y="336" class="s c">can address, whatever the program's addresses are.</text>
</svg>
