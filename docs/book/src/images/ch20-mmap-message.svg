<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <rect class="u" x="35.0" y="30" width="150" height="30" rx="4"/>
  <text x="110" y="50" class="c">the program</text>
  <path class="life" d="M110,60 L110,370"/>
  <rect class="g" x="245.0" y="30" width="170" height="30" rx="4"/>
  <text x="330" y="50" class="c">libc and libsys</text>
  <path class="life" d="M330,60 L330,370"/>
  <rect class="k" x="495.0" y="30" width="250" height="30" rx="4"/>
  <text x="620" y="50" class="c">process 1: memory manager</text>
  <path class="life" d="M620,60 L620,370"/>
  <path class="ln" d="M35,22 L415,22"/>
  <text x="220.0" y="16" class="s c">one thread of the calling process</text>
  <path class="ln" d="M110,86 L328,86" marker-end="url(#a)"/>
  <text x="220.0" y="80" class="ms c">mmap(0, len, prot, flags, fd, off)</text>
  <rect class="g" x="235" y="96" width="190" height="46" rx="3"/>
  <circle cx="250" cy="119" r="9" fill="#3e7b34"/>
  <text x="250" y="123" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="268" y="115" class="s">translates FreeBSD's flags</text>
  <text x="268" y="129" class="s">and protection bits</text>
  <path class="lnk" d="M330,160 L618,160" marker-end="url(#ak)"/>
  <text x="475.0" y="154" class="ms c">_MEM_MAP</text>
  <rect class="y" x="270" y="168" width="120" height="150" rx="3"/>
  <text x="330" y="240" class="s c">REPLY-blocked</text>
  <rect class="k" x="470" y="168" width="300" height="26" rx="3"/>
  <circle cx="484" cy="181" r="9" fill="#2c5d9b"/>
  <text x="484" y="185" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="502" y="185" class="s">checks the arguments and abilities</text>
  <rect class="k" x="470" y="198" width="300" height="26" rx="3"/>
  <circle cx="484" cy="211" r="9" fill="#2c5d9b"/>
  <text x="484" y="215" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="502" y="215" class="s">decides what the mapping is (Figure 20.5)</text>
  <rect class="k" x="470" y="228" width="300" height="26" rx="3"/>
  <circle cx="484" cy="241" r="9" fill="#2c5d9b"/>
  <text x="484" y="245" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="502" y="245" class="s">allocates every page frame; zeroes or fills it</text>
  <rect class="k" x="470" y="258" width="300" height="26" rx="3"/>
  <circle cx="484" cy="271" r="9" fill="#2c5d9b"/>
  <text x="484" y="275" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="502" y="275" class="s">writes the page-table entries</text>
  <rect class="k" x="470" y="288" width="300" height="26" rx="3"/>
  <circle cx="484" cy="301" r="9" fill="#2c5d9b"/>
  <text x="484" y="305" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">6</text>
  <text x="502" y="305" class="s">records the region in the process's memory map</text>
  <path class="lng" d="M620,330 L392,330" marker-end="url(#ag)"/>
  <text x="495.0" y="324" class="s c">reply: the address</text>
  <path class="lng" d="M330,346 L112,346" marker-end="url(#ag)"/>
  <text x="220.0" y="340" class="s c">returns the address</text>
  <text x="400" y="388" class="s c">When mmap() returns, every page of the mapping has its frame. No later access can fault for lack of one.</text>
</svg>
