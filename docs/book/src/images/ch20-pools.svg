<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <text x="170" y="18" class="h c">Physical addresses on QEMU's virt</text>
  <text x="112" y="44" class="s e">the CPU's limit</text>
  <path class="ln" d="M114,40 L120,40"/>
  <rect class="w" x="120" y="40" width="150" height="60" rx="0"/>
  <text x="195.0" y="74.0" class="s c">nothing</text>
  <text x="112" y="104" class="ms e">0x1_0000_0000</text>
  <path class="ln" d="M114,100 L120,100"/>
  <rect class="w" x="120" y="100" width="150" height="40" rx="0"/>
  <text x="195.0" y="124.0" class="s c">nothing</text>
  <text x="112" y="144" class="ms e">0xC000_0000</text>
  <path class="ln" d="M114,140 L120,140"/>
  <rect class="g" x="120" y="140" width="150" height="120" rx="0"/>
  <text x="195.0" y="198.0" class="c">RAM, 2 GiB</text>
  <text x="195.0" y="213.0" class="s c">ram; its free part: sysram</text>
  <text x="112" y="264" class="ms e">0x4000_0000</text>
  <path class="ln" d="M114,260 L120,260"/>
  <rect class="n" x="120" y="260" width="150" height="80" rx="0"/>
  <text x="195.0" y="298.0" class="c">devices</text>
  <text x="195.0" y="313.0" class="s c">PL011 at 0x0900_0000 ...</text>
  <text x="112" y="344" class="ms e">0</text>
  <path class="ln" d="M114,340 L120,340"/>
  <path class="ln" d="M278,102 L284,102 L284,340 L278,340"/>
  <text x="290" y="225.0" class="ms">below4G</text>
  <path class="ln" d="M356,40 L362,40 L362,340 L356,340"/>
  <text x="362" y="34" class="ms c">memory</text>
  <text x="190" y="366" class="s c">Named ranges of the system page.</text>
  <text x="190" y="380" class="s c">There is no below1G: RAM starts at 1 GiB.</text>
  <text x="632" y="18" class="h c">A driver gets a DMA buffer</text>
  <rect class="g" x="480" y="36" width="140" height="28" rx="4"/>
  <text x="550" y="55" class="c">a driver in netd</text>
  <rect class="k" x="645" y="36" width="140" height="28" rx="4"/>
  <text x="715" y="55" class="c">process 1</text>
  <path class="life" d="M550,64 L550,390"/>
  <path class="life" d="M715,64 L715,390"/>
  <path class="lnk" d="M550,100 L713,100" marker-end="url(#ak)"/>
  <circle cx="534" cy="100" r="9" fill="#2c5d9b"/>
  <text x="534" y="104" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="632.5" y="94" class="s c">open /memory/below4G</text>
  <path class="lng" d="M715,126 L552,126" marker-end="url(#ag)"/>
  <text x="632.5" y="120" class="s c">a descriptor</text>
  <text x="520" y="104" class="s e">typed memory,</text>
  <text x="520" y="118" class="s e">to allocate</text>
  <path class="lnk" d="M550,180 L713,180" marker-end="url(#ak)"/>
  <circle cx="534" cy="180" r="9" fill="#2c5d9b"/>
  <text x="534" y="184" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="632.5" y="174" class="s c">mmap(fd, len)</text>
  <path class="lng" d="M715,206 L552,206" marker-end="url(#ag)"/>
  <text x="632.5" y="200" class="s c">a virtual address</text>
  <text x="520" y="184" class="s e">shared,</text>
  <text x="520" y="198" class="s e">uncached if asked</text>
  <path class="lnk" d="M550,260 L713,260" marker-end="url(#ak)"/>
  <circle cx="534" cy="260" r="9" fill="#2c5d9b"/>
  <text x="534" y="264" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="632.5" y="254" class="s c">where is it?</text>
  <path class="lng" d="M715,286 L552,286" marker-end="url(#ag)"/>
  <text x="632.5" y="280" class="s c">a physical address</text>
  <text x="520" y="264" class="s e">_MEM_OFFSET</text>
  <text x="723" y="196" class="s">one run of</text>
  <text x="723" y="209" class="s">frames in</text>
  <text x="723" y="222" class="s">the pool</text>
  <rect class="n" x="480" y="330" width="140" height="40" rx="3"/>
  <circle cx="464" cy="350" r="9" fill="#333333"/>
  <text x="464" y="354" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="550" y="347" class="s c">writes the physical</text>
  <text x="550" y="361" class="s c">address to the device</text>
</svg>
