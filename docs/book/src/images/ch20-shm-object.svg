<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <rect class="k" x="20" y="36" width="200" height="110" rx="4"/>
  <text x="120" y="54" class="b c">names under /dev/shmem</text>
  <rect class="wk" x="32" y="64" width="176" height="28" rx="3"/>
  <text x="42" y="82" class="m">"frames"</text>
  <rect class="wk" x="32" y="100" width="176" height="28" rx="3"/>
  <text x="42" y="118" class="m">"ring/log"</text>
  <rect class="k" x="300" y="56" width="200" height="56" rx="4"/>
  <text x="400" y="76" class="b c">ShmFile</text>
  <text x="400" y="92" class="s c">owner, mode, creator</text>
  <text x="400" y="105" class="s c">what stat() reports</text>
  <path class="lnk" d="M208,78 L298,78" marker-end="url(#ak)"/>
  <rect class="y" x="300" y="160" width="200" height="56" rx="4"/>
  <text x="400" y="180" class="b c">MemObject</text>
  <text x="400" y="196" class="s c">a size and a table of frames</text>
  <text x="400" y="209" class="s c">one entry per page</text>
  <path class="lnk" d="M400,112 L400,158" marker-end="url(#ak)"/>
  <rect class="g" x="300" y="262" width="40" height="24" rx="0"/>
  <rect class="g" x="340" y="262" width="40" height="24" rx="0"/>
  <rect class="g" x="380" y="262" width="40" height="24" rx="0"/>
  <rect class="g" x="420" y="262" width="40" height="24" rx="0"/>
  <rect class="g" x="460" y="262" width="40" height="24" rx="0"/>
  <text x="400" y="304" class="s c">page frames, zeroed when the object is sized</text>
  <path class="ln" d="M400,216 L400,260" marker-end="url(#a)"/>
  <rect class="u" x="580" y="36" width="200" height="66" rx="4"/>
  <text x="680" y="56" class="b c">process A</text>
  <text x="680" y="72" class="s c">descriptor from shm_open()</text>
  <text x="680" y="88" class="s c">and a MAP_SHARED mapping</text>
  <rect class="u" x="580" y="150" width="200" height="66" rx="4"/>
  <text x="680" y="170" class="b c">process B</text>
  <text x="680" y="186" class="s c">closed its descriptor;</text>
  <text x="680" y="202" class="s c">still has the mapping</text>
  <path class="ln" d="M580,60 L502,76" marker-end="url(#a)"/>
  <text x="540" y="56" class="s c">open</text>
  <path class="ln" d="M580,92 L502,172" marker-end="url(#a)"/>
  <path class="ln" d="M580,186 L502,190" marker-end="url(#a)"/>
  <text x="545" y="206" class="s c">mapped</text>
  <text x="20" y="196" class="s">Each arrow holds the object.</text>
  <text x="20" y="210" class="s">shm_unlink() removes only the name;</text>
  <text x="20" y="224" class="s">the frames are freed when the</text>
  <text x="20" y="238" class="s">last arrow goes.</text>
</svg>
