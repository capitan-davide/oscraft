<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <rect class="u" x="60" y="16" width="220" height="44" rx="4"/>
  <text x="170" y="35" class="b c">tmpfs</text>
  <text x="170" y="51" class="ms c">resmgr_attach("/tmp")</text>
  <rect class="k" x="460" y="16" width="260" height="44" rx="4"/>
  <text x="590" y="35" class="b c">process 1</text>
  <text x="590" y="51" class="s c">the pathname manager</text>
  <path class="life" d="M170,60 L170,384"/>
  <path class="life" d="M590,60 L590,384"/>
  <rect class="wu" x="60" y="74" width="220" height="30" rx="3"/>
  <text x="170" y="93" class="s c">a channel, and a handle for /tmp</text>
  <path class="lnk" d="M170,138 L588,138" marker-end="url(#ak)"/>
  <circle cx="192" cy="125" r="9" fill="#2c5d9b"/>
  <text x="192" y="129" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="208" y="129" class="s">link /tmp, on the connection every process has</text>
  <rect class="wk" x="480" y="146" width="220" height="30" rx="3"/>
  <text x="590" y="165" class="s c">may this process attach names?</text>
  <path class="lng" d="M590,204 L172,204" marker-end="url(#ag)"/>
  <circle cx="194" cy="191" r="9" fill="#3e7b34"/>
  <text x="194" y="195" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="210" y="195" class="s">ask again, on a connection of your own</text>
  <rect class="wu" x="60" y="212" width="220" height="30" rx="3"/>
  <text x="170" y="231" class="s c">a new connection to process 1</text>
  <path class="lnk" d="M170,270 L588,270" marker-end="url(#ak)"/>
  <circle cx="192" cy="257" r="9" fill="#2c5d9b"/>
  <text x="192" y="261" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="208" y="261" class="s">link /tmp: my process, channel, handle, flags</text>
  <rect class="y" x="460" y="278" width="260" height="46" rx="3"/>
  <text x="590" y="296" class="s c">a new row in the table:</text>
  <text x="590" y="312" class="ms c">tmp -&gt; tmpfs, owned by that connection</text>
  <path class="lng" d="M590,352 L172,352" marker-end="url(#ag)"/>
  <circle cx="194" cy="339" r="9" fill="#3e7b34"/>
  <text x="194" y="343" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="210" y="343" class="s">done</text>
  <rect class="g" x="60" y="360" width="220" height="30" rx="3"/>
  <text x="170" y="379" class="s c">the name lives while it is open</text>
</svg>
