<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="840" height="350" fill="#ffffff"/>
  <text x="205" y="24" class="h c">Mount points: the kernel walks the path</text>
  <rect class="n" x="20" y="38" width="370" height="262" rx="4"/>
  <text x="36" y="58" class="s">a monolithic kernel</text>
  <rect class="y" x="40" y="70" width="150" height="190" rx="3"/>
  <text x="115" y="90" class="b c">root file system</text>
  <text x="76" y="122" class="m">/</text>
  <text x="76" y="152" class="m">  usr/</text>
  <text x="76" y="182" class="m">  bin/</text>
  <text x="76" y="212" class="m">  tmp/</text>
  <rect class="y" x="230" y="70" width="140" height="190" rx="3"/>
  <text x="300" y="90" class="b c">file system</text>
  <text x="300" y="105" class="s c">mounted on /tmp</text>
  <text x="250" y="212" class="m">notes</text>
  <circle cx="52" cy="118" r="9" fill="#333333"/>
  <text x="52" y="122" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <circle cx="52" cy="208" r="9" fill="#333333"/>
  <text x="52" y="212" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <path class="ln" d="M52,128 L52,198" marker-end="url(#a)"/>
  <path class="lnr" d="M130,208 L228,208" marker-end="url(#ar)"/>
  <text x="180" y="200" class="s c red">mount point</text>
  <circle cx="312" cy="208" r="9" fill="#333333"/>
  <text x="312" y="212" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="205" y="284" class="s c">each component is looked up in a directory</text>
  <text x="205" y="322" class="s c">open("/tmp/notes"): three lookups, all in the kernel</text>
  <text x="630" y="24" class="h c">Prefixes: a manager matches, a server interprets</text>
  <rect class="n" x="440" y="38" width="200" height="150" rx="4"/>
  <text x="540" y="58" class="b c">name manager: a table</text>
  <rect class="w" x="452" y="72" width="176" height="28" rx="3"/>
  <text x="462" y="90" class="m">/dev/random</text>
  <text x="618" y="90" class="s e">server C</text>
  <rect class="g" x="452" y="108" width="176" height="28" rx="3"/>
  <text x="462" y="126" class="m">/tmp</text>
  <text x="618" y="126" class="s e">server B</text>
  <rect class="w" x="452" y="144" width="176" height="28" rx="3"/>
  <text x="462" y="162" class="m">/</text>
  <text x="618" y="162" class="s e">server A</text>
  <rect class="u" x="690" y="84" width="130" height="56" rx="4"/>
  <text x="755" y="106" class="b c">server B</text>
  <text x="755" y="124" class="s c">a file system</text>
  <text x="512" y="222" class="s">the path, as a string</text>
  <rect class="g" x="468" y="232" width="60" height="30" rx="3"/>
  <text x="498" y="252" class="m c">/tmp</text>
  <rect class="y" x="528" y="232" width="84" height="30" rx="3"/>
  <text x="570" y="252" class="m c">/notes</text>
  <text x="498" y="280" class="s c green">longest prefix</text>
  <text x="580" y="280" class="s c">the rest</text>
  <path class="lng" d="M498,232 L498,138" marker-end="url(#ag)"/>
  <path class="ln" d="M612,247 L755,247 L755,142" marker-end="url(#a)"/>
  <text x="728" y="266" class="s c">sent to the server it names</text>
  <text x="630" y="322" class="s c">open("/tmp/notes"): one match, then the server does the rest</text>
</svg>
