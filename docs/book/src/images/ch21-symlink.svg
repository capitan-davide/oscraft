<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
  <rect class="u" x="40" y="16" width="160" height="44" rx="4"/>
  <text x="120" y="35" class="b c">a program</text>
  <text x="120" y="51" class="s c">libsys</text>
  <path class="life" d="M120,60 L120,455"/>
  <rect class="k" x="270" y="16" width="160" height="44" rx="4"/>
  <text x="350" y="35" class="b c">process 1</text>
  <text x="350" y="51" class="s c">pathname manager</text>
  <path class="life" d="M350,60 L350,455"/>
  <rect class="k" x="480" y="16" width="160" height="44" rx="4"/>
  <text x="560" y="35" class="b c">process 1</text>
  <text x="560" y="51" class="s c">image file system</text>
  <path class="life" d="M560,60 L560,455"/>
  <rect class="u" x="650" y="16" width="160" height="44" rx="4"/>
  <text x="730" y="35" class="b c">tmpfs</text>
  <text x="730" y="51" class="s c">owns /tmp</text>
  <path class="life" d="M730,60 L730,455"/>
  <text x="20" y="84" class="ms">open("/usr/tmp/notes")</text>
  <path class="lnk" d="M120,120 L348,120" marker-end="url(#ak)"/>
  <circle cx="142" cy="107" r="9" fill="#2c5d9b"/>
  <text x="142" y="111" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="158" y="111" class="s">who owns /usr/tmp/notes?</text>
  <path class="lng" d="M350,154 L122,154" marker-end="url(#ag)"/>
  <circle cx="144" cy="141" r="9" fill="#3e7b34"/>
  <text x="144" y="145" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="160" y="145" class="s">the image file system</text>
  <path class="lnk" d="M120,196 L558,196" marker-end="url(#ak)"/>
  <circle cx="142" cy="183" r="9" fill="#2c5d9b"/>
  <text x="142" y="187" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="158" y="187" class="s">open usr/tmp/notes</text>
  <rect class="wk" x="460" y="204" width="200" height="30" rx="3"/>
  <text x="560" y="223" class="s c">usr/tmp is a link to /tmp</text>
  <path class="lnr" d="M560,262 L122,262" marker-end="url(#ar)"/>
  <circle cx="144" cy="249" r="9" fill="#aa2222"/>
  <text x="144" y="253" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="160" y="253" class="s">a link: the path is /tmp/notes, no servers</text>
  <rect class="y" x="20" y="272" width="200" height="44" rx="3"/>
  <text x="120" y="290" class="s c">start again with the new path</text>
  <text x="120" y="305" class="s c">(at most 16 times, then ELOOP)</text>
  <path class="lnk" d="M120,346 L348,346" marker-end="url(#ak)"/>
  <circle cx="142" cy="333" r="9" fill="#2c5d9b"/>
  <text x="142" y="337" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="158" y="337" class="s">who owns /tmp/notes?</text>
  <path class="lng" d="M350,380 L122,380" marker-end="url(#ag)"/>
  <circle cx="144" cy="367" r="9" fill="#3e7b34"/>
  <text x="144" y="371" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">6</text>
  <text x="160" y="371" class="s">tmpfs, then the image file system</text>
  <path class="lnk" d="M120,414 L728,414" marker-end="url(#ak)"/>
  <circle cx="142" cy="401" r="9" fill="#2c5d9b"/>
  <text x="142" y="405" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">7</text>
  <text x="158" y="405" class="s">open notes</text>
  <path class="lng" d="M730,448 L122,448" marker-end="url(#ag)"/>
  <circle cx="144" cy="435" r="9" fill="#3e7b34"/>
  <text x="144" y="439" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">8</text>
  <text x="160" y="439" class="s">done</text>
</svg>
