<svg xmlns="http://www.w3.org/2000/svg" width="800" height="356" viewBox="0 0 800 356" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="356" fill="#ffffff"/>
  <rect class="u" x="45" y="16" width="190" height="44" rx="4"/>
  <text x="140" y="35" class="b c">a program</text>
  <text x="140" y="51" class="s c">its C library</text>
  <path class="life" d="M140,60 L140,340"/>
  <rect class="u" x="335" y="16" width="190" height="44" rx="4"/>
  <text x="430" y="35" class="b c">server B</text>
  <text x="430" y="51" class="s c">registered /etc</text>
  <path class="life" d="M430,60 L430,340"/>
  <rect class="u" x="585" y="16" width="190" height="44" rx="4"/>
  <text x="680" y="35" class="b c">server A</text>
  <text x="680" y="51" class="s c">registered /</text>
  <path class="life" d="M680,60 L680,340"/>
  <rect class="y" x="30" y="76" width="220" height="62" rx="3"/>
  <text x="140" y="94" class="s c">open("/etc/hosts"): who to ask</text>
  <text x="44" y="112" class="ms">1. server B, owns /etc</text>
  <text x="44" y="128" class="ms">2. server A, owns /</text>
  <path class="lnk" d="M140,172 L428,172" marker-end="url(#ak)"/>
  <circle cx="162" cy="159" r="9" fill="#2c5d9b"/>
  <text x="162" y="163" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="178" y="163" class="s">open "hosts"</text>
  <rect class="wu" x="350" y="180" width="160" height="28" rx="3"/>
  <text x="430" y="198" class="s c">has passwd, group only</text>
  <path class="lnr" d="M430,236 L142,236" marker-end="url(#ar)"/>
  <circle cx="164" cy="223" r="9" fill="#aa2222"/>
  <text x="164" y="227" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="180" y="227" class="s">no such file</text>
  <path class="lnk" d="M140,270 L678,270" marker-end="url(#ak)"/>
  <circle cx="162" cy="257" r="9" fill="#2c5d9b"/>
  <text x="162" y="261" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="178" y="261" class="s">open "etc/hosts"</text>
  <rect class="wu" x="600" y="278" width="160" height="28" rx="3"/>
  <text x="680" y="296" class="s c">has etc/hosts</text>
  <path class="lng" d="M680,334 L142,334" marker-end="url(#ag)"/>
  <circle cx="164" cy="321" r="9" fill="#3e7b34"/>
  <text x="164" y="325" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="180" y="325" class="s">done: this connection is the file</text>
</svg>
