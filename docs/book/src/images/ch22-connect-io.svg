<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
  <rect class="u" x="40" y="16" width="220" height="44" rx="4"/>
  <text x="150" y="35" class="b c">a program</text>
  <text x="150" y="51" class="s c">its C library</text>
  <rect class="u" x="410" y="16" width="300" height="44" rx="4"/>
  <text x="560" y="35" class="b c">a resource manager</text>
  <text x="560" y="51" class="s c">owns the names below /data</text>
  <path class="life" d="M150,60 L150,415"/>
  <path class="life" d="M560,60 L560,415"/>
  <text x="40" y="84" class="ms">fd = open("/data/log", O_RDONLY)</text>
  <path class="lnk" d="M150,118 L558,118" marker-end="url(#ak)"/>
  <circle cx="172" cy="105" r="9" fill="#2c5d9b"/>
  <text x="172" y="109" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="188" y="109" class="s">connect message: open "log", for reading</text>
  <rect class="y" x="430" y="126" width="260" height="46" rx="3"/>
  <text x="560" y="144" class="s c">finds the file, checks access, creates</text>
  <text x="560" y="160" class="s c">state for this open: position 0, read-only</text>
  <path class="lng" d="M560,200 L152,200" marker-end="url(#ag)"/>
  <circle cx="174" cy="187" r="9" fill="#3e7b34"/>
  <text x="174" y="191" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="190" y="191" class="s">accepted: the new connection is fd</text>
  <text x="40" y="232" class="ms">read(fd, buf, 100)</text>
  <path class="lnk" d="M150,262 L558,262" marker-end="url(#ak)"/>
  <circle cx="172" cy="249" r="9" fill="#2c5d9b"/>
  <text x="172" y="253" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="188" y="253" class="s">I/O message on fd: read 100 bytes (no path)</text>
  <rect class="y" x="430" y="270" width="260" height="30" rx="3"/>
  <text x="560" y="289" class="s c">state of this connection: position 0 -&gt; 100</text>
  <path class="lng" d="M560,328 L152,328" marker-end="url(#ag)"/>
  <circle cx="174" cy="315" r="9" fill="#3e7b34"/>
  <text x="174" y="319" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="190" y="319" class="s">100 bytes</text>
  <text x="40" y="360" class="ms">close(fd)</text>
  <path class="lnk" d="M150,388 L558,388" marker-end="url(#ak)"/>
  <circle cx="172" cy="375" r="9" fill="#2c5d9b"/>
  <text x="172" y="379" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="188" y="379" class="s">I/O message on fd: close</text>
  <rect class="w" x="430" y="396" width="260" height="26" rx="3"/>
  <text x="560" y="413" class="s c">the state is freed; the file remains</text>
</svg>
