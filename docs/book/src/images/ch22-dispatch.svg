<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
  <rect class="y" x="20" y="120" width="190" height="96" rx="3"/>
  <text x="115" y="140" class="b c">a connect message</text>
  <text x="34" y="162" class="ms">request: open</text>
  <text x="34" y="178" class="ms">handle:  5</text>
  <text x="34" y="194" class="ms">path:    self/cmdline</text>
  <text x="115" y="236" class="s c">the handle came from the</text>
  <text x="115" y="251" class="s c">pathname manager's reply</text>
  <path class="lnk" d="M210,168 L268,168" marker-end="url(#ak)"/>
  <rect class="k" x="270" y="16" width="530" height="390" rx="4"/>
  <text x="286" y="36" class="b">process 1</text>
  <rect class="wk" x="286" y="46" width="498" height="286" rx="3"/>
  <text x="300" y="66" class="s">channel 1: one thread receives every request</text>
  <text x="300" y="90" class="s">handle</text>
  <text x="380" y="90" class="s">goes to</text>
  <rect class="w" x="296" y="98" width="478" height="23" rx="3"/>
  <text x="306" y="114" class="m">0</text>
  <text x="380" y="114" class="">the pathname manager</text>
  <text x="764" y="114" class="s e">Chapter 21</text>
  <rect class="w" x="296" y="126" width="478" height="23" rx="3"/>
  <text x="306" y="142" class="m">1</text>
  <text x="380" y="142" class="">the image file system</text>
  <text x="764" y="142" class="s e">/ and the boot image's files</text>
  <rect class="w" x="296" y="154" width="478" height="23" rx="3"/>
  <text x="306" y="170" class="m">2, 3, 10</text>
  <text x="380" y="170" class="">the simple devices</text>
  <text x="764" y="170" class="s e">/dev/null, /dev/zero, /dev/klog</text>
  <rect class="w" x="296" y="182" width="478" height="23" rx="3"/>
  <text x="306" y="198" class="m">4</text>
  <text x="380" y="198" class="">/dev/tty</text>
  <text x="764" y="198" class="s e">a link to the caller's terminal</text>
  <rect class="g" x="296" y="210" width="478" height="23" rx="3"/>
  <text x="306" y="226" class="m">5</text>
  <text x="380" y="226" class="">the process file system</text>
  <text x="764" y="226" class="s e">/proc</text>
  <rect class="w" x="296" y="238" width="478" height="23" rx="3"/>
  <text x="306" y="254" class="m">6, 7</text>
  <text x="380" y="254" class="">memory objects</text>
  <text x="764" y="254" class="s e">/dev/shmem, typed memory</text>
  <rect class="w" x="296" y="266" width="478" height="23" rx="3"/>
  <text x="306" y="282" class="m">9</text>
  <text x="380" y="282" class="">named semaphores</text>
  <text x="764" y="282" class="s e">/dev/sem</text>
  <rect class="w" x="296" y="294" width="478" height="23" rx="3"/>
  <text x="306" y="310" class="m">256 ...</text>
  <text x="380" y="310" class="">directories of the name space</text>
  <text x="764" y="310" class="s e">/dev, /dev/socket ...</text>
  <rect class="wk" x="286" y="342" width="498" height="52" rx="3"/>
  <text x="300" y="362" class="s">channel 2: a thread of its own</text>
  <text x="300" y="381" class="">the console</text>
  <text x="764" y="381" class="s e">/dev/text, /dev/console</text>
</svg>
