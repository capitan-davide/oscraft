<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="330" fill="#ffffff"/>
  <text x="110" y="24" class="h c">file descriptors</text>
  <text x="110" y="40" class="s c">per process</text>
  <text x="410" y="24" class="h c">open file descriptions</text>
  <text x="410" y="40" class="s c">per open(): state in the server</text>
  <text x="700" y="24" class="h c">files</text>
  <text x="700" y="40" class="s c">per file: state in the server</text>
  <rect class="u" x="20" y="56" width="180" height="66" rx="4"/>
  <text x="110" y="74" class="s c">parent</text>
  <rect class="wu" x="40" y="82" width="140" height="28" rx="3"/>
  <text x="110" y="101" class="m c">fd 1</text>
  <rect class="u" x="20" y="136" width="180" height="66" rx="4"/>
  <text x="110" y="154" class="s c">child, after fork()</text>
  <rect class="wu" x="40" y="162" width="140" height="28" rx="3"/>
  <text x="110" y="181" class="m c">fd 1</text>
  <rect class="u" x="20" y="216" width="180" height="66" rx="4"/>
  <text x="110" y="234" class="s c">another process</text>
  <rect class="wu" x="40" y="242" width="140" height="28" rx="3"/>
  <text x="110" y="261" class="m c">fd 3</text>
  <rect class="y" x="310" y="86" width="200" height="62" rx="4"/>
  <text x="410" y="108" class="b c">description A</text>
  <text x="410" y="126" class="s c">position 120, append mode</text>
  <rect class="y" x="310" y="226" width="200" height="50" rx="4"/>
  <text x="410" y="248" class="b c">description B</text>
  <text x="410" y="265" class="s c">position 0</text>
  <rect class="y" x="610" y="150" width="190" height="66" rx="4"/>
  <text x="705" y="172" class="m c">/tmp/log</text>
  <text x="705" y="190" class="s c">size, owner, mode, times</text>
  <text x="705" y="205" class="s c">and the data</text>
  <path class="lnk" d="M180,96 L308,110" marker-end="url(#ak)"/>
  <path class="lnk" d="M180,176 L308,126" marker-end="url(#ak)"/>
  <path class="lnk" d="M180,256 L308,252" marker-end="url(#ak)"/>
  <path class="ln" d="M510,118 L608,172" marker-end="url(#a)"/>
  <path class="ln" d="M510,250 L608,196" marker-end="url(#a)"/>
  <text x="20" y="314" class="s">A write through either of the first two descriptors moves the position the other sees. The third has a position of its own.</text>
</svg>
