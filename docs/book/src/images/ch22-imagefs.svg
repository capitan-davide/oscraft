<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="380" fill="#ffffff"/>
  <text x="20" y="24" class="h">physical memory: the boot image, where the startup left it</text>
  <rect class="y" x="20" y="40" width="80" height="40" rx="0"/>
  <text x="60.0" y="64" class="s c">header</text>
  <rect class="y" x="100" y="40" width="230" height="40" rx="0"/>
  <text x="215.0" y="64" class="s c">directory: an entry per file</text>
  <rect class="g" x="330" y="40" width="170" height="40" rx="0"/>
  <text x="415.0" y="64" class="s c">data of /bin/sh</text>
  <rect class="g" x="500" y="40" width="190" height="40" rx="0"/>
  <text x="595.0" y="64" class="s c">data of /lib/libc.so.7</text>
  <rect class="y" x="690" y="40" width="110" height="40" rx="0"/>
  <text x="745.0" y="64" class="s c">...</text>
  <rect class="k" x="20" y="150" width="300" height="210" rx="4"/>
  <text x="36" y="172" class="b">process 1: the image file system</text>
  <rect class="wk" x="36" y="184" width="268" height="50" rx="3"/>
  <text x="170" y="204" class="s c">index, built once at boot:</text>
  <text x="170" y="221" class="ms c">path -&gt; directory entry</text>
  <rect class="wk" x="36" y="246" width="268" height="50" rx="3"/>
  <text x="170" y="266" class="s c">the whole image mapped read-only</text>
  <text x="170" y="283" class="s c">into the kernel</text>
  <rect class="y" x="36" y="308" width="268" height="40" rx="3"/>
  <text x="170" y="325" class="s c">an open: the entry, a position,</text>
  <text x="170" y="340" class="s c">the open flags</text>
  <path class="lnk" d="M290,184 L290,82" marker-end="url(#ak)"/>
  <rect class="u" x="400" y="170" width="180" height="76" rx="4"/>
  <text x="490" y="190" class="b c">a program</text>
  <text x="490" y="208" class="ms c">read(fd, buf, n)</text>
  <text x="490" y="226" class="s c">gets a copy of the bytes</text>
  <rect class="u" x="606" y="170" width="200" height="76" rx="4"/>
  <text x="706" y="190" class="b c">two processes running sh</text>
  <text x="710" y="208" class="ms c">mmap() of its code</text>
  <text x="710" y="226" class="s c">the image's own pages</text>
  <path class="ln dash" d="M380,82 L470,168" marker-end="url(#a)"/>
  <path class="lng" d="M450,82 L700,168" marker-end="url(#ag)"/>
  <text x="372" y="128" class="s e">copied</text>
  <text x="600" y="128" class="s green">shared, not copied</text>
  <rect class="r" x="400" y="280" width="400" height="60" rx="3"/>
  <text x="600" y="302" class="s c">Nothing can be changed: opening for writing, creating</text>
  <text x="600" y="318" class="s c">and removing fail. Other servers' names are added</text>
  <text x="600" y="334" class="s c">to its directory listings.</text>
</svg>
