    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>
  <text x="120" y="24" class="h c">connections</text>
  <text x="120" y="40" class="s c">what the kernel knows</text>
  <text x="400" y="24" class="h c">the map</text>
  <text x="400" y="40" class="s c">(process, connection) -&gt; context</text>
  <text x="690" y="24" class="h c">open-file contexts</text>
  <text x="690" y="40" class="s c">shared, each with its own lock</text>
  <rect class="u" x="20" y="56" width="200" height="90" rx="4"/>
  <text x="120" y="74" class="s c">process 12</text>
  <rect class="wu" x="40" y="82" width="160" height="24" rx="3"/>
  <text x="120" y="98" class="m c">fd 3</text>
  <rect class="wu" x="40" y="112" width="160" height="24" rx="3"/>
  <text x="120" y="128" class="m c">fd 4 = dup(3)</text>
  <rect class="u" x="20" y="160" width="200" height="60" rx="4"/>
  <text x="120" y="178" class="s c">process 13, forked from 12</text>
