  <text x="120" y="278" class="m c">fd 0</text>
  <rect class="wu" x="40" y="292" width="160" height="24" rx="3"/>
  <text x="120" y="308" class="m c">fd 5</text>
  <rect class="k" x="320" y="56" width="160" height="284" rx="4"/>
  <rect class="y" x="580" y="76" width="220" height="48" rx="4"/>
  <text x="690" y="96" class="m c">Image</text>
  <text x="690" y="113" class="s c">bin/sh, position 4096</text>
  <rect class="y" x="580" y="186" width="220" height="48" rx="4"/>
  <text x="690" y="206" class="m c">Text</text>
  <text x="690" y="223" class="s c">the console's open flags</text>
  <rect class="y" x="580" y="276" width="220" height="48" rx="4"/>
  <text x="690" y="296" class="m c">Proc</text>
  <text x="690" y="313" class="s c">/proc/20/cmdline, position 0</text>
