<svg xmlns="http://www.w3.org/2000/svg" width="820" height="372" viewBox="0 0 820 372" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="820" height="372" fill="#ffffff"/>
  <text x="20" y="24" class="h">One answer, in the caller's form</text>
  <rect class="k" x="20" y="40" width="200" height="70" rx="4"/>
  <text x="120" y="62" class="b c">a built-in manager</text>
  <text x="120" y="80" class="s c">fills FreeBSD's struct stat</text>
  <text x="120" y="96" class="s c">(Stat, 224 bytes)</text>
  <rect class="wk" x="290" y="52" width="150" height="46" rx="3"/>
  <text x="365" y="72" class="s c">who is asking?</text>
  <text x="365" y="88" class="ms c">encode(client)</text>
  <path class="lnk" d="M220,75 L288,75" marker-end="url(#ak)"/>
  <rect class="g" x="520" y="36" width="280" height="40" rx="3"/>
  <text x="660" y="53" class="s c">a native process: the 224 bytes as they are</text>
  <text x="660" y="68" class="ms c">reply status 0x4642</text>
  <rect class="r" x="520" y="86" width="280" height="40" rx="3"/>
  <text x="660" y="103" class="s c">a QNX process: converted to QNX's struct</text>
  <text x="660" y="118" class="s c">(Part VI)</text>
  <path class="lng" d="M440,68 L518,56" marker-end="url(#ag)"/>
  <path class="lnr" d="M440,82 L518,104" marker-end="url(#ar)"/>
  <text x="20" y="170" class="h">A directory is read as records: FreeBSD's struct dirent</text>
  <rect class="y" x="20" y="190" width="128" height="44" rx="0"/>
  <text x="84.0" y="210" class="m c">d_fileno</text>
  <text x="84.0" y="226" class="s c">inode number</text>
  <rect class="y" x="148" y="190" width="128" height="44" rx="0"/>
  <text x="212.0" y="210" class="m c">d_off</text>
  <text x="212.0" y="226" class="s c">position</text>
  <rect class="y" x="276" y="190" width="64" height="44" rx="0"/>
  <rect class="y" x="340" y="190" width="32" height="44" rx="0"/>
  <rect class="n" x="372" y="190" width="32" height="44" rx="0"/>
  <rect class="y" x="404" y="190" width="64" height="44" rx="0"/>
  <rect class="n" x="468" y="190" width="64" height="44" rx="0"/>
  <rect class="y" x="532" y="190" width="281.6" height="44" rx="0"/>
  <text x="672.8" y="210" class="m c">d_name</text>
  <text x="672.8" y="226" class="s c">the name, a 0 byte, padding</text>
  <path class="ln" d="M308.0,234 L308.0,294 L324.0,294"/>
  <text x="328.0" y="298" class="s">d_reclen: this record's length</text>
  <path class="ln" d="M356.0,234 L356.0,276 L372.0,276"/>
  <text x="376.0" y="280" class="s">d_type: 0, unknown</text>
  <path class="ln" d="M436.0,234 L436.0,258 L452.0,258"/>
  <text x="456.0" y="262" class="s">d_namlen: the name's length</text>
  <text x="22" y="185" class="s">0</text>
  <text x="150" y="185" class="s">8</text>
  <text x="278" y="185" class="s">16</text>
  <text x="534" y="185" class="s">24</text>
  <text x="20" y="340" class="s">Each record is padded to a multiple of 8 bytes. A read returns as many whole records as fit in the caller's buffer,</text>
  <text x="20" y="356" class="s">and the open's position counts the names already returned.</text>
</svg>
