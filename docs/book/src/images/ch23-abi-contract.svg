<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="390" fill="#ffffff"/>
  <rect class="u" x="90" y="24" width="250" height="78" rx="4"/>
  <text x="215" y="46" class="h c">the program</text>
  <text x="215" y="66" class="ms c">fd = open(path, O_CREAT, 0644);</text>
  <text x="215" y="82" class="ms c">fstat(fd, &amp;st); n = st.st_size;</text>
  <rect class="g" x="90" y="150" width="250" height="78" rx="4"/>
  <text x="215" y="172" class="h c">the C library</text>
  <text x="215" y="192" class="s c">open(), fstat(), errno, pthread_*()</text>
  <text x="215" y="208" class="s c">its bottom layer enters the kernel</text>
  <rect class="k" x="90" y="276" width="250" height="78" rx="4"/>
  <text x="215" y="298" class="h c">the kernel</text>
  <text x="215" y="318" class="s c">does the work, or has it done,</text>
  <text x="215" y="334" class="s c">and fills in the results</text>
  <path class="ln" d="M215,102 L215,148" marker-end="url(#a)"/>
  <path class="ln" d="M215,228 L215,274" marker-end="url(#a)"/>
  <path class="ln dash" d="M60,126 L780,126"/>
  <path class="ln dash" d="M60,252 L780,252"/>
  <circle cx="372" cy="126" r="9" fill="#333333"/>
  <text x="372" y="130" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <circle cx="372" cy="252" r="9" fill="#333333"/>
  <text x="372" y="256" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <path class="lng" d="M90,315 L40,315 L40,63 L88,63" marker-end="url(#ag)"/>
  <circle cx="40" cy="190" r="9" fill="#3e7b34"/>
  <text x="40" y="194" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <rect class="w" x="400" y="20" width="380" height="94" rx="3"/>
  <text x="412" y="40" class="b">1  Fixed when the program was compiled</text>
  <text x="412" y="59" class="s">the names and argument types of the functions</text>
  <text x="412" y="75" class="s">where each field lies: st_size is 8 bytes at offset 112</text>
  <text x="412" y="91" class="s">the values of constants: O_CREAT is 0x200, ENOENT is 2</text>
  <text x="412" y="107" class="s">how a function is called: the processor's call standard</text>
  <rect class="w" x="400" y="140" width="380" height="94" rx="3"/>
  <text x="412" y="160" class="b">2  Fixed when the library was compiled</text>
  <text x="412" y="179" class="s">the instruction that enters the kernel, each call's number</text>
  <text x="412" y="195" class="s">which registers carry arguments, result and error</text>
  <text x="412" y="211" class="s">the same layouts and constants: the library passes the</text>
  <text x="412" y="227" class="s">program's struct stat to the kernel as it is</text>
  <rect class="w" x="400" y="266" width="380" height="94" rx="3"/>
  <text x="412" y="286" class="b">3  What the kernel gives a new program</text>
  <text x="412" y="305" class="s">the initial stack: argc, argv, the environment and a</text>
  <text x="412" y="321" class="s">table of facts about the system (the auxiliary vector)</text>
  <text x="412" y="337" class="s">the registers at the first instruction</text>
  <text x="412" y="353" class="s">later: the frame a signal handler is entered with</text>
</svg>
