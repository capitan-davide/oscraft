<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <text x="20" y="30" class="b">the program file's first 16 bytes (e_ident)</text>
  <rect class="w" x="20" y="40" width="44" height="30" rx="2"/>
  <text x="42.0" y="60" class="ms c">7f</text>
  <text x="42.0" y="84" class="s c">0</text>
  <rect class="w" x="64" y="40" width="44" height="30" rx="2"/>
  <text x="86.0" y="60" class="ms c">'E'</text>
  <text x="86.0" y="84" class="s c">1</text>
  <rect class="w" x="108" y="40" width="44" height="30" rx="2"/>
  <text x="130.0" y="60" class="ms c">'L'</text>
  <text x="130.0" y="84" class="s c">2</text>
  <rect class="w" x="152" y="40" width="44" height="30" rx="2"/>
  <text x="174.0" y="60" class="ms c">'F'</text>
  <text x="174.0" y="84" class="s c">3</text>
  <rect class="w" x="196" y="40" width="44" height="30" rx="2"/>
  <text x="218.0" y="60" class="ms c">class</text>
  <text x="218.0" y="84" class="s c">4</text>
  <rect class="w" x="240" y="40" width="44" height="30" rx="2"/>
  <text x="262.0" y="60" class="ms c">data</text>
  <text x="262.0" y="84" class="s c">5</text>
  <rect class="w" x="284" y="40" width="44" height="30" rx="2"/>
  <text x="306.0" y="60" class="ms c">vers.</text>
  <text x="306.0" y="84" class="s c">6</text>
  <rect class="y" x="328" y="40" width="62" height="30" rx="2"/>
  <text x="359.0" y="60" class="ms c">OS ABI</text>
  <text x="359.0" y="84" class="s c">7</text>
  <rect class="w" x="390" y="40" width="14" height="30" rx="2"/>
  <rect class="w" x="404" y="40" width="14" height="30" rx="2"/>
  <rect class="w" x="418" y="40" width="14" height="30" rx="2"/>
  <rect class="w" x="432" y="40" width="14" height="30" rx="2"/>
  <rect class="w" x="446" y="40" width="14" height="30" rx="2"/>
  <rect class="w" x="460" y="40" width="14" height="30" rx="2"/>
  <rect class="w" x="474" y="40" width="14" height="30" rx="2"/>
  <rect class="w" x="488" y="40" width="14" height="30" rx="2"/>
  <text x="512" y="60" class="s">bytes 8 to 15: padding</text>
  <path class="ln" d="M359.0,90 L359.0,118" marker-end="url(#a)"/>
  <rect class="k" x="250" y="120" width="190" height="44" rx="3"/>
  <text x="345" y="139" class="s c">the loader:</text>
  <text x="345" y="155" class="ms c">Personality::from_osabi()</text>
  <path class="lng" d="M440,132 L520,112" marker-end="url(#ag)"/>
  <rect class="g" x="522" y="96" width="258" height="30" rx="3"/>
  <text x="651" y="116" class="c">9, FreeBSD's brand: Native</text>
  <path class="lnr" d="M440,152 L520,172" marker-end="url(#ar)"/>
  <rect class="r" x="522" y="158" width="258" height="30" rx="3"/>
  <text x="651" y="178" class="c">any other value: Qnx</text>
  <path class="ln" d="M345,164 L345,198" marker-end="url(#a)"/>
  <rect class="k" x="20" y="200" width="420" height="60" rx="4"/>
  <text x="230" y="222" class="h c">the process object</text>
  <rect class="y" x="150" y="230" width="160" height="22" rx="3"/>
  <text x="230" y="246" class="ms c">personality</text>
  <text x="455" y="222" class="s">fork(): the child takes its parent's</text>
  <text x="455" y="240" class="s">exec: set again from the new file</text>
  <text x="20" y="290" class="b">asked wherever the two kinds of program differ:</text>
  <rect class="wk" x="20" y="302" width="146" height="36" rx="3"/>
  <text x="93" y="325" class="s c">how the program starts</text>
  <rect class="wk" x="173.5" y="302" width="146" height="36" rx="3"/>
  <text x="246.5" y="325" class="s c">error numbers of calls</text>
  <rect class="wk" x="327.0" y="302" width="146" height="36" rx="3"/>
  <text x="400.0" y="325" class="s c">signals</text>
  <rect class="wk" x="480.5" y="302" width="146" height="36" rx="3"/>
  <text x="553.5" y="325" class="s c">process 1's replies</text>
  <rect class="wk" x="634.0" y="302" width="146" height="36" rx="3"/>
  <text x="707.0" y="325" class="s c">the message info</text>
</svg>
