<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>
  <rect class="k" x="20" y="90" width="180" height="170" rx="4"/>
  <text x="110" y="114" class="h c">process 1</text>
  <text x="110" y="140" class="s c">looks up the sender's</text>
  <text x="110" y="155" class="s c">personality and answers</text>
  <text x="110" y="170" class="s c">each in its own layouts</text>
  <text x="110" y="200" class="s c">FreeBSD's struct stat</text>
  <text x="110" y="215" class="s c">to a native process,</text>
  <text x="110" y="230" class="s c">QNX's to a QNX one</text>
  <rect class="g" x="310" y="30" width="180" height="60" rx="4"/>
  <text x="400" y="56" class="h c">a native program</text>
  <text x="400" y="74" class="s c">libsys, FreeBSD's layouts</text>
  <rect class="r" x="310" y="250" width="180" height="60" rx="4"/>
  <text x="400" y="276" class="h c">a QNX program</text>
  <text x="400" y="294" class="s c">QNX's library and layouts</text>
  <rect class="k" x="600" y="30" width="180" height="60" rx="4"/>
  <text x="690" y="56" class="h c">a native server</text>
  <text x="690" y="74" class="s c">tmpfs, pipe, pty, netd</text>
  <rect class="y" x="600" y="180" width="180" height="60" rx="4"/>
  <text x="690" y="206" class="h c">qnxd</text>
  <text x="690" y="224" class="s c">converts both ways</text>
  <path class="lng" d="M490,60 L598,60" marker-end="url(#ag)"/>
  <text x="544" y="50" class="s c">MI_NATIVE in</text>
  <text x="544" y="76" class="s c">the message info</text>
  <path class="lng" d="M310,60 L202,130" marker-end="url(#ag)"/>
  <text x="228" y="76" class="s c">FreeBSD's</text>
  <path class="lnr" d="M310,280 L202,222" marker-end="url(#ar)"/>
  <text x="236" y="278" class="s c">QNX's</text>
  <path class="lnr" d="M490,280 L598,222" marker-end="url(#ar)"/>
  <text x="556" y="278" class="s">the kernel sends it here first</text>
  <path class="ln" d="M690,180 L690,92" marker-end="url(#a)"/>
  <text x="682" y="132" class="s e">forwarded,</text>
  <text x="682" y="147" class="s e">in FreeBSD's layouts</text>
  <text x="400" y="196" class="s c">(a QNX program's plain reads and</text>
  <text x="400" y="211" class="s c">writes go straight to the server)</text>
</svg>
