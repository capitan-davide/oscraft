<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <rect class="n" x="20" y="30" width="200" height="50" rx="4"/>
  <text x="120" y="50" class="c">FreeBSD's list of calls</text>
  <text x="120" y="66" class="ms c">sys/sys/syscall.mk</text>
  <rect class="k" x="20" y="120" width="200" height="76" rx="4"/>
  <text x="120" y="140" class="ms c">user/libsys/src/*.rs</text>
  <text x="120" y="158" class="s c">about 200 calls, by hand</text>
  <text x="120" y="176" class="s c">stubs.rs: the others, as stubs,</text>
  <text x="120" y="190" class="s c">and every alias</text>
  <path class="ln" d="M120,80 L120,118" marker-end="url(#a)"/>
  <text x="128" y="96" class="s">gen-stubs.py: the calls</text>
  <text x="128" y="110" class="s">with no hand-written function</text>
  <path class="ln" d="M220,158 L300,158" marker-end="url(#a)"/>
  <text x="260" y="138" class="s c">cargo rustc,</text>
  <text x="260" y="150" class="s c">one unit</text>
  <rect class="y" x="302" y="132" width="150" height="52" rx="3"/>
  <text x="377" y="154" class="ms c">oscraft_libsys.o</text>
  <text x="377" y="172" class="s c">one relocatable object</text>
  <rect class="g" x="302" y="30" width="150" height="60" rx="3"/>
  <text x="377" y="50" class="s c">FreeBSD's own files</text>
  <text x="377" y="66" class="ms c">__error.c, auxv.c, ...</text>
  <text x="377" y="82" class="s c">compiled as always</text>
  <rect class="g" x="500" y="20" width="280" height="290" rx="4"/>
  <text x="640" y="42" class="b c">FreeBSD's build, given the object</text>
  <rect class="w" x="516" y="60" width="248" height="44" rx="3"/>
  <text x="640" y="78" class="ms c">libsys.a, libsys.so.7</text>
  <text x="640" y="94" class="s c">the system-call library</text>
  <rect class="w" x="516" y="130" width="248" height="44" rx="3"/>
  <text x="640" y="148" class="ms c">libc.a</text>
  <text x="640" y="164" class="s c">static programs: the calls are inside</text>
  <rect class="w" x="516" y="200" width="248" height="44" rx="3"/>
  <text x="640" y="218" class="ms c">ld-elf.so.1</text>
  <text x="640" y="234" class="s c">the dynamic loader's private copy</text>
  <rect class="w" x="516" y="258" width="248" height="44" rx="3"/>
  <text x="640" y="276" class="ms c">libc.so.7, libthr.so.3</text>
  <text x="640" y="292" class="s c">unchanged: they import from libsys.so</text>
  <path class="ln" d="M452,158 L476,158 L476,82 L514,82" marker-end="url(#a)"/>
  <path class="ln" d="M452,158 L476,158 L476,152 L514,152" marker-end="url(#a)"/>
  <path class="ln" d="M452,158 L476,158 L476,222 L514,222" marker-end="url(#a)"/>
  <path class="lng" d="M452,60 L486,60 L486,72 L514,72" marker-end="url(#ag)"/>
  <text x="377" y="204" class="s c">takes the place of FreeBSD's</text>
  <text x="377" y="218" class="s c">generated trap stubs,</text>
  <text x="377" y="232" class="s c">cerror and vfork</text>
</svg>
