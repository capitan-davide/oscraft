<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <rect class="k" x="20" y="20" width="220" height="34" rx="4"/>
  <text x="130" y="42" class="h c">libsys, in open()</text>
  <rect class="k" x="290" y="20" width="220" height="34" rx="4"/>
  <text x="400" y="42" class="h c">pathname manager</text>
  <rect class="u" x="560" y="20" width="220" height="34" rx="4"/>
  <text x="670" y="42" class="h c">tmpfs</text>
  <path class="life" d="M130,54 L130,330"/>
  <path class="life" d="M400,54 L400,330"/>
  <path class="life" d="M670,54 L670,330"/>
  <path class="lnk" d="M130,92 L400,92" marker-end="url(#ak)"/>
  <circle cx="148" cy="78" r="9" fill="#2c5d9b"/>
  <text x="148" y="82" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="164" y="82" class="s">connect request, on the connection to process 1</text>
  <text x="164" y="106" class="ms">"/tmp/notes", open, read-only</text>
  <path class="lng" d="M400,150 L130,150" marker-end="url(#ag)"/>
  <circle cx="148" cy="136" r="9" fill="#3e7b34"/>
  <text x="148" y="140" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="164" y="140" class="s">a link: the servers whose prefix matches</text>
  <text x="164" y="164" class="ms">{ tmpfs's process and channel, the prefix's length }</text>
  <rect class="wk" x="30" y="176" width="200" height="40" rx="3"/>
  <circle cx="46" cy="196" r="9" fill="#2c5d9b"/>
  <text x="46" y="200" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="140" y="193" class="ms c">ConnectAttach(process,</text>
  <text x="140" y="207" class="ms c">channel): connection 3</text>
  <path class="lnk" d="M230,252 L670,252" marker-end="url(#ak)"/>
  <circle cx="248" cy="238" r="9" fill="#2c5d9b"/>
  <text x="248" y="242" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="264" y="242" class="s">the same request on the new connection, the prefix removed</text>
  <text x="264" y="266" class="ms">"notes", open, read-only</text>
  <path class="lng" d="M670,310 L130,310" marker-end="url(#ag)"/>
  <circle cx="148" cy="296" r="9" fill="#3e7b34"/>
  <text x="148" y="300" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="164" y="300" class="s">status 0: the file is open</text>
  <rect class="g" x="30" y="322" width="200" height="26" rx="3"/>
  <text x="130" y="340" class="ms c">open() returns 3</text>
  <rect class="w" x="20" y="366" width="760" height="62" rx="3"/>
  <text x="32" y="384" class="b">Other answers a server may give in step 5</text>
  <text x="32" y="402" class="s">ENOENT: libsys detaches and tries the next server of the list; with none left, open() fails with it.</text>
  <text x="32" y="418" class="s">A link with a path and no servers: the name is a symbolic link; start again at step 1 with its target, at most 16 times.</text>
</svg>
