<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="210" y="24" class="h c">on FreeBSD</text>
  <text x="590" y="24" class="h c">on OsCraft</text>
  <rect class="u" x="40" y="40" width="340" height="44" rx="4"/>
  <text x="210" y="60" class="b c">the program</text>
  <text x="210" y="76" class="ms c">f = fopen("/tmp/notes", "r");</text>
  <rect class="g" x="40" y="100" width="340" height="62" rx="4"/>
  <text x="210" y="120" class="b c">FreeBSD's libc</text>
  <text x="210" y="137" class="s c">fopen() parses the mode, allocates the FILE,</text>
  <text x="210" y="152" class="s c">and calls the function __sys_openat()</text>
  <path class="ln" d="M210,84 L210,98" marker-end="url(#a)"/>
  <path class="ln" d="M210,162 L210,186" marker-end="url(#a)"/>
  <rect class="u" x="420" y="40" width="340" height="44" rx="4"/>
  <text x="590" y="60" class="b c">the program</text>
  <text x="590" y="76" class="ms c">f = fopen("/tmp/notes", "r");</text>
  <rect class="g" x="420" y="100" width="340" height="62" rx="4"/>
  <text x="590" y="120" class="b c">FreeBSD's libc</text>
  <text x="590" y="137" class="s c">fopen() parses the mode, allocates the FILE,</text>
  <text x="590" y="152" class="s c">and calls the function __sys_openat()</text>
  <path class="ln" d="M590,84 L590,98" marker-end="url(#a)"/>
  <path class="ln" d="M590,162 L590,186" marker-end="url(#a)"/>
  <rect class="frame" x="28" y="32" width="744" height="138" rx="6"/>
  <text x="400" y="182" class="s c">the same compiled code on both systems</text>
  <rect class="g" x="40" y="188" width="340" height="62" rx="4"/>
  <text x="210" y="208" class="b c">libsys: FreeBSD's stubs</text>
  <text x="210" y="225" class="s c">__sys_openat: put number 499 in a register,</text>
  <text x="210" y="240" class="s c">trap; on failure store errno, return -1</text>
  <path class="ln" d="M210,250 L210,284" marker-end="url(#a)"/>
  <text x="218" y="271" class="s">one trap</text>
  <rect class="n" x="40" y="286" width="340" height="96" rx="4"/>
  <text x="210" y="306" class="b c">FreeBSD's kernel</text>
  <rect class="w" x="54" y="316" width="150" height="54" rx="3"/>
  <text x="129" y="338" class="s c">the table of calls:</text>
  <text x="129" y="354" class="ms c">499: sys_openat()</text>
  <rect class="w" x="216" y="316" width="150" height="54" rx="3"/>
  <text x="291" y="338" class="s c">the file systems,</text>
  <text x="291" y="354" class="s c">in the kernel</text>
  <path class="ln" d="M204,343 L214,343" marker-end="url(#a)"/>
  <rect class="k" x="420" y="188" width="340" height="62" rx="4"/>
  <text x="590" y="208" class="b c">libsys: OsCraft's</text>
  <text x="590" y="225" class="s c">__sys_openat: ask who owns the path, connect</text>
  <text x="590" y="240" class="s c">to that server, send it an open request</text>
  <path class="ln" d="M590,250 L590,284" marker-end="url(#a)"/>
  <text x="598" y="271" class="s">kernel calls</text>
  <rect class="k" x="420" y="286" width="160" height="96" rx="4"/>
  <text x="500" y="306" class="b c">OsCraft's kernel</text>
  <text x="500" y="330" class="s c">carries the</text>
  <text x="500" y="345" class="s c">messages</text>
  <rect class="u" x="600" y="286" width="160" height="96" rx="4"/>
  <text x="680" y="306" class="b c">servers</text>
  <text x="680" y="330" class="s c">the pathname manager,</text>
  <text x="680" y="345" class="s c">then tmpfs,</text>
  <text x="680" y="360" class="s c">which owns /tmp</text>
  <path class="ln" d="M580,334 L598,334" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
