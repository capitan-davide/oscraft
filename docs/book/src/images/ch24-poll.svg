<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
  <rect class="k" x="20" y="20" width="180" height="34" rx="4"/>
  <text x="110" y="42" class="h c">libsys, in poll()</text>
  <rect class="k" x="250" y="20" width="160" height="34" rx="4"/>
  <text x="330" y="42" class="h c">the kernel</text>
  <rect class="u" x="460" y="20" width="140" height="34" rx="4"/>
  <text x="530" y="42" class="h c">pty</text>
  <rect class="u" x="630" y="20" width="140" height="34" rx="4"/>
  <text x="700" y="42" class="h c">netd</text>
  <path class="life" d="M110,54 L110,410"/>
  <path class="life" d="M330,54 L330,410"/>
  <path class="life" d="M530,54 L530,410"/>
  <path class="life" d="M700,54 L700,410"/>
  <circle cx="34" cy="80" r="9" fill="#2c5d9b"/>
  <text x="34" y="84" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <path class="lnk" d="M110,84 L330,84" marker-end="url(#ak)"/>
  <text x="122" y="76" class="s">MsgRegisterEvent(): signal 57</text>
  <text x="122" y="100" class="s">to this thread, once per descriptor</text>
  <circle cx="34" cy="126" r="9" fill="#2c5d9b"/>
  <text x="34" y="130" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <path class="lnk" d="M110,130 L530,130" marker-end="url(#ak)"/>
  <path class="lnk" d="M110,154 L700,154" marker-end="url(#ak)"/>
  <text x="342" y="122" class="s">notify request: poll and arm</text>
  <text x="342" y="146" class="s">the same, to the other server</text>
  <path class="lng dash" d="M700,180 L110,180" marker-end="url(#ag)"/>
  <text x="342" y="174" class="s">both reply: nothing ready, armed</text>
  <circle cx="34" cy="206" r="9" fill="#2c5d9b"/>
  <text x="34" y="210" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <path class="lnk" d="M110,210 L330,210" marker-end="url(#ak)"/>
  <text x="122" y="202" class="s">TimerTimeout(), SignalWaitinfo()</text>
  <rect class="y" x="50" y="220" width="120" height="60" rx="3"/>
  <text x="110" y="246" class="s c">blocked, waiting</text>
  <text x="110" y="261" class="s c">for signal 57</text>
  <circle cx="756" cy="240" r="9" fill="#333333"/>
  <text x="756" y="244" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <rect class="wu" x="640" y="226" width="104" height="28" rx="3"/>
  <text x="692" y="244" class="s c">a packet arrives</text>
  <path class="ln" d="M640,262 L330,262" marker-end="url(#a)"/>
  <text x="342" y="276" class="s">MsgDeliverEvent()</text>
  <path class="lng" d="M330,290 L172,290" marker-end="url(#ag)"/>
  <text x="180" y="304" class="s">the signal ends the wait</text>
  <circle cx="34" cy="326" r="9" fill="#2c5d9b"/>
  <text x="34" y="330" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <path class="lnk" d="M110,330 L530,330" marker-end="url(#ak)"/>
  <path class="lnk" d="M110,354 L700,354" marker-end="url(#ak)"/>
  <text x="342" y="322" class="s">notify request: poll (which disarms)</text>
  <text x="342" y="346" class="s">the same</text>
  <path class="lng dash" d="M700,380 L110,380" marker-end="url(#ag)"/>
  <text x="342" y="374" class="s">pty: nothing; netd: input</text>
  <rect class="g" x="20" y="390" width="180" height="26" rx="3"/>
  <text x="110" y="408" class="ms c">poll() returns 1</text>
</svg>
