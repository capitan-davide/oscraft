<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
  <rect class="u" x="25" y="14" width="190" height="44" rx="4"/>
  <text x="120" y="33" class="b c">sh</text>
  <text x="120" y="49" class="s c">has /dev/ttyp0 open</text>
  <path class="life" d="M120,58 L120,415"/>
  <rect class="u" x="305" y="14" width="190" height="44" rx="4"/>
  <text x="400" y="33" class="b c">pty</text>
  <text x="400" y="49" class="s c">one thread</text>
  <path class="life" d="M400,58 L400,415"/>
  <rect class="u" x="585" y="14" width="190" height="44" rx="4"/>
  <text x="680" y="33" class="b c">a terminal program</text>
  <text x="680" y="49" class="s c">has /dev/ptyp0 open</text>
  <path class="life" d="M680,58 L680,415"/>
  <path class="lnk" d="M120,92 L398,92" marker-end="url(#ak)"/>
  <circle cx="144" cy="79" r="9" fill="#2c5d9b"/>
  <text x="144" y="83" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="160" y="83" class="s">read, 1024 bytes</text>
  <rect class="wu" x="295" y="100" width="210" height="44" rx="3"/>
  <text x="400" y="118" class="s c">no line yet: keeps the receive ID,</text>
  <text x="400" y="133" class="s c">returns RESMGR_NOREPLY</text>
  <rect class="y" x="70" y="100" width="100" height="232" rx="3"/>
  <text x="120" y="210" class="s c">REPLY-</text>
  <text x="120" y="224" class="s c">blocked</text>
  <rect class="g" x="295" y="152" width="210" height="30" rx="3"/>
  <text x="400" y="171" class="s c">receives again: free for others</text>
  <path class="lnk" d="M680,216 L402,216" marker-end="url(#ak)"/>
  <circle cx="426" cy="203" r="9" fill="#2c5d9b"/>
  <text x="426" y="207" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="442" y="207" class="s">write "ls" and a newline</text>
  <rect class="wu" x="295" y="224" width="210" height="44" rx="3"/>
  <text x="400" y="242" class="s c">line discipline: a complete</text>
  <text x="400" y="257" class="s c">line is ready for the reader</text>
  <path class="lng" d="M400,296 L678,296" marker-end="url(#ag)"/>
  <circle cx="424" cy="283" r="9" fill="#3e7b34"/>
  <text x="424" y="287" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="440" y="287" class="s">reply: 3 bytes written</text>
  <path class="lng" d="M400,332 L172,332" marker-end="url(#ag)"/>
  <circle cx="196" cy="319" r="9" fill="#3e7b34"/>
  <text x="196" y="323" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="212" y="323" class="s">reply to the kept receive ID: the line</text>
  <rect class="g" x="70" y="340" width="100" height="34" rx="3"/>
  <text x="120" y="361" class="s c">read() returns</text>
  <rect class="g" x="295" y="346" width="210" height="30" rx="3"/>
  <text x="400" y="365" class="s c">receives again</text>
  <text x="400" y="404" class="s c">Had a signal reached sh while it waited, the kernel would have sent pty an unblock pulse, and pty would have replied EINTR.</text>
</svg>
