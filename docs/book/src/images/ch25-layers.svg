<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
  <rect class="u" x="30" y="20" width="430" height="50" rx="4"/>
  <text x="46" y="42" class="b">the server's own functions</text>
  <text x="46" y="59" class="ms">open, read, write, devctl ... only those it needs</text>
  <text x="480" y="42" class="s">what the device or file system does</text>
  <rect class="k" x="30" y="78" width="430" height="50" rx="4"/>
  <text x="46" y="100" class="b">iofunc</text>
  <text x="46" y="117" class="ms">user/resmgr/src/iofunc.rs</text>
  <text x="480" y="100" class="s">attributes and open-control blocks; a default</text>
  <text x="480" y="115" class="s">for every request</text>
  <rect class="k" x="30" y="136" width="430" height="50" rx="4"/>
  <text x="46" y="158" class="b">resmgr</text>
  <text x="46" y="175" class="ms">user/resmgr/src/resmgr.rs</text>
  <text x="480" y="158" class="s">paths attached, connections bound to open</text>
  <text x="480" y="173" class="s">files, the replies</text>
  <rect class="k" x="30" y="194" width="430" height="50" rx="4"/>
  <text x="46" y="216" class="b">dispatch</text>
  <text x="46" y="233" class="ms">user/resmgr/src/dispatch.rs</text>
  <text x="480" y="216" class="s">the channel, the handlers by message type,</text>
  <text x="480" y="231" class="s">the receive loop</text>
  <rect class="k" x="30" y="252" width="430" height="50" rx="4"/>
  <text x="46" y="274" class="b">kercall</text>
  <text x="46" y="291" class="ms">user/kercall/</text>
  <text x="480" y="274" class="s">kernel calls as functions; the client side of</text>
  <text x="480" y="289" class="s">the protocol</text>
  <rect class="g" x="30" y="310" width="430" height="44" rx="4"/>
  <text x="46" y="330" class="b">FreeBSD's libc and libthr, Rust's std</text>
  <text x="46" y="346" class="s">memory, threads, mutexes, errno; over libsys</text>
  <text x="480" y="330" class="s">a server is an ordinary FreeBSD program,</text>
  <text x="480" y="345" class="s">linked statically</text>
  <path class="life" d="M10,363 L790,363"/>
  <rect class="k" x="30" y="372" width="430" height="40" rx="4"/>
  <text x="245.0" y="396" class="b c">the kernel: channels, messages, pulses</text>
  <text x="480" y="396" class="s">entered by a supervisor call</text>
</svg>
