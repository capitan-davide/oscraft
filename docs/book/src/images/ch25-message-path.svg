  <text x="400.0" y="29.0" class="b c">dispatch_block()</text>
  <text x="400.0" y="45.0" class="s c">MsgReceive into the thread's context</text>
  <path class="ln" d="M400,52 L400,72" marker-end="url(#a)"/>
