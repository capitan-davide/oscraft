<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <rect class="u" x="20" y="20" width="230" height="250" rx="4"/>
  <text x="135" y="42" class="b c">a program</text>
  <rect class="g" x="40" y="56" width="190" height="44" rx="3"/>
  <text x="135" y="75" class="b c">FreeBSD's libc</text>
  <text x="135" y="91" class="s c">syslog(): connect(), send()</text>
  <rect class="k" x="40" y="112" width="190" height="62" rx="3"/>
  <text x="135" y="131" class="b c">libsys</text>
  <text x="135" y="147" class="s c">sees the path /var/run/log</text>
  <text x="135" y="162" class="s c">and takes the socket's place</text>
  <path class="ln" d="M135,100 L135,110" marker-end="url(#a)"/>
  <rect class="y" x="300" y="150" width="200" height="120" rx="3"/>
  <text x="400" y="171" class="b c">the process's log ring</text>
  <text x="400" y="188" class="s c">shared memory, mapped by both</text>
  <rect class="w" x="318" y="204" width="28" height="26" rx="0"/>
  <rect class="g" x="346" y="204" width="28" height="26" rx="0"/>
  <rect class="g" x="374" y="204" width="28" height="26" rx="0"/>
  <rect class="g" x="402" y="204" width="28" height="26" rx="0"/>
  <rect class="w" x="430" y="204" width="28" height="26" rx="0"/>
  <rect class="w" x="458" y="204" width="28" height="26" rx="0"/>
  <text x="400" y="248" class="ms c">/dev/shmem/logring/&lt;pid&gt;.&lt;n&gt;</text>
  <rect class="u" x="550" y="20" width="230" height="250" rx="4"/>
  <text x="665" y="42" class="b c">syslogd</text>
  <rect class="wu" x="570" y="56" width="190" height="44" rx="3"/>
  <text x="665" y="75" class="m c">/var/run/log</text>
  <text x="665" y="91" class="s c">a read registers the caller</text>
  <rect class="wu" x="570" y="160" width="190" height="44" rx="3"/>
  <text x="665" y="179" class="b c">drain</text>
  <text x="665" y="195" class="s c">reads every ring until empty</text>
  <rect class="wu" x="570" y="214" width="190" height="44" rx="3"/>
  <text x="665" y="233" class="b c">rules of /etc/syslog.conf</text>
  <text x="665" y="249" class="s c">facility and level select outputs</text>
  <path class="ln" d="M665,204 L665,212" marker-end="url(#a)"/>
  <path class="lnk" d="M230,124 L270,124 L270,70 L568,70" marker-end="url(#ak)"/>
  <circle cx="300" cy="56" r="9" fill="#2c5d9b"/>
  <text x="300" y="60" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="316" y="60" class="s">open and read</text>
  <path class="lng" d="M568,88 L290,88 L290,142 L232,142" marker-end="url(#ag)"/>
  <circle cx="420" cy="102" r="9" fill="#3e7b34"/>
  <text x="420" y="106" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="436" y="106" class="s">the ring's name</text>
  <path class="ln" d="M230,166 L262,166 L262,216 L298,216" marker-end="url(#a)"/>
  <circle cx="72" cy="202" r="9" fill="#333333"/>
  <text x="72" y="206" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="88" y="200" class="s">writes a record:</text>
  <text x="88" y="214" class="s">no kernel call</text>
  <path class="lnk dash" d="M52,174 L52,300 L665,300 L665,272" marker-end="url(#ak)"/>
  <circle cx="330" cy="300" r="9" fill="#2c5d9b"/>
  <text x="330" y="304" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="346" y="318" class="s">a pulse, only if syslogd said it was going to sleep</text>
  <path class="ln" d="M568,182 L502,182" marker-end="url(#a)"/>
  <circle cx="535" cy="166" r="9" fill="#333333"/>
  <text x="535" y="170" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <rect class="y" x="550" y="340" width="110" height="40" rx="3"/>
  <text x="605" y="357" class="ms c">/var/log/</text>
  <text x="605" y="371" class="ms c">messages</text>
  <rect class="y" x="670" y="340" width="110" height="40" rx="3"/>
  <text x="725" y="364" class="ms c">/dev/console</text>
  <path class="ln" d="M620,270 L605,338" marker-end="url(#a)"/>
  <path class="ln" d="M710,270 L725,338" marker-end="url(#a)"/>
</svg>
