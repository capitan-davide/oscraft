<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <rect class="n" x="20" y="16" width="760" height="300" rx="4"/>
  <text x="40" y="36" class="b">the build host (x86-64 Linux, say)</text>
  <rect class="y" x="40" y="130" width="110" height="44" rx="3"/>
  <text x="95" y="157" class="m c">prog.c</text>
  <rect class="w" x="200" y="120" width="150" height="64" rx="3"/>
  <text x="275" y="142" class="b c">compiler</text>
  <text x="275" y="158" class="s c">told the target triple</text>
  <text x="275" y="173" class="ms c">aarch64-unknown-freebsd</text>
  <rect class="y" x="400" y="130" width="90" height="44" rx="3"/>
  <text x="445" y="157" class="m c">prog.o</text>
  <rect class="w" x="540" y="120" width="110" height="64" rx="3"/>
  <text x="595" y="148" class="b c">linker</text>
  <text x="595" y="165" class="s c">for the target</text>
  <rect class="u" x="690" y="124" width="76" height="56" rx="3"/>
  <text x="728" y="147" class="m c">prog</text>
  <text x="728" y="164" class="s c">runs on</text>
  <text x="728" y="176" class="s c">the target</text>
  <path class="ln" d="M150,152 L198,152" marker-end="url(#a)"/>
  <path class="ln" d="M350,152 L398,152" marker-end="url(#a)"/>
  <path class="ln" d="M490,152 L538,152" marker-end="url(#a)"/>
  <path class="ln" d="M650,152 L688,152" marker-end="url(#a)"/>
  <rect class="g" x="200" y="226" width="450" height="74" rx="3"/>
  <text x="425" y="246" class="b c">the sysroot: the target's own files, on the host</text>
  <rect class="w" x="215" y="256" width="130" height="34" rx="2"/>
  <text x="280" y="270" class="ms c">usr/include</text>
  <text x="280" y="283" class="s c">headers</text>
  <rect class="w" x="360" y="256" width="130" height="34" rx="2"/>
  <text x="425" y="270" class="ms c">usr/lib/crt1.o ...</text>
  <text x="425" y="283" class="s c">start-up objects</text>
  <rect class="w" x="505" y="256" width="130" height="34" rx="2"/>
  <text x="570" y="270" class="ms c">libc.a, libc.so</text>
  <text x="570" y="283" class="s c">libraries</text>
  <path class="lng" d="M275,224 L275,186" marker-end="url(#ag)"/>
  <path class="lng" d="M595,224 L595,186" marker-end="url(#ag)"/>
  <text x="603" y="210" class="s">crt objects, libraries</text>
  <text x="283" y="210" class="s">#include</text>
  <text x="275" y="84" class="s c">nothing from the host's own /usr/include or /usr/lib is used</text>
</svg>
