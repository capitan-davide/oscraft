<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="205" y="24" class="h c">Static</text>
  <rect class="u" x="40" y="40" width="150" height="150" rx="4"/>
  <text x="115" y="58" class="m c">prog</text>
  <rect class="wu" x="52" y="68" width="126" height="30" rx="2"/>
  <text x="115" y="87" class="s c">its own code</text>
  <rect class="g" x="52" y="102" width="126" height="38" rx="2"/>
  <text x="115" y="118" class="s c">the parts of libc.a</text>
  <text x="115" y="132" class="s c">it uses, copied in</text>
  <rect class="k" x="52" y="144" width="126" height="34" rx="2"/>
  <text x="115" y="165" class="s c">system-call layer</text>
  <text x="290" y="70" class="b c">at start</text>
  <text x="290" y="90" class="s c">the kernel's program</text>
  <text x="290" y="105" class="s c">loader maps one file</text>
  <text x="290" y="120" class="s c">and jumps to it</text>
  <path class="ln" d="M192,115 L226,115" marker-end="url(#a)"/>
  <text x="210" y="220" class="s c">needs nothing else in the image</text>
  <text x="210" y="235" class="s c">a new libc reaches it only</text>
  <text x="210" y="250" class="s c">when it is linked again</text>
  <path class="life" d="M400,14 L400,366"/>
  <text x="595" y="24" class="h c">Dynamic</text>
  <rect class="u" x="430" y="40" width="150" height="96" rx="4"/>
  <text x="505" y="58" class="m c">prog</text>
  <rect class="wu" x="442" y="68" width="126" height="30" rx="2"/>
  <text x="505" y="87" class="s c">its own code</text>
  <rect class="y" x="442" y="102" width="126" height="26" rx="2"/>
  <text x="505" y="119" class="ms c">needs: libc.so.7</text>
  <rect class="g" x="620" y="40" width="160" height="34" rx="3"/>
  <text x="700" y="61" class="ms c">/libexec/ld-elf.so.1</text>
  <rect class="g" x="620" y="96" width="160" height="34" rx="3"/>
  <text x="700" y="117" class="ms c">/lib/libc.so.7</text>
  <rect class="k" x="620" y="152" width="160" height="34" rx="3"/>
  <text x="700" y="173" class="ms c">/lib/libsys.so.7</text>
  <path class="lnk" d="M580,57 L618,57" marker-end="url(#ak)"/>
  <circle cx="599" cy="42" r="9" fill="#2c5d9b"/>
  <text x="599" y="46" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <path class="lng" d="M700,74 L700,94" marker-end="url(#ag)"/>
  <circle cx="718" cy="85" r="9" fill="#3e7b34"/>
  <text x="718" y="89" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <path class="lng" d="M700,130 L700,150" marker-end="url(#ag)"/>
  <circle cx="718" cy="141" r="9" fill="#3e7b34"/>
  <text x="718" y="145" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <path class="lng dash" d="M620,113 L570,113" marker-end="url(#ag)"/>
  <circle cx="595" cy="98" r="9" fill="#3e7b34"/>
  <text x="595" y="102" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="430" y="216" class="s">1  the program names its interpreter; the kernel's loader</text>
  <text x="430" y="232" class="s">    maps both and starts the interpreter</text>
  <text x="430" y="248" class="s">2  the interpreter maps each library the program needs,</text>
  <text x="430" y="264" class="s">3  and each library those need,</text>
  <text x="430" y="280" class="s">4  then binds the program's calls to them and jumps to it</text>
  <text x="605" y="318" class="s c">one copy of libc on the system; a new one</text>
  <text x="605" y="333" class="s c">reaches every program at its next start</text>
</svg>
