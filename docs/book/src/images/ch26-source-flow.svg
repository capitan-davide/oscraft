<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <rect class="g" x="20" y="16" width="230" height="50" rx="4"/>
  <text x="135" y="37" class="b c">FreeBSD stable/15</text>
  <text x="135" y="54" class="s c">at the commit in UPSTREAM_COMMIT</text>
  <rect class="y" x="20" y="86" width="230" height="50" rx="4"/>
  <text x="135" y="107" class="m c">tools/freebsd/patches/</text>
  <text x="135" y="124" class="s c">12 commits, kept as patches</text>
  <rect class="g" x="300" y="46" width="200" height="60" rx="4"/>
  <text x="400" y="68" class="b c">the fork, branch oscraft</text>
  <text x="400" y="85" class="s c">a checkout beside the</text>
  <text x="400" y="98" class="s c">repository: ../freebsd-src</text>
  <path class="ln" d="M250,41 L275,41 L275,66 L298,66" marker-end="url(#a)"/>
  <path class="ln" d="M250,111 L275,111 L275,86 L298,86" marker-end="url(#a)"/>
  <rect class="k" x="560" y="16" width="220" height="50" rx="4"/>
  <text x="670" y="37" class="b c">user/libsys  (Rust)</text>
  <text x="670" y="54" class="ms c">make libsys</text>
  <rect class="k" x="560" y="86" width="220" height="40" rx="3"/>
  <text x="670" y="104" class="m c">oscraft_libsys.o</text>
  <text x="670" y="118" class="s c">every system call, in one object</text>
  <path class="lnk" d="M670,66 L670,84" marker-end="url(#ak)"/>
  <rect class="w" x="200" y="160" width="400" height="60" rx="4"/>
  <text x="400" y="182" class="b c">FreeBSD's own build, cross from the host</text>
  <text x="400" y="199" class="ms c">make freebsd-libs   make freebsd-progs</text>
  <text x="400" y="213" class="s c">upstream clang and lld, target aarch64-unknown-freebsd</text>
  <path class="ln" d="M400,106 L400,158" marker-end="url(#a)"/>
  <path class="lnk" d="M670,126 L670,144 L540,144 L540,158" marker-end="url(#ak)"/>
  <text x="408" y="138" class="s">replaces the trap stubs</text>
  <rect class="g" x="60" y="256" width="680" height="86" rx="4"/>
  <text x="400" y="276" class="b c">the sysroot  (FreeBSD's temporary tree, in ../freebsd-obj)</text>
  <rect class="w" x="72" y="288" width="126" height="42" rx="2"/>
  <text x="135.0" y="305" class="ms c">usr/include</text>
  <text x="135.0" y="321" class="s c">headers</text>
  <rect class="w" x="204" y="288" width="126" height="42" rx="2"/>
  <text x="267.0" y="305" class="ms c">usr/lib</text>
  <text x="267.0" y="321" class="s c">crt objects, libc.a ...</text>
  <rect class="w" x="336" y="288" width="126" height="42" rx="2"/>
  <text x="399.0" y="305" class="ms c">lib</text>
  <text x="399.0" y="321" class="s c">libc.so.7, libsys.so.7 ...</text>
  <rect class="w" x="468" y="288" width="126" height="42" rx="2"/>
  <text x="531.0" y="305" class="ms c">libexec</text>
  <text x="531.0" y="321" class="s c">ld-elf.so.1</text>
  <rect class="w" x="600" y="288" width="126" height="42" rx="2"/>
  <text x="663.0" y="305" class="ms c">oscraft/bin</text>
  <text x="663.0" y="321" class="s c">sh, ls, ps, ifconfig ...</text>
  <path class="ln" d="M400,220 L400,254" marker-end="url(#a)"/>
  <rect class="u" x="60" y="376" width="220" height="48" rx="4"/>
  <text x="170" y="396" class="b c">the boot image</text>
  <text x="170" y="413" class="s c">programs, shared libraries, loader</text>
  <path class="ln" d="M170,342 L170,374" marker-end="url(#a)"/>
  <rect class="u" x="290" y="376" width="220" height="48" rx="4"/>
  <text x="400" y="396" class="b c">native servers and tests</text>
  <text x="400" y="413" class="s c">compiled and linked against it</text>
  <path class="ln" d="M400,342 L400,374" marker-end="url(#a)"/>
  <rect class="u" x="520" y="376" width="220" height="48" rx="4"/>
  <text x="630" y="396" class="b c">the SDK</text>
  <text x="630" y="413" class="s c">its headers and libraries, packed</text>
  <path class="ln" d="M630,342 L630,374" marker-end="url(#a)"/>
</svg>
