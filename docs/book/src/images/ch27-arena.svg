<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="20" y="26" class="h">the arena: 64 GB of addresses reserved at start (PROT_NONE), no memory behind them yet</text>
  <rect class="w" x="20" y="40" width="760" height="46" rx="4"/>
  <rect class="g" x="20" y="40" width="70" height="46" rx="0"/>
  <text x="55" y="60" class="c">2 MB</text>
  <text x="55" y="76" class="s c">backed</text>
  <rect class="g" x="90" y="40" width="70" height="46" rx="0"/>
  <text x="125" y="60" class="c">2 MB</text>
  <text x="125" y="76" class="s c">backed</text>
  <rect class="g" x="160" y="40" width="70" height="46" rx="0"/>
  <text x="195" y="60" class="c">2 MB</text>
  <text x="195" y="76" class="s c">backed</text>
  <text x="505" y="68" class="s c">reserved, backed 2 MB at a time when an allocation needs it</text>
  <text x="20" y="104" class="ms">base</text>
  <path class="ln" d="M230,96 L300,96" marker-end="url(#a)"/>
  <text x="306" y="100" class="s">grows this way, never shrinks</text>
  <text x="20" y="138" class="h">a struct vm_page for every page, in a second reserved range, backed along with the arena</text>
  <rect class="w" x="20" y="150" width="760" height="30" rx="4"/>
  <rect class="g" x="20" y="150" width="60" height="30" rx="0"/>
  <text x="50" y="169" class="s c">vm_page[]</text>
  <path class="lng dash" d="M125,86 L50,148" marker-end="url(#ag)"/>
  <text x="96" y="169" class="ms">PHYS_TO_VM_PAGE(a) = table + (a - base) / 4096: an index, not a search</text>
  <rect class="k" x="20" y="206" width="370" height="78" rx="4"/>
  <text x="205" y="226" class="b c">inside the server</text>
  <text x="205" y="244" class="s c">an address is its own "physical" address:</text>
  <text x="205" y="259" class="s c">pmap_kextract(va) = va, the direct map is the identity,</text>
  <text x="205" y="274" class="s c">so UMA, malloc(9) and mbufs run without a change</text>
  <rect class="u" x="410" y="206" width="370" height="78" rx="4"/>
  <text x="595" y="226" class="b c">for a device</text>
  <text x="595" y="244" class="s c">a device needs the real physical address:</text>
  <text x="595" y="259" class="s c">the process manager knows it (_MEM_OFFSET),</text>
  <text x="595" y="274" class="s c">and whether the next page follows on in RAM</text>
  <rect class="y" x="20" y="306" width="240" height="78" rx="4"/>
  <text x="140" y="326" class="b c">busdma memory</text>
  <text x="140" y="344" class="s c">bus_dmamem_alloc(): not from the arena;</text>
  <text x="140" y="359" class="s c">contiguous RAM from a typed-memory</text>
  <text x="140" y="374" class="s c">pool, mapped uncached</text>
  <rect class="y" x="280" y="306" width="240" height="78" rx="4"/>
  <text x="400" y="326" class="b c">buffers loaded into a map</text>
  <text x="400" y="344" class="s c">bus_dmamap_load() of an mbuf:</text>
  <text x="400" y="359" class="s c">one question per physically</text>
  <text x="400" y="374" class="s c">contiguous piece</text>
  <rect class="y" x="540" y="306" width="240" height="78" rx="4"/>
  <text x="660" y="326" class="b c">a module's own calls</text>
  <text x="660" y="344" class="s c">vtophys(): asks the process manager;</text>
  <text x="660" y="359" class="s c">contigmalloc(): arena memory, kept only</text>
  <text x="660" y="374" class="s c">if it is contiguous in RAM too</text>
  <path class="ln" d="M500,284 L140,304" marker-end="url(#a)"/>
  <path class="ln" d="M595,284 L400,304" marker-end="url(#a)"/>
  <path class="ln" d="M595,284 L660,304" marker-end="url(#a)"/>
</svg>
