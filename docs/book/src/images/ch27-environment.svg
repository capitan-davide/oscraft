<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="200" y="30" class="h c">in its own kernel</text>
  <rect class="g" x="20" y="44" width="360" height="50" rx="4"/>
  <text x="200" y="65" class="b c">a kernel subsystem</text>
  <text x="200" y="82" class="s c">the network stack, a bus, a driver</text>
  <rect class="y" x="20" y="118" width="360" height="96" rx="4"/>
  <text x="200" y="136" class="b c">what it calls and assumes</text>
  <text x="34" y="156" class="s">the current thread and CPU</text>
  <text x="210" y="156" class="s">mutexes, reader-writer locks</text>
  <text x="34" y="171" class="s">sleep and wakeup</text>
  <text x="210" y="171" class="s">memory allocators</text>
  <text x="34" y="186" class="s">timers and the clock</text>
  <text x="210" y="186" class="s">start-up order</text>
  <text x="34" y="201" class="s">buses and their resources</text>
  <text x="210" y="201" class="s">interrupts, addresses for DMA</text>
  <rect class="g" x="20" y="238" width="360" height="50" rx="4"/>
  <text x="200" y="259" class="b c">the rest of the kernel</text>
  <text x="200" y="276" class="s c">scheduler, virtual memory, clock, bus framework</text>
  <rect class="n" x="20" y="312" width="360" height="50" rx="4"/>
  <text x="200" y="333" class="b c">the machine</text>
  <text x="200" y="350" class="s c">kernel mode: every instruction is allowed</text>
  <path class="ln" d="M200,94 L200,116" marker-end="url(#a)"/>
  <path class="ln" d="M200,214 L200,236" marker-end="url(#a)"/>
  <path class="ln" d="M200,288 L200,310" marker-end="url(#a)"/>
  <text x="600" y="30" class="h c">moved into a process</text>
  <rect class="g" x="420" y="44" width="360" height="50" rx="4"/>
  <text x="600" y="65" class="b c">a kernel subsystem</text>
  <text x="600" y="82" class="s c">the same source, not edited</text>
  <rect class="y" x="420" y="118" width="360" height="96" rx="4"/>
  <text x="600" y="136" class="b c">what it calls and assumes</text>
  <text x="434" y="156" class="s">the current thread and CPU</text>
  <text x="610" y="156" class="s">mutexes, reader-writer locks</text>
  <text x="434" y="171" class="s">sleep and wakeup</text>
  <text x="610" y="171" class="s">memory allocators</text>
  <text x="434" y="186" class="s">timers and the clock</text>
  <text x="610" y="186" class="s">start-up order</text>
  <text x="434" y="201" class="s">buses and their resources</text>
  <text x="610" y="201" class="s">interrupts, addresses for DMA</text>
  <rect class="k" x="420" y="238" width="360" height="50" rx="4"/>
  <text x="600" y="259" class="b c">an environment layer</text>
  <text x="600" y="276" class="s c">the same functions, written again over the host</text>
  <rect class="n" x="420" y="312" width="360" height="50" rx="4"/>
  <text x="600" y="333" class="b c">the host system</text>
  <text x="600" y="350" class="s c">threads, mutexes, mappings, timers, messages</text>
  <path class="ln" d="M600,94 L600,116" marker-end="url(#a)"/>
  <path class="ln" d="M600,214 L600,236" marker-end="url(#a)"/>
  <path class="ln" d="M600,288 L600,310" marker-end="url(#a)"/>
  <path class="life" d="M400,20 L400,372"/>
  <text x="400" y="390" class="s c">The interfaces in the middle stay the same. What answers them changes.</text>
</svg>
