<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <rect class="u" x="20" y="14" width="175" height="30" rx="4"/>
  <text x="107" y="34" class="b c">thread A: waits for data</text>
  <path class="life" d="M107,44 L107,356"/>
  <rect class="g" x="215" y="14" width="175" height="30" rx="4"/>
  <text x="302" y="34" class="b c">FreeBSD's code, not edited</text>
  <path class="life" d="M302,44 L302,356"/>
  <rect class="k" x="410" y="14" width="175" height="30" rx="4"/>
  <text x="497" y="34" class="b c">bsdkern</text>
  <path class="life" d="M497,44 L497,356"/>
  <rect class="u" x="605" y="14" width="175" height="30" rx="4"/>
  <text x="692" y="34" class="b c">thread B: has the data</text>
  <path class="life" d="M692,44 L692,356"/>
  <rect class="w" x="24" y="58" width="167" height="26" rx="3"/>
  <text x="107" y="74" class="ms c">msleep(chan, &amp;mtx, ...)</text>
  <path class="ln" d="M191,71 L217,71" marker-end="url(#a)"/>
  <circle cx="204" cy="56" r="9" fill="#333333"/>
  <text x="204" y="60" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <rect class="w" x="219" y="58" width="167" height="38" rx="3"/>
  <text x="302" y="74" class="ms c">sleepq_add(), sleepq_wait()</text>
  <text x="302" y="89" class="s c">A joins chan's queue</text>
  <path class="ln" d="M302,96 L302,106" marker-end="url(#a)"/>
  <rect class="w" x="219" y="108" width="167" height="38" rx="3"/>
  <text x="302" y="124" class="ms c">mi_switch()</text>
  <text x="302" y="139" class="s c">would switch to another thread</text>
  <path class="ln" d="M386,127 L412,127" marker-end="url(#a)"/>
  <circle cx="399" cy="112" r="9" fill="#333333"/>
  <text x="399" y="116" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <rect class="w" x="414" y="108" width="167" height="38" rx="3"/>
  <text x="497" y="124" class="ms c">sched_switch()</text>
  <text x="497" y="139" class="s c">set inhibited, drop the lock</text>
  <path class="ln" d="M497,146 L497,156" marker-end="url(#a)"/>
  <rect class="y" x="414" y="158" width="167" height="38" rx="3"/>
  <text x="497" y="174" class="ms c">park</text>
  <text x="497" y="189" class="s c">wait on A's condition variable</text>
  <rect class="y" x="24" y="96" width="167" height="206" rx="3"/>
  <text x="107" y="196" class="s c">A's pthread is blocked</text>
  <text x="107" y="212" class="s c">in the microkernel</text>
  <rect class="w" x="609" y="212" width="167" height="26" rx="3"/>
  <text x="692" y="228" class="ms c">wakeup(chan)</text>
  <path class="ln" d="M609,225 L388,225" marker-end="url(#a)"/>
  <circle cx="497" cy="211" r="9" fill="#333333"/>
  <text x="497" y="215" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <rect class="w" x="219" y="212" width="167" height="38" rx="3"/>
  <text x="302" y="228" class="ms c">sleepq_broadcast()</text>
  <text x="302" y="243" class="s c">A leaves chan's queue</text>
  <path class="ln" d="M302,250 L302,276 L412,276" marker-end="url(#a)"/>
  <circle cx="399" cy="261" r="9" fill="#333333"/>
  <text x="399" y="265" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <rect class="w" x="414" y="264" width="167" height="38" rx="3"/>
  <text x="497" y="280" class="ms c">sched_wakeup()</text>
  <text x="497" y="295" class="s c">clear inhibited, unpark A</text>
  <path class="lng" d="M414,294 L193,294" marker-end="url(#ag)"/>
  <rect class="w" x="609" y="264" width="167" height="38" rx="3"/>
  <text x="692" y="280" class="ms c">wakeup() returns</text>
  <text x="692" y="295" class="s c">B never blocked</text>
  <rect class="g" x="24" y="312" width="167" height="38" rx="3"/>
  <text x="107" y="328" class="ms c">msleep() returns</text>
  <text x="107" y="343" class="s c">with mtx held again</text>
  <text x="400" y="376" class="s c">The sleep queues, their hash chains and their timeouts are FreeBSD's. Only the last step differs:</text>
  <text x="400" y="392" class="s c">where a kernel would switch to another thread, bsdkern blocks the pthread, and the microkernel</text>
  <text x="400" y="408" class="s c">chooses what runs next. A wakeup that arrives before the park is not lost: the park returns at once.</text>
</svg>
