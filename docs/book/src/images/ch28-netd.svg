  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>
  <rect class="u" x="20" y="20" width="170" height="50" rx="4"/>
  <text x="105" y="40" class="b c">a program</text>
  <text x="105" y="57" class="s c">libc, libsys: socket(), recv()</text>
  <rect class="u" x="210" y="20" width="170" height="50" rx="4"/>
  <text x="295" y="40" class="b c">ifconfig, route, netstat</text>
  <text x="295" y="57" class="s c">ioctl(), sysctl(), routing sockets</text>
  <rect class="u" x="400" y="20" width="170" height="50" rx="4"/>
  <text x="485" y="40" class="b c">kldload, kldstat</text>
  <text x="485" y="57" class="s c">kldload(2) and its family</text>
  <rect class="k" x="20" y="110" width="560" height="340" rx="4"/>
  <text x="34" y="130" class="h">netd, one process</text>
  <rect class="wk" x="36" y="142" width="528" height="74" rx="3"/>
  <text x="300" y="160" class="b c">the front end (Rust, user/netd/src)</text>
  <text x="48" y="180" class="m">/dev/socket/2   /28   /1   /17   /38</text>
  <text x="48" y="196" class="s">one name per domain: inet, inet6, unix, route, netlink</text>
  <text x="468" y="180" class="m">/dev/netd</text>
  <text x="468" y="196" class="s">(modules)</text>
  <text x="300" y="210" class="s c">a pool of threads, each serving one message at a time</text>
  <rect class="wk" x="400" y="228" width="164" height="44" rx="3"/>
  <text x="482" y="246" class="b c">AF_UNIX</text>
  <text x="482" y="262" class="s c">netd's own (unix.rs)</text>
  <rect class="g" x="36" y="228" width="350" height="44" rx="3"/>
  <text x="211" y="246" class="c">sock.c: one function per socket operation</text>
  <text x="211" y="262" class="ms c">bsdnet_socket(), bsdnet_recv(), bsdnet_sysctl() ...</text>
  <rect class="g" x="36" y="284" width="350" height="78" rx="3"/>
  <text x="211" y="302" class="b c">libbsdnet.a: FreeBSD's network stack</text>
  <text x="211" y="320" class="s c">sockets, mbufs, TCP, UDP, IPv4, IPv6, routing,</text>
  <text x="211" y="334" class="s c">Ethernet, the loopback interface lo0,</text>
  <text x="211" y="348" class="s c">the bus framework and the module linker</text>
  <rect class="g" x="400" y="284" width="164" height="78" rx="3"/>
  <text x="482" y="302" class="b c">modules (.ko)</text>
  <text x="482" y="320" class="s c">pci, virtio, virtio_pci,</text>
  <text x="482" y="334" class="s c">if_vtnet: the driver</text>
  <text x="482" y="348" class="s c">ipfw: a packet filter</text>
  <rect class="wk" x="36" y="374" width="528" height="62" rx="3"/>
  <text x="300" y="392" class="b c">bsdkern (Chapter 27): what FreeBSD's kernel code expects of its kernel</text>
  <text x="300" y="410" class="s c">threads and sleeping, locks, memory, timers, interrupt threads, busdma, dlopen() for modules</text>
  <text x="300" y="426" class="s c">over FreeBSD's libc and libthr, and libsys</text>
