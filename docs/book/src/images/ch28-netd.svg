  <path class="lnk" d="M295,70 L295,140" marker-end="url(#ak)"/>
  <path class="lnk" d="M485,70 L485,140" marker-end="url(#ak)"/>
  <text x="200" y="95" class="s c blue">messages</text>
  <path class="ln" d="M211,216 L211,226" marker-end="url(#a)"/>
  <path class="ln" d="M482,216 L482,226" marker-end="url(#a)"/>
  <path class="ln" d="M211,272 L211,282" marker-end="url(#a)"/>
  <path class="ln" d="M386,323 L398,323" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect class="u" x="620" y="130" width="160" height="56" rx="4"/>
  <text x="700" y="150" class="b c">pcid</text>
  <text x="700" y="166" class="s c">where the device is:</text>
  <text x="700" y="180" class="s c">its registers, its interrupt</text>
  <rect class="k" x="620" y="220" width="160" height="70" rx="4"/>
  <text x="700" y="240" class="b c">process 1</text>
  <text x="700" y="256" class="s c">maps the registers;</text>
  <text x="700" y="270" class="s c">tells physical addresses</text>
  <text x="700" y="284" class="s c">of netd's memory</text>
  <rect class="k" x="620" y="324" width="160" height="56" rx="4"/>
  <text x="700" y="344" class="b c">the microkernel</text>
  <text x="700" y="360" class="s c">the device's interrupt</text>
  <text x="700" y="374" class="s c">wakes a thread of netd</text>
  <rect class="n" x="620" y="410" width="160" height="40" rx="4"/>
  <text x="700" y="428" class="c">virtio network device</text>
  <text x="700" y="442" class="s c">queues in netd's memory</text>
  <path class="lnk" d="M580,158 L618,158" marker-end="url(#ak)"/>
  <path class="lnk" d="M580,255 L618,255" marker-end="url(#ak)"/>
  <path class="lng" d="M618,352 L582,352" marker-end="url(#ag)"/>
