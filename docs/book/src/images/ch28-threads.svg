<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <rect class="u" x="10" y="14" width="160" height="42" rx="4"/>
  <text x="90" y="32" class="b c">program A</text>
  <text x="90" y="48" class="ms c">recv(s, ...)</text>
  <path class="life" d="M90,56 L90,406"/>
  <rect class="k" x="220" y="14" width="160" height="42" rx="4"/>
  <text x="300" y="32" class="b c">netd, thread 1</text>
  <text x="300" y="48" class="s c"></text>
  <path class="life" d="M300,56 L300,406"/>
  <rect class="k" x="430" y="14" width="160" height="42" rx="4"/>
  <text x="510" y="32" class="b c">netd, thread 2</text>
  <text x="510" y="48" class="s c"></text>
  <path class="life" d="M510,56 L510,406"/>
  <rect class="u" x="630" y="14" width="160" height="42" rx="4"/>
  <text x="710" y="32" class="b c">program B</text>
  <text x="710" y="48" class="ms c">send(s2, ...)</text>
  <path class="life" d="M710,56 L710,406"/>
  <text x="300" y="48" class="s c">waiting to receive</text>
  <text x="510" y="48" class="s c">does not exist yet</text>
  <path class="lnk" d="M90,90 L298,90" marker-end="url(#ak)"/>
  <circle cx="110" cy="77" r="9" fill="#2c5d9b"/>
  <text x="110" y="81" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="126" y="81" class="s">read request, a socket receive</text>
  <rect class="wk" x="210" y="100" width="180" height="44" rx="3"/>
  <text x="300" y="118" class="s c">nobody else is receiving:</text>
  <text x="300" y="134" class="s c">start another thread first</text>
  <path class="ln dash" d="M390,122 L508,122" marker-end="url(#a)"/>
  <circle cx="412" cy="109" r="9" fill="#333333"/>
  <text x="412" y="113" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <rect class="wk" x="430" y="132" width="160" height="28" rx="3"/>
  <text x="510" y="150" class="s c">waiting to receive</text>
  <rect class="y" x="210" y="158" width="180" height="58" rx="3"/>
  <text x="300" y="176" class="s c">soreceive(): the socket's</text>
  <text x="300" y="191" class="s c">buffer is empty,</text>
  <text x="300" y="206" class="s c">the thread sleeps</text>
  <rect class="y" x="20" y="110" width="140" height="44" rx="3"/>
  <text x="90" y="128" class="s c">REPLY-blocked</text>
  <text x="90" y="144" class="s c">for as long as it takes</text>
  <path class="lnk" d="M710,244 L512,244" marker-end="url(#ak)"/>
  <circle cx="532" cy="231" r="9" fill="#2c5d9b"/>
  <text x="532" y="235" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="548" y="235" class="s">write request, a socket send</text>
  <rect class="wk" x="420" y="254" width="180" height="58" rx="3"/>
  <text x="510" y="272" class="s c">sosend(): the datagram goes</text>
  <text x="510" y="287" class="s c">down and up the stack to</text>
  <text x="510" y="302" class="s c">A's socket; wake its sleeper</text>
  <path class="lng" d="M420,290 L302,290" marker-end="url(#ag)"/>
  <circle cx="322" cy="277" r="9" fill="#3e7b34"/>
  <text x="322" y="281" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <path class="lng" d="M510,340 L708,340" marker-end="url(#ag)"/>
  <circle cx="530" cy="327" r="9" fill="#3e7b34"/>
  <text x="530" y="331" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="546" y="331" class="s">sent: n bytes</text>
  <rect class="wk" x="210" y="300" width="180" height="30" rx="3"/>
  <text x="300" y="319" class="s c">soreceive() returns the data</text>
  <path class="lng" d="M300,372 L92,372" marker-end="url(#ag)"/>
  <circle cx="112" cy="359" r="9" fill="#3e7b34"/>
  <text x="112" y="363" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">6</text>
  <text x="128" y="363" class="s">the data</text>
  <text x="400" y="398" class="s c">both threads go back to waiting for a message</text>
</svg>
