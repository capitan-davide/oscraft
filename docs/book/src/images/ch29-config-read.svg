  <text x="533.0" y="184" class="ms c">d_ioctl()</text>
  <path class="ln" d="M596,220 L722,220" marker-end="url(#a)"/>
  <text x="659.0" y="214" class="ms c">PCIB_READ_CONFIG()</text>
