  <text x="659.0" y="281" class="s c">the value</text>
  <path class="lng dash" d="M596,308 L470,308" marker-end="url(#ag)"/>
  <text x="533.0" y="303" class="s c">struct pci_io</text>
  <path class="lng dash" d="M470,330 L334,330" marker-end="url(#ag)"/>
  <text x="402.0" y="325" class="s c">the reply</text>
  <path class="lng dash" d="M334,352 L208,352" marker-end="url(#ag)"/>
  <text x="271.0" y="347" class="s c">0</text>
  <path class="lng dash" d="M208,374 L82,374" marker-end="url(#ag)"/>
  <text x="145.0" y="369" class="s c">the value</text>
  <text x="400" y="420" class="s c">Each arrow to the right is an ordinary function call, except the one between the servers. The answer returns the same way.</text>
