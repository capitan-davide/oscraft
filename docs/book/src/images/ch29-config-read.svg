  <text x="82" y="49" class="b c">virtio_pci</text>
  <text x="82" y="64" class="s c">FreeBSD's driver</text>
  <path class="life" d="M82,72 L82,384"/>
  <rect class="k" x="150" y="32" width="116" height="40" rx="4"/>
  <text x="208" y="49" class="b c">pci0</text>
  <text x="208" y="64" class="s c">the client bus</text>
  <path class="life" d="M208,72 L208,384"/>
  <rect class="k" x="276" y="32" width="116" height="40" rx="4"/>
  <text x="334" y="49" class="b c">libc, libsys</text>
  <text x="334" y="64" class="s c"></text>
  <path class="life" d="M334,72 L334,384"/>
  <rect class="k" x="412" y="32" width="116" height="40" rx="4"/>
  <text x="470" y="49" class="b c">devfs</text>
