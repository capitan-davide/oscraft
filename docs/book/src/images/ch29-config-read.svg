  <path class="ln" d="M82,100 L208,100" marker-end="url(#a)"/>
  <text x="145.0" y="94" class="ms c">pci_read_config(dev, reg, 4)</text>
  <path class="ln" d="M208,130 L334,130" marker-end="url(#a)"/>
  <text x="271.0" y="124" class="ms c">ioctl(fd, PCIOCREAD, &amp;io)</text>
