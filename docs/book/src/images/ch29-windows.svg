<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="150" y="24" class="h c">CPU physical addresses</text>
  <text x="650" y="24" class="h c">PCI bus addresses</text>
  <rect class="n" x="20" y="40" width="260" height="50" rx="0"/>
  <text x="150.0" y="69.0" class="c">memory</text>
  <rect class="w" x="20" y="90" width="260" height="34" rx="0"/>
  <text x="150.0" y="111.0" class="c">other devices</text>
  <rect class="g" x="20" y="124" width="260" height="80" rx="0"/>
  <text x="150.0" y="160.0" class="c">the bridge's memory window</text>
  <text x="150.0" y="177.0" class="s c">what the CPU reads and writes here goes to the bus</text>
  <rect class="w" x="20" y="204" width="260" height="34" rx="0"/>
  <text x="150.0" y="225.0" class="c"></text>
  <rect class="y" x="20" y="238" width="260" height="80" rx="0"/>
  <text x="150.0" y="274.0" class="c">ECAM</text>
  <text x="150.0" y="291.0" class="s c">the configuration space of every function</text>
  <rect class="g" x="520" y="124" width="260" height="34" rx="0"/>
  <text x="650.0" y="145.0" class="c">BAR 4 of 00:01.0</text>
  <rect class="g" x="520" y="158" width="260" height="24" rx="0"/>
  <text x="650.0" y="174.0" class="c">BAR 0 of 00:02.0</text>
  <rect class="w" x="520" y="182" width="260" height="22" rx="0"/>
  <text x="650.0" y="197.0" class="c">free</text>
  <path class="lng" d="M280,124 L518,124" marker-end="url(#ag)"/>
  <path class="lng" d="M280,204 L518,204" marker-end="url(#ag)"/>
  <text x="400" y="150" class="s c">outbound window:</text>
  <text x="400" y="165" class="s c">bus address = CPU address</text>
  <text x="400" y="180" class="s c">minus a fixed offset</text>
  <rect class="n" x="520" y="40" width="260" height="50" rx="0"/>
  <text x="650" y="62" class="s c">a device doing DMA sees memory</text>
  <text x="650" y="77" class="s c">through an inbound window</text>
  <path class="ln dash" d="M518,65 L282,65" marker-end="url(#a)"/>
  <rect class="wk" x="310" y="238" width="470" height="80" rx="4"/>
  <text x="545" y="257" class="b c">one 4 KB page of ECAM per function</text>
  <text x="545" y="279" class="ms c">address = base + (bus &lt;&lt; 20 | device &lt;&lt; 15 | function &lt;&lt; 12)</text>
  <text x="545" y="299" class="s c">then the register's offset inside the page</text>
  <path class="life" d="M280,278 L310,278"/>
  <text x="20" y="346" class="s">A device's registers are in the green window, at the address its BAR was given. Its configuration space is elsewhere,</text>
  <text x="20" y="362" class="s">in the yellow region, at an address computed from its bus, device and function numbers.</text>
</svg>
