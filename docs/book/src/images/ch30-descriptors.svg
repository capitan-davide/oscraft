<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
  <rect class="y" x="20" y="20" width="230" height="92" rx="4"/>
  <text x="135" y="40" class="b c">device descriptor</text>
  <text x="34" y="60" class="s">vendor and product IDs</text>
  <text x="34" y="75" class="s">device class</text>
  <text x="34" y="90" class="s">number of configurations</text>
  <rect class="g" x="20" y="150" width="230" height="66" rx="4"/>
  <text x="135" y="170" class="b c">endpoint 0</text>
  <text x="135" y="188" class="s c">control, both directions;</text>
  <text x="135" y="202" class="s c">exists before any configuration</text>
  <rect class="y" x="300" y="20" width="480" height="390" rx="4"/>
  <text x="540" y="40" class="b c">configuration 1</text>
  <text x="540" y="56" class="s c">the host selects one: SET_CONFIGURATION</text>
  <path class="ln" d="M250,60 L298,60" marker-end="url(#a)"/>
  <rect class="w" x="320" y="76" width="440" height="100" rx="3"/>
  <text x="540" y="94" class="b c">interface 0: class Communications</text>
  <text x="540" y="110" class="s c">what kind of network adapter this is, and its Ethernet address</text>
  <rect class="g" x="420" y="124" width="240" height="40" rx="3"/>
  <text x="540" y="141" class="c">endpoint 1 IN: interrupt</text>
  <text x="540" y="156" class="s c">link up, link down</text>
  <rect class="w" x="320" y="192" width="440" height="204" rx="3"/>
  <text x="540" y="210" class="b c">interface 1: class Data</text>
  <text x="540" y="226" class="s c">two alternate settings; the host selects one: SET_INTERFACE</text>
  <rect class="n" x="336" y="240" width="190" height="140" rx="3"/>
  <text x="431" y="260" class="c">alternate setting 0</text>
  <text x="431" y="300" class="s c">no endpoints:</text>
  <text x="431" y="315" class="s c">the adapter is idle</text>
  <rect class="wk" x="554" y="240" width="190" height="140" rx="3"/>
  <text x="649" y="260" class="c">alternate setting 1</text>
  <rect class="g" x="566" y="274" width="166" height="40" rx="3"/>
  <text x="649" y="291" class="c">endpoint 2 IN: bulk</text>
  <text x="649" y="306" class="s c">received packets</text>
  <rect class="g" x="566" y="326" width="166" height="40" rx="3"/>
  <text x="649" y="343" class="c">endpoint 2 OUT: bulk</text>
  <text x="649" y="358" class="s c">packets to send</text>
  <text x="135" y="262" class="s c">A device describes itself</text>
  <text x="135" y="277" class="s c">with these structures.</text>
  <text x="135" y="300" class="s c">The host reads them over</text>
  <text x="135" y="315" class="s c">endpoint 0 and picks drivers</text>
  <text x="135" y="330" class="s c">by the interfaces' classes.</text>
</svg>
