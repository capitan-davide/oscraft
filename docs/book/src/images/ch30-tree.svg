<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <rect class="k" x="250" y="16" width="300" height="96" rx="4"/>
  <text x="400" y="36" class="h c">the host</text>
  <rect class="wk" x="266" y="46" width="268" height="26" rx="3"/>
  <text x="400" y="64" class="s c">host controller: starts every transfer</text>
  <rect class="wk" x="266" y="78" width="268" height="26" rx="3"/>
  <text x="400" y="96" class="s c">root hub: the controller's own ports</text>
  <rect class="n" x="301" y="104" width="18" height="14" rx="2"/>
  <rect class="n" x="361" y="104" width="18" height="14" rx="2"/>
  <rect class="n" x="421" y="104" width="18" height="14" rx="2"/>
  <rect class="n" x="481" y="104" width="18" height="14" rx="2"/>
  <rect class="u" x="70" y="176" width="150" height="44" rx="4"/>
  <text x="145" y="195" class="c">keyboard</text>
  <text x="145" y="210" class="s c">address 1</text>
  <rect class="y" x="300" y="170" width="200" height="50" rx="4"/>
  <text x="400" y="188" class="b c">hub</text>
  <text x="400" y="203" class="s c">address 2, four ports</text>
  <rect class="n" x="331" y="213" width="18" height="14" rx="2"/>
  <rect class="n" x="371" y="213" width="18" height="14" rx="2"/>
  <rect class="n" x="411" y="213" width="18" height="14" rx="2"/>
  <rect class="n" x="451" y="213" width="18" height="14" rx="2"/>
  <rect class="n" x="590" y="176" width="150" height="44" rx="4"/>
  <text x="665" y="195" class="c">a free port</text>
  <text x="665" y="210" class="s c">nothing attached</text>
  <path class="ln" d="M310,118 L145,174" marker-end="url(#a)"/>
  <path class="ln" d="M370,118 L392,168" marker-end="url(#a)"/>
  <path class="ln dash" d="M490,118 L665,176"/>
  <rect class="u" x="150" y="290" width="190" height="44" rx="4"/>
  <text x="245" y="309" class="c">network adapter</text>
  <text x="245" y="324" class="s c">address 3</text>
  <rect class="u" x="460" y="290" width="190" height="44" rx="4"/>
  <text x="555" y="309" class="c">storage device</text>
  <text x="555" y="324" class="s c">address 4</text>
  <path class="ln" d="M340,226 L255,288" marker-end="url(#a)"/>
  <path class="ln" d="M420,226 L545,288" marker-end="url(#a)"/>
  <text x="30" y="60" class="s">the root</text>
  <text x="30" y="160" class="s">tier 1</text>
  <text x="30" y="280" class="s">tier 2</text>
  <path class="life" d="M20,140 L780,140"/>
  <path class="life" d="M20,258 L780,258"/>
  <text x="400" y="362" class="s c">One host, a tree of hubs, devices at the leaves. A device never talks unless the host has just asked it to.</text>
</svg>
