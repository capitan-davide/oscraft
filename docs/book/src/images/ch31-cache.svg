<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="190" y="26" class="h c">the cache: room for four blocks</text>
  <text x="40" y="52" class="s">block</text>
  <text x="120" y="52" class="s">contents</text>
  <text x="210" y="52" class="s">changed</text>
  <text x="280" y="52" class="s">last used</text>
  <rect class="w" x="30" y="62" width="330" height="28" rx="3"/>
  <text x="40" y="81" class="m">7</text>
  <text x="120" y="81" class="s">512 bytes</text>
  <text x="210" y="81" class="s">no</text>
  <text x="280" y="81" class="s">41</text>
  <rect class="y" x="30" y="96" width="330" height="28" rx="3"/>
  <text x="40" y="115" class="m">812</text>
  <text x="120" y="115" class="s">512 bytes</text>
  <text x="210" y="115" class="s">yes</text>
  <text x="280" y="115" class="s">38</text>
  <rect class="r" x="30" y="130" width="330" height="28" rx="3"/>
  <text x="40" y="149" class="m">3</text>
  <text x="120" y="149" class="s">512 bytes</text>
  <text x="210" y="149" class="s">no</text>
  <text x="280" y="149" class="s">12, the oldest</text>
  <rect class="y" x="30" y="164" width="330" height="28" rx="3"/>
  <text x="40" y="183" class="m">96</text>
  <text x="120" y="183" class="s">512 bytes</text>
  <text x="210" y="183" class="s">yes</text>
  <text x="280" y="183" class="s">40</text>
  <rect class="n" x="560" y="150" width="210" height="60" rx="4"/>
  <text x="665" y="175" class="b c">the disk</text>
  <text x="665" y="194" class="s c">slow</text>
  <circle cx="42" cy="222" r="9" fill="#2c5d9b"/>
  <text x="42" y="226" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="60" y="226" class="b">read block 7: a hit</text>
  <text x="60" y="242" class="s">answered from memory;</text>
  <text x="60" y="256" class="s">its last-used time is updated</text>
  <circle cx="42" cy="288" r="9" fill="#2c5d9b"/>
  <text x="42" y="292" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="60" y="292" class="b">change block 96</text>
  <text x="60" y="308" class="s">changed in memory and marked;</text>
  <text x="60" y="322" class="s">the disk is not touched yet</text>
  <circle cx="302" cy="222" r="9" fill="#aa2222"/>
  <text x="302" y="226" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="320" y="226" class="b">read block 500: a miss, and the cache is full</text>
  <text x="320" y="242" class="s">the oldest block, 3, gives up its place</text>
  <text x="320" y="256" class="s">(written to the disk first if it was changed);</text>
  <text x="320" y="270" class="s">block 500 is read from the disk into the free place</text>
  <circle cx="302" cy="318" r="9" fill="#3e7b34"/>
  <text x="302" y="322" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="320" y="322" class="b">sync</text>
  <text x="320" y="338" class="s">every changed block is written, in block order,</text>
  <text x="320" y="352" class="s">and marked unchanged: 96, then 812</text>
  <path class="lng" d="M360,110 L460,110 L460,170 L558,170" marker-end="url(#ag)"/>
  <text x="470" y="104" class="s">written at 4, or when evicted</text>
  <path class="lnr" d="M558,196 L440,196 L440,144 L362,144" marker-end="url(#ar)"/>
  <text x="450" y="212" class="s">read at 3</text>
</svg>
