<svg xmlns="http://www.w3.org/2000/svg" width="800" height="372" viewBox="0 0 800 372" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="372" fill="#ffffff"/>
  <text x="140" y="24" class="h c">What a compiled program assumes</text>
  <text x="540" y="24" class="h c">A QNX program and a FreeBSD program disagree, for example, on</text>
  <rect class="k" x="20" y="40" width="240" height="46" rx="4"/>
  <text x="140" y="60" class="b c">How it is started</text>
  <text x="140" y="76" class="s c">the stack and registers at its first instruction</text>
  <rect class="y" x="280" y="40" width="500" height="46" rx="4"/>
  <text x="530" y="67" class="s c">who prepares the thread-local block; what the auxiliary vector holds</text>
  <path class="ln" d="M260,63 L278,63" marker-end="url(#a)"/>
  <rect class="k" x="20" y="92" width="240" height="46" rx="4"/>
  <text x="140" y="112" class="b c">How it enters the kernel</text>
  <text x="140" y="128" class="s c">the trap, the call number, the error</text>
  <rect class="g" x="280" y="92" width="500" height="46" rx="4"/>
  <text x="530" y="119" class="s c">nothing here: both use the same kernel calls (svc 0x51, number in w8)</text>
  <path class="ln" d="M260,115 L278,115" marker-end="url(#a)"/>
  <rect class="k" x="20" y="144" width="240" height="46" rx="4"/>
  <text x="140" y="164" class="b c">Numbers</text>
  <text x="140" y="180" class="s c">error numbers, signal numbers, flag bits</text>
  <rect class="y" x="280" y="144" width="500" height="46" rx="4"/>
  <text x="530" y="171" class="s c">EAGAIN: 11 or 35.  SIGUSR1: 16 or 30.  O_NONBLOCK: 0x80 or 0x4</text>
  <path class="ln" d="M260,167 L278,167" marker-end="url(#a)"/>
  <rect class="k" x="20" y="196" width="240" height="46" rx="4"/>
  <text x="140" y="216" class="b c">Layouts</text>
  <text x="140" y="232" class="s c">the fields and size of each structure</text>
  <rect class="y" x="280" y="196" width="500" height="46" rx="4"/>
  <text x="530" y="223" class="s c">struct stat: 120 or 224 bytes.  struct termios: 76 or 44 bytes</text>
  <path class="ln" d="M260,219 L278,219" marker-end="url(#a)"/>
  <rect class="k" x="20" y="248" width="240" height="46" rx="4"/>
  <text x="140" y="268" class="b c">Behaviour</text>
  <text x="140" y="284" class="s c">which error, in what order, how soon</text>
  <rect class="y" x="280" y="248" width="500" height="46" rx="4"/>
  <text x="530" y="275" class="s c">which of two pending signals is delivered first</text>
  <path class="ln" d="M260,271 L278,271" marker-end="url(#a)"/>
  <rect class="k" x="20" y="300" width="240" height="46" rx="4"/>
  <text x="140" y="320" class="b c">Names</text>
  <text x="140" y="336" class="s c">paths it opens without being told to</text>
  <rect class="y" x="280" y="300" width="500" height="46" rx="4"/>
  <text x="530" y="327" class="s c">/bin/sh, its dynamic loader, its C library, /proc/&lt;pid&gt;/as</text>
  <path class="ln" d="M260,323 L278,323" marker-end="url(#a)"/>
  <text x="400" y="364" class="s c">Green: already the same. Yellow: must be converted or provided for a QNX program.</text>
</svg>
