<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <text x="140" y="24" class="h c">In a library</text>
  <rect class="r" x="20" y="40" width="240" height="44" rx="4"/>
  <text x="140" y="66.0" class="c">the foreign program</text>
  <rect class="k" x="20" y="92" width="240" height="60" rx="4"/>
  <text x="140" y="118.5" class="c">a replacement C library</text>
  <text x="140" y="133.5" class="s c">its functions, built on the host's calls</text>
  <rect class="k" x="20" y="160" width="240" height="114" rx="4"/>
  <text x="140" y="213.5" class="c">the host kernel</text>
  <text x="140" y="228.5" class="s c">one system-call interface</text>
  <text x="140" y="300" class="s c">The program's own library is replaced.</text>
  <text x="140" y="315" class="s c">Calls made without it are not caught.</text>
  <text x="400" y="24" class="h c">At the kernel boundary</text>
  <rect class="r" x="280" y="40" width="240" height="44" rx="4"/>
  <text x="400" y="66.0" class="c">the foreign program</text>
  <rect class="r" x="280" y="92" width="240" height="60" rx="4"/>
  <text x="400" y="126.0" class="c">its own C library, unchanged</text>
  <rect class="k" x="280" y="160" width="240" height="46" rx="4"/>
  <text x="400" y="179.5" class="c">a second system-call interface</text>
  <text x="400" y="194.5" class="s c">converts numbers and structures</text>
  <rect class="k" x="280" y="214" width="240" height="60" rx="4"/>
  <text x="400" y="248.0" class="c">the host kernel's core</text>
  <text x="400" y="300" class="s c">Nothing in user space is replaced.</text>
  <text x="400" y="315" class="s c">The kernel keeps two interfaces.</text>
  <text x="660" y="24" class="h c">A whole machine</text>
  <rect class="r" x="540" y="40" width="240" height="44" rx="4"/>
  <text x="660" y="66.0" class="c">the foreign program</text>
  <rect class="r" x="540" y="92" width="240" height="60" rx="4"/>
  <text x="660" y="126.0" class="c">its own C library, unchanged</text>
  <rect class="r" x="540" y="160" width="240" height="46" rx="4"/>
  <text x="660" y="187.0" class="c">its own kernel, unchanged</text>
  <rect class="k" x="540" y="214" width="240" height="60" rx="4"/>
  <text x="660" y="248.0" class="c">a virtual machine on the host</text>
  <text x="660" y="300" class="s c">Everything foreign is kept.</text>
  <text x="660" y="315" class="s c">The two systems share nothing.</text>
  <path class="life" d="M270,16 L270,340"/>
  <path class="life" d="M530,16 L530,340"/>
  <text x="400" y="352" class="s c">Red: the foreign system's code. Blue: the host's.</text>
</svg>
