<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="400" y="22" class="h c">The first 16 bytes of the program file (the ELF identification)</text>
  <rect class="w" x="120" y="34" width="62" height="30" rx="2"/>
  <text x="151.0" y="54" class="ms c">7f</text>
  <text x="151.0" y="78" class="s c">0</text>
  <rect class="w" x="182" y="34" width="62" height="30" rx="2"/>
  <text x="213.0" y="54" class="ms c">'E'</text>
  <text x="213.0" y="78" class="s c">1</text>
  <rect class="w" x="244" y="34" width="62" height="30" rx="2"/>
  <text x="275.0" y="54" class="ms c">'L'</text>
  <text x="275.0" y="78" class="s c">2</text>
  <rect class="w" x="306" y="34" width="62" height="30" rx="2"/>
  <text x="337.0" y="54" class="ms c">'F'</text>
  <text x="337.0" y="78" class="s c">3</text>
  <rect class="w" x="368" y="34" width="62" height="30" rx="2"/>
  <text x="399.0" y="54" class="ms c">class</text>
  <text x="399.0" y="78" class="s c">4</text>
  <rect class="w" x="430" y="34" width="62" height="30" rx="2"/>
  <text x="461.0" y="54" class="ms c">data</text>
  <text x="461.0" y="78" class="s c">5</text>
  <rect class="w" x="492" y="34" width="62" height="30" rx="2"/>
  <text x="523.0" y="54" class="ms c">version</text>
  <text x="523.0" y="78" class="s c">6</text>
  <rect class="y" x="554" y="34" width="62" height="30" rx="2"/>
  <text x="585.0" y="54" class="ms c">OSABI</text>
  <text x="585.0" y="78" class="s c">7</text>
  <rect class="w" x="616" y="34" width="62" height="30" rx="2"/>
  <text x="647.0" y="54" class="ms c">ABI ver.</text>
  <text x="647.0" y="78" class="s c">8</text>
  <rect class="w" x="678" y="34" width="62" height="30" rx="2"/>
  <text x="709" y="54" class="ms c">padding</text>
  <text x="709" y="78" class="s c">9..15</text>
  <path class="ln" d="M585,84 L585,104" marker-end="url(#a)"/>
  <rect class="k" x="435" y="106" width="300" height="34" rx="4"/>
  <text x="585" y="127" class="m c">Personality::from_osabi(byte 7)</text>
  <path class="lng" d="M505,140 L210,168" marker-end="url(#ag)"/>
  <text x="270" y="150" class="s e green">9 (FreeBSD)</text>
  <path class="lnr" d="M645,140 L590,168" marker-end="url(#ar)"/>
  <text x="604" y="150" class="s red">anything else</text>
  <rect class="g" x="30" y="170" width="360" height="30" rx="4"/>
  <text x="210" y="190" class="b c">Native: a FreeBSD process</text>
  <rect class="w" x="30" y="206" width="360" height="34" rx="2"/>
  <text x="38" y="220" class="s">initial stack</text>
  <text x="38" y="234" class="ms">FreeBSD's: ps_strings, argc, argv, envp, auxv</text>
  <rect class="w" x="30" y="244" width="360" height="34" rx="2"/>
  <text x="38" y="258" class="s">thread pointer at entry</text>
  <text x="38" y="272" class="ms">0: libc makes its own thread-local storage</text>
  <rect class="w" x="30" y="282" width="360" height="34" rx="2"/>
  <text x="38" y="296" class="s">dynamic loader</text>
  <text x="38" y="310" class="ms">ld-elf.so.1</text>
  <rect class="w" x="30" y="320" width="360" height="34" rx="2"/>
  <text x="38" y="334" class="s">data from the kernel and process 1</text>
  <text x="38" y="348" class="ms">as they are</text>
  <rect class="r" x="410" y="170" width="360" height="30" rx="4"/>
  <text x="590" y="190" class="b c">Qnx: a QNX process</text>
  <rect class="w" x="410" y="206" width="360" height="34" rx="2"/>
  <text x="418" y="220" class="s">initial stack</text>
  <text x="418" y="234" class="ms">QNX's: thread-local block, argc, argv, envp, auxv</text>
  <rect class="w" x="410" y="244" width="360" height="34" rx="2"/>
  <text x="418" y="258" class="s">thread pointer at entry</text>
  <text x="418" y="272" class="ms">the block the kernel built on the stack</text>
  <rect class="w" x="410" y="282" width="360" height="34" rx="2"/>
  <text x="418" y="296" class="s">dynamic loader</text>
  <text x="418" y="310" class="ms">ldqnx-64.so.2</text>
  <rect class="w" x="410" y="320" width="360" height="34" rx="2"/>
  <text x="418" y="334" class="s">data from the kernel and process 1</text>
  <text x="418" y="348" class="ms">converted to QNX's numbers and layouts</text>
  <text x="400" y="388" class="s c">Chosen once, when the program is loaded; a child made by fork() has its parent's.</text>
</svg>
