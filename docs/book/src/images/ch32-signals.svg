<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>
  <text x="20" y="58" class="b">QNX's</text>
  <text x="20" y="73" class="s">numbers</text>
  <text x="20" y="218" class="b">the kernel's</text>
  <text x="20" y="233" class="s">(FreeBSD's)</text>
  <rect class="g" x="110.0" y="40" width="78.0" height="40" rx="2"/>
  <text x="149.0" y="58" class="s c">1-15</text>
  <text x="149.0" y="72" class="s c">the same</text>
  <rect class="y" x="188.0" y="40" width="130.0" height="40" rx="2"/>
  <text x="253.0" y="58" class="s c">16-40</text>
  <text x="253.0" y="72" class="s c">other numbers</text>
  <rect class="u" x="318.0" y="40" width="83.2" height="40" rx="2"/>
  <text x="359.6" y="58" class="s c">41-56</text>
  <text x="359.6" y="72" class="s c">real-time</text>
  <rect class="r" x="401.2" y="40" width="41.6" height="40" rx="2"/>
  <text x="422.0" y="58" class="s c">57-64</text>
  <text x="422.0" y="72" class="s c">QNX's</text>
  <rect class="g" x="110.0" y="200" width="78.0" height="40" rx="2"/>
  <text x="149.0" y="224" class="s c">1-15</text>
  <rect class="y" x="188.0" y="200" width="93.60000000000001" height="40" rx="2"/>
  <text x="234.8" y="218" class="s c">16-33</text>
  <text x="234.8" y="232" class="s c">FreeBSD's</text>
  <rect class="w" x="281.6" y="200" width="119.60000000000001" height="40" rx="2"/>
  <text x="341.40000000000003" y="218" class="s c">34-56</text>
  <text x="341.40000000000003" y="232" class="s c">7 are QNX's</text>
  <rect class="r" x="401.2" y="200" width="41.6" height="40" rx="2"/>
  <text x="422.0" y="224" class="s c">57-64</text>
  <rect class="u" x="442.8" y="200" width="83.2" height="40" rx="2"/>
  <text x="484.40000000000003" y="224" class="s c">65-80</text>
  <rect class="w" x="526.0" y="200" width="239.20000000000002" height="40" rx="2"/>
  <text x="645.6" y="218" class="s c">81-126</text>
  <text x="645.6" y="232" class="s c">FreeBSD's other real-time signals</text>
  <path class="lng" d="M149.0,80 L149.0,198" marker-end="url(#ag)" marker-start="url(#ag)"/>
  <path class="ln" d="M233.0,80 L234.8,198" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln dash" d="M273.0,80 L331.40000000000003,198" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M359.6,80 L484.40000000000003,198" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="lnr" d="M422.0,80 L422.0,198" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="620" y="96" class="s">16-40, by table:</text>
  <text x="620" y="111" class="ms">SIGUSR1 16 = 30</text>
  <text x="620" y="124" class="ms">SIGCHLD 18 = 20</text>
  <text x="620" y="148" class="s">41-56, by offset:</text>
  <text x="620" y="163" class="ms">41 = 65 ... 56 = 80</text>
  <text x="400" y="272" class="s c">Each QNX number has one kernel number. A kernel number above 80, or one QNX has no name for, is 0 to a QNX process.</text>
</svg>
