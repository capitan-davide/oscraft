<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="250" y="24" class="h c">The top of every process's address space</text>
  <rect class="n" x="130" y="40" width="240" height="34" rx="2"/>
  <text x="250.0" y="54.0" class="c">nothing mapped above</text>
  <text x="250.0" y="69.0" class="s c">the kernel's half</text>
  <text x="122" y="78" class="ms e">0x80_0000_0000</text>
  <path class="ln" d="M126,74 L130,74"/>
  <rect class="y" x="130" y="74" width="240" height="96" rx="2"/>
  <text x="250.0" y="119.0" class="c">the system page</text>
  <text x="250.0" y="134.0" class="s c">three pages, read-only, shared</text>
  <text x="122" y="174" class="ms e">0x7f_ffff_d000</text>
  <path class="ln" d="M126,170 L130,170"/>
  <rect class="w" x="130" y="170" width="240" height="32" rx="2"/>
  <text x="250.0" y="190.0" class="c">one page not mapped</text>
  <text x="122" y="206" class="ms e">0x7f_ffff_c000</text>
  <path class="ln" d="M126,202 L130,202"/>
  <rect class="u" x="130" y="202" width="240" height="110" rx="2"/>
  <text x="250.0" y="254.0" class="c">the main thread's stack</text>
  <text x="250.0" y="269.0" class="s c">512 KB by default, grows down</text>
  <rect class="r" x="130" y="312" width="240" height="30" rx="2"/>
  <text x="250.0" y="331.0" class="c">guard page</text>
  <text x="122" y="138" class="s e">four pages</text>
  <text x="122" y="152" class="s e">reserved</text>
  <rect class="k" x="440" y="60" width="340" height="70" rx="4"/>
  <text x="610" y="80" class="b c">the kernel, once at boot</text>
  <text x="610" y="98" class="s c">chooses the address and writes it into the page:</text>
  <text x="610" y="114" class="ms c">system_private.user_syspageptr</text>
  <path class="lnk" d="M440,95 L372,122" marker-end="url(#ak)"/>
  <rect class="k" x="440" y="150" width="340" height="54" rx="4"/>
  <text x="610" y="170" class="b c">the loader, for each new process</text>
  <text x="610" y="188" class="s c">maps the page's memory there</text>
  <path class="lnk" d="M440,177 L372,140" marker-end="url(#ak)"/>
  <rect class="r" x="440" y="224" width="340" height="70" rx="4"/>
  <text x="610" y="244" class="b c">QNX's C library, as the program starts</text>
  <text x="610" y="262" class="s c">asks the kernel where the page is</text>
  <text x="610" y="278" class="s c">and keeps the answer in _syspage_ptr</text>
  <path class="lnr" d="M440,259 L372,158" marker-end="url(#ar)"/>
  <text x="610" y="322" class="s c">The addresses are those of QEMU's virt</text>
  <text x="610" y="337" class="s c">with OsCraft's startup.</text>
</svg>
