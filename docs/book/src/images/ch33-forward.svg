<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
  <rect class="r" x="30" y="20" width="180" height="34" rx="4"/>
  <text x="120" y="41" class="b c">QNX client</text>
  <rect class="y" x="310" y="20" width="180" height="34" rx="4"/>
  <text x="400" y="41" class="b c">a thread of qnxd</text>
  <rect class="g" x="590" y="20" width="180" height="34" rx="4"/>
  <text x="680" y="41" class="b c">native server</text>
  <path class="life" d="M120,54 L120,470"/>
  <path class="life" d="M400,54 L400,470"/>
  <path class="life" d="M680,54 L680,470"/>
  <path class="lnr" d="M120,96 L398,96" marker-end="url(#ar)"/>
  <circle cx="120.19999999999999" cy="84" r="9" fill="#aa2222"/>
  <text x="120.19999999999999" y="88" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="265.0" y="88" class="s c">MsgSendv() of fstat() on its descriptor</text>
  <text x="284.0" y="110" class="s c">the kernel hands it to qnxd</text>
  <rect class="y" x="70" y="104" width="100" height="300" rx="3"/>
  <text x="120" y="240" class="s c">REPLY-blocked</text>
  <text x="120" y="254" class="s c">on qnxd</text>
  <rect class="w" x="325" y="124" width="150" height="46" rx="3"/>
  <text x="400" y="142" class="s c">2  MsgReceive(), MsgRead()</text>
  <text x="400" y="158" class="s c">converts the request</text>
  <path class="lnk" d="M400,200 L678,200" marker-end="url(#ak)"/>
  <circle cx="393.79999999999995" cy="188" r="9" fill="#2c5d9b"/>
  <text x="393.79999999999995" y="192" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="545.0" y="192" class="s c">MsgForwardv(), on the client's connection</text>
  <rect class="y" x="350" y="208" width="100" height="122" rx="3"/>
  <text x="400" y="262" class="s c">REPLY-blocked</text>
  <text x="400" y="276" class="s c">on the server</text>
  <rect class="g" x="605" y="208" width="150" height="100" rx="3"/>
  <text x="680" y="240" class="s c">4  sees the client:</text>
  <text x="680" y="255" class="s c">its process, thread,</text>
  <text x="680" y="270" class="s c">priority, connection</text>
  <text x="680" y="291" class="s c">answers in FreeBSD's form</text>
  <path class="lng" d="M680,328 L402,328" marker-end="url(#ag)"/>
  <circle cx="418.2" cy="316" r="9" fill="#3e7b34"/>
  <text x="418.2" y="320" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="547.0" y="320" class="s c">MsgReply(): struct stat, 224 bytes</text>
  <rect class="w" x="325" y="340" width="150" height="46" rx="3"/>
  <text x="400" y="358" class="s c">6  converts the answer</text>
  <text x="400" y="374" class="s c">to QNX's struct stat</text>
  <path class="lnr" d="M400,412 L122,412" marker-end="url(#ar)"/>
  <circle cx="179.8" cy="400" r="9" fill="#aa2222"/>
  <text x="179.8" y="404" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">7</text>
  <text x="267.0" y="404" class="s c">MsgReply(): 120 bytes</text>
  <rect class="r" x="70" y="420" width="100" height="30" rx="3"/>
  <text x="120" y="439" class="s c">runs again</text>
  <text x="400" y="490" class="s c">Time runs downwards. The client makes one call and is blocked once; it cannot tell that two processes answered it.</text>
</svg>
