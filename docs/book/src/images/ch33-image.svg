<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="200" y="24" class="h c">The image built with QNX=1</text>
  <rect class="g" x="20" y="40" width="360" height="150" rx="4"/>
  <text x="200" y="60" class="b c">the base image (always)</text>
  <text x="34" y="82" class="s">/proc/boot/kernel, the startup</text>
  <text x="34" y="99" class="s">/bin, /sbin, /usr/bin: FreeBSD's sh and utilities</text>
  <text x="34" y="116" class="s">/lib, /usr/lib: FreeBSD's libc, libthr, ld-elf.so.1</text>
  <text x="34" y="133" class="s">the native servers: pipe, random, pty, tmpfs,</text>
  <text x="34" y="150" class="s">syslogd, pcid, netd</text>
  <rect class="r" x="20" y="200" width="360" height="150" rx="4"/>
  <text x="200" y="220" class="b c">the overlay (QNX=1): /compat/qnx</text>
  <text x="34" y="242" class="s">lib/ldqnx-64.so.2, libc.so.6, libsocket.so.4, ...</text>
  <text x="34" y="259" class="s">bin/ksh, bin/sh (a link to ksh), usr/bin/toybox and its links</text>
  <text x="34" y="276" class="s">bin/pidin, slogger2, slog2info; usr/sbin/sshd, tracelogger</text>
  <text x="34" y="293" class="s">QNX's servers: mqueue, devc-pty, devc-serpl011, ...</text>
  <rect class="k" x="34" y="314" width="332" height="26" rx="2"/>
  <text x="200" y="331" class="s c">sbin/qnxd: OsCraft's own, the one native program here</text>
  <text x="200" y="368" class="s c">Red: files copied from the user's QNX SDP when the image is built.</text>
  <text x="600" y="24" class="h c">The boot script, in order</text>
  <rect class="g" x="440" y="40" width="320" height="48" rx="4"/>
  <text x="600" y="60" class="m c">the base image's script</text>
  <text x="600" y="77" class="s c">native servers, the network</text>
  <path class="ln" d="M600,88 L600,102" marker-end="url(#a)"/>
  <rect class="k" x="440" y="104" width="320" height="48" rx="4"/>
  <text x="600" y="124" class="m c">/compat/qnx/sbin/qnxd</text>
  <text x="600" y="141" class="s c">returns once it has registered</text>
  <path class="ln" d="M600,152 L600,166" marker-end="url(#a)"/>
  <rect class="r" x="440" y="168" width="320" height="48" rx="4"/>
  <text x="600" y="188" class="m c">/compat/qnx/bin/slogger2</text>
  <text x="600" y="205" class="s c">QNX's logger, for QNX's services</text>
  <path class="ln" d="M600,216 L600,230" marker-end="url(#a)"/>
  <rect class="r" x="440" y="232" width="320" height="48" rx="4"/>
  <text x="600" y="252" class="m c">/compat/qnx/bin/ksh /etc/rc.net &amp;</text>
  <text x="600" y="269" class="s c">waits for /dev/socket, starts QNX's sshd</text>
  <text x="600" y="308" class="s c">Until qnxd has registered, a QNX program</text>
  <text x="600" y="323" class="s c">cannot use a native server at all.</text>
</svg>
