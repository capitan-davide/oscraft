<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="150" y="24" class="h c">One file system</text>
  <rect class="w" x="30" y="40" width="170" height="26" rx="2"/>
  <text x="40" y="57" class="m">/</text>
  <rect class="g" x="66" y="72" width="170" height="26" rx="2"/>
  <text x="76" y="89" class="m">bin/sh</text>
  <rect class="g" x="66" y="104" width="170" height="26" rx="2"/>
  <text x="76" y="121" class="m">lib/libc.so.7</text>
  <rect class="g" x="66" y="136" width="170" height="26" rx="2"/>
  <text x="76" y="153" class="m">dev/null</text>
  <rect class="g" x="66" y="168" width="170" height="26" rx="2"/>
  <text x="76" y="185" class="m">tmp/</text>
  <rect class="r" x="66" y="200" width="170" height="26" rx="2"/>
  <text x="76" y="217" class="m">compat/qnx/</text>
  <rect class="r" x="102" y="232" width="170" height="26" rx="2"/>
  <text x="112" y="249" class="m">bin/sh</text>
  <rect class="r" x="102" y="264" width="170" height="26" rx="2"/>
  <text x="112" y="281" class="m">bin/ksh</text>
  <rect class="r" x="102" y="296" width="170" height="26" rx="2"/>
  <text x="112" y="313" class="m">lib/libc.so.6</text>
  <text x="150" y="342" class="s c">green: FreeBSD's files    red: QNX's, from the SDP</text>
  <text x="560" y="24" class="h c">Three lookups</text>
  <rect class="g" x="330" y="50" width="130" height="44" rx="4"/>
  <text x="395" y="69" class="b c">a native process</text>
  <text x="395" y="85" class="ms c">opens "/bin/sh"</text>
  <path class="ln" d="M460,72 L488,72" marker-end="url(#a)"/>
  <rect class="k" x="490" y="50" width="150" height="44" rx="4"/>
  <text x="565" y="69" class="s c">no overlay:</text>
  <text x="565" y="84" class="s c">the path as it is</text>
  <path class="ln" d="M640,72 L668,72" marker-end="url(#a)"/>
  <rect class="g" x="670" y="50" width="120" height="44" rx="4"/>
  <text x="730" y="69" class="s c">gets</text>
  <text x="730" y="85" class="ms c">/bin/sh</text>
  <rect class="r" x="330" y="140" width="130" height="44" rx="4"/>
  <text x="395" y="159" class="b c">a QNX process</text>
  <text x="395" y="175" class="ms c">opens "/bin/sh"</text>
  <path class="ln" d="M460,162 L488,162" marker-end="url(#a)"/>
  <rect class="k" x="490" y="140" width="150" height="44" rx="4"/>
  <text x="565" y="159" class="s c">/compat/qnx/bin/sh</text>
  <text x="565" y="174" class="s c">exists: use it</text>
  <path class="ln" d="M640,162 L668,162" marker-end="url(#a)"/>
  <rect class="r" x="670" y="140" width="120" height="44" rx="4"/>
  <text x="730" y="159" class="s c">gets</text>
  <text x="730" y="175" class="ms c">QNX's sh</text>
  <rect class="r" x="330" y="230" width="130" height="44" rx="4"/>
  <text x="395" y="249" class="b c">a QNX process</text>
  <text x="395" y="265" class="ms c">opens "/dev/null"</text>
  <path class="ln" d="M460,252 L488,252" marker-end="url(#a)"/>
  <rect class="k" x="490" y="230" width="150" height="44" rx="4"/>
  <text x="565" y="249" class="s c">/compat/qnx/dev/null</text>
  <text x="565" y="264" class="s c">does not exist: as it is</text>
  <path class="ln" d="M640,252 L668,252" marker-end="url(#a)"/>
  <rect class="g" x="670" y="230" width="120" height="44" rx="4"/>
  <text x="730" y="249" class="s c">gets</text>
  <text x="730" y="265" class="ms c">/dev/null</text>
  <text x="560" y="310" class="s c">The overlay is tried for every path a QNX process names,</text>
  <text x="560" y="325" class="s c">before the path manager looks for the server that owns it.</text>
</svg>
