<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <rect class="u" x="30" y="40" width="200" height="90" rx="4"/>
  <text x="130" y="66" class="b c">1  A question</text>
  <text x="130" y="90" class="s c">What does a QNX program</text>
  <text x="130" y="106" class="s c">see in this case?</text>
  <rect class="y" x="300" y="40" width="200" height="90" rx="4"/>
  <text x="400" y="66" class="b c">2  A probe</text>
  <text x="400" y="90" class="s c">a small C program that</text>
  <text x="400" y="106" class="s c">prints what it observes</text>
  <rect class="r" x="570" y="40" width="200" height="90" rx="4"/>
  <text x="670" y="66" class="b c">3  Run on both kernels</text>
  <text x="670" y="90" class="s c">tools/qnx/probe.py --diff:</text>
  <text x="670" y="106" class="s c">procnto's output, OsCraft's</text>
  <rect class="k" x="570" y="190" width="200" height="90" rx="4"/>
  <text x="670" y="216" class="b c">4  Change OsCraft</text>
  <text x="670" y="240" class="s c">until the two outputs</text>
  <text x="670" y="256" class="s c">are identical</text>
  <rect class="y" x="300" y="190" width="200" height="90" rx="4"/>
  <text x="400" y="216" class="b c">5  Keep it as a test</text>
  <text x="400" y="240" class="s c">the program into tests/qnx,</text>
  <text x="400" y="256" class="s c">its output into target.tests</text>
  <rect class="g" x="30" y="190" width="200" height="90" rx="4"/>
  <text x="130" y="216" class="b c">6  Both suites</text>
  <text x="130" y="240" class="s c">make test QNX=1 and</text>
  <text x="130" y="256" class="s c">make qnx-test pass it</text>
  <path class="ln" d="M230,85 L298,85" marker-end="url(#a)"/>
  <path class="ln" d="M500,85 L568,85" marker-end="url(#a)"/>
  <path class="ln" d="M670,130 L670,188" marker-end="url(#a)"/>
  <path class="ln" d="M568,235 L502,235" marker-end="url(#a)"/>
  <path class="ln" d="M298,235 L232,235" marker-end="url(#a)"/>
  <path class="ln dash" d="M620,190 L620,132" marker-end="url(#a)"/>
  <text x="612" y="164" class="s e">again</text>
  <text x="400" y="310" class="s c">The expected values of a QNX test are procnto's measured results, so the same test passes on both kernels.</text>
</svg>
