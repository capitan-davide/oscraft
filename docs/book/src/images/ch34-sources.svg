<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>
  <text x="250" y="24" class="h c">Three sources for one fact, from cheapest to most certain</text>
  <rect class="y" x="20" y="44" width="460" height="62" rx="4"/>
  <text x="34" y="66" class="b">1. The documentation</text>
  <text x="34" y="84" class="s">says what the designers intended</text>
  <text x="34" y="99" class="s">fast to read; silent or wrong in places</text>
  <rect class="y" x="20" y="118" width="460" height="62" rx="4"/>
  <text x="34" y="140" class="b">2. A measurement</text>
  <text x="34" y="158" class="s">a program run on the reference</text>
  <text x="34" y="173" class="s">shows what happens, for the cases tried</text>
  <rect class="y" x="20" y="192" width="460" height="62" rx="4"/>
  <text x="34" y="214" class="b">3. The binary itself</text>
  <text x="34" y="232" class="s">its code, read with a disassembler</text>
  <text x="34" y="247" class="s">shows why, and the cases nobody tried</text>
  <path class="ln" d="M500,60 L500,250" marker-end="url(#a)"/>
  <text x="506" y="160" class="s">when the one above</text>
  <text x="506" y="175" class="s">does not settle it</text>
  <path class="lnr dash" d="M640,40 L640,300"/>
  <text x="640" y="30" class="s c red">the clean-room line</text>
  <rect class="g" x="660" y="60" width="130" height="88" rx="4"/>
  <text x="725" y="82" class="b c">may cross</text>
  <text x="725" y="100" class="s c">numbers, layouts,</text>
  <text x="725" y="114" class="s c">return values,</text>
  <text x="725" y="128" class="s c">what a function does</text>
  <rect class="r" x="660" y="170" width="130" height="88" rx="4"/>
  <text x="725" y="192" class="b c">never crosses</text>
  <text x="725" y="210" class="s c">code, in any form,</text>
  <text x="725" y="224" class="s c">and the text of</text>
  <text x="725" y="238" class="s c">the documentation</text>
  <text x="400" y="322" class="s c">Whatever the source, what is taken from it is a fact about an interface, written down in one's own words.</text>
</svg>
