<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="200" y="24" class="h c">The reference image</text>
  <text x="200" y="42" class="m c">make qnx-test</text>
  <rect class="u" x="30" y="54" width="340" height="46" rx="4"/>
  <text x="200" y="74.0" class="c">the QNX test programs</text>
  <text x="200" y="90.0" class="s c">tests/qnx, built with the SDP's compiler</text>
  <rect class="r" x="30" y="106" width="340" height="46" rx="4"/>
  <text x="200" y="126.0" class="c">QNX's shell on QNX's serial driver</text>
  <text x="200" y="142.0" class="s c">the console the tests are typed into</text>
  <rect class="r" x="30" y="158" width="340" height="40" rx="4"/>
  <text x="200" y="182.0" class="c">QNX's C library, loader, pipe manager, tools</text>
  <rect class="r" x="30" y="204" width="340" height="60" rx="4"/>
  <text x="200" y="231.0" class="c">procnto, QNX's kernel</text>
  <text x="200" y="247.0" class="s c">from the SDP</text>
  <rect class="k" x="30" y="270" width="340" height="36" rx="4"/>
  <text x="200" y="292.0" class="c">OsCraft's startup for virt</text>
  <rect class="n" x="30" y="312" width="340" height="36" rx="4"/>
  <text x="200" y="334.0" class="c">QEMU's virt machine</text>
  <text x="600" y="24" class="h c">OsCraft's test image</text>
  <text x="600" y="42" class="m c">make test QNX=1</text>
  <rect class="u" x="430" y="54" width="340" height="46" rx="4"/>
  <text x="600" y="74.0" class="c">the QNX test programs</text>
  <text x="600" y="90.0" class="s c">the same files</text>
  <rect class="r" x="430" y="106" width="340" height="46" rx="4"/>
  <text x="600" y="126.0" class="c">QNX's shell on QNX's serial driver</text>
  <text x="600" y="142.0" class="s c">the same files</text>
  <rect class="r" x="430" y="158" width="340" height="40" rx="4"/>
  <text x="600" y="175.0" class="c">QNX's C library, loader and tools; qnxd</text>
  <text x="600" y="191.0" class="s c">the native servers and FreeBSD's userland below</text>
  <rect class="k" x="430" y="204" width="340" height="60" rx="4"/>
  <text x="600" y="238.0" class="c">OsCraft's kernel and process 1</text>
  <rect class="k" x="430" y="270" width="340" height="36" rx="4"/>
  <text x="600" y="292.0" class="c">OsCraft's startup for virt</text>
  <rect class="n" x="430" y="312" width="340" height="36" rx="4"/>
  <text x="600" y="334.0" class="c">QEMU's virt machine</text>
  <path class="lng" d="M372,77 L428,77"/>
  <path class="lng" d="M372,129 L428,129"/>
  <path class="lng" d="M372,288 L428,288"/>
  <path class="lng" d="M372,330 L428,330"/>
  <text x="400" y="71" class="s c green">same</text>
  <text x="400" y="123" class="s c green">same</text>
  <text x="400" y="282" class="s c green">same</text>
  <text x="400" y="324" class="s c green">same</text>
  <path class="lnr" d="M372,234 L428,234"/>
  <text x="400" y="228" class="s c red">differs</text>
  <text x="400" y="380" class="s c">Only the kernel, and what the kernel brings with it, differs between the two runs.</text>
</svg>
