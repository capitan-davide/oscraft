<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <rect class="frame" x="15" y="30" width="770" height="140" rx="4"/>
  <text x="25" y="24" class="s">OsCraft in QEMU, booted with the QNX overlay (QNX=1)</text>
  <rect class="k" x="30" y="60" width="150" height="80" rx="4"/>
  <text x="105" y="82" class="b c">kernel</text>
  <text x="105" y="100" class="s c">kernel calls, scheduler,</text>
  <text x="105" y="113" class="s c">messages, interrupts</text>
  <text x="105" y="129" class="ms c">emit()</text>
  <path class="lnk" d="M180,100 L218,100" marker-end="url(#ak)"/>
  <rect class="y" x="220" y="72" width="110" height="56" rx="4"/>
  <text x="275" y="96" class="c">trace buffers</text>
  <text x="275" y="112" class="s c">per CPU</text>
  <path class="ln" d="M330,100 L368,100" marker-end="url(#a)"/>
  <rect class="r" x="370" y="60" width="170" height="80" rx="4"/>
  <text x="455" y="84" class="b c">tracelogger</text>
  <text x="455" y="102" class="s c">QNX's, from the SDP,</text>
  <text x="455" y="115" class="s c">under /compat/qnx</text>
  <path class="ln" d="M540,100 L578,100" marker-end="url(#a)"/>
  <rect class="y" x="580" y="72" width="190" height="56" rx="4"/>
  <text x="675" y="96" class="ms c">/tmp/oscraft-trace.kev</text>
  <text x="675" y="113" class="s c">the events, still binary</text>
  <path class="ln dash" d="M675,128 L675,216" marker-end="url(#a)"/>
  <text x="667" y="190" class="s e">base64 over the console</text>
  <rect class="frame" x="15" y="204" width="770" height="120" rx="4"/>
  <text x="25" y="198" class="s">The development host</text>
  <rect class="k" x="580" y="218" width="190" height="44" rx="4"/>
  <text x="675" y="237" class="ms c">tools/trace/collect.py</text>
  <text x="675" y="252" class="s c">boots, runs the workload, copies</text>
  <path class="ln" d="M580,240 L542,240" marker-end="url(#a)"/>
  <rect class="y" x="450" y="222" width="90" height="36" rx="4"/>
  <text x="495" y="244" class="ms c">trace.kev</text>
  <path class="ln" d="M450,240 L412,240" marker-end="url(#a)"/>
  <rect class="r" x="270" y="216" width="140" height="48" rx="4"/>
  <text x="340" y="236" class="b c">traceprinter</text>
  <text x="340" y="252" class="s c">from $QNX_HOST</text>
  <path class="ln" d="M270,240 L232,240" marker-end="url(#a)"/>
  <rect class="y" x="140" y="222" width="90" height="36" rx="4"/>
  <text x="185" y="244" class="ms c">trace.txt</text>
  <path class="ln" d="M185,258 L185,280" marker-end="url(#a)"/>
  <rect class="k" x="30" y="282" width="310" height="34" rx="4"/>
  <text x="185" y="303" class="s c">tools/trace/analyze.py: CPU time, call times, latencies</text>
  <text x="400" y="346" class="s c">Blue: OsCraft's code. Red: QNX's tools, the user's own licensed copies. Yellow: data.</text>
</svg>
