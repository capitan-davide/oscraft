<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <text x="120" y="64" class="e b">what the CPU ran</text>
  <rect class="g" x="130" y="44" width="170" height="32" rx="0"/>
  <text x="215" y="64" class="c">thread A</text>
  <rect class="r" x="300" y="44" width="18" height="32" rx="0"/>
  <rect class="u" x="318" y="44" width="54" height="32" rx="0"/>
  <text x="345" y="64" class="c">B</text>
  <rect class="g" x="372" y="44" width="188" height="32" rx="0"/>
  <text x="466" y="64" class="c">thread A</text>
  <rect class="k" x="560" y="44" width="80" height="32" rx="0"/>
  <text x="600" y="64" class="c">C</text>
  <rect class="g" x="640" y="44" width="130" height="32" rx="0"/>
  <text x="705" y="64" class="c">thread A</text>
  <text x="309" y="36" class="s c red">interrupt</text>
  <path class="lnr" d="M309,39 L309,44"/>
  <text x="120" y="142" class="e b">sampling</text>
  <text x="120" y="157" class="s e">look at fixed intervals</text>
  <path class="life" d="M130,138 L770,138"/>
  <path class="life" d="M165,76 L165,126"/>
  <circle cx="165" cy="138" r="9" fill="#333333"/>
  <text x="165" y="142" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">A</text>
  <path class="life" d="M275,76 L275,126"/>
  <circle cx="275" cy="138" r="9" fill="#333333"/>
  <text x="275" y="142" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">A</text>
  <path class="life" d="M385,76 L385,126"/>
  <circle cx="385" cy="138" r="9" fill="#333333"/>
  <text x="385" y="142" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">A</text>
  <path class="life" d="M495,76 L495,126"/>
  <circle cx="495" cy="138" r="9" fill="#333333"/>
  <text x="495" y="142" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">A</text>
  <path class="life" d="M605,76 L605,126"/>
  <circle cx="605" cy="138" r="9" fill="#333333"/>
  <text x="605" y="142" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">C</text>
  <path class="life" d="M715,76 L715,126"/>
  <circle cx="715" cy="138" r="9" fill="#333333"/>
  <text x="715" y="142" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">A</text>
  <text x="120" y="236" class="e b">event tracing</text>
  <text x="120" y="251" class="s e">record every change</text>
  <path class="life" d="M130,232 L770,232"/>
  <path class="life" d="M300,76 L300,222"/>
  <rect class="y" x="296" y="224" width="8" height="16" rx="1"/>
  <path class="ln" d="M300,240 L300,256"/>
  <text x="297" y="268" class="s e">interrupt</text>
  <path class="life" d="M318,76 L318,222"/>
  <rect class="y" x="314" y="224" width="8" height="16" rx="1"/>
  <path class="ln" d="M318,240 L318,256"/>
  <text x="321" y="268" class="s">B runs</text>
  <path class="life" d="M372,76 L372,222"/>
  <rect class="y" x="368" y="224" width="8" height="16" rx="1"/>
  <path class="ln" d="M372,240 L372,272"/>
  <text x="372" y="284" class="s c">A runs</text>
  <path class="life" d="M560,76 L560,222"/>
  <rect class="y" x="556" y="224" width="8" height="16" rx="1"/>
  <path class="ln" d="M560,240 L560,256"/>
  <text x="560" y="268" class="s c">C runs</text>
  <path class="life" d="M640,76 L640,222"/>
  <rect class="y" x="636" y="224" width="8" height="16" rx="1"/>
  <path class="ln" d="M640,240 L640,272"/>
  <text x="640" y="284" class="s c">A runs</text>
  <text x="450" y="314" class="s c">Five records, each with its time: the order of events and every duration can be rebuilt exactly.</text>
  <rect x="170" y="164" width="560" height="18" fill="#ffffff"/>
  <text x="450" y="176" class="s c">Sees A five times and C once. The interrupt and thread B ran between two looks and left no trace.</text>
</svg>
