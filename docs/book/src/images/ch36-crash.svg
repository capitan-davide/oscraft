<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <rect class="frame" x="15" y="30" width="770" height="250" rx="4"/>
  <text x="25" y="24" class="s">The machine</text>
  <rect class="r" x="30" y="50" width="150" height="40" rx="4"/>
  <text x="105" y="67" class="s c">an exception in</text>
  <text x="105" y="81" class="s c">kernel mode</text>
  <rect class="r" x="30" y="104" width="150" height="40" rx="4"/>
  <text x="105" y="121" class="s c">a Rust panic</text>
  <text x="105" y="135" class="s c">in the kernel</text>
  <path class="lnr" d="M180,70 L218,88" marker-end="url(#ar)"/>
  <path class="lnr" d="M180,124 L218,106" marker-end="url(#ar)"/>
  <rect class="k" x="220" y="66" width="150" height="62" rx="4"/>
  <text x="295" y="86" class="s c b">report on the console</text>
  <text x="295" y="102" class="s c">registers, the thread,</text>
  <text x="295" y="116" class="s c">its kernel stack</text>
  <path class="lnk" d="M370,97 L408,97" marker-end="url(#ak)"/>
  <rect class="w" x="410" y="72" width="150" height="50" rx="4"/>
  <text x="485" y="93" class="s c">did a dumper register</text>
  <text x="485" y="107" class="s c">in the system page?</text>
  <path class="ln" d="M560,97 L628,97" marker-end="url(#a)"/>
  <text x="594" y="90" class="s c">no</text>
  <rect class="n" x="630" y="72" width="140" height="50" rx="4"/>
  <text x="700" y="93" class="s c">the CPU halts;</text>
  <text x="700" y="107" class="s c">the report is all there is</text>
  <path class="ln" d="M485,122 L485,168" marker-end="url(#a)"/>
  <text x="493" y="150" class="s">yes</text>
  <rect class="r" x="410" y="170" width="150" height="60" rx="4"/>
  <text x="485" y="190" class="b c">the dumper</text>
  <text x="485" y="206" class="s c">gets the registers,</text>
  <text x="485" y="220" class="s c">writes an ELF dump</text>
  <rect class="k" x="180" y="170" width="170" height="60" rx="4"/>
  <text x="265" y="190" class="s c b">kernel: "next range"</text>
  <text x="265" y="206" class="s c">its heap, stacks, mapped</text>
  <text x="265" y="220" class="s c">pages, translation tables</text>
  <path class="ln" d="M408,188 L352,188" marker-end="url(#a)"/>
  <text x="380" y="181" class="s c">asks</text>
  <path class="lnk" d="M352,214 L408,214" marker-end="url(#ak)"/>
  <text x="380" y="228" class="s c">answers</text>
  <rect class="n" x="630" y="170" width="140" height="60" rx="4"/>
  <text x="700" y="190" class="c">console</text>
  <text x="700" y="206" class="s c">the dump, as text;</text>
  <text x="700" y="220" class="s c">then the machine resets</text>
  <path class="ln" d="M560,200 L628,200" marker-end="url(#a)"/>
  <rect class="frame" x="15" y="310" width="770" height="90" rx="4"/>
  <text x="25" y="304" class="s">The development host</text>
  <path class="ln dash" d="M700,230 L700,326" marker-end="url(#a)"/>
  <rect class="k" x="600" y="328" width="170" height="54" rx="4"/>
  <text x="685" y="346" class="ms c">tools/kdump/collect.py</text>
  <text x="685" y="360" class="s c">records the console,</text>
  <text x="685" y="373" class="s c">decodes the dump</text>
  <path class="ln" d="M600,355 L562,355" marker-end="url(#a)"/>
  <rect class="y" x="470" y="336" width="90" height="38" rx="4"/>
  <text x="515" y="359" class="ms c">kdump.elf</text>
  <path class="ln" d="M470,355 L432,355" marker-end="url(#a)"/>
  <rect class="r" x="270" y="328" width="160" height="54" rx="4"/>
  <text x="350" y="348" class="b c">kdserver and gdb</text>
  <text x="350" y="365" class="s c">from $QNX_HOST</text>
  <rect class="y" x="30" y="336" width="100" height="38" rx="4"/>
  <text x="80" y="353" class="s c">the kernel's</text>
  <text x="80" y="366" class="s c">ELF file</text>
  <path class="ln" d="M130,355 L268,355" marker-end="url(#a)"/>
  <text x="199" y="348" class="s c">symbols</text>
  <text x="400" y="424" class="s c">The dumper (in an image built with KDUMP=1), kdserver and gdb are QNX's, from the user's SDP. The rest is OsCraft's.</text>
</svg>
