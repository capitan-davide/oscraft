<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <rect class="u" x="20" y="40" width="150" height="200" rx="4"/>
  <text x="95" y="62" class="b c">debugger</text>
  <text x="95" y="86" class="s c">knows the program's</text>
  <text x="95" y="101" class="s c">source and symbols;</text>
  <text x="95" y="116" class="s c">shows variables,</text>
  <text x="95" y="131" class="s c">the stack, the</text>
  <text x="95" y="146" class="s c">current line</text>
  <rect class="k" x="360" y="40" width="150" height="200" rx="4"/>
  <text x="435" y="62" class="b c">operating system</text>
  <text x="435" y="78" class="s c">debug interface</text>
  <rect class="u" x="630" y="40" width="150" height="200" rx="4"/>
  <text x="705" y="62" class="b c">debugged process</text>
  <rect class="wu" x="645" y="80" width="120" height="40" rx="4"/>
  <text x="705" y="97" class="c">memory</text>
  <text x="705" y="111" class="s c">code, data, stacks</text>
  <rect class="wu" x="645" y="130" width="120" height="40" rx="4"/>
  <text x="705" y="147" class="c">threads</text>
  <text x="705" y="161" class="s c">registers of each</text>
  <circle cx="186" cy="90" r="9" fill="#2c5d9b"/>
  <text x="186" y="94" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <text x="200" y="94" class="s">stop it, let it run</text>
  <path class="lnk" d="M170,99 L358,99" marker-end="url(#ak)"/>
  <circle cx="186" cy="116" r="9" fill="#2c5d9b"/>
  <text x="186" y="120" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <text x="200" y="120" class="s">read and write memory</text>
  <path class="lnk" d="M170,125 L358,125" marker-end="url(#ak)"/>
  <circle cx="186" cy="142" r="9" fill="#2c5d9b"/>
  <text x="186" y="146" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <text x="200" y="146" class="s">read and write registers</text>
  <path class="lnk" d="M170,151 L358,151" marker-end="url(#ak)"/>
  <circle cx="186" cy="168" r="9" fill="#2c5d9b"/>
  <text x="186" y="172" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <text x="200" y="172" class="s">set a breakpoint</text>
  <path class="lnk" d="M170,177 L358,177" marker-end="url(#ak)"/>
  <circle cx="186" cy="194" r="9" fill="#2c5d9b"/>
  <text x="186" y="198" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <text x="200" y="198" class="s">run one instruction</text>
  <path class="lnk" d="M170,203 L358,203" marker-end="url(#ak)"/>
  <path class="lnk" d="M510,100 L643,100" marker-end="url(#ak)" marker-start="url(#ak)"/>
  <text x="577" y="93" class="s c">copies bytes</text>
  <path class="lnk" d="M510,150 L643,150" marker-end="url(#ak)" marker-start="url(#ak)"/>
  <text x="577" y="143" class="s c">saved state</text>
  <path class="ln dash" d="M358,228 L172,228" marker-end="url(#a)"/>
  <text x="265" y="222" class="s c">"it has stopped, and why"</text>
  <path class="lnr" d="M630,205 L512,205" marker-end="url(#ar)"/>
  <text x="571" y="198" class="s c red">trap, fault, signal</text>
  <path class="life" d="M20,262 L780,262"/>
  <text x="400" y="284" class="h c">Remote debugging: the same, split in two</text>
  <rect class="frame" x="20" y="298" width="230" height="76" rx="4"/>
  <text x="30" y="314" class="s">development machine</text>
  <rect class="u" x="40" y="322" width="190" height="40" rx="4"/>
  <text x="135" y="339" class="c">debugger</text>
  <text x="135" y="353" class="s c">source, symbols, user interface</text>
  <path class="ln" d="M250,342 L398,342" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="324" y="334" class="s c">serial line or network</text>
  <text x="324" y="358" class="s c">a small protocol</text>
  <rect class="frame" x="400" y="298" width="380" height="76" rx="4"/>
  <text x="410" y="314" class="s">target</text>
  <rect class="u" x="420" y="322" width="110" height="40" rx="4"/>
  <text x="475" y="339" class="c">agent</text>
  <text x="475" y="353" class="s c">does 1 to 5 locally</text>
  <path class="lnk" d="M530,342 L558,342" marker-end="url(#ak)"/>
  <rect class="k" x="560" y="322" width="80" height="40" rx="4"/>
  <text x="600" y="346" class="c">system</text>
  <path class="lnk" d="M640,342 L668,342" marker-end="url(#ak)"/>
  <rect class="u" x="670" y="322" width="95" height="40" rx="4"/>
  <text x="717" y="346" class="c">process</text>
</svg>
