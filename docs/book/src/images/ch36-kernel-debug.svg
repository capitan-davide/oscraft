<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="350" fill="#ffffff"/>
  <text x="140" y="24" class="h c">From outside the machine</text>
  <rect class="u" x="70" y="40" width="140" height="32" rx="4"/>
  <text x="140" y="60" class="c">debugger</text>
  <path class="ln" d="M140,72 L140,98" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect class="n" x="35" y="100" width="210" height="32" rx="4"/>
  <text x="140" y="120" class="c">emulator, or a hardware probe</text>
  <path class="ln" d="M140,132 L140,158" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect class="k" x="35" y="160" width="210" height="60" rx="4"/>
  <text x="140" y="182" class="c">the whole machine, stopped:</text>
  <text x="140" y="198" class="c">all CPUs, all memory</text>
  <text x="140" y="213" class="s c">the kernel does not take part</text>
  <text x="140" y="250" class="s c">Works however broken the</text>
  <text x="140" y="264" class="s c">kernel is, from its first instruction.</text>
  <text x="140" y="278" class="s c">Needs an emulator or a probe.</text>
  <text x="400" y="24" class="h c">From inside the kernel</text>
  <rect class="u" x="330" y="40" width="140" height="32" rx="4"/>
  <text x="400" y="60" class="c">debugger</text>
  <path class="ln" d="M400,72 L400,158" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="408" y="112" class="s">serial line</text>
  <text x="408" y="126" class="s">or network</text>
  <rect class="k" x="295" y="160" width="210" height="60" rx="4"/>
  <text x="400" y="180" class="c">the kernel</text>
  <rect class="wk" x="325" y="188" width="150" height="24" rx="4"/>
  <text x="400" y="204" class="s c">a debug stub inside it</text>
  <text x="400" y="250" class="s c">Works on real hardware in the field.</text>
  <text x="400" y="264" class="s c">Needs the kernel healthy enough to</text>
  <text x="400" y="278" class="s c">run the stub and its driver.</text>
  <text x="660" y="24" class="h c">After the crash</text>
  <rect class="k" x="555" y="40" width="210" height="32" rx="4"/>
  <text x="660" y="60" class="c">the kernel crashes</text>
  <path class="lnr" d="M660,72 L660,98" marker-end="url(#ar)"/>
  <rect class="r" x="555" y="100" width="210" height="32" rx="4"/>
  <text x="660" y="120" class="c">a dumper copies memory out</text>
  <path class="ln" d="M660,132 L660,158" marker-end="url(#a)"/>
  <rect class="y" x="555" y="160" width="100" height="60" rx="4"/>
  <text x="605" y="186" class="c">crash dump</text>
  <text x="605" y="202" class="s c">a file</text>
  <path class="ln" d="M655,190 L673,190" marker-end="url(#a)"/>
  <rect class="u" x="675" y="160" width="90" height="60" rx="4"/>
  <text x="720" y="186" class="c">debugger</text>
  <text x="720" y="202" class="s c">any time later</text>
  <text x="660" y="250" class="s c">Nothing is running any more: only</text>
  <text x="660" y="264" class="s c">reading. The one way to study a</text>
  <text x="660" y="278" class="s c">crash that cannot be repeated.</text>
  <path class="life" d="M268,14 L268,290"/>
  <path class="life" d="M528,14 L528,290"/>
  <text x="400" y="326" class="s c">A process is debugged with the kernel's help. The kernel has nobody below it to ask.</text>
</svg>
