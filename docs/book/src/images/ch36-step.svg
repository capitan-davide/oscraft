<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>
  <rect class="u" x="16" y="50" width="138" height="96" rx="4"/>
  <text x="85" y="72" class="b c">debugger</text>
  <text x="85" y="96" class="s c">"run, one step"</text>
  <circle cx="28" cy="38" r="9" fill="#9a6b2f"/>
  <text x="28" y="42" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">1</text>
  <rect class="k" x="170" y="50" width="138" height="96" rx="4"/>
  <text x="239" y="72" class="b c">kernel</text>
  <text x="239" y="96" class="s c">sets the step bit in the</text>
  <text x="239" y="110" class="s c">thread's saved flags</text>
  <text x="239" y="124" class="s c">(SPSR.SS), wakes it</text>
  <circle cx="182" cy="38" r="9" fill="#2c5d9b"/>
  <text x="182" y="42" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">2</text>
  <path class="ln" d="M154,98 L169,98" marker-end="url(#a)"/>
  <rect class="k" x="324" y="50" width="138" height="96" rx="4"/>
  <text x="393" y="72" class="b c">the thread's return</text>
  <text x="393" y="96" class="s c">turns stepping on for</text>
  <text x="393" y="110" class="s c">this CPU (MDSCR.SS),</text>
  <text x="393" y="124" class="s c">returns to user mode</text>
  <circle cx="336" cy="38" r="9" fill="#2c5d9b"/>
  <text x="336" y="42" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">3</text>
  <path class="ln" d="M308,98 L323,98" marker-end="url(#a)"/>
  <rect class="u" x="478" y="50" width="138" height="96" rx="4"/>
  <text x="547" y="72" class="b c">user mode</text>
  <text x="547" y="96" class="s c">exactly one instruction</text>
  <text x="547" y="110" class="s c">of the program runs</text>
  <circle cx="490" cy="38" r="9" fill="#9a6b2f"/>
  <text x="490" y="42" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">4</text>
  <path class="ln" d="M462,98 L477,98" marker-end="url(#a)"/>
  <rect class="k" x="632" y="50" width="138" height="96" rx="4"/>
  <text x="701" y="72" class="b c">step exception</text>
  <text x="701" y="96" class="s c">stepping off, bit cleared;</text>
  <text x="701" y="110" class="s c">the process stops; the</text>
  <text x="701" y="124" class="s c">debugger is told</text>
  <circle cx="644" cy="38" r="9" fill="#2c5d9b"/>
  <text x="644" y="42" class="c" style="fill:#ffffff;font-size:11px;font-weight:bold">5</text>
  <path class="ln" d="M616,98 L631,98" marker-end="url(#a)"/>
  <rect class="r" x="250" y="196" width="300" height="50" rx="4"/>
  <text x="400" y="217" class="c">a context switch on this CPU</text>
  <text x="400" y="234" class="s c">turns stepping off before the next thread runs</text>
  <path class="lnr dash" d="M393,146 L393,194" marker-end="url(#ar)"/>
  <text x="400" y="274" class="s c">The step bit travels with the one thread's saved state; the CPU's switch is on only for that thread's return.</text>
  <text x="400" y="290" class="s c">No other thread, and no kernel code, is ever stepped.</text>
</svg>
