<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <rect class="u" x="20" y="50" width="120" height="50" rx="4"/>
  <text x="80" y="72" class="c">thread runs</text>
  <text x="80" y="88" class="s c">its program</text>
  <path class="ln" d="M140,75 L178,75" marker-end="url(#a)"/>
  <rect class="k" x="180" y="50" width="130" height="50" rx="4"/>
  <text x="245" y="72" class="c">enters the kernel</text>
  <text x="245" y="88" class="s c">call, interrupt, tick</text>
  <path class="ln" d="M310,75 L348,75" marker-end="url(#a)"/>
  <rect class="w" x="350" y="50" width="150" height="50" rx="4"/>
  <text x="425" y="72" class="c">on the way back:</text>
  <text x="425" y="88" class="s c">is the process stopped?</text>
  <path class="lng" d="M500,75 L538,75" marker-end="url(#ag)"/>
  <text x="519" y="68" class="s c green">no</text>
  <rect class="k" x="540" y="50" width="110" height="50" rx="4"/>
  <text x="595" y="72" class="c">takes its</text>
  <text x="595" y="88" class="s c">pending signals</text>
  <path class="ln" d="M650,75 L688,75" marker-end="url(#a)"/>
  <rect class="u" x="690" y="50" width="90" height="50" rx="4"/>
  <text x="735" y="72" class="c">back in its</text>
  <text x="735" y="88" class="s c">program</text>
  <path class="lnr" d="M400,100 L400,168" marker-end="url(#ar)"/>
  <text x="392" y="140" class="s e red">yes</text>
  <rect class="y" x="320" y="170" width="180" height="60" rx="4"/>
  <text x="410" y="192" class="b c">parked: state STOPPED</text>
  <text x="410" y="208" class="s c">blocked in the kernel,</text>
  <text x="410" y="221" class="s c">uses no CPU</text>
  <path class="lng" d="M450,168 L450,102" marker-end="url(#ag)"/>
  <text x="458" y="140" class="s green">woken: asks again</text>
  <rect class="w" x="12" y="150" width="292" height="100" rx="4"/>
  <text x="158" y="170" class="s c b">The process is stopped while either holds</text>
  <text x="24" y="192" class="s">job control: SIGSTOP ... SIGCONT</text>
  <text x="24" y="210" class="s">its debugger: a stop request, or a breakpoint,</text>
  <text x="24" y="224" class="s">step, fault or signal it asked to see ... run</text>
  <path class="ln dash" d="M304,200 L318,200" marker-end="url(#a)"/>
  <text x="660" y="150" class="s c">the parked thread's kernel stack</text>
  <rect class="y" x="560" y="160" width="200" height="54" rx="0"/>
  <text x="660" y="180" class="c">saved user registers</text>
  <text x="660" y="197" class="s c">x0-x30, sp, pc, flags</text>
  <rect class="wk" x="560" y="214" width="200" height="36" rx="0"/>
  <text x="660" y="236" class="s c">kernel frames of the park</text>
  <rect class="n" x="560" y="250" width="200" height="22" rx="0"/>
  <text x="660" y="265" class="s c">unused</text>
  <path class="life" d="M500,200 L558,190"/>
  <rect class="u" x="560" y="300" width="200" height="44" rx="4"/>
  <text x="660" y="318" class="s c">debugger: reads and writes</text>
  <text x="660" y="332" class="s c">the registers here</text>
  <path class="ln" d="M540,322 L540,187 L558,187" marker-end="url(#a)"/>
  <path class="ln" d="M560,322 L540,322"/>
  <text x="280" y="300" class="s c">A thread is never stopped in the middle of kernel work:</text>
  <text x="280" y="316" class="s c">it holds no kernel lock while parked, and its user</text>
  <text x="280" y="332" class="s c">registers are complete and in a known place.</text>
</svg>
