<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>

  <rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
  <rect class="k" x="30" y="30" width="240" height="300" rx="4"/>
  <text x="150" y="52" class="h c">GICv2 (GICD, GICC)</text>
  <rect class="n" x="45" y="70" width="210" height="40" rx="4"/>
  <text x="150.0" y="87.0" class="b c">SGIs 0-15</text>
  <text x="150.0" y="101.0" class="s c">IPIs between CPUs</text>
  <rect class="g" x="45" y="120" width="210" height="40" rx="4"/>
  <text x="150.0" y="137.0" class="b c">PPIs 16-31</text>
  <text x="150.0" y="151.0" class="s c">per CPU: timers, PMU</text>
  <rect class="y" x="45" y="200" width="210" height="110" rx="4"/>
  <text x="150.0" y="252.0" class="b c">SPIs 32-287</text>
  <text x="150.0" y="266.0" class="s c">shared: devices</text>
  <rect class="g" x="330" y="120" width="230" height="30" rx="4"/>
  <text x="445" y="140" class="s c">virtual timer: PPI 11 = 27 (the tick)</text>
  <rect class="wk" x="330" y="160" width="230" height="30" rx="4"/>
  <text x="445" y="180" class="s c">phys. timers 29, 30; hyp. 26; PMU 23</text>
  <rect class="wu" x="330" y="210" width="230" height="24" rx="4"/>
  <text x="445" y="226" class="s c">PL011: SPI 1 = 33</text>
  <polyline class="ln" points="328,222 257,222"/>
  <rect class="wu" x="330" y="240" width="230" height="24" rx="4"/>
  <text x="445" y="256" class="s c">PL031 RTC: SPI 2 = 34</text>
  <polyline class="ln" points="328,252 257,252"/>
  <rect class="wu" x="330" y="270" width="230" height="24" rx="4"/>
  <text x="445" y="286" class="s c">PCIe INTA-D: SPIs 3-6 = 35-38</text>
  <polyline class="ln" points="328,282 257,282"/>
  <rect class="wu" x="330" y="300" width="230" height="24" rx="4"/>
  <text x="445" y="316" class="s c">PL061 GPIO: SPI 7 = 39</text>
  <polyline class="ln" points="328,312 257,300"/>
  <rect class="wu" x="600" y="210" width="230" height="24" rx="4"/>
  <text x="715" y="226" class="s c">virtio-mmio: SPIs 16-47 = 48-79</text>
  <rect class="wu" x="600" y="250" width="230" height="54" rx="4"/>
  <text x="715" y="270" class="s c">PCIe MSI: GICv2m frame,</text>
  <text x="715" y="286" class="s c">IDs 80-143 (SPIs 48-111)</text>
  <polyline class="ln" points="328,135 257,135"/>
  <text x="560" y="340" class="s c">interrupt ID = 32 + SPI number, 16 + PPI number (the device tree&#x27;s cells)</text>
</svg>
