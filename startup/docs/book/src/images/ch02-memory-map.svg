<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>

  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>
  <text x="40" y="28" class="h">physical address</text>
  <text x="470" y="28" class="h">what is there (QEMU&#x27;s hw/arm/virt.c)</text>
  <text x="150" y="68.0" class="m e">0x0000_0000</text>
  <rect class="n" x="170" y="44" width="260" height="40" rx="4"/>
  <text x="300" y="68.0" class="s c">flash</text>
  <text x="450" y="62.0" class="b">flash</text>
  <text x="450" y="76.0" class="s">2 x 64 MB CFI flash (firmware, if any)</text>
  <text x="150" y="109.0" class="m e">0x0800_0000</text>
  <rect class="k" x="170" y="90" width="260" height="30" rx="4"/>
  <text x="300" y="109.0" class="s c">GIC</text>
  <text x="450" y="103.0" class="b">GIC</text>
  <text x="450" y="117.0" class="s">GICD 0x0800_0000, GICC 0x0801_0000, GICv2m 0x0802_0000</text>
  <text x="150" y="145.0" class="m e">0x0900_0000</text>
  <rect class="wk" x="170" y="126" width="260" height="30" rx="4"/>
  <text x="300" y="145.0" class="s c">PL011 UART, PL031 RTC, fw_cfg, PL…</text>
  <text x="450" y="139.0" class="b">PL011 UART, PL031 RTC, fw_cfg, PL061 GPIO</text>
  <text x="450" y="153.0" class="s">0x0900_0000, 0x0901_0000, 0x0902_0000, 0x0903_0000</text>
  <text x="150" y="181.0" class="m e">0x0a00_0000</text>
  <rect class="wu" x="170" y="162" width="260" height="30" rx="4"/>
  <text x="300" y="181.0" class="s c">virtio-mmio transports</text>
  <text x="450" y="175.0" class="b">virtio-mmio transports</text>
  <text x="450" y="189.0" class="s">32 slots of 0x200, SPIs 16-47</text>
  <text x="150" y="215.0" class="m e">0x0c00_0000</text>
  <rect class="n" x="170" y="198" width="260" height="26" rx="4"/>
  <text x="300" y="215.0" class="s c">platform bus</text>
  <text x="450" y="209.0" class="b">platform bus</text>
  <text x="450" y="223.0" class="s">dynamic sysbus devices</text>
  <text x="150" y="257.0" class="m e">0x1000_0000</text>
  <rect class="wu" x="170" y="230" width="260" height="46" rx="4"/>
  <text x="300" y="257.0" class="s c">PCIe MMIO window (32-bit)</text>
  <text x="450" y="251.0" class="b">PCIe MMIO window (32-bit)</text>
  <text x="450" y="265.0" class="s">0x1000_0000 - 0x3eff_ffff: BARs</text>
  <text x="150" y="298.0" class="m e">0x3eff_0000</text>
  <rect class="wu" x="170" y="282" width="260" height="24" rx="4"/>
  <text x="300" y="298.0" class="s c">PCIe I/O window</text>
  <text x="450" y="292.0" class="b">PCIe I/O window</text>
  <text x="450" y="306.0" class="s">64 KB</text>
  <text x="150" y="371.0" class="m e">0x4000_0000</text>
  <rect class="y" x="170" y="312" width="260" height="110" rx="4"/>
  <text x="300" y="371.0" class="s c">RAM (-m 2G: up to 0xbfff_ffff)</text>
  <text x="450" y="365.0" class="b">RAM (-m 2G: up to 0xbfff_ffff)</text>
  <text x="450" y="379.0" class="s">the image at 0x4008_0000, the device tree after it</text>
  <text x="150" y="447.0" class="m e">0x40_1000_0000</text>
  <rect class="wu" x="170" y="428" width="260" height="30" rx="4"/>
  <text x="300" y="447.0" class="s c">PCIe ECAM</text>
  <text x="450" y="441.0" class="b">PCIe ECAM</text>
  <text x="450" y="455.0" class="s">configuration space, 256 MB</text>
  <text x="150" y="488.0" class="m e">0x80_0000_0000</text>
  <rect class="wu" x="170" y="464" width="260" height="40" rx="4"/>
  <text x="300" y="488.0" class="s c">PCIe MMIO window (64-bit)</text>
  <text x="450" y="482.0" class="b">PCIe MMIO window (64-bit)</text>
  <text x="450" y="496.0" class="s">512 GB</text>
  <text x="40" y="540" class="s">Blue: what startup programs (the GIC, the debug UART); yellow: RAM; orange: devices for the drivers.</text>
</svg>
