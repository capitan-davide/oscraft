<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>

  <rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
  <rect class="k" x="30" y="30" width="380" height="300" rx="4"/>
  <text x="220" y="52" class="h c">the library (src/)</text>
  <rect class="wk" x="50" y="66" width="340" height="26" rx="4"/>
  <text x="220" y="83" class="s c">entry, EL1, caches, stack</text>
  <rect class="wk" x="50" y="98" width="340" height="26" rx="4"/>
  <text x="220" y="115" class="s c">the system page and its sections</text>
  <rect class="wk" x="50" y="130" width="340" height="26" rx="4"/>
  <text x="220" y="147" class="s c">the GICv2: its setup and callouts</text>
  <rect class="wk" x="50" y="162" width="340" height="26" rx="4"/>
  <text x="220" y="179" class="s c">the generic timer: qtime</text>
  <rect class="wk" x="50" y="194" width="340" height="26" rx="4"/>
  <text x="220" y="211" class="s c">the MMU: the kernel&#x27;s page tables</text>
  <rect class="wk" x="50" y="226" width="340" height="26" rx="4"/>
  <text x="220" y="243" class="s c">loading the kernel from the image</text>
  <rect class="wk" x="50" y="258" width="340" height="26" rx="4"/>
  <text x="220" y="275" class="s c">the CPUs&#x27; second step (smp_spin)</text>
  <rect class="wk" x="50" y="290" width="340" height="26" rx="4"/>
  <text x="220" y="307" class="s c">the handoff</text>
  <rect class="y" x="450" y="30" width="380" height="300" rx="4"/>
  <text x="640" y="52" class="h c">the board (boards/qemu-virt)</text>
  <rect class="wu" x="470" y="66" width="340" height="26" rx="4"/>
  <text x="640" y="83" class="s c">RAM&#x27;s size, the CPUs: from the device tree</text>
  <rect class="wu" x="470" y="98" width="340" height="26" rx="4"/>
  <text x="640" y="115" class="s c">GICD 0x0800_0000, GICC 0x0801_0000</text>
  <rect class="wu" x="470" y="130" width="340" height="26" rx="4"/>
  <text x="640" y="147" class="s c">the debug UART: PL011, 24 MHz</text>
  <rect class="wu" x="470" y="162" width="340" height="26" rx="4"/>
  <text x="640" y="179" class="s c">the tick: PPI 27</text>
  <rect class="wu" x="470" y="194" width="340" height="26" rx="4"/>
  <text x="640" y="211" class="s c">starting a CPU: PSCI CPU_ON (hvc)</text>
  <rect class="wu" x="470" y="226" width="340" height="26" rx="4"/>
  <text x="640" y="243" class="s c">reboot: PSCI SYSTEM_RESET (hvc)</text>
  <rect class="wu" x="470" y="258" width="340" height="26" rx="4"/>
  <text x="640" y="275" class="s c">uname&#x27;s strings: QEMU virt</text>
</svg>
