<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>

  <rect x="0" y="0" width="860" height="380" fill="#ffffff"/>
  <rect class="y" x="30" y="30" width="260" height="56" rx="4"/>
  <text x="160.0" y="55.0" class="b c">boot arguments</text>
  <text x="160.0" y="69.0" class="s c">-v -u reg (mkifs wrote them)</text>
  <polyline class="ln" points="292,58 378,190" marker-end="url(#a)"/>
  <rect class="y" x="30" y="110" width="260" height="56" rx="4"/>
  <text x="160.0" y="135.0" class="b c">startup header</text>
  <text x="160.0" y="149.0" class="s c">at 0x4008_0100: the image</text>
  <polyline class="ln" points="292,138 378,190" marker-end="url(#a)"/>
  <rect class="y" x="30" y="190" width="260" height="56" rx="4"/>
  <text x="160.0" y="215.0" class="b c">x0</text>
  <text x="160.0" y="229.0" class="s c">the device tree, 0x5360_0000</text>
  <polyline class="ln" points="292,218 378,190" marker-end="url(#a)"/>
  <rect class="wu" x="30" y="270" width="260" height="56" rx="4"/>
  <text x="160.0" y="295.0" class="b c">the board crate</text>
  <text x="160.0" y="309.0" class="s c">UARTs, RAM, CPUs, GIC</text>
  <polyline class="ln" points="292,298 378,190" marker-end="url(#a)"/>
  <rect class="k" x="380" y="110" width="200" height="160" rx="4"/>
  <text x="480" y="136" class="h c">Startup</text>
  <text x="480" y="160" class="s c">options, debug level</text>
  <text x="480" y="178" class="s c">the console</text>
  <text x="480" y="196" class="s c">RAM: a range set</text>
  <text x="480" y="214" class="s c">the system page builder</text>
  <text x="480" y="232" class="s c">the page tables</text>
  <polyline class="ln" points="582,190 660,190" marker-end="url(#a)"/>
  <rect class="k" x="660" y="150" width="170" height="80" rx="4"/>
  <text x="745.0" y="187.0" class="b c">boot()</text>
  <text x="745.0" y="201.0" class="s c">system page, CPUs, kernel</text>
</svg>
