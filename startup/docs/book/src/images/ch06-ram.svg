<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5d9b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aa2222"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e7b34"/></marker></defs>
  <style>
    .k  { fill: #dce9f8; stroke: #2c5d9b; stroke-width: 1.2; }
    .u  { fill: #f6e7d2; stroke: #9a6b2f; stroke-width: 1.2; }
    .n  { fill: #eeeeee; stroke: #666666; stroke-width: 1.2; }
    .g  { fill: #e2f0dc; stroke: #3e7b34; stroke-width: 1.2; }
    .r  { fill: #f8e0e0; stroke: #aa2222; stroke-width: 1.2; }
    .y  { fill: #fbf3c8; stroke: #9a8420; stroke-width: 1.2; }
    .w  { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .wk { fill: #ffffff; stroke: #2c5d9b; stroke-width: 1; }
    .wu { fill: #ffffff; stroke: #9a6b2f; stroke-width: 1; }
    .frame { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .ln  { fill: none; stroke: #333333; stroke-width: 1.3; }
    .lnk { fill: none; stroke: #2c5d9b; stroke-width: 1.3; }
    .lnr { fill: none; stroke: #aa2222; stroke-width: 1.3; }
    .lng { fill: none; stroke: #3e7b34; stroke-width: 1.3; }
    .dash { stroke-dasharray: 5 4; }
    .life { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    text { fill: #222222; font-size: 12px; }
    .b  { font-weight: bold; }
    .h  { font-size: 13px; font-weight: bold; }
    .s  { font-size: 10.5px; fill: #444444; }
    .m  { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 11px; }
    .ms { font-family: DejaVu Sans Mono, Menlo, Consolas, monospace; font-size: 10px; }
    .c  { text-anchor: middle; }
    .e  { text-anchor: end; }
    .red { fill: #aa2222; }
    .blue { fill: #2c5d9b; }
    .green { fill: #3e7b34; }
  </style>

  <rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
  <text x="30" y="26" class="h">RAM on virt, 0x4000_0000 - 0xbfff_ffff (2 GB; not to scale)</text>
  <rect class="r" x="30" y="40" width="90" height="50" rx="4"/>
  <text x="75.0" y="69.0" class="b c">allocated</text>
  <rect class="g" x="120" y="40" width="60" height="50" rx="4"/>
  <text x="150.0" y="69.0" class="b c">free</text>
  <rect class="y" x="180" y="40" width="190" height="50" rx="4"/>
  <text x="275.0" y="62.0" class="b c">the image</text>
  <text x="275.0" y="76.0" class="s c">startup + IFS</text>
  <rect class="g" x="370" y="40" width="40" height="50" rx="4"/>
  <text x="390.0" y="69.0" class="b c">free</text>
  <rect class="y" x="410" y="40" width="60" height="50" rx="4"/>
  <text x="440.0" y="69.0" class="b c">fdt</text>
  <rect class="g" x="470" y="40" width="360" height="50" rx="4"/>
  <text x="650.0" y="69.0" class="b c">free</text>
  <polyline class="ln" points="30,92 30,100"/>
  <text x="32" y="110" class="ms">0x4000_0000</text>
  <polyline class="ln" points="120,92 120,114"/>
  <text x="122" y="124" class="ms">0x4000_b140</text>
  <polyline class="ln" points="180,92 180,100"/>
  <text x="182" y="110" class="ms">0x4008_0100</text>
  <polyline class="ln" points="370,92 370,114"/>
  <text x="372" y="124" class="ms">0x5359_f31c</text>
  <polyline class="ln" points="410,92 410,100"/>
  <text x="412" y="110" class="ms">0x5360_0000</text>
  <polyline class="ln" points="470,92 470,114"/>
  <text x="472" y="124" class="ms">0x5370_0000</text>
  <polyline class="lng dash" points="150.0,128 150.0,168" marker-end="url(#ag)"/>
  <rect class="g" x="120" y="170" width="60" height="34" rx="4"/>
  <text x="150.0" y="191.0" class="b c">sysram</text>
  <polyline class="lng dash" points="390.0,128 390.0,168" marker-end="url(#ag)"/>
  <rect class="g" x="370" y="170" width="40" height="34" rx="4"/>
  <text x="390.0" y="191.0" class="b c">sysram</text>
  <polyline class="lng dash" points="650.0,128 650.0,168" marker-end="url(#ag)"/>
  <rect class="g" x="470" y="170" width="360" height="34" rx="4"/>
  <text x="650.0" y="191.0" class="b c">sysram</text>
  <text x="30" y="250" class="s">red: allocated by startup (the system page, the page tables, the kernel&#x27;s data); yellow: reserved (the image,</text>
  <text x="30" y="266" class="s">the device tree); green: free, given to the kernel as sysram entries when boot() has made its last allocation</text>
</svg>
