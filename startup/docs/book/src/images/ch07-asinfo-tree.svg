  <polyline class="ln" points="100,120 100,160 128,160"/>
  <polyline class="ln" points="150,180 150,220 178,220"/>
  <polyline class="ln" points="150,180 150,270 178,270"/>
  <polyline class="ln" points="150,180 150,320 178,320"/>
  <rect class="wk" x="560" y="20" width="260" height="40" rx="4"/>
  <text x="690.0" y="37.0" class="b c">gicd</text>
  <text x="690.0" y="51.0" class="s c">0x0800_0000</text>
  <polyline class="ln" points="250,40 540,40 540,40 558,40"/>
  <rect class="wk" x="560" y="76" width="260" height="40" rx="4"/>
  <text x="690.0" y="93.0" class="b c">gicc</text>
  <text x="690.0" y="107.0" class="s c">0x0801_0000</text>
  <polyline class="ln" points="250,40 540,40 540,96 558,96"/>
  <rect class="wk" x="560" y="132" width="260" height="40" rx="4"/>
  <text x="690.0" y="149.0" class="b c">startup</text>
  <text x="690.0" y="163.0" class="s c">0x4008_0100</text>
  <polyline class="ln" points="250,40 540,40 540,152 558,152"/>
  <rect class="wk" x="560" y="188" width="260" height="40" rx="4"/>
  <text x="690.0" y="205.0" class="b c">imagefs, bootram</text>
  <text x="690.0" y="219.0" class="s c">0x400f_05c4</text>
  <polyline class="ln" points="250,40 540,40 540,208 558,208"/>
  <rect class="wk" x="560" y="244" width="260" height="40" rx="4"/>
  <text x="690.0" y="261.0" class="b c">fdt</text>
  <text x="690.0" y="275.0" class="s c">0x5360_0000</text>
  <polyline class="ln" points="250,40 540,40 540,264 558,264"/>
  <text x="30" y="400" class="s">QEMU virt with 2 GB, as OsCraft&#x27;s startup describes it. sysram is the kernel&#x27;s free RAM: ram less what</text>
  <text x="30" y="416" class="s">startup kept (its own page, the image, the device tree). Each entry points to its parent by offset:</text>
  <text x="30" y="432" class="s">the array is the tree, in the order the entries were added.</text>
</svg>
