[package]
name = "syslogd"
description = "OsCraft's system logger: FreeBSD's syslogd in Rust, over per-process rings"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "syslogd"
path = "src/lib.rs"

[[bin]]
name = "syslogd"
path = "src/main.rs"
test = false

[dependencies]
logring = { path = "../logring" }

[target.'cfg(target_os = "freebsd")'.dependencies]
kercall = { path = "../kercall" }
proto = { path = "../proto" }
resmgr = { path = "../resmgr" }

[lints]
workspace = true
